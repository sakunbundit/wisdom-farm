<!-- ฟอนต์ Inter + Anuphan จาก Google Fonts (ผู้ใช้อนุญาตให้ใช้เน็ตได้ 2026-11-01) — ไม่มีเน็ตจะใช้ฟอนต์สำรองของเครื่อง เกมยังเล่นได้ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#bfe6ff; --sky2:#8fd0f7; --grass:#9be37c; --grass2:#6cc44f; --soil:#a9713f; --soil2:#8a5a30;
  --wood:#e8c58f; --wood2:#c99a5b; --ink:#3a2a14; --ink2:#6b5636; --white:#fffdf6;
  --good:#2fae4f; --bad:#e0553d; --gold:#f3b823; --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Inter","Anuphan","Noto Sans Thai","Leelawadee UI","Tahoma",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(var(--sky) 0,var(--sky) 110px,var(--grass) 110px,var(--grass2) 100%);
  background-attachment:fixed;font-size:16px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0}
/* จัดหน้าให้พอดีจอเดียว (ใช้กับ iPad เป็นหลัก): โครงหน้า = แถบบน + แท็บ + เนื้อหา ไม่เลื่อนทั้งหน้า */
.wrap{max-width:1100px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:6px;
  padding:max(6px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.content{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.content>.panel{margin-bottom:0}
h1,h2,h3{margin:.3em 0}
.banner{background:#fff3cd;border:2px solid #e0b43c;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:15px}
/* ปุ่ม */
.btn{background:linear-gradient(#ffd45c,#f3b823);border-bottom:4px solid #c48a0b;border-radius:14px;padding:8px 16px;font-weight:700;min-height:44px}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.green{background:linear-gradient(#7fdc6a,#3fb24a);border-bottom-color:#2a8a35;color:#fff}
.btn.gray{background:linear-gradient(#f2ead8,#d9ccb0);border-bottom-color:#b3a27f}
.btn.red{background:linear-gradient(#f28a73,#d9503a);border-bottom-color:#a93522;color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.big{font-size:18px;padding:10px 18px;width:100%}
/* แถบบน */
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--wood);
  border:3px solid var(--wood2);border-radius:var(--r);padding:4px 10px;flex:none}
.top .title{font-weight:800;font-size:18px}
.top .ver{font-size:12px;color:var(--ink2);font-weight:400}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--white);border-radius:999px;padding:5px 12px;font-weight:700;border:2px solid var(--wood2)}
.mini{padding:6px 10px;min-height:38px;font-size:15px}
/* แท็บ */
.tabs{display:flex;gap:6px;flex:none}
.tab{flex:1;background:var(--wood);border:3px solid var(--wood2);border-radius:14px;padding:6px 4px;min-height:44px;font-weight:700;text-align:center;font-size:15px}
.tab.on{background:var(--white);border-color:var(--gold)}
.panel{background:rgba(255,253,246,.92);border:3px solid var(--wood2);border-radius:var(--r);padding:8px 10px}
/* ฟาร์มสไตล์ Hay Day: ฉากวาดด้วย CSS/SVG/อีโมจิ ไม่ใช้ไฟล์ภาพ (เปิดแบบไม่มีเน็ตได้)
   ฉากมีหน่วย --u (1u = 1% ของความกว้างฉาก) ขยายตามจอ: แนวนอน 100x62.5u แนวตั้ง 100x100u */
.scenebox{flex:1 1 auto;min-height:0;container-type:size;display:grid;place-items:center}
.scene{--u:min(1cqw,1.6cqh);position:relative;width:calc(var(--u)*100);height:calc(var(--u)*62.5);overflow:hidden;
  border-radius:calc(var(--u)*2);box-shadow:0 0 0 4px var(--wood2),0 6px 0 4px #a8793f;
  background:radial-gradient(circle at 18% 25%,rgba(255,255,255,.14),transparent 45%),
    repeating-linear-gradient(0deg,rgba(0,0,0,.045) 0 calc(var(--u)*3),transparent calc(var(--u)*3) calc(var(--u)*6)),
    linear-gradient(#92dc70,#78c855)}
.sp{position:absolute;left:calc(var(--u)*var(--x));top:calc(var(--u)*var(--y));width:calc(var(--u)*var(--w))}
.sp.em{width:auto;font-size:calc(var(--u)*var(--w));line-height:1;user-select:none;pointer-events:none}
.sp .art{display:block;width:100%;height:auto;filter:drop-shadow(0 calc(var(--u)*.5) 0 rgba(0,0,0,.18))}
button.sp{background:none;border:0;padding:0;cursor:pointer}
.s-barn{--x:2;--y:3;--w:19}.s-silo{--x:21.5;--y:2;--w:6.5}.s-shop{--x:78;--y:3;--w:19}
.s-road{--x:79;--y:25;--w:19;height:calc(var(--u)*37.5);border-radius:calc(var(--u)*1.5);
  background:linear-gradient(90deg,#b9996a,#d1b588 14%,#d1b588 86%,#b9996a);box-shadow:inset 0 0 0 calc(var(--u)*.3) rgba(90,60,20,.35)}
.s-road::after{content:"";position:absolute;left:50%;top:3%;bottom:3%;width:calc(var(--u)*.5);margin-left:calc(var(--u)*-.25);
  background:repeating-linear-gradient(0deg,#f7eccd 0 calc(var(--u)*2.2),transparent calc(var(--u)*2.2) calc(var(--u)*4.4))}
.s-truck{--x:84.5;--y:27;--w:6;animation:drive 14s ease-in-out infinite}
.s-pond{--x:11;--y:51;--w:15;height:calc(var(--u)*9.5);border-radius:50%;
  background:radial-gradient(ellipse at 35% 30%,#bfe9ff,#6cc0ee 55%,#4da6dd);box-shadow:0 0 0 calc(var(--u)*.7) #9fd47f,0 0 0 calc(var(--u)*1.1) #7bb85b}
.s-field{--x:29;--y:9;--w:46;height:calc(var(--u)*41);padding:calc(var(--u)*2);box-sizing:border-box;z-index:2;border-radius:calc(var(--u)*1.5);
  background:linear-gradient(#86cf62,#74bd51);border:calc(var(--u)*.8) solid #a3733a;
  box-shadow:inset 0 0 0 calc(var(--u)*.35) #7a5224,0 calc(var(--u)*.6) 0 #7a5224;
  --tile:11.5;display:grid;grid-template-columns:repeat(3,calc(var(--u)*var(--tile)));grid-auto-rows:calc(var(--u)*var(--tile));gap:calc(var(--u)*1.2);justify-content:center;align-content:center}
.s-field::before,.s-field::after{content:"";position:absolute;left:calc(var(--u)*-.8);right:calc(var(--u)*-.8);height:calc(var(--u)*1.5);pointer-events:none;
  background:repeating-linear-gradient(90deg,#8a5a2b 0 calc(var(--u)*.9),transparent calc(var(--u)*.9) calc(var(--u)*3.4))}
.s-field::before{top:calc(var(--u)*-1.9)}.s-field::after{bottom:calc(var(--u)*-1.9)}
.t1{--x:.5;--y:53;--w:8}.t2{--x:25;--y:51;--w:7}.t3{--x:75.5;--y:52;--w:8}.t4{--x:31;--y:.5;--w:6}.t5{--x:68;--y:1;--w:5}
.fl1{--x:27;--y:44;--w:3}.fl2{--x:76;--y:49;--w:2.6}.fl3{--x:2;--y:34;--w:2.6}
.a-duck{--x:17;--y:53;--w:3;animation:wander 8s ease-in-out -3s infinite}
.cl1{--x:42;--y:.5;--w:6;opacity:.85;animation:drift 40s linear infinite}.cl2{--x:58;--y:2;--w:4.4;opacity:.7;animation:drift 55s linear -20s infinite}
.bf1{--x:27;--y:44;--w:2;animation:flutter 7s ease-in-out infinite}.bf2{--x:75;--y:46;--w:1.8;animation:flutter 5s ease-in-out -2s infinite}
.bush1{--x:27.5;--y:57;--w:3.2}.bush2{--x:27;--y:49.5;--w:2.4}.rock1{--x:28;--y:60;--w:2.4}.hay1{--x:8.2;--y:56;--w:3.6}.mail1{--x:76;--y:23;--w:2.4}
/* คอกสัตว์ */
.s-pen{--x:1;--y:23;--w:23;height:calc(var(--u)*18);box-sizing:border-box;padding:calc(var(--u)*1);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:calc(var(--u)*.7);z-index:2;
  border-radius:calc(var(--u)*1.2);border:calc(var(--u)*.7) solid #8a5a2b;box-shadow:0 calc(var(--u)*.5) 0 #6a4220,inset 0 0 0 calc(var(--u)*.25) #5b3a18;
  background:repeating-linear-gradient(100deg,#e6c984 0 calc(var(--u)*1.1),#dcbb72 calc(var(--u)*1.1) calc(var(--u)*2.2))}
.an{position:relative;display:grid;place-items:center;padding:0;cursor:pointer;border:0;border-radius:calc(var(--u)*.9);background:rgba(255,255,255,.28);box-shadow:inset 0 calc(var(--u)*-.35) 0 rgba(90,55,20,.22);color:#fff;font-weight:700;min-height:44px}
.an:active{transform:translateY(2px)}
.an .spr{font-size:calc(var(--u)*3.4);line-height:1;transform:translateY(-12%);filter:drop-shadow(0 2px 0 rgba(0,0,0,.28))}
.an.locked .spr{filter:grayscale(1) brightness(.9);opacity:.55}
.an.locked{background:rgba(120,90,50,.28)}
.an.ready{box-shadow:0 0 0 calc(var(--u)*.4) var(--gold),inset 0 calc(var(--u)*-.35) 0 rgba(90,55,20,.22)}
.an.ready .spr{animation:bob 1.3s ease-in-out infinite}
.an .tm,.an .bub{position:absolute;border-radius:99px;font-weight:800;white-space:nowrap;padding:0 .5em;font-size:max(12px,calc(var(--u)*1.4))}
.an .tm{bottom:3%;left:50%;transform:translateX(-50%);background:rgba(40,25,5,.82)}
.an .bub{top:-14%;right:-6%;background:var(--gold);color:#3a2a14;animation:pop 1s ease-in-out infinite}
.an .bub.hint{background:#fff;opacity:.92;animation:pop 1.8s ease-in-out infinite}
.w0{--x:2;--y:42.5;--w:7}.w1{--x:13;--y:42.5;--w:7}.w2{--x:34;--y:52;--w:7}.w3{--x:46;--y:52;--w:7}.w4{--x:58;--y:52;--w:7}.w5{--x:68;--y:52;--w:7}
/* แปลงดิน */
.tile{position:relative;aspect-ratio:1;border-radius:calc(var(--u)*1.2);border:calc(var(--u)*.4) solid #5e3b1c;padding:0;cursor:pointer;color:#fff;
  background-color:#a06a3a;background-image:linear-gradient(rgba(255,255,255,.14),transparent 45%),repeating-linear-gradient(90deg,rgba(60,30,10,.3) 0 8%,transparent 8% 25%);
  box-shadow:inset 0 calc(var(--u)*-.6) 0 rgba(0,0,0,.2);display:grid;place-items:center;font-weight:700}
.tile:active{transform:translateY(2px)}
.tile.ghost{background:rgba(120,80,40,.13);border:calc(var(--u)*.35) dashed rgba(90,60,30,.4);box-shadow:none;pointer-events:none}
.tile .spr{font-size:calc(var(--u)*4.6);line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.tile.g0 .spr{font-size:calc(var(--u)*3)}.tile.g1 .spr{font-size:calc(var(--u)*3.8)}.tile.g2 .spr{font-size:calc(var(--u)*4.2)}
.tile .spr.m1,.tile .spr.m2{position:absolute;bottom:20%;font-size:calc(var(--u)*2.3)}
.tile .spr.m1{left:9%}.tile .spr.m2{right:9%}.tile.g2 .spr.m1{left:auto;right:9%;font-size:calc(var(--u)*2)}
.tile.plus .spr{font-size:calc(var(--u)*4);opacity:.5}
.tile.ready{box-shadow:0 0 0 calc(var(--u)*.5) var(--gold),inset 0 calc(var(--u)*-.6) 0 rgba(0,0,0,.2)}
.tile.ready .spr{animation:bob 1.3s ease-in-out infinite}
.tile .tm,.tile .bub{position:absolute;border-radius:99px;font-weight:800;font-size:max(11px,calc(var(--u)*1.45));white-space:nowrap;padding:0 .55em}
.tile .tm{bottom:5%;left:50%;transform:translateX(-50%);background:rgba(40,25,5,.8);color:#fff}
.tile .bub{top:-7%;right:-7%;background:var(--gold);color:#3a2a14;animation:pop 1s ease-in-out infinite}
.tile.lock{background:repeating-linear-gradient(45deg,#eadfc4 0 8px,#d9ccab 8px 16px);border-color:#a8996f;color:#5a4a2a;font-size:max(11px,calc(var(--u)*1.5));line-height:1.25}

// ---------- ตัวสุ่มแบบกำหนดเมล็ดได้ (เทสต์ซ้ำได้) ----------
function makeRng(seed) {
  let a = seed >>> 0;
  const next = () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    next,
    int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
    pick: arr => arr[Math.floor(next() * arr.length)],
    chance: p => next() < p
  };
}

// ---------- เลขและเศษส่วน ----------
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
function lcm(a, b) { return a / gcd(a, b) * b; }
function rat(n, d) {
  if (d === undefined) d = 1;
  if (d < 0) { n = -n; d = -d; }
  const g = gcd(n, d) || 1;
  return { n: n / g, d: d / g };
}
function ratText(r) { return r.d === 1 ? String(r.n) : r.n + '/' + r.d; }
// เขียนเป็นทศนิยมถ้าหารลงตัวในฐานสิบ ไม่งั้นเป็นเศษส่วน
function decText(r) {
  if (r.d === 1) return String(r.n);
  for (let k = 1; k <= 6; k++) {
    const scaled = r.n * Math.pow(10, k);
    if (scaled % r.d === 0) {
      let s = String(Math.abs(scaled / r.d));
      while (s.length <= k) s = '0' + s;
      return (r.n < 0 ? '-' : '') + s.slice(0, -k) + '.' + s.slice(-k);
    }
  }
  return ratText(r);
}
function fracHtml(n, d) { return '<span class="fr"><span>' + n + '</span><span>' + d + '</span></span>'; }
function neg(n) { return n < 0 ? '−' + (-n) : String(n); }          // −5
function sgn(n) { return n < 0 ? '− ' + (-n) : '+ ' + n; }           // + 5 / − 5
function nCr(n, r) { let v = 1; for (let i = 1; i <= r; i++) v = v * (n - r + i) / i; return Math.round(v); }

// รับ "12" "-3" "0.75" "7/4" (รับเครื่องหมายลบแบบ −) คืนเศษส่วน หรือ null ถ้าอ่านไม่ออก
function parseAnswer(s) {
  if (typeof s !== 'string') return null;
  s = s.trim().replace(/−/g, '-').replace(/,/g, '').replace(/\s+/g, '');
  let m = /^(-?)(\d+)\/(\d+)$/.exec(s);
  if (m) {
    const n = parseInt(m[2], 10), d = parseInt(m[3], 10);
    return d === 0 ? null : rat(m[1] ? -n : n, d);
  }
  m = /^(-?)(\d*)(?:\.(\d+))?$/.exec(s);
  if (!m || (m[2] === '' && m[3] === undefined)) return null;
  const frac = m[3] || '';
  const n = parseInt((m[2] || '0') + frac, 10);
  return rat(m[1] ? -n : n, Math.pow(10, frac.length));
}
function checkAnswer(input, q) {
  const r = parseAnswer(input);

}

  { id: 'ratio_change', level: 'm1', tier: 'core', topic: 'อัตราส่วนเปลี่ยนไป', make(r, g) {

    let A, B, T, give, tries = 0, p1, p2;
    do {
      p1 = r.pick(pairs); p2 = r.pick(pairs);
      const s1 = p1[0] + p1[1], s2 = p2[0] + p2[1];
      T = lcm(s1, s2) * r.int(2, 8);
      A = T * p1[0] / s1; give = A - T * p2[0] / s2; tries++;

    return mkQ(g, 'พี่กับน้องมีเงินรวมกัน ' + T + ' บาท เงินของพี่ต่อน้องเป็น ' + p1[0] + ' : ' + p1[1] + ' ต่อมาพี่ให้เงินน้องส่วนหนึ่ง ทำให้เงินของพี่ต่อน้องเป็น ' + p2[0] + ' : ' + p2[1] + ' พี่ให้เงินน้องกี่บาท', rat(give),

  // ===== เตรียมสอบ ม.1 : ท้าทาย (ระดับ ม.1-2) =====

function shuffle(arr, r) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = r.int(0, i); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

// ---------- ข้อสอบแบบเลือกตอบจากคลัง (วิทย์/สังคม/ไทย/อังกฤษ) ----------
// ข้อละ 4 ตัวเลือก สลับลำดับตัวเลือกทุกครั้งที่ออก ข้อที่ถูกตัดออกได้ผ่าน bad (ผู้ปกครองแจ้งว่าเฉลยผิด)
function bankItemId(topicId, k) { return topicId + '#' + k; }
// ---------- ข้อมูลข้อสอบ: โหลดเป็นไฟล์แยกตามชั้น (data/*.js) ตอนเลือกชั้น (v0.22.0) ----------
// แต่ละไฟล์เรียก SQ_DATA(ชนิด, ชั้น, รายการ) → ลงทะเบียนเข้าดัชนีที่นี่ครั้งเดียว (ค้นหาข้อของหัวข้อได้ทันที ไม่ต้องไล่ทั้งคลังทุกครั้งที่ออกโจทย์)
// หัวข้อ (BANK_TOPICS ฯลฯ) อยู่ในไฟล์เกมเสมอ จึงรู้จักหัวข้อทั้งหมดก่อนโหลดข้อ · ต้องตรวจ dataReady(ชั้น) ก่อนออกโจทย์ของชั้นนั้น
const DATA_KINDS = ['bank', 'vocab', 'spell'];
const DATA_LOADED = {};
const BANK_ITEMS = [], VOCAB = [], SPELL = [];     // ข้อของชั้นที่โหลดแล้ว
const BANK_ENTRIES = {};                           // หัวข้อ → [{ id, item }] รหัสข้อ = หัวข้อ#ลำดับในหัวข้อ
const VOCAB_BY_TOPIC = {}, VOCAB_BY_LEVEL = {}, VOCAB_TOPIC_BY_ID = {}, SPELL_BY_TOPIC = {}, SPELL_TOPIC_BY_ID = {};
VOCAB_TOPICS.forEach(t => { VOCAB_TOPIC_BY_ID[t.id] = t; });
SPELL_TOPICS.forEach(t => { SPELL_TOPIC_BY_ID[t.id] = t; });
const dataReady = level => DATA_KINDS.every(k => DATA_LOADED[k + ':' + level]);
function SQ_DATA(kind, level, list) {
  const key = kind + ':' + level;
  if (DATA_LOADED[key]) return;                    // โหลดซ้ำไม่ทำอะไร
  DATA_LOADED[key] = true;
  if (kind === 'bank') list.forEach(it => { BANK_ITEMS.push(it); const e = BANK_ENTRIES[it.t] || (BANK_ENTRIES[it.t] = []); e.push({ id: bankItemId(it.t, e.length), item: it }); });
  else if (kind === 'vocab') list.forEach(v => { VOCAB.push(v); (VOCAB_BY_TOPIC[v.t] = VOCAB_BY_TOPIC[v.t] || []).push(v); (VOCAB_BY_LEVEL[level] = VOCAB_BY_LEVEL[level] || []).push(v); });
  else if (kind === 'spell') list.forEach(s => { SPELL.push(s); (SPELL_BY_TOPIC[s.t] = SPELL_BY_TOPIC[s.t] || []).push(s); });
  ITEM_INDEX = null;                               // ดัชนีข้อสอบทั้งหมด (ใช้ตรวจเฉลย/สถิติ) ต้องสร้างใหม่
}
function bankItems(topicId) { return BANK_ENTRIES[topicId] || []; }
function bankGen(t) {
  return { id: t.id, subject: t.subject, level: t.level, tier: t.tier, topic: t.name, bank: true,
    make(r, g, bad, used) {
      let pool = bankItems(g.id).filter(x => !(bad && bad[x.id]) && !(used && used[x.id]));
      if (!pool.length) pool = bankItems(g.id).filter(x => !(bad && bad[x.id]));
      if (!pool.length) pool = bankItems(g.id);
      const pick = r.pick(pool), it = pick.item;
      const order = shuffle([0, 1, 2, 3], r);
      const choices = order.map(i => it.c[i]);
      const correct = order.indexOf(it.a);
      return mkQ(g, escHtml(it.q).replace(/\n/g, '<br>'), rat(correct), escHtml(it.e),
        { kind: 'mc', choices, correct, ansText: CHOICE_LABELS[correct] + '. ' + choices[correct], itemId: pick.id });
    } };
}
BANK_TOPICS.forEach(t => GENS.push(bankGen(t)));

  const lvl = VOCAB_TOPIC_BY_ID[v.t].level, same = VOCAB_BY_TOPIC[v.t] || [], lvAll = VOCAB_BY_LEVEL[lvl] || [];

    do {

      const all = gensFor(p.level, subjects.length > 1 ? rng.pick(subjects) : subjects[0]);
      const core = all.filter(x => x.tier === 'core'), stretch = all.filter(x => x.tier === 'stretch'), easy = all.filter(x => x.tier === 'easy');
      const roll = rng.next();
      let pool = roll < p.stretch ? stretch : (easy.length && roll < p.stretch + EASY_SHARE) ? easy : core;
      if (!pool.length) pool = core.length ? core : all;
      g = weightedPick(pool, x => genWeight(p, x), rng);
      tries++;
    } while (g.id === prev && tries < 10);
    prev = g.id;
    add(g);
  }
  return qs;
}
function topicAccuracy(p, genId) {
  const st = p.stats[genId];
  if (!st || st.r + st.w === 0) return null;
  return st.r / (st.r + st.w);
}

    { say: '<b>น้ำมีความหนาแน่น 1 g/cm³</b> ของที่หนาแน่น <b>น้อยกว่า 1 จะลอย</b> ของที่หนาแน่น <b>มากกว่า 1 จะจม</b> เช่น ไม้ 0.5 ลอย เหล็ก 7.8 จม', fig: { t: 'bars', rows: [{ parts: 10, shade: 5, label: 'ไม้ 0.5 (ลอย)' }, { parts: 10, shade: 10, label: 'น้ำ 1 (เทียบ)' }] } }
  ] },
  { id: 'ls_ohm', level: 'm4', subject: 'sci', gen: 'sc_ohm', icon: '💡', title: 'ไฟสว่างในโรงนา', blurb: 'กฎของโอห์ม ต่ออนุกรมและขนาน', pages: [
    { say: 'ลุงข้าวโพดต่อหลอดไฟในโรงนา ต้องรู้ 3 อย่าง: <b>แรงดันไฟ V</b> (โวลต์) <b>กระแส I</b> (แอมแปร์) และ <b>ความต้านทาน R</b> (โอห์ม) ซึ่งสัมพันธ์กันตามกฎของโอห์ม', fig: { t: 'formula', lines: ['V = I × R', 'I = V ÷ R'] } },
    { say: 'ต่อตัวต้านทานแบบ <b>อนุกรม</b> (ต่อเรียงกันทางเดียว) ความต้านทานรวมคือ <b>บวกกัน</b> เช่น 4 + 6 = 10 โอห์ม', fig: { t: 'circ', kind: 'series', a: '4 Ω', b: '6 Ω' } },
    { say: 'ถ้าแหล่งไฟ <b>20 โวลต์</b> กระแสในวงจร I = V ÷ R = 20 ÷ 10 = <b>2 แอมแปร์</b> (กระแสเท่ากันตลอดวงจรอนุกรม)', fig: { t: 'formula', lines: ['R รวม = 4 + 6 = 10 Ω', 'I = 20 ÷ 10 = 2 A'] } },
    { say: 'ต่อแบบ <b>ขนาน</b> (มีหลายทางให้กระแสแยกไหล) ความต้านทานรวมจะ <b>น้อยลง</b> สูตร 1/R = 1/R₁ + 1/R₂ หรือ R = (R₁×R₂) ÷ (R₁+R₂)', fig: { t: 'circ', kind: 'parallel', a: '6 Ω', b: '3 Ω' } },
    { say: 'ตัวอย่าง 6 Ω ขนานกับ 3 Ω: R = (6 × 3) ÷ (6 + 3) = 18 ÷ 9 = <b>2 Ω</b> ซึ่งน้อยกว่าตัวที่น้อยที่สุด (3 Ω) เสมอ ใช้ตรวจคำตอบได้', fig: { t: 'formula', lines: ['อนุกรม: R = R₁ + R₂', 'ขนาน: R = (R₁×R₂)÷(R₁+R₂)', 'ขนานแล้ว R น้อยกว่าตัวเล็กสุด'] } }
  ] },
  { id: 'ls_quad', level: 'm4', subject: 'math', gen: 'quad_roots', icon: '🧩', title: 'ล้อมคอกด้วยการแยกตัวประกอบ', blurb: 'สมการกำลังสอง (แยกตัวประกอบ)', pages: [
    { say: 'สมการแบบ <b>x² − 5x + 6 = 0</b> เรียกว่าสมการกำลังสอง มักมีคำตอบ 2 ค่า วิธีง่ายที่สุดคือ <b>แยกตัวประกอบ</b> ให้เป็นวงเล็บสองอัน', fig: { t: 'formula', lines: ['x² − 5x + 6 = 0', '= (x − ?)(x − ?) = 0'] } },
    { say: 'หาเลข 2 ตัวที่ <b>คูณกันได้ +6</b> (ตัวท้าย) และ <b>บวกกันได้ −5</b> (ตัวกลาง) ลองไล่: 1×6, 2×3 และต้องติดลบทั้งคู่ → <b>−2 กับ −3</b> (−2×−3 = 6, −2+−3 = −5)', fig: { t: 'formula', lines: ['คูณกัน = 6', 'บวกกัน = −5', 'คือ −2 และ −3'] } },
    { say: 'จึงได้ (x − 2)(x − 3) = 0 ถ้าสองอย่างคูณกันได้ 0 อย่างน้อยหนึ่งอย่างต้องเป็น 0 จึงได้ <b>x = 2 หรือ x = 3</b>', fig: { t: 'formula', lines: ['(x − 2)(x − 3) = 0', 'x = 2 หรือ x = 3'] } },
    { say: '<b>ตรวจคำตอบ</b> แทนค่ากลับ: x = 2 → 4 − 10 + 6 = 0 ✓ · x = 3 → 9 − 15 + 6 = 0 ✓', fig: { t: 'formula', lines: ['2² − 5(2) + 6 = 0 ✓', '3² − 5(3) + 6 = 0 ✓'] } },
    { say: 'ตัวอย่างตัวท้ายติดลบ: x² + x − 12 = 0 → คูณได้ −12 บวกได้ +1 คือ <b>+4 กับ −3</b> ได้ (x + 4)(x − 3) = 0 → <b>x = −4 หรือ 3</b> (ระวังเครื่องหมายตอนย้ายวงเล็บ)', fig: { t: 'formula', lines: ['x² + x − 12 = 0', '(x + 4)(x − 3) = 0', 'x = −4 หรือ x = 3'] } },
    { say: 'สรุป: <b>1)</b> จัดให้ขวาเป็น 0 <b>2)</b> หาเลขสองตัว คูณ = ตัวท้าย บวก = ตัวกลาง <b>3)</b> เขียนเป็นวงเล็บ <b>4)</b> ให้แต่ละวงเล็บ = 0 <b>5)</b> ตรวจด้วยการแทนค่า', fig: { t: 'formula', lines: ['x² + bx + c = 0', 'หาสองตัว: คูณ = c · บวก = b', '(x + ตัวแรก)(x + ตัวสอง) = 0'] } }
  ] },
  { id: 'ls_arith', level: 'm4', subject: 'math', gen: 'arith_seq', icon: '🌽', title: 'แถวข้าวโพดที่เพิ่มขึ้นทีละแถว', blurb: 'ลำดับเลขคณิต พจน์ที่ n และผลบวก', pages: [
    { say: 'ลุงปลูกข้าวโพดเป็นแถว แถวแรก 3 ต้น แถวถัดไปเพิ่มทีละ 2 ต้น: <b>3, 5, 7, 9, …</b> เลขที่เพิ่มด้วยจำนวนเท่ากันทุกครั้ง เรียกว่า <b>ลำดับเลขคณิต</b>', fig: { t: 'emojis', rows: [['🌽', 3, 'แถว 1: 3 ต้น'], ['🌽', 5, 'แถว 2: 5 ต้น'], ['🌽', 7, 'แถว 3: 7 ต้น']] } },
    { say: 'ตัวเลขที่เพิ่มทุกครั้ง เรียก <b>ผลต่างร่วม d</b> ในที่นี้ d = 2 พจน์แรก <b>a₁ = 3</b> ถ้าอยากรู้แถวที่ 10 จะมีกี่ต้น ไม่ต้องไล่นับก็ได้', fig: { t: 'formula', lines: ['a₁ = 3', 'd = 2'] } },
    { say: 'สูตรพจน์ที่ n: <b>aₙ = a₁ + (n − 1)d</b> เพราะกว่าจะถึงพจน์ที่ n ต้องบวก d ไป (n − 1) ครั้ง แถวที่ 10: 3 + 9 × 2 = <b>21 ต้น</b>', fig: { t: 'formula', lines: ['aₙ = a₁ + (n − 1)d', 'a₁₀ = 3 + 9 × 2 = 21'] } },
    { say: 'ผลบวก 10 แถวแรก: <b>Sₙ = n(a₁ + aₙ) ÷ 2</b> = 10 × (3 + 21) ÷ 2 = 10 × 24 ÷ 2 = <b>120 ต้น</b>', fig: { t: 'formula', lines: ['Sₙ = n(a₁ + aₙ) ÷ 2', 'S₁₀ = 10 × 24 ÷ 2 = 120'] } },
    { say: 'ที่มาของสูตร: จับคู่ <b>หัวกับท้าย</b> 3 + 21 = 24, 5 + 19 = 24, … ได้ 5 คู่ คู่ละ 24 รวม 5 × 24 = 120 ถ้าไม่รู้พจน์สุดท้าย ใช้ Sₙ = n(2a₁ + (n − 1)d) ÷ 2 แทน', fig: { t: 'formula', lines: ['3 + 21 = 24', '5 + 19 = 24 ...', '5 คู่ × 24 = 120'] } }
  ] },
  { id: 'ls_punnett', level: 'm4', subject: 'sci', gen: 'sc_punnett', icon: '🐥', title: 'ลูกเจี๊ยบสีอะไรดี', blurb: 'พันธุศาสตร์ ตาราง Punnett', pages: [
    { say: 'ลักษณะของลูกถ่ายทอดจากพ่อแม่ผ่าน <b>ยีน</b> ที่เป็นคู่ เขียนด้วยตัวอักษร: ตัวใหญ่ <b>A = ลักษณะเด่น</b> ตัวเล็ก <b>a = ลักษณะด้อย</b> พ่อและแม่ให้ลูกคนละ 1 ตัวจากคู่ของตัวเอง', fig: { t: 'formula', lines: ['A = เด่น · a = ด้อย', 'AA, Aa แสดงลักษณะเด่น', 'aa แสดงลักษณะด้อย'] } },
    { say: 'พ่อ <b>Aa</b> แม่ <b>Aa</b> ใช้ <b>ตาราง Punnett</b> จับคู่ทุกแบบที่เป็นไปได้ ได้ลูก 4 แบบ (แถวคือยีนพ่อ คอลัมน์คือยีนแม่)', fig: { t: 'grid', cols: ['A', 'a'], rows: ['A', 'a'], cells: [['AA', 'Aa'], ['Aa', 'aa']], hi: [] } },
    { say: 'นับจาก 4 ช่อง: ลักษณะเด่น (AA, Aa, Aa) = <b>3/4</b> · ลักษณะด้อย (aa) = <b>1/4</b> · พันธุ์ทาง Aa = <b>2/4 = 1/2</b>', fig: { t: 'grid', cols: ['A', 'a'], rows: ['A', 'a'], cells: [['AA', 'Aa'], ['Aa', 'aa']], hi: [[0, 0], [0, 1], [1, 0]] } },
    { say: 'พ่อ <b>Aa</b> แม่ <b>aa</b>: ลูกได้ Aa 2 ช่อง และ aa 2 ช่อง ลักษณะเด่น = 2/4 = <b>1/2</b> ลักษณะด้อย = <b>1/2</b>', fig: { t: 'grid', cols: ['a', 'a'], rows: ['A', 'a'], cells: [['Aa', 'Aa'], ['aa', 'aa']], hi: [[0, 0], [0, 1]] } },
    { say: 'สรุป: <b>1)</b> เขียนยีนพ่อแม่ <b>2)</b> วาดตาราง 2×2 <b>3)</b> เติมแต่ละช่อง <b>4)</b> นับช่องที่ตรงเงื่อนไข ÷ 4 ถ้าพ่อแม่เป็น AA จะได้ลูกเด่นทุกตัว (4/4)', fig: { t: 'formula', lines: ['จำนวนช่องที่ตรงเงื่อนไข', '÷ 4 ช่อง = ความน่าจะเป็น'] } }
  ] },
  { id: 'ls_rect', level: 'm1', subject: 'math', gen: 'rect_fence', icon: '🥕', title: 'รั้วและหญ้าของสวนผัก', blurb: 'พื้นที่และเส้นรอบรูปสี่เหลี่ยมผืนผ้า', pages: [
    { say: 'ลุงข้าวโพดมีสวนผักรูปสี่เหลี่ยมผืนผ้า <b>ยาว 10 เมตร กว้าง 6 เมตร</b> อยากรู้ว่าต้องซื้อรั้วกี่เมตร และปูหญ้าได้กี่ตารางเมตร', fig: { t: 'rect', l: 'ยาว 10 ม.', w: 'กว้าง 6 ม.' } },
    { say: '<b>เส้นรอบรูป</b> คือความยาวของขอบรอบสวน ใช้คิดรั้ว: <b>2 × (ยาว + กว้าง)</b> = 2 × (10 + 6) = <b>32 เมตร</b>', fig: { t: 'formula', lines: ['เส้นรอบรูป = 2 × (ยาว + กว้าง)', '= 2 × 16 = 32 เมตร'] } },
    { say: '<b>พื้นที่</b> คือเนื้อที่ข้างใน ใช้คิดปูหญ้า: <b>ยาว × กว้าง</b> = 10 × 6 = <b>60 ตารางเมตร</b> สังเกตหน่วย: รอบรูปเป็น "เมตร" พื้นที่เป็น "ตารางเมตร"', fig: { t: 'formula', lines: ['พื้นที่ = ยาว × กว้าง', '= 10 × 6 = 60 ตร.ม.'] } },
    { say: 'โจทย์มักให้ข้อมูลอ้อม ๆ เช่น <b>พื้นที่ 60 ตร.ม. กว้าง 6 ม.</b> ถามรั้ว ต้องหาด้านยาวก่อน: 60 ÷ 6 = 10 แล้วค่อยหารอบรูป 2 × (10 + 6) = 32', fig: { t: 'formula', lines: ['ยาว = พื้นที่ ÷ กว้าง', '= 60 ÷ 6 = 10', 'รั้ว = 2 × (10 + 6) = 32 ม.'] } },
    { say: 'ข้อผิดที่พบบ่อย: เอาพื้นที่ไปใช้เป็นเส้นรอบรูป หรือลืมคูณ 2 จำไว้ว่า <b>รั้ว = รอบรูป · หญ้า/ปูกระเบื้อง = พื้นที่</b>', fig: { t: 'formula', lines: ['รั้ว, ขอบ → เส้นรอบรูป (เมตร)', 'หญ้า, ทาสี, ปูพื้น → พื้นที่ (ตร.ม.)'] } }
  ] },
  { id: 'ls_mean', level: 'm1', subject: 'math', gen: 'mean_missing', icon: '📊', title: 'ไข่ไก่เฉลี่ยต่อวัน', blurb: 'ค่าเฉลี่ยและการหาจากผลรวม', pages: [
    { say: 'ป้าไก่นับไข่ 4 วัน ได้ 3, 5, 4 และ 8 ฟอง ถามว่า <b>เฉลี่ยวันละกี่ฟอง</b>? ค่าเฉลี่ยคือจำนวนที่ถ้าทุกวันได้เท่ากัน จะรวมได้เท่าเดิม', fig: { t: 'emojis', rows: [['🥚', 3, 'วัน 1: 3 ฟอง'], ['🥚', 5, 'วัน 2: 5 ฟอง'], ['🥚', 4, 'วัน 3: 4 ฟอง']] } },
    { say: 'สูตร: <b>ค่าเฉลี่ย = ผลรวม ÷ จำนวนข้อมูล</b> ในที่นี้ 3 + 5 + 4 + 8 = 20 แล้ว 20 ÷ 4 = <b>5 ฟองต่อวัน</b>', fig: { t: 'formula', lines: ['เฉลี่ย = ผลรวม ÷ จำนวนวัน', '(3 + 5 + 4 + 8) ÷ 4 = 5'] } },
    { say: 'โจทย์สอบมักให้ค่าเฉลี่ยมา แล้วให้ย้อนหา <b>ผลรวม</b>: นักเรียน 4 คนเฉลี่ย 70 คะแนน → ผลรวม = 70 × 4 = <b>280</b>', fig: { t: 'formula', lines: ['ผลรวม = เฉลี่ย × จำนวน', '70 × 4 = 280'] } },
    { say: 'มีคนที่ 5 สอบได้ 90: ผลรวมใหม่ = 280 + 90 = 370 เฉลี่ยใหม่ = 370 ÷ 5 = <b>74</b>', fig: { t: 'formula', lines: ['280 + 90 = 370', '370 ÷ 5 = 74'] } },
    { say: 'ระวัง! ห้ามเอา (70 + 90) ÷ 2 = 80 เพราะ 70 เป็นค่าเฉลี่ยของ <b>4 คน</b> ไม่ใช่คนเดียว ต้องแปลงกลับเป็นผลรวมก่อนเสมอ', fig: { t: 'formula', lines: ['เฉลี่ย → ผลรวม (× จำนวนคน)', 'บวกข้อมูลใหม่', 'หารด้วยจำนวนคนใหม่'] } }
  ] },
  { id: 'ls_speed', level: 'm1', subject: 'math', gen: 'speed_time', icon: '🚚', title: 'รถบรรทุกส่งผัก', blurb: 'ระยะทาง ความเร็ว เวลา', pages: [
    { say: 'รถบรรทุกส่งผักวิ่งด้วยความเร็วคงที่ <b>60 กิโลเมตรต่อชั่วโมง</b> นาน 2 ชั่วโมง จะไปได้ไกลแค่ไหน?', fig: { t: 'emojis', rows: [['🚚', 2, '60 กม./ชม. นาน 2 ชม.']] } },
    { say: 'สูตร: <b>ระยะทาง = ความเร็ว × เวลา</b> = 60 × 2 = <b>120 กิโลเมตร</b> ความเร็ว 60 กม./ชม. แปลว่า 1 ชั่วโมงไป 60 กม.', fig: { t: 'formula', lines: ['ระยะทาง = ความเร็ว × เวลา', '60 × 2 = 120 กม.'] } },
    { say: 'ถ้าเวลามี <b>นาที</b> ต้องแปลงเป็นชั่วโมงก่อน (หาร 60) เช่น 2 ชม. 30 นาที = 2 ชม. + 30/60 = 2.5 ชม. → 60 × 2.5 = <b>150 กม.</b>', fig: { t: 'formula', lines: ['30 นาที = 30/60 = 1/2 ชม.', '60 × 2.5 = 150 กม.'] } },
    { say: 'อีกตัวอย่าง: 80 กม./ชม. นาน 1 ชม. 45 นาที: 80 × 1 = 80 กม. และ 45 นาที = 3/4 ชม. 80 × 3/4 = 60 กม. รวม <b>140 กม.</b>', fig: { t: 'formula', lines: ['80 × 1 = 80', '80 × 45/60 = 60', '80 + 60 = 140 กม.'] } },
    { say: 'จำไว้: <b>หน่วยต้องตรงกัน</b> ความเร็วเป็นต่อชั่วโมง เวลาต้องเป็นชั่วโมง ทางลัด 15 นาที = 1/4 ชม. · 30 นาที = 1/2 ชม. · 45 นาที = 3/4 ชม.', fig: { t: 'formula', lines: ['15 นาที = 1/4 ชม.', '30 นาที = 1/2 ชม.', '45 นาที = 3/4 ชม.'] } }
  ] },
  { id: 'ls_lin', level: 'm1', subject: 'math', gen: 'lin1', icon: '⚖️', title: 'ตาชั่งสมดุลของสมการ', blurb: 'สมการเชิงเส้น 1 ตัวแปร', pages: [
    { say: 'สมการเหมือน <b>ตาชั่งสมดุล</b> ซ้ายเท่ากับขวา อะไรที่ทำกับข้างซ้าย <b>ต้องทำกับข้างขวาเหมือนกัน</b> ตาชั่งถึงยังสมดุล', fig: { t: 'formula', lines: ['3x + 5 = 20', 'หา x = ?'] } },
    { say: 'ขั้นแรก <b>กำจัดตัวบวกลบ</b> ลบ 5 ออกทั้งสองข้าง: 3x + 5 − 5 = 20 − 5 ได้ <b>3x = 15</b>', fig: { t: 'formula', lines: ['3x + 5 = 20', '3x = 20 − 5', '3x = 15'] } },
    { say: 'ขั้นสอง <b>กำจัดตัวคูณ</b> หารทั้งสองข้างด้วย 3: x = 15 ÷ 3 = <b>5</b>', fig: { t: 'formula', lines: ['3x = 15', 'x = 15 ÷ 3', 'x = 5'] } },
    { say: '<b>ตรวจคำตอบ</b> เสมอ แทน x = 5 กลับ: 3 × 5 + 5 = 20 ✓ ถ้าไม่เท่า แปลว่าคำนวณพลาด', fig: { t: 'formula', lines: ['3(5) + 5 = 15 + 5 = 20 ✓'] } },
    { say: 'ตัวอย่างมีเครื่องหมายลบ: 4x − 7 = 13 → <b>บวก 7</b> ทั้งสองข้าง ได้ 4x = 20 → x = <b>5</b> (ตรวจ 4×5 − 7 = 13 ✓) ย้ายข้างแล้วเครื่องหมายสลับเสมอ', fig: { t: 'formula', lines: ['4x − 7 = 13', '4x = 13 + 7 = 20', 'x = 5'] } },
    { say: 'ตอบเป็นลบได้ เช่น 2x + 9 = 1 → 2x = 1 − 9 = <b>−8</b> → x = <b>−4</b> (ตรวจ 2(−4) + 9 = 1 ✓) ลำดับ: จัดบวกลบก่อน แล้วค่อยหารตัวคูณ', fig: { t: 'formula', lines: ['2x + 9 = 1', '2x = −8', 'x = −4'] } }
  ] },
  { id: 'ls_circle', level: 'm4', subject: 'math', gen: 'circle', icon: '⭕', title: 'บ่อน้ำกลมของฟาร์ม', blurb: 'เส้นรอบวงและพื้นที่วงกลม (π = 22/7)', pages: [
    { say: 'ฟาร์มมีบ่อน้ำกลม <b>รัศมี 7 เมตร</b> รัศมีคือระยะจากจุดศูนย์กลางถึงขอบ ถ้าอยากรู้ว่าต้องล้อมรั้วยาวเท่าไร และผิวน้ำกว้างแค่ไหน', fig: { t: 'disc', label: 'รัศมี r = 7 ม.' } },
    { say: '<b>เส้นรอบวง</b> (ยาวรอบบ่อ) <b>C = 2πr</b> ใช้ π = 22/7: 2 × 22/7 × 7 = <b>44 เมตร</b> (7 ตัดกับ 7 ได้พอดี)', fig: { t: 'formula', lines: ['C = 2πr', '= 2 × 22/7 × 7 = 44 ม.'] } },
    { say: '<b>พื้นที่</b> A = <b>πr²</b> = 22/7 × 7 × 7 = 22 × 7 = <b>154 ตารางเมตร</b> ระวัง r² คือ r × r ไม่ใช่ r × 2', fig: { t: 'formula', lines: ['A = πr²', '= 22/7 × 7 × 7 = 154 ตร.ม.'] } },
    { say: 'ใช้ 22/7 สะดวกเมื่อรัศมีหารด้วย 7 ลงตัว เช่น r = 14: A = 22/7 × 14 × 14 = 22 × 2 × 14 = <b>616</b> และ C = 2 × 22/7 × 14 = <b>88</b>', fig: { t: 'formula', lines: ['r = 14', 'A = 22/7 × 196 = 616', 'C = 2 × 22/7 × 14 = 88'] } },
    { say: 'ระวังโจทย์ให้ <b>เส้นผ่านศูนย์กลาง d</b> (กว้างสุดของวงกลม) ต้องหาร 2 ให้เป็นรัศมีก่อน: r = d ÷ 2', fig: { t: 'formula', lines: ['d = 2r  →  r = d ÷ 2', 'แล้วค่อยใช้ C = 2πr, A = πr²'] } }
  ] },
  { id: 'ls_dice', level: 'm4', subject: 'math', gen: 'dice_sum', icon: '🎲', title: 'ทอยลูกเต๋าสองลูก', blurb: 'ความน่าจะเป็นจากตารางผลลัพธ์', pages: [
    { say: 'ทอยลูกเต๋า 2 ลูกพร้อมกัน แต้มแต่ละลูกมี 6 แบบ ผลลัพธ์ทั้งหมด <b>6 × 6 = 36 แบบ</b> ตารางนี้แสดงผลบวกของทุกแบบ', fig: { t: 'grid', cols: ['1', '2', '3', '4', '5', '6'], rows: ['1', '2', '3', '4', '5', '6'], cells: [[2, 3, 4, 5, 6, 7], [3, 4, 5, 6, 7, 8], [4, 5, 6, 7, 8, 9], [5, 6, 7, 8, 9, 10], [6, 7, 8, 9, 10, 11], [7, 8, 9, 10, 11, 12]].map(r => r.map(String)), hi: [], W: 40, fs: 16 } },
    { say: 'ผลบวก <b>เท่ากับ 7</b> อยู่ตามเส้นทแยงมุม มี 6 แบบ (1+6, 2+5, 3+4, 4+3, 5+2, 6+1) ความน่าจะเป็น = 6/36 = <b>1/6</b>', fig: { t: 'grid', cols: ['1', '2', '3', '4', '5', '6'], rows: ['1', '2', '3', '4', '5', '6'], cells: [[2, 3, 4, 5, 6, 7], [3, 4, 5, 6, 7, 8], [4, 5, 6, 7, 8, 9], [5, 6, 7, 8, 9, 10], [6, 7, 8, 9, 10, 11], [7, 8, 9, 10, 11, 12]].map(r => r.map(String)), hi: [[0, 5], [1, 4], [2, 3], [3, 2], [4, 1], [5, 0]], W: 40, fs: 16 } },
    { say: 'ผลบวก <b>มากกว่าหรือเท่ากับ 10</b> = 10 (3 แบบ) + 11 (2 แบบ) + 12 (1 แบบ) = 6 แบบ → 6/36 = <b>1/6</b>', fig: { t: 'grid', cols: ['1', '2', '3', '4', '5', '6'], rows: ['1', '2', '3', '4', '5', '6'], cells: [[2, 3, 4, 5, 6, 7], [3, 4, 5, 6, 7, 8], [4, 5, 6, 7, 8, 9], [5, 6, 7, 8, 9, 10], [6, 7, 8, 9, 10, 11], [7, 8, 9, 10, 11, 12]].map(r => r.map(String)), hi: [[3, 5], [4, 4], [4, 5], [5, 3], [5, 4], [5, 5]], W: 40, fs: 16 } },
    { say: 'สูตร: <b>ความน่าจะเป็น = จำนวนแบบที่ต้องการ ÷ จำนวนแบบทั้งหมด</b> ค่าอยู่ระหว่าง 0 ถึง 1 และอย่าลืมทำเป็นเศษส่วนอย่างต่ำ (6/36 = 1/6)', fig: { t: 'formula', lines: ['P = แบบที่ต้องการ ÷ 36', 'ทำเป็นเศษส่วนอย่างต่ำ'] } },
    { say: 'เคล็ด: ผลบวก 7 เกิดบ่อยสุด (6 แบบ) ส่วน 2 กับ 12 เกิดยากสุด (1 แบบ) ถ้าโจทย์ถามผลบวกที่เป็นไปไม่ได้ เช่น 13 ความน่าจะเป็นคือ 0', fig: { t: 'formula', lines: ['ผลบวก 7 → 6 แบบ (มากสุด)', 'ผลบวก 2 หรือ 12 → 1 แบบ', 'ผลบวก 13 → 0 แบบ'] } }
  ] },
  { id: 'ls_kine', level: 'm4', subject: 'sci', gen: 'sc_kine', icon: '🚜', title: 'รถไถเร่งเครื่อง', blurb: 'การเคลื่อนที่ด้วยความเร่งคงที่', pages: [
    { say: 'รถไถของลุงเริ่มออกตัวด้วยความเร็ว <b>2 เมตร/วินาที</b> แล้วเร่งเครื่องเพิ่มความเร็วอย่างสม่ำเสมอ <b>ความเร่ง</b> คือความเร็วที่เพิ่มขึ้นในทุก 1 วินาที', fig: { t: 'emojis', rows: [['🚜', 1, 'u = 2 m/s, a = 3 m/s², t = 4 s']] } },
    { say: 'ความเร่ง a = 3 เมตร/วินาที² หมายถึง ทุกวินาทีเร็วขึ้น 3 เมตร/วินาที ความเร็วปลาย <b>v = u + at</b> = 2 + 3 × 4 = <b>14 เมตร/วินาที</b>', fig: { t: 'formula', lines: ['v = u + at', '= 2 + 3 × 4 = 14 m/s'] } },
    { say: 'ระยะทางที่ไปได้: <b>s = ut + ½at²</b> = 2 × 4 + ½ × 3 × 4² = 8 + 24 = <b>32 เมตร</b> (t² คือ 4 × 4 = 16 ไม่ใช่ 4 × 2)', fig: { t: 'formula', lines: ['s = ut + ½at²', '= 8 + ½ × 3 × 16', '= 8 + 24 = 32 m'] } },
    { say: '<b>ตรวจคำตอบ</b> ด้วยวิธีเฉลี่ย: ความเร็วเฉลี่ย = (2 + 14) ÷ 2 = 8 m/s ไป 4 วินาที ได้ 8 × 4 = 32 เมตร ตรงกัน ✓', fig: { t: 'formula', lines: ['เฉลี่ย (2 + 14) ÷ 2 = 8', '8 × 4 = 32 m ✓'] } },
    { say: 'ตัวแปร: <b>u</b> ความเร็วต้น · <b>v</b> ความเร็วปลาย · <b>a</b> ความเร่ง · <b>t</b> เวลา · <b>s</b> ระยะทาง ถ้าออกจากหยุดนิ่ง u = 0 สูตรจะง่ายขึ้นมาก', fig: { t: 'formula', lines: ['v = u + at', 's = ut + ½at²', 'ออกจากหยุดนิ่ง: u = 0'] } }
  ] },
  { id: 'ls_heat', level: 'm4', subject: 'sci', gen: 'sc_heat', icon: '♨️', title: 'ต้มน้ำให้ร้อนต้องใช้พลังงานเท่าไร', blurb: 'ความร้อนจำเพาะ Q = mcΔT', pages: [
    { say: 'น้ำ 1 กรัมต้องการพลังงานความร้อน <b>4.2 จูล</b> เพื่อให้ร้อนขึ้น 1 °C ค่านี้เรียก <b>ความร้อนจำเพาะ (c)</b> ของน้ำ แต่ละสารมีค่าไม่เท่ากัน', fig: { t: 'formula', lines: ['น้ำ c = 4.2 จูล/กรัม·°C'] } },
    { say: 'สูตร: <b>Q = m × c × ΔT</b> Q = พลังงานความร้อน (จูล) m = มวล (กรัม) ΔT = อุณหภูมิที่เปลี่ยน (°C)', fig: { t: 'formula', lines: ['Q = m × c × ΔT'] } },
    { say: 'ตัวอย่าง: น้ำ 200 กรัม ร้อนขึ้น 10 °C: Q = 200 × 4.2 × 10 = <b>8,400 จูล</b>', fig: { t: 'formula', lines: ['200 × 4.2 × 10', '= 8,400 จูล'] } },
    { say: 'อีกตัวอย่าง: น้ำ 150 กรัม ร้อนขึ้น 20 °C: 150 × 4.2 × 20 = <b>12,600 จูล</b> ทริค: คูณ 150 × 20 = 3,000 ก่อน แล้วค่อย × 4.2', fig: { t: 'formula', lines: ['150 × 20 = 3,000', '3,000 × 4.2 = 12,600 จูล'] } },
    { say: 'ΔT คือ <b>ค่าที่เปลี่ยน</b> ไม่ใช่อุณหภูมิสุดท้าย เช่น จาก 25 ถึง 45 °C ΔT = 45 − 25 = 20 และถ้า c สูง (เช่นน้ำ) ใช้พลังงานมากกว่าจะร้อนขึ้น', fig: { t: 'formula', lines: ['ΔT = อุณหภูมิหลัง − ก่อน', '25 → 45 °C  :  ΔT = 20'] } }
  ] },
  { id: 'ls_power', level: 'm4', subject: 'sci', gen: 'sc_power', icon: '💪', title: 'ผลักกล่องผักด้วยกำลังเท่าไร', blurb: 'งานและกำลัง', pages: [
    { say: 'ลุงออกแรงผลักกล่องผัก <b>20 นิวตัน</b> ไปตามพื้น <b>5 เมตร</b> ในทางฟิสิกส์ถือว่าทำ <b>งาน</b> เมื่อมีแรงและวัตถุเคลื่อนที่ไปตามแรง', fig: { t: 'emojis', rows: [['📦', 1, 'แรง 20 N · ระยะ 5 m · เวลา 4 s']] } },
    { say: '<b>งาน W = แรง × ระยะทาง</b> = 20 × 5 = <b>100 จูล</b> (นิวตันคูณเมตร = จูล)', fig: { t: 'formula', lines: ['W = F × s', '= 20 × 5 = 100 จูล'] } },
    { say: '<b>กำลัง</b> คืองานที่ทำได้ในหนึ่งวินาที: <b>P = W ÷ t</b> ถ้าใช้เวลา 4 วินาที P = 100 ÷ 4 = <b>25 วัตต์</b> (วัตต์ = จูลต่อวินาที)', fig: { t: 'formula', lines: ['P = W ÷ t', '= 100 ÷ 4 = 25 วัตต์'] } },
    { say: 'งานเท่าเดิมแต่ทำเร็วขึ้น <b>กำลังยิ่งมาก</b>: ใช้เวลา 2 วินาที P = 100 ÷ 2 = <b>50 วัตต์</b> (เวลาลดครึ่ง กำลังเพิ่มสองเท่า)', fig: { t: 'formula', lines: ['เวลา 4 s → 25 W', 'เวลา 2 s → 50 W'] } },
    { say: 'ระวัง: ถ้าถือกล่องค้างไว้เฉย ๆ ไม่เคลื่อนที่ <b>งานเป็น 0</b> และแรงต้องอยู่ในแนวเดียวกับการเคลื่อนที่ โจทย์สอบมักบอกแรง ระยะ เวลา ให้คิดงานก่อนแล้วค่อยหากำลัง', fig: { t: 'formula', lines: ['1) W = F × s', '2) P = W ÷ t', 'ไม่เคลื่อนที่ → W = 0'] } }
  ] },
  { id: 'ls_lcm', level: 'm1', subject: 'math', gen: 'lcm_word', icon: '💡', title: 'ไฟสองดวงกะพริบพร้อมกัน', blurb: 'ค.ร.น. ในโจทย์ปัญหา', pages: [

    { say: 'ตัวเลขที่ซ้ำกันตัวแรกคือ <b>12</b> เรียกว่า <b>ค.ร.น.</b> (ตัวคูณร่วมที่น้อยที่สุด) ดังนั้นกะพริบพร้อมกันอีกครั้งใน <b>12 วินาที</b>', fig: { t: 'formula', lines: ['ค.ร.น. ของ 4 และ 6 = 12', 'พร้อมกันอีกใน 12 วินาที'] } },

  ] },
  { id: 'ls_work', level: 'm1', subject: 'math', gen: 'work_rate', icon: '🎨', title: 'ช่วยกันทาสีโรงนา', blurb: 'งานที่ทำพร้อมกัน', pages: [

  ] },
  { id: 'ls_age', level: 'm1', subject: 'math', gen: 'age_sum', icon: '👨‍👧', title: 'อายุพ่อกับลูก', blurb: 'โจทย์อายุ แบ่งเป็นส่วน', pages: [

    { say: 'รวมอายุตอนนี้ = <b>1 + 3 = 4 ส่วน</b> แต่ตัวเลข 40 เป็นของ <b>อีก 4 ปีข้างหน้า</b> ต้องย้อนกลับมาปัจจุบันก่อน', fig: { t: 'formula', lines: ['ตอนนี้: ลูก 1 ส่วน + พ่อ 3 ส่วน = 4 ส่วน', 'อีก 4 ปี: รวม 40 ปี'] } },
    { say: 'อีก 4 ปี <b>ทั้งสองคนอายุเพิ่มคนละ 4</b> รวมเพิ่ม 4 × 2 = 8 ปี ดังนั้นตอนนี้รวมกัน 40 − 8 = <b>32 ปี</b>', fig: { t: 'formula', lines: ['รวมเพิ่ม 2 คน × 4 ปี = 8', 'ตอนนี้รวม 40 − 8 = 32 ปี'] } },
    { say: '4 ส่วน = 32 ปี → 1 ส่วน = 8 ปี ลูกอายุ <b>8 ปี</b> พ่ออายุ 3 × 8 = <b>24 ปี</b> ตรวจ: อีก 4 ปี 12 + 28 = 40 ✓', fig: { t: 'formula', lines: ['1 ส่วน = 32 ÷ 4 = 8', 'ลูก 8 ปี · พ่อ 24 ปี', 'ตรวจ 12 + 28 = 40 ✓'] } },
    { say: 'สรุป: <b>1)</b> วาดส่วนตอนนี้ <b>2)</b> ปรับตัวเลขให้เป็นเวลาเดียวกัน (อายุเพิ่มคนละเท่ากัน คูณจำนวนคน) <b>3)</b> หาร 1 ส่วน <b>4)</b> ตอบแล้วตรวจ ผลต่างอายุ ไม่เปลี่ยนตามเวลา', fig: { t: 'formula', lines: ['ผลต่างอายุคงที่เสมอ', 'อีก n ปี รวมเพิ่ม 2n'] } }
  ] },
  { id: 'ls_seqn', level: 'm1', subject: 'math', gen: 'seq_nth', icon: '🔢', title: 'หาพจน์ที่ 50 โดยไม่ต้องนับ', blurb: 'แบบรูปและพจน์ที่ n', pages: [
    { say: 'แบบรูป <b>5, 9, 13, 17, …</b> พจน์ที่ 50 คือเลขอะไร? ถ้าไล่นับทีละตัวคงเหนื่อย ต้องหากฎก่อน', fig: { t: 'formula', lines: ['5, 9, 13, 17, ...', 'พจน์ที่ 50 = ?'] } },
    { say: 'ดูผลต่างระหว่างตัวติดกัน: 9−5 = 4, 13−9 = 4, 17−13 = 4 <b>เพิ่มทีละ 4 เท่ากันทุกครั้ง</b>', fig: { t: 'formula', lines: ['5 → 9 → 13 → 17', '  +4   +4   +4'] } },
    { say: 'กว่าจะถึงพจน์ที่ 50 ต้อง "บวก 4" ไป <b>49 ครั้ง</b> (ไม่ใช่ 50 เพราะพจน์แรกอยู่แล้ว) จึงได้ 5 + 49 × 4', fig: { t: 'formula', lines: ['พจน์ที่ n = พจน์แรก + (n − 1) × ผลต่าง', '= 5 + 49 × 4'] } },
    { say: 'คำนวณ: 49 × 4 = 196 แล้ว 5 + 196 = <b>201</b> พจน์ที่ 50 คือ 201', fig: { t: 'formula', lines: ['5 + 196 = 201'] } },
    { say: 'ตรวจกับตัวเล็กก่อนเสมอ: พจน์ที่ 3 ตามสูตร = 5 + 2 × 4 = 13 ตรงกับแบบรูป ✓ จุดพลาดที่พบบ่อยคือใช้ n แทน (n − 1)', fig: { t: 'formula', lines: ['พจน์ที่ 3 = 5 + 2×4 = 13 ✓', 'ระวัง (n − 1) ไม่ใช่ n'] } }
  ] },
  { id: 'ls_diffsq', level: 'm4', subject: 'math', gen: 'diff_squares', icon: '✂️', title: 'ทางลัดผลต่างกำลังสอง', blurb: 'หาค่าโดยไม่ต้องแก้สมการ', pages: [
    { say: 'ถ้า <b>x − 2y = 3</b> และ <b>x² − 4y² = 21</b> จงหา x + 2y ลองแก้หา x กับ y ก็ได้ แต่มีทางลัดที่เร็วกว่ามาก', fig: { t: 'formula', lines: ['x − 2y = 3', 'x² − 4y² = 21', 'x + 2y = ?'] } },
    { say: 'จำสูตร <b>ผลต่างกำลังสอง</b>: a² − b² = (a − b)(a + b) มองว่า x² − 4y² = x² − (2y)² จึงแยกได้เป็น (x − 2y)(x + 2y)', fig: { t: 'formula', lines: ['a² − b² = (a − b)(a + b)', 'x² − 4y² = (x − 2y)(x + 2y)'] } },
    { say: 'แทนค่าที่รู้: 21 = (x − 2y)(x + 2y) = <b>3</b> × (x + 2y)', fig: { t: 'formula', lines: ['21 = 3 × (x + 2y)'] } },
    { say: 'หารทั้งสองข้างด้วย 3: x + 2y = 21 ÷ 3 = <b>7</b> ไม่ต้องรู้ค่า x กับ y เลย', fig: { t: 'formula', lines: ['x + 2y = 21 ÷ 3 = 7'] } },
    { say: 'ตรวจ: ถ้า x = 5, y = 1 → x − 2y = 3 ✓ · x² − 4y² = 25 − 4 = 21 ✓ · x + 2y = 7 ✓ สัญญาณที่ใช้สูตรนี้: โจทย์ให้กำลังสอง กับตัวที่ลบกัน', fig: { t: 'formula', lines: ['5² − 4(1)² = 21 ✓', 'แยก (ลบ)(บวก) แล้วแทนค่า'] } }
  ] },
  { id: 'ls_mix', level: 'm4', subject: 'math', gen: 'mix_conc', icon: '🧂', title: 'ผสมน้ำเกลือสองถัง', blurb: 'ผสมสารละลายและร้อยละ', pages: [
    { say: 'น้ำเกลือ <b>20%</b> ปริมาตร 300 มล. ผสมกับน้ำเกลือ <b>40%</b> ปริมาตร 200 มล. ได้น้ำเกลือเข้มข้นกี่เปอร์เซ็นต์?', fig: { t: 'bars', rows: [{ parts: 5, shade: 1, label: 'ถัง 1: 20% (300 มล.)' }, { parts: 5, shade: 2, label: 'ถัง 2: 40% (200 มล.)' }] } },
    { say: 'หัวใจคือ คิดปริมาณ <b>เกลือจริง ๆ</b> ในแต่ละถัง: เกลือ = ปริมาตร × ร้อยละ ÷ 100', fig: { t: 'formula', lines: ['ถัง 1: 300 × 20% = 60 มล.', 'ถัง 2: 200 × 40% = 80 มล.'] } },
    { say: 'รวมเกลือ 60 + 80 = <b>140</b> มล. รวมน้ำเกลือทั้งหมด 300 + 200 = <b>500</b> มล.', fig: { t: 'formula', lines: ['เกลือรวม = 140 มล.', 'สารละลายรวม = 500 มล.'] } },
    { say: 'ความเข้มข้นใหม่ = เกลือรวม ÷ สารละลายรวม × 100 = 140 ÷ 500 × 100 = <b>28%</b>', fig: { t: 'formula', lines: ['140 ÷ 500 × 100 = 28%'] } },
    { say: 'ตรวจ: ผลต้องอยู่ <b>ระหว่าง 20% กับ 40%</b> และเอนไปทางถังที่ปริมาตรมากกว่า (ถัง 20%) 28% จึงสมเหตุผล ห้ามเอา (20+40)÷2 = 30 เพราะปริมาตรไม่เท่ากัน', fig: { t: 'formula', lines: ['ผลอยู่ระหว่างสองค่า', 'เอนไปทางถังที่มากกว่า', 'ห้ามเฉลี่ยตรง ๆ'] } }
  ] },
  { id: 'ls_dilute', level: 'm4', subject: 'sci', gen: 'sc_dilute', icon: '🧪', title: 'เติมน้ำให้สารละลายจางลง', blurb: 'การเจือจาง C₁V₁ = C₂V₂', pages: [
    { say: 'เติมน้ำลงในสารละลาย สารละลายจะ <b>จางลง</b> แต่ปริมาณ <b>สารที่ละลายอยู่ไม่เปลี่ยน</b> มีแค่ปริมาตรเพิ่มขึ้น นี่คือหัวใจของเรื่องนี้', fig: { t: 'formula', lines: ['เติมน้ำ → ปริมาตรเพิ่ม', 'สารละลาย (โมล) เท่าเดิม', 'ความเข้มข้นลดลง'] } },
    { say: 'โมลของสาร = ความเข้มข้น (M) × ปริมาตร (ลิตร) ก่อนเติมน้ำกับหลังเติมน้ำ โมลเท่ากัน จึงได้สูตร <b>C₁V₁ = C₂V₂</b>', fig: { t: 'formula', lines: ['C₁V₁ = C₂V₂', 'ก่อนเจือจาง = หลังเจือจาง'] } },
    { say: 'ตัวอย่าง: สารละลาย <b>6 M</b> ปริมาตร 100 มล. อยากได้ <b>2 M</b> → 6 × 100 = 2 × V₂ → V₂ = 600 ÷ 2 = <b>300 มล.</b>', fig: { t: 'formula', lines: ['6 × 100 = 2 × V₂', 'V₂ = 300 มล.'] } },
    { say: 'โจทย์มักถาม <b>ต้องเติมน้ำกี่มล.</b> ซึ่งไม่ใช่ V₂ แต่คือ V₂ − V₁ = 300 − 100 = <b>200 มล.</b> (ระวังตอบ 300 ผิด!)', fig: { t: 'formula', lines: ['น้ำที่เติม = V₂ − V₁', '= 300 − 100 = 200 มล.'] } },
    { say: 'ตัวอย่างอีกข้อ: 4 M ปริมาตร 50 มล. เจือจางเป็น 1 M → V₂ = 4 × 50 ÷ 1 = 200 มล. เติมน้ำ <b>150 มล.</b> ตรวจ: ความเข้มข้นลดลง 4 เท่า ปริมาตรต้องเพิ่ม 4 เท่า ✓', fig: { t: 'formula', lines: ['4 × 50 = 1 × V₂ → V₂ = 200', 'เติมน้ำ 200 − 50 = 150 มล.'] } }
  ] },
  { id: 'ls_boyle', level: 'm4', subject: 'sci', gen: 'sc_boyle', icon: '🎈', title: 'บอลลูนถูกบีบ', blurb: 'กฎของบอยล์ P₁V₁ = P₂V₂', pages: [
    { say: 'ก๊าซในกระบอกสูบ ถ้า <b>อุณหภูมิคงที่</b> แล้วเพิ่มความดัน ปริมาตรก๊าซจะ <b>ลดลง</b> เหมือนบีบบอลลูนให้เล็กลง นี่คือ <b>กฎของบอยล์</b>', fig: { t: 'emojis', rows: [['🎈', 3, 'ความดันต่ำ ปริมาตรมาก'], ['🎈', 1, 'ความดันสูง ปริมาตรน้อย']] } },
    { say: 'ความดันกับปริมาตรเป็น <b>สัดส่วนผกผัน</b> ความดันเพิ่ม 2 เท่า ปริมาตรลดเหลือครึ่งเดียว ผลคูณ P × V จึงคงที่', fig: { t: 'formula', lines: ['P × V = ค่าคงที่', 'P₁V₁ = P₂V₂'] } },
    { say: 'ตัวอย่าง: ก๊าซ <b>6 ลิตร</b> ที่ <b>2 บรรยากาศ</b> เพิ่มความดันเป็น 4 บรรยากาศ: 2 × 6 = 4 × V₂ → V₂ = 12 ÷ 4 = <b>3 ลิตร</b>', fig: { t: 'formula', lines: ['2 × 6 = 4 × V₂', 'V₂ = 3 ลิตร'] } },
    { say: 'ลดความดันก็ได้: ก๊าซ 8 ลิตร ที่ 3 บรรยากาศ ลดเหลือ 2 บรรยากาศ → V₂ = 3 × 8 ÷ 2 = <b>12 ลิตร</b> (ความดันลด ปริมาตรต้องเพิ่ม)', fig: { t: 'formula', lines: ['3 × 8 = 2 × V₂', 'V₂ = 12 ลิตร'] } },
    { say: 'ตรวจคำตอบด้วยทิศทาง: ความดัน <b>เพิ่ม</b> → ปริมาตร <b>ลด</b> · ความดัน <b>ลด</b> → ปริมาตร <b>เพิ่ม</b> และใช้ได้เมื่ออุณหภูมิคงที่เท่านั้น', fig: { t: 'formula', lines: ['P เพิ่ม → V ลด', 'P ลด → V เพิ่ม', 'ต้องอุณหภูมิคงที่'] } }
  ] },
  { id: 'ls_chicken', level: 'm1', subject: 'math', gen: 'chicken_cow', icon: '🐄', title: 'ไก่กับวัวในคอก', blurb: 'โจทย์สมมติ นับหัวนับขา', pages: [
    { say: 'ในคอกมีไก่กับวัวรวมกัน <b>10 ตัว</b> นับขาได้ <b>28 ขา</b> มีไก่กี่ตัว วัวกี่ตัว? ไก่มี 2 ขา วัวมี 4 ขา', fig: { t: 'emojis', rows: [['🐔', 3, 'ไก่ 2 ขา'], ['🐄', 3, 'วัว 4 ขา']] } },
    { say: 'ใช้วิธี <b>สมมติ</b> ก่อนว่า ทั้ง 10 ตัวเป็นไก่ทั้งหมด จะมีขา 10 × 2 = <b>20 ขา</b>', fig: { t: 'formula', lines: ['สมมติไก่ทั้งหมด', '10 × 2 = 20 ขา'] } },
    { say: 'แต่จริงมี 28 ขา ขาดไป 28 − 20 = <b>8 ขา</b> ทุกครั้งที่เปลี่ยนไก่ 1 ตัวเป็นวัว ขาเพิ่มขึ้น 4 − 2 = <b>2 ขา</b>', fig: { t: 'formula', lines: ['ขาที่ขาด = 28 − 20 = 8', 'เปลี่ยนไก่เป็นวัว 1 ตัว +2 ขา'] } },
    { say: 'จำนวนวัว = 8 ÷ 2 = <b>4 ตัว</b> ที่เหลือเป็นไก่ 10 − 4 = <b>6 ตัว</b> ตรวจ: 4×4 + 6×2 = 16 + 12 = 28 ✓', fig: { t: 'formula', lines: ['วัว = 8 ÷ 2 = 4 ตัว', 'ไก่ = 10 − 4 = 6 ตัว', 'ตรวจ 16 + 12 = 28 ✓'] } },
    { say: 'สรุป: <b>สมมติทุกตัวเป็นสัตว์ขาน้อย → หาขาที่ขาด → หารด้วยผลต่างขา</b> จะได้จำนวนสัตว์ขามาก ใช้ได้กับโจทย์ตั๋ว 2 ราคา เหรียญ 2 ชนิดด้วย', fig: { t: 'formula', lines: ['ขาที่ขาด ÷ ผลต่างขาต่อตัว', '= จำนวนสัตว์ขามาก'] } }
  ] },
  { id: 'ls_meet', level: 'm1', subject: 'math', gen: 'meet_dist', icon: '🚗', title: 'รถสองคันวิ่งสวนกัน', blurb: 'ระยะทาง ความเร็วสัมพัทธ์', pages: [
    { say: 'รถสองคันอยู่ห่างกัน <b>300 กม.</b> ขับสวนทางเข้าหากัน คันแรก <b>60 กม./ชม.</b> คันที่สอง <b>90 กม./ชม.</b> อีกกี่ชั่วโมงจะพบกัน?', fig: { t: 'emojis', rows: [['🚗', 1, 'คัน ก. 60 กม./ชม. →'], ['🚙', 1, '← คัน ข. 90 กม./ชม.']] } },
    { say: 'ขับ <b>เข้าหากัน</b> ระยะห่างลดลงทั้งสองฝั่ง ใน 1 ชั่วโมงระยะห่างลด 60 + 90 = <b>150 กม.</b> (ความเร็วรวม)', fig: { t: 'formula', lines: ['ระยะห่างลดต่อชั่วโมง', '= 60 + 90 = 150 กม.'] } },
    { say: 'เวลาที่พบกัน = ระยะทางทั้งหมด ÷ ความเร็วรวม = 300 ÷ 150 = <b>2 ชั่วโมง</b>', fig: { t: 'formula', lines: ['เวลา = 300 ÷ 150 = 2 ชม.'] } },
    { say: 'ถามต่อ: พบกันที่ห่างจากจุดเริ่มต้นของคัน ก. กี่กม.? = 60 × 2 = <b>120 กม.</b> (คัน ข. ไป 90 × 2 = 180 รวม 300 ✓)', fig: { t: 'formula', lines: ['ก. 60 × 2 = 120', 'ข. 90 × 2 = 180', '120 + 180 = 300 ✓'] } },
    { say: 'ระวัง: ถ้าขับ <b>ไปทางเดียวกัน</b> ต้อง <b>ลบ</b> ความเร็วแทนบวก (ดูบทตามทัน) สวนทางบวก · ทางเดียวกันลบ', fig: { t: 'formula', lines: ['สวนทาง → บวกความเร็ว', 'ทางเดียวกัน → ลบความเร็ว'] } }
  ] },
  { id: 'ls_robin', level: 'm1', subject: 'math', gen: 'round_robin', icon: '⚽', title: 'แข่งพบกันหมด', blurb: 'การนับ จับคู่แข่งขัน', pages: [
    { say: 'ทีมฟุตบอล 4 ทีม แข่งแบบ <b>พบกันหมด</b> คือทุกทีมเจอกันทีมละ 1 นัด จะมีกี่นัด?', fig: { t: 'emojis', rows: [['⚽', 4, 'ทีม A B C D']] } },
    { say: 'ไล่ดู: A เจอ B, C, D (3 นัด) · B เจอ C, D (เพิ่ม 2 นัด) · C เจอ D (เพิ่ม 1 นัด) รวม <b>3 + 2 + 1 = 6 นัด</b>', fig: { t: 'formula', lines: ['A: B C D  → 3', 'B: C D    → 2', 'C: D      → 1', 'รวม 6 นัด'] } },
    { say: 'ทางลัด: แต่ละทีมเจอทีมอื่น (n − 1) ทีม ทั้งหมด n ทีม รวม n × (n − 1) แต่นับซ้ำสองรอบ (A-B กับ B-A) จึง <b>หาร 2</b>', fig: { t: 'formula', lines: ['นัด = n × (n − 1) ÷ 2', '4 × 3 ÷ 2 = 6'] } },
    { say: 'ตัวอย่าง 6 ทีม: 6 × 5 ÷ 2 = <b>15 นัด</b> · 10 ทีม: 10 × 9 ÷ 2 = <b>45 นัด</b>', fig: { t: 'formula', lines: ['6 ทีม → 15 นัด', '10 ทีม → 45 นัด'] } },
    { say: 'ถ้าแข่งแบบ <b>เหย้า-เยือน</b> (เจอกันทีมละ 2 นัด) ก็ไม่ต้องหาร 2 → n × (n − 1) เช่น 4 ทีม = 12 นัด ดูคำในโจทย์ให้ดี', fig: { t: 'formula', lines: ['เจอกันนัดเดียว → n(n−1)÷2', 'เหย้า-เยือน → n(n−1)'] } }
  ] },
  { id: 'ls_angle', level: 'm1', subject: 'math', gen: 'angle_ratio', icon: '📐', title: 'มุมสามเหลี่ยมในอัตราส่วน', blurb: 'ผลรวมมุมภายใน 180°', pages: [
    { say: 'มุมภายในของสามเหลี่ยมทุกรูป <b>รวมกันได้ 180°</b> เสมอ ไม่ว่ารูปร่างเป็นอย่างไร จำข้อนี้ให้แม่น', fig: { t: 'formula', lines: ['มุม A + มุม B + มุม C = 180°'] } },
    { say: 'สามเหลี่ยมรูปหนึ่งมีมุมอัตราส่วน <b>2 : 3 : 4</b> มุมแต่ละมุมเท่ากับกี่องศา? แบ่ง 180° เป็นส่วน ๆ', fig: { t: 'bars', rows: [{ parts: 9, shade: 2, label: 'มุมแรก 2 ส่วน' }, { parts: 9, shade: 3, label: 'มุมสอง 3 ส่วน' }, { parts: 9, shade: 4, label: 'มุมสาม 4 ส่วน' }] } },
    { say: 'รวมส่วน 2 + 3 + 4 = <b>9 ส่วน</b> = 180° ดังนั้น 1 ส่วน = 180 ÷ 9 = <b>20°</b>', fig: { t: 'formula', lines: ['9 ส่วน = 180°', '1 ส่วน = 20°'] } },

  { id: 'ls_line', level: 'm4', subject: 'math', gen: 'line_intercept', icon: '📏', title: 'หาสมการเส้นตรง', blurb: 'เส้นตรงและจุดตัดแกน Y', pages: [

    { say: 'ตัว −2 กับ +2 หักล้างกัน ผลรวมจึงเป็น <b>3 เท่าของตัวกลาง</b> ดังนั้น 3m = 45 → m = <b>15</b>', fig: { t: 'formula', lines: ['3m = 45', 'm = 15'] } },

    { say: 'ใช้ได้กับจำนวนเรียงกันทุกแบบ: จำนวนนับ 5 ตัวเรียงกัน ผลรวม = 5 เท่าของตัวกลาง (ถ้าจำนวนตัวเป็นคี่) ห่างกันทีละ 1 สำหรับจำนวนนับ ห่างกันทีละ 2 สำหรับคี่หรือคู่', fig: { t: 'formula', lines: ['n ตัว (n คี่) รวม = n × ตัวกลาง', 'นับ: ห่าง 1 · คี่/คู่: ห่าง 2'] } }
  ] },
  { id: 'ls_exp', level: 'm1', subject: 'math', gen: 'exp_rule', icon: '⚡', title: 'กฎของเลขยกกำลัง', blurb: 'คูณ หาร ยกกำลังซ้อน', pages: [
    { say: '<b>เลขยกกำลัง</b> 2³ หมายถึง 2 คูณตัวเอง 3 ครั้ง = 2×2×2 = 8 เลข 2 คือ <b>ฐาน</b> เลข 3 คือ <b>เลขชี้กำลัง</b>', fig: { t: 'formula', lines: ['2³ = 2 × 2 × 2 = 8', 'ฐาน 2 · เลขชี้กำลัง 3'] } },
    { say: '<b>คูณ</b> ฐานเดียวกัน → <b>บวกเลขชี้กำลัง</b>: 2³ × 2⁴ = 2⁽³⁺⁴⁾ = 2⁷ = <b>128</b> (นับ 2 ที่คูณกันได้ 7 ตัวพอดี)', fig: { t: 'formula', lines: ['aᵐ × aⁿ = aᵐ⁺ⁿ', '2³ × 2⁴ = 2⁷ = 128'] } },
    { say: '<b>หาร</b> ฐานเดียวกัน → <b>ลบเลขชี้กำลัง</b>: 2⁵ ÷ 2² = 2³ = <b>8</b> · <b>ยกกำลังซ้อน</b> → คูณกัน: (2³)² = 2⁶ = <b>64</b>', fig: { t: 'formula', lines: ['aᵐ ÷ aⁿ = aᵐ⁻ⁿ', '2⁵ ÷ 2² = 2³ = 8', '(aᵐ)ⁿ = aᵐⁿ', '(2³)² = 2⁶ = 64'] } },
    { say: 'กรณีพิเศษ: <b>a⁰ = 1</b> (เมื่อ a ไม่ใช่ 0) เช่น 5⁰ = 1 และ <b>a¹ = a</b> เหตุผล 2³ ÷ 2³ = 2⁰ แต่ 8 ÷ 8 = 1', fig: { t: 'formula', lines: ['a⁰ = 1', 'a¹ = a', '2³ ÷ 2³ = 2⁰ = 1'] } },
    { say: 'ระวัง: กฎบวก/ลบเลขชี้กำลังใช้ได้ <b>เมื่อฐานเท่ากัน</b> เท่านั้น 2³ × 3² ห้ามเอาไปรวมเป็น 6⁵ ต้องคำนวณแยก = 8 × 9 = 72', fig: { t: 'formula', lines: ['ฐานเท่ากัน → ใช้กฎได้', 'ฐานต่างกัน → คำนวณแยก', '2³ × 3² = 8 × 9 = 72'] } }
  ] },
  { id: 'ls_sector', level: 'm4', subject: 'math', gen: 'sector', icon: '🍕', title: 'พิซซ่าชิ้นพัดของวงกลม', blurb: 'พื้นที่และความยาวส่วนโค้งของเซกเตอร์', pages: [
    { say: 'ตัดวงกลมเหมือนตัดพิซซ่า ชิ้นที่ได้เรียกว่า <b>เซกเตอร์</b> วงกลมมีมุมรอบจุดศูนย์กลาง <b>360°</b> ชิ้นที่มุมเปิด 90° คือ 90/360 = <b>1/4</b> ของทั้งวง', fig: { t: 'pie', parts: 4, shade: 1, label: '90° = 1/4 ของวงกลม' } },
    { say: 'หลักคิด: <b>พื้นที่เซกเตอร์ = (มุม ÷ 360) × พื้นที่วงกลม</b> วงกลมรัศมี 7 พื้นที่ = 22/7 × 7 × 7 = 154', fig: { t: 'formula', lines: ['พื้นที่ทั้งวง = 154 ตร.ซม. (r = 7)'] } },
    { say: 'ชิ้น 90°: 90/360 × 154 = 1/4 × 154 = <b>38.5 ตร.ซม.</b>', fig: { t: 'formula', lines: ['(90 ÷ 360) × 154', '= 38.5 ตร.ซม.'] } },
    { say: '<b>ความยาวส่วนโค้ง</b> ก็ใช้หลักเดียวกัน: (มุม ÷ 360) × เส้นรอบวง เส้นรอบวง = 2πr = 44 → 1/4 × 44 = <b>11 ซม.</b>', fig: { t: 'formula', lines: ['(90 ÷ 360) × 44 = 11 ซม.'] } },
    { say: 'ชิ้น 60° ของวงเดียวกัน: 60/360 = 1/6 → พื้นที่ 154 ÷ 6 ≈ 25.7 · โจทย์มักเลือกมุมที่ลดเศษส่วนสวย เช่น 90°, 60°, 120°, 45°', fig: { t: 'formula', lines: ['90° → 1/4', '60° → 1/6', '120° → 1/3', '45° → 1/8'] } }
  ] },
  { id: 'ls_cyl', level: 'm4', subject: 'math', gen: 'cyl_to_box', icon: '🥛', title: 'เทน้ำจากถังกลมลงกล่อง', blurb: 'ปริมาตรทรงกระบอกและระดับน้ำ', pages: [
    { say: 'ถังทรงกระบอกรัศมี <b>7 ซม.</b> สูง <b>10 ซม.</b> เต็มน้ำ เทลงกล่องสี่เหลี่ยมฐาน <b>20 × 11 ซม.</b> น้ำสูงกี่ซม.? ปริมาตรน้ำ <b>ไม่เปลี่ยน</b> ตอนย้ายภาชนะ', fig: { t: 'formula', lines: ['ถัง r = 7, สูง 10', 'กล่องฐาน 20 × 11', 'น้ำสูง ? ซม.'] } },
    { say: '<b>ปริมาตรทรงกระบอก = πr²h</b> = 22/7 × 7 × 7 × 10 = 22 × 7 × 10 = <b>1,540 ลบ.ซม.</b>', fig: { t: 'formula', lines: ['V = πr²h', '= 22/7 × 49 × 10 = 1,540'] } },
    { say: 'น้ำในกล่อง: ปริมาตร = <b>พื้นที่ฐาน × ความสูงน้ำ</b> พื้นที่ฐาน = 20 × 11 = <b>220 ตร.ซม.</b>', fig: { t: 'formula', lines: ['V = ฐาน × สูง', 'ฐาน = 20 × 11 = 220'] } },
    { say: 'ตั้งสมการ 220 × h = 1,540 → h = 1,540 ÷ 220 = <b>7 ซม.</b>', fig: { t: 'formula', lines: ['h = 1,540 ÷ 220 = 7 ซม.'] } },
    { say: 'ตรวจ: ความสูงน้ำต้องไม่เกินความสูงกล่อง และ 220 × 7 = 1,540 ✓ หลักคิด <b>ปริมาตรเดิม = ปริมาตรใหม่</b> ใช้ได้กับการหลอมของเปลี่ยนรูปด้วย', fig: { t: 'formula', lines: ['ปริมาตรก่อน = ปริมาตรหลัง', '220 × 7 = 1,540 ✓'] } }
  ] },
  { id: 'ls_catch', level: 'm4', subject: 'math', gen: 'catch_up', icon: '🏃', title: 'ออกตามหลังแล้วตามทัน', blurb: 'โจทย์ตามทัน ความเร็วสัมพัทธ์', pages: [
    { say: 'รถ ก. ออกเดินทางด้วย <b>40 กม./ชม.</b> อีก <b>2 ชั่วโมง</b> ต่อมารถ ข. ออกตามด้วย <b>60 กม./ชม.</b> ทางเดียวกัน รถ ข. จะตามทันหลังออกตัวกี่ชั่วโมง?', fig: { t: 'emojis', rows: [['🚗', 1, 'ก. 40 กม./ชม. ออกก่อน'], ['🚙', 1, 'ข. 60 กม./ชม. ออกทีหลัง']] } },
    { say: 'ตอน ข. ออกตัว รถ ก. วิ่งมาแล้ว 40 × 2 = <b>80 กม.</b> (ระยะนำ) ต้องไล่ให้ทัน 80 กม. นี้', fig: { t: 'formula', lines: ['ระยะนำ = 40 × 2 = 80 กม.'] } },
    { say: 'ทางเดียวกัน ข. เร็วกว่า ก. ทุกชั่วโมงไล่ได้ 60 − 40 = <b>20 กม.</b> (ความเร็วที่ห่างกัน ต้อง <b>ลบ</b>)', fig: { t: 'formula', lines: ['ไล่ได้ต่อชั่วโมง', '= 60 − 40 = 20 กม.'] } },
    { say: 'เวลาที่ตามทัน = ระยะนำ ÷ ความเร็วที่ไล่ = 80 ÷ 20 = <b>4 ชั่วโมง</b>', fig: { t: 'formula', lines: ['เวลา = 80 ÷ 20 = 4 ชม.'] } },
    { say: 'ตรวจ: ข. วิ่ง 60 × 4 = 240 กม. ก. วิ่งรวม (2 + 4) = 6 ชม. × 40 = 240 กม. ถึงจุดเดียวกัน ✓ ระวังนับเวลาของ ก. ให้รวมช่วงที่ออกก่อนด้วย', fig: { t: 'formula', lines: ['ข. 60 × 4 = 240', 'ก. 40 × 6 = 240 ✓'] } }
  ] },
  { id: 'ls_comb', level: 'm4', subject: 'math', gen: 'comb', icon: '🎯', title: 'เลือกทีมจากเพื่อน', blurb: 'การจัดหมู่ nCr', pages: [
    { say: 'มีเพื่อน 5 คน เลือกไปเป็นตัวแทน <b>2 คน</b> (ไม่สนลำดับ) เลือกได้กี่แบบ? การเลือกที่ <b>ไม่สนลำดับ</b> เรียกว่า <b>การจัดหมู่</b>', fig: { t: 'emojis', rows: [['🧒', 5, 'A B C D E เลือก 2 คน']] } },
    { say: 'ไล่ดู: AB AC AD AE · BC BD BE · CD CE · DE รวม <b>4 + 3 + 2 + 1 = 10 แบบ</b> (AB กับ BA ถือเป็นแบบเดียวกัน)', fig: { t: 'formula', lines: ['AB AC AD AE', 'BC BD BE', 'CD CE', 'DE', 'รวม 10 แบบ'] } },
    { say: 'สูตร: <b>C(n, r) = n! ÷ (r! × (n − r)!)</b> หรือแบบลัด C(5, 2) = (5 × 4) ÷ (2 × 1) = <b>10</b> (คูณลงมา r ตัวจาก n แล้วหารด้วย r!)', fig: { t: 'formula', lines: ['C(n,r) = n!÷(r!(n−r)!)', 'C(5,2) = (5×4)÷(2×1) = 10'] } },
    { say: 'ตัวอย่าง: เลือก 3 คนจาก 6 คน C(6, 3) = (6×5×4) ÷ (3×2×1) = 120 ÷ 6 = <b>20 แบบ</b> และ C(n, r) = C(n, n−r) (เลือกคนที่จะ "ไม่ไป" ก็ได้ผลเท่ากัน)', fig: { t: 'formula', lines: ['C(6,3) = 120 ÷ 6 = 20', 'C(5,2) = C(5,3) = 10'] } },
    { say: 'แยกให้ออก: <b>จัดหมู่</b> = ไม่สนลำดับ (เลือกทีม) · <b>เรียงสับเปลี่ยน</b> = สนลำดับ (เลือกประธาน รองประธาน) ถ้าสนลำดับ P(5, 2) = 5 × 4 = 20', fig: { t: 'formula', lines: ['ไม่สนลำดับ → C(n,r)', 'สนลำดับ → P(n,r) = n(n−1)...', 'P(5,2) = 20 · C(5,2) = 10'] } }
  ] },
  { id: 'ls_log', level: 'm4', subject: 'math', gen: 'log_val', icon: '🧮', title: 'ลอการิทึมคือเลขชี้กำลังย้อนกลับ', blurb: 'ความหมายของลอการิทึม', pages: [
    { say: 'รู้ว่า <b>2³ = 8</b> ถ้าถามกลับว่า "2 ยกกำลังเท่าไรได้ 8" คำตอบคือ 3 เขียนว่า <b>log₂ 8 = 3</b> ลอการิทึมคือ <b>การหาเลขชี้กำลัง</b>', fig: { t: 'formula', lines: ['2³ = 8', 'log₂ 8 = 3'] } },
    { say: 'นิยาม: <b>log_a b = x</b> หมายถึง <b>aˣ = b</b> (a คือฐาน) อ่านว่า "ล็อกฐาน a ของ b" ตัวเลขที่ได้คือเลขชี้กำลังนั่นเอง', fig: { t: 'formula', lines: ['log_a b = x  ⟺  aˣ = b'] } },
    { say: 'ตัวอย่าง: log₃ 81 = ? ถาม 3 ยกกำลังเท่าไรได้ 81 → 3⁴ = 81 → <b>4</b> · log₁₀ 1000 = <b>3</b> (10³ = 1000)', fig: { t: 'formula', lines: ['log₃ 81 = 4  (3⁴ = 81)', 'log₁₀ 1000 = 3  (10³)'] } },
    { say: 'ค่าติดลบก็ได้ เช่น log₂ (1/4) = <b>−2</b> เพราะ 2⁻² = 1/4 และ log ของ 1 ทุกฐานเท่ากับ <b>0</b> (a⁰ = 1) ส่วน log_a a = <b>1</b>', fig: { t: 'formula', lines: ['log₂ (1/4) = −2', 'log_a 1 = 0', 'log_a a = 1'] } },
    { say: 'กฎที่ใช้บ่อย: <b>log (A × B) = log A + log B</b> เช่น log₂ 32 = log₂ (4 × 8) = 2 + 3 = 5 ตรวจ 2⁵ = 32 ✓ · ฐานและค่าในลอการิทึมต้องเป็นบวก', fig: { t: 'formula', lines: ['log(A×B) = log A + log B', 'log₂ 32 = 2 + 3 = 5'] } }
  ] },
  { id: 'ls_sets', level: 'm4', subject: 'math', gen: 'sets', icon: '🔵', title: 'ชอบผักหรือชอบผลไม้', blurb: 'เซตและแผนภาพเวนน์', pages: [
    { say: 'ในห้อง มีคนชอบ <b>แครอท</b> 20 คน ชอบ <b>ข้าวโพด</b> 15 คน และชอบ <b>ทั้งสองอย่าง</b> 8 คน มีกี่คนที่ชอบอย่างน้อยหนึ่งอย่าง?', fig: { t: 'formula', lines: ['n(A) = 20 (แครอท)', 'n(B) = 15 (ข้าวโพด)', 'n(A ∩ B) = 8 (ทั้งสอง)'] } },
    { say: 'ถ้าเอา 20 + 15 มาบวกตรง ๆ คนที่ชอบ <b>ทั้งสอง</b> ถูกนับ <b>สองครั้ง</b> (ในวงของ A และของ B) ต้องหักออกหนึ่งครั้ง', fig: { t: 'formula', lines: ['20 + 15 = 35', 'คนชอบทั้งสองถูกนับซ้ำ 8 คน'] } },
    { say: 'สูตร: <b>n(A ∪ B) = n(A) + n(B) − n(A ∩ B)</b> = 20 + 15 − 8 = <b>27 คน</b>', fig: { t: 'formula', lines: ['n(A∪B) = n(A) + n(B) − n(A∩B)', '= 20 + 15 − 8 = 27'] } },
    { say: 'หาส่วนย่อยในแผนภาพเวนน์: ชอบ <b>แครอทอย่างเดียว</b> = 20 − 8 = <b>12</b> · ข้าวโพดอย่างเดียว = 15 − 8 = <b>7</b> · 12 + 8 + 7 = 27 ✓', fig: { t: 'formula', lines: ['เฉพาะ A = 20 − 8 = 12', 'เฉพาะ B = 15 − 8 = 7', 'ทั้งสอง = 8', 'รวม 27'] } },
    { say: 'ถ้าห้องมี 30 คน คนที่ <b>ไม่ชอบทั้งสองอย่าง</b> = 30 − 27 = <b>3 คน</b> วาดแผนภาพเวนน์เติมตัวเลขจากส่วนที่ซ้อนกันก่อนเสมอ แล้วค่อยเติมส่วนอื่น', fig: { t: 'formula', lines: ['ไม่ชอบเลย = 30 − 27 = 3', 'เติมส่วนที่ซ้อนกันก่อน'] } }
  ] },
  { id: 'ls_thword', level: 'm1', subject: 'th', gen: 'th1_word', icon: '📝', title: 'คำ 7 ชนิดในภาษาไทย', blurb: 'ชนิดของคำและส่วนของประโยค', pages: [
    { say: 'คำในภาษาไทยแบ่งตามหน้าที่ได้ <b>7 ชนิด</b> ได้แก่ นาม · สรรพนาม · กริยา · วิเศษณ์ · บุพบท · สันธาน · อุทาน เริ่มจากสามชนิดแรกที่เจอบ่อยสุด', fig: { t: 'formula', lines: ['1 นาม  2 สรรพนาม  3 กริยา', '4 วิเศษณ์  5 บุพบท', '6 สันธาน  7 อุทาน'] } },
    { say: '<b>นาม</b> คือคำเรียกชื่อคน สัตว์ สิ่งของ สถานที่ เช่น ลุง วัว โรงนา · <b>สรรพนาม</b> คือคำที่ใช้แทนนาม เช่น ฉัน เธอ เขา มัน', fig: { t: 'formula', lines: ['นาม: ลุง วัว โรงนา', 'สรรพนาม: ฉัน เธอ เขา มัน'] } },

    { say: '<b>บุพบท</b> คือคำที่เชื่อมนามกับคำอื่นให้เห็นความสัมพันธ์ เช่น ใน บน ที่ แก่ · <b>สันธาน</b> คือคำเชื่อมประโยค เช่น และ แต่ หรือ เพราะ · <b>อุทาน</b> คือคำที่เปล่งออกมาตามอารมณ์ เช่น โอ้ ว้าย', fig: { t: 'formula', lines: ['บุพบท: ใน บน ที่ แก่', 'สันธาน: และ แต่ หรือ เพราะ', 'อุทาน: โอ้ ว้าย'] } },
    { say: 'ประโยคพื้นฐานมี <b>ประธาน + กริยา (+ กรรม)</b> เช่น "ลุงรดน้ำผัก" ประธาน = ลุง (ผู้ทำ) · กริยา = รด · กรรม = น้ำผัก (ผู้ถูกกระทำ) หาประธานโดยถามว่า ใครทำ', fig: { t: 'formula', lines: ['ลุง | รด | น้ำผัก', 'ประธาน | กริยา | กรรม'] } }
  ] },
  { id: 'ls_thproverb', level: 'm1', subject: 'th', gen: 'th1_proverb', icon: '💬', title: 'สำนวนสุภาษิตจากเรื่องใกล้ตัว', blurb: 'ความหมายของสำนวน สุภาษิต', pages: [
    { say: '<b>สำนวน</b> คือคำพูดที่มีความหมายเปรียบเทียบ ไม่ได้แปลตรงตัว ส่วน <b>สุภาษิต</b> คือคำพูดที่สอนใจ ต้องรู้ความหมายจริง ไม่ใช่แปลคำต่อคำ', fig: { t: 'formula', lines: ['สำนวน = เปรียบเทียบ', 'สุภาษิต = สอนใจ', 'ห้ามแปลคำต่อคำ'] } },
    { say: '<b>วัวหายล้อมคอก</b> = แก้ไขปัญหาเมื่อเสียหายไปแล้ว ซึ่งสายเกินไป · <b>น้ำขึ้นให้รีบตัก</b> = เมื่อมีโอกาสดี ให้รีบฉวยไว้', fig: { t: 'emojis', rows: [['🐄', 1, 'วัวหายล้อมคอก = สายเกินแก้'], ['💧', 1, 'น้ำขึ้นให้รีบตัก = รีบฉวยโอกาส']] } },
    { say: '<b>ขี่ช้างจับตั๊กแตน</b> = ลงทุนหรือใช้แรงมาก แต่ได้ผลน้อยไม่คุ้มกัน · <b>กินปูนร้อนท้อง</b> = ทำผิดไว้จึงหวาดระแวงว่าจะถูกจับได้', fig: { t: 'formula', lines: ['ขี่ช้างจับตั๊กแตน → ไม่คุ้มค่า', 'กินปูนร้อนท้อง → คนผิดหวาดระแวง'] } },
    { say: '<b>ไก่งามเพราะขน คนงามเพราะแต่ง</b> = การแต่งกายดีช่วยให้ดูดีขึ้น · <b>น้ำน้อยแพ้ไฟ</b> = ฝ่ายที่มีกำลังน้อยย่อมสู้ฝ่ายที่มีกำลังมากกว่าไม่ได้', fig: { t: 'formula', lines: ['ไก่งามเพราะขน → แต่งตัวช่วยให้ดูดี', 'น้ำน้อยแพ้ไฟ → กำลังน้อยสู้ไม่ได้'] } },
    { say: 'เทคนิคทำข้อสอบ: <b>1)</b> อย่าแปลตรงตัว <b>2)</b> หาสถานการณ์ในตัวเลือกที่ตรงกับ "ใจความ" ของสำนวน <b>3)</b> ตัดตัวเลือกที่พูดถึงเรื่องเดียวกับคำในสำนวนแต่ความหมายต่างกัน', fig: { t: 'formula', lines: ['ดูใจความ ไม่ดูคำ', 'หาสถานการณ์ที่ตรงกัน'] } }
  ] },
  { id: 'ls_socgeo', level: 'm1', subject: 'soc', gen: 'soc1_geo', icon: '🗺️', title: 'อ่านแผนที่และพิกัด', blurb: 'ทิศ ละติจูด ลองจิจูด ภาคของไทย', pages: [
    { say: 'ประเทศไทยแบ่งเป็น <b>6 ภาค</b> ตามลักษณะทางภูมิศาสตร์ ได้แก่ เหนือ · กลาง · ตะวันออกเฉียงเหนือ · ตะวันออก · ตะวันตก · ใต้', fig: { t: 'formula', lines: ['เหนือ · กลาง · ตะวันออกเฉียงเหนือ', 'ตะวันออก · ตะวันตก · ใต้'] } },
    { say: 'ทิศหลัก 4 ทิศ คือ เหนือ ใต้ ตะวันออก ตะวันตก ทิศระหว่างทิศ เช่น <b>ตะวันออกเฉียงเหนือ</b> อยู่กึ่งกลางระหว่างตะวันออกกับเหนือ ในแผนที่ ด้านบนมักเป็นทิศเหนือ', fig: { t: 'formula', lines: ['      เหนือ', 'ตะวันตก   ตะวันออก', '      ใต้'] } },
    { say: '<b>เส้นละติจูด</b> (เส้นขนาน) วัดตำแหน่ง <b>เหนือ-ใต้</b> จาก <b>เส้นศูนย์สูตร</b> (0°) · <b>เส้นลองจิจูด</b> (เส้นเมริเดียน) วัดตำแหน่ง <b>ตะวันออก-ตะวันตก</b> จาก <b>เส้นเมริเดียนแรก</b> (0°) ที่ผ่านเมืองกรีนิช', fig: { t: 'formula', lines: ['ละติจูด → เหนือ-ใต้ (จากเส้นศูนย์สูตร)', 'ลองจิจูด → ตะวันออก-ตะวันตก (จากกรีนิช)'] } },
    { say: 'ประเทศไทยอยู่ในซีกโลก <b>เหนือ</b> ของเส้นศูนย์สูตร (ละติจูดเหนือ) และอยู่ <b>ตะวันออก</b> ของเส้นเมริเดียนแรก (ลองจิจูดตะวันออก) จึงเรียกพิกัดเป็น °N และ °E', fig: { t: 'formula', lines: ['ไทย ≈ ละติจูด °N (เหนือ)', 'ไทย ≈ ลองจิจูด °E (ตะวันออก)'] } },
    { say: '<b>มาตราส่วนแผนที่</b> บอกว่าระยะบนแผนที่เล็กกว่าจริงกี่เท่า เช่น 1 ซม. : 5 กม. คือ 1 ซม. บนแผนที่ แทนระยะจริง 5 กม. วัดได้ 4 ซม. = จริง 20 กม. · <b>สัญลักษณ์/คำอธิบายสัญลักษณ์</b> ช่วยอ่านสิ่งต่าง ๆ บนแผนที่', fig: { t: 'formula', lines: ['มาตราส่วน 1 ซม. : 5 กม.', 'วัด 4 ซม. → จริง 4 × 5 = 20 กม.'] } }
  ] },
  { id: 'ls_sochist', level: 'm1', subject: 'soc', gen: 'soc1_rat', icon: '🏯', title: 'เส้นเวลาประวัติศาสตร์ไทย', blurb: 'สุโขทัย อยุธยา ธนบุรี รัตนโกสินทร์', pages: [
    { say: 'ประวัติศาสตร์ไทยเรียงตามเวลา มี 4 ยุคใหญ่ที่เป็นราชธานี: <b>สุโขทัย → อยุธยา → ธนบุรี → รัตนโกสินทร์</b> จำลำดับให้แม่นก่อน', fig: { t: 'formula', lines: ['สุโขทัย → อยุธยา', '→ ธนบุรี → รัตนโกสินทร์'] } },
    { say: '<b>สุโขทัย</b> เริ่มราว พ.ศ. 1781 ผู้ก่อตั้งคือ พ่อขุนศรีอินทราทิตย์ พ่อขุนรามคำแหงมหาราชทรงประดิษฐ์ <b>ลายสือไทย</b> (อักษรไทย) พ.ศ. 1826 ปกครองแบบ <b>พ่อปกครองลูก</b>', fig: { t: 'formula', lines: ['สุโขทัย ≈ พ.ศ. 1781', 'ลายสือไทย พ.ศ. 1826', 'ปกครองแบบพ่อปกครองลูก'] } },
    { say: '<b>อยุธยา</b> สถาปนา พ.ศ. 1893 โดย <b>พระเจ้าอู่ทอง</b> (สมเด็จพระรามาธิบดีที่ 1) เป็นราชธานีนานกว่า 400 ปี เสียกรุงครั้งที่ 2 เมื่อ <b>พ.ศ. 2310</b>', fig: { t: 'formula', lines: ['อยุธยา พ.ศ. 1893', 'เสียกรุงครั้งที่ 2 พ.ศ. 2310'] } },
    { say: '<b>ธนบุรี</b> พ.ศ. 2310 สมเด็จพระเจ้าตากสินมหาราชกู้เอกราชและตั้งราชธานีที่ธนบุรี · <b>รัตนโกสินทร์</b> เริ่ม <b>พ.ศ. 2325</b> เมื่อรัชกาลที่ 1 ย้ายราชธานีมากรุงเทพมหานคร', fig: { t: 'formula', lines: ['ธนบุรี พ.ศ. 2310', 'รัตนโกสินทร์ พ.ศ. 2325 (ร.1)'] } },
    { say: 'ไทม์ไลน์รวม: <b>1781 → 1893 → 2310 → 2325</b> เทคนิคจำ: ธนบุรีสั้นมาก (15 ปี) ต่อด้วยรัตนโกสินทร์ที่ต่อเนื่องถึงปัจจุบัน ข้อสอบมักถามผู้ก่อตั้ง ปีสำคัญ และเหตุการณ์ของแต่ละยุค', fig: { t: 'formula', lines: ['สุโขทัย 1781', 'อยุธยา 1893', 'ธนบุรี 2310', 'รัตนโกสินทร์ 2325'] } }
  ] },
  { id: 'ls_envconv', level: 'm1', subject: 'en', gen: 'en1_gram', icon: '🕒', title: 'Tenses: เวลาในประโยค', blurb: 'Present simple · continuous · past · future', pages: [
    { say: 'ภาษาอังกฤษใช้รูปกริยาบอกเวลา เรียกว่า <b>Tense</b> เริ่มจาก <b>Present Simple</b> ใช้กับ <b>นิสัย/ความจริง</b> เช่น I eat rice. · She <b>eats</b> rice.', fig: { t: 'formula', lines: ['I / You / We / They + V1', 'He / She / It + V1 + s/es'] } },
    { say: 'ประธานเป็น <b>he, she, it</b> หรือเอกพจน์ ต้องเติม <b>s/es</b> ที่กริยา: She <b>likes</b> milk. · He <b>goes</b> to school. ประโยคปฏิเสธใช้ <b>does not + V1</b> (She does not like milk.)', fig: { t: 'formula', lines: ['She likes milk.', 'She does not like milk.', '(ไม่เติม s หลัง does)'] } },
    { say: '<b>Present Continuous</b> ใช้กับสิ่งที่ <b>กำลังเกิดอยู่ตอนนี้</b> โครงสร้าง <b>is/am/are + V-ing</b> เช่น I am reading. · They <b>are playing</b> now.', fig: { t: 'formula', lines: ['am / is / are + V-ing', 'I am reading.', 'They are playing.'] } },
    { say: '<b>Past Simple</b> ใช้กับเรื่องที่ <b>จบไปแล้ว</b> กริยาปกติเติม <b>-ed</b> เช่น walk → walked ส่วนกริยาไม่ปกติเปลี่ยนรูป เช่น go → went, eat → ate, have → had · คำใบ้ yesterday, last week, ago', fig: { t: 'formula', lines: ['walk → walked', 'go → went · eat → ate', 'yesterday, last week, ago'] } },
    { say: '<b>Future</b> ใช้กับสิ่งที่ <b>จะเกิดขึ้น</b> โครงสร้าง <b>will + V1</b> เช่น I will help you. · คำใบ้ tomorrow, next week · อย่าลืม: ใช้ V1 เสมอหลัง will ไม่เติม s หรือ ed', fig: { t: 'formula', lines: ['will + V1', 'I will help you.', 'tomorrow, next week'] } }
  ] },
  { id: 'ls_enconv', level: 'm1', subject: 'en', gen: 'en1_conv', icon: '💬', title: 'ตอบรับ ขอร้อง ขอบคุณ', blurb: 'บทสนทนาในชีวิตประจำวัน', pages: [
    { say: 'บทสนทนาในข้อสอบมักให้ <b>เลือกประโยคตอบ</b> ที่เหมาะกับสถานการณ์ ต้องอ่านประโยคแรกให้เข้าใจว่าเป็นการ ทักทาย ถาม ขอร้อง เสนอ หรือขอบคุณ', fig: { t: 'formula', lines: ['ทักทาย · ถาม · ขอร้อง', 'เสนอ · ขอบคุณ · ขอโทษ'] } },
    { say: '<b>ขอบคุณ</b> Thank you. → ตอบ <b>You\'re welcome.</b> / Not at all. · <b>ขอโทษ</b> I\'m sorry. → ตอบ <b>That\'s all right.</b> / It\'s OK. (ไม่เป็นไร)', fig: { t: 'formula', lines: ['Thank you. → You\'re welcome.', 'I\'m sorry. → That\'s all right.'] } },
    { say: '<b>เสนอ</b> Would you like some tea? → ตอบรับ <b>Yes, please.</b> / ปฏิเสธ <b>No, thank you.</b> · <b>ขอร้อง</b> Could you open the door, please? → <b>Sure.</b> / Certainly.', fig: { t: 'formula', lines: ['Would you like ...? → Yes, please.', '                   → No, thank you.', 'Could you ...? → Sure.'] } },
    { say: '<b>ทักทายและแนะนำ</b> How are you? → <b>I\'m fine, thank you. And you?</b> · How do you do? → <b>How do you do?</b> (ใช้ตอนพบกันครั้งแรก ตอบด้วยประโยคเดิม)', fig: { t: 'formula', lines: ['How are you? → I\'m fine, thanks.', 'How do you do? → How do you do?'] } },
    { say: 'เทคนิค: <b>1)</b> ดูว่าประโยคแรกเป็นประเภทไหน <b>2)</b> เลือกคำตอบที่ตรงประเภท <b>3)</b> ตัดตัวเลือกที่สุภาพเกินหรือไม่ตรงเรื่อง เช่น ตอบ "Thank you" กลับด้วย "You\'re welcome" ไม่ใช่ "Thank you" อีกครั้ง', fig: { t: 'formula', lines: ['จับประเภทประโยคแรก', 'เลือกคำตอบที่เข้าคู่กัน'] } }
  ] },
  { id: 'ls_throyal', level: 'm4', subject: 'th', gen: 'th4_royal', icon: '👑', title: 'ราชาศัพท์ที่ควรรู้', blurb: 'คำราชาศัพท์ของพระมหากษัตริย์', pages: [
    { say: '<b>ราชาศัพท์</b> คือคำสุภาพที่ใช้กับพระมหากษัตริย์และพระบรมวงศานุวงศ์ ข้อสอบมักให้เลือกคำให้ตรงความหมาย ลองจำเป็นกลุ่ม ๆ', fig: { t: 'formula', lines: ['ใช้กับพระมหากษัตริย์', 'และพระบรมวงศานุวงศ์'] } },
    { say: 'กริยาที่ควรจำ: <b>เสด็จ</b> = ไป · <b>เสวย</b> = กิน · <b>บรรทม</b> = นอน · <b>ประชวร</b> = ป่วย · <b>พระราชทาน</b> = ให้', fig: { t: 'formula', lines: ['ไป → เสด็จ   กิน → เสวย', 'นอน → บรรทม  ป่วย → ประชวร', 'ให้ → พระราชทาน'] } },
    { say: 'ใช้คำว่า <b>ทรง</b> นำหน้ากริยาสามัญเพื่อทำเป็นราชาศัพท์ เช่น <b>ทรงขับรถ</b> · <b>ทรงดนตรี</b> · <b>ทรงม้า</b> · <b>ทรงพระราชดำเนิน</b> (เดิน) คำที่มีราชาศัพท์เฉพาะแล้ว ไม่ต้องเติมทรง เช่น "เสวย" ไม่ใช่ "ทรงเสวย"', fig: { t: 'formula', lines: ['ทรง + กริยา เช่น ทรงขับรถ', 'ทรงพระราชดำเนิน = เดิน', 'เสวย (ไม่ใช่ ทรงเสวย)'] } },
    { say: 'ส่วนของร่างกายใช้ <b>พระ</b> นำหน้า เช่น <b>พระเศียร</b> (ศีรษะ) · <b>พระพักตร์</b> (หน้า) · <b>พระหัตถ์</b> (มือ) · <b>พระบาท</b> (เท้า) · <b>พระเนตร</b> (ตา) · <b>พระกรรณ</b> (หู)', fig: { t: 'formula', lines: ['ศีรษะ → พระเศียร', 'หน้า → พระพักตร์ · มือ → พระหัตถ์', 'เท้า → พระบาท · ตา → พระเนตร'] } },
    { say: 'ข้อสอบมักถาม <b>การใช้คำให้เหมาะกับบุคคล</b> พระมหากษัตริย์ใช้ ทรง/เสด็จ/พระราชทาน ส่วนพระสงฆ์มีคำใช้เฉพาะ ต่างจากราชาศัพท์ ระวังไม่ปนกัน และคำสามัญเช่น "กิน" ใช้กับคนทั่วไป', fig: { t: 'formula', lines: ['พระมหากษัตริย์ → ราชาศัพท์', 'พระสงฆ์ → คำสุภาพสำหรับพระสงฆ์', 'คนทั่วไป → คำสามัญ'] } }
  ] },
  { id: 'ls_thlit', level: 'm4', subject: 'th', gen: 'th4_lit', icon: '📜', title: 'กลอนแปดและสัมผัส', blurb: 'ฉันทลักษณ์กลอนสุภาพ', pages: [
    { say: '<b>กลอนแปด</b> (กลอนสุภาพ) 1 บทมี <b>4 วรรค</b> แต่ละวรรคมี <b>7–9 คำ</b> (นิยม 8 คำ) 2 วรรคเป็น 1 บาทหรือ 1 คำกลอน ชื่อวรรค: <b>สดับ · รับ · รอง · ส่ง</b>', fig: { t: 'formula', lines: ['วรรคสดับ  วรรครับ', 'วรรครอง   วรรคส่ง', '(วรรคละ 7–9 คำ)'] } },
    { say: '<b>สัมผัสนอก</b> (สัมผัสบังคับระหว่างวรรค): คำสุดท้ายวรรคสดับ สัมผัสกับ <b>คำที่ 3 หรือ 5</b> ของวรรครับ · คำสุดท้ายวรรครับ สัมผัสกับ <b>คำสุดท้ายวรรครอง</b> · คำสุดท้ายวรรครอง สัมผัสกับคำที่ 3 หรือ 5 ของวรรคส่ง', fig: { t: 'formula', lines: ['ท้ายสดับ → คำ 3 หรือ 5 วรรครับ', 'ท้ายรับ → ท้ายวรรครอง', 'ท้ายรอง → คำ 3 หรือ 5 วรรคส่ง'] } },
    { say: '<b>สัมผัสใน</b> เป็นสัมผัสระหว่างคำในวรรคเดียวกัน ไม่บังคับ แต่ทำให้กลอนไพเราะ · สัมผัสมี 2 แบบ คือ <b>สัมผัสสระ</b> (เสียงสระเหมือนกัน เช่น ใจ-ไป) และ <b>สัมผัสอักษร</b> (พยัญชนะต้นเหมือนกัน)', fig: { t: 'formula', lines: ['สัมผัสสระ: ใจ-ไป', 'สัมผัสอักษร: ทุ่ง-ทาง', 'สัมผัสใน = ไม่บังคับ'] } },
    { say: 'การแบ่งจังหวะอ่านกลอนแปดมักเป็น <b>3 | 2 | 3</b> หนึ่งวรรคมี 8 คำ อ่านเป็นสามช่วง ช่วยให้นับคำและหาตำแหน่งคำที่ 3 หรือ 5 ได้ง่าย', fig: { t: 'formula', lines: ['จังหวะ 3 | 2 | 3', 'ฝนพรำพรม | ลมโชย | โรยกลิ่นดอก'] } },
    { say: 'ข้อสอบมักถาม <b>1)</b> จำนวนคำต่อวรรค <b>2)</b> คู่คำที่สัมผัสกัน <b>3)</b> ชื่อวรรค · เคล็ด: วาดตาราง 4 วรรค ขีดเส้นโยงสัมผัสแต่ละจุด ตรวจว่าอยู่ตำแหน่งคำที่ 3/5 หรือท้ายวรรคตามกฎ', fig: { t: 'formula', lines: ['วาดตาราง 4 วรรค', 'โยงเส้นสัมผัสตามกฎ'] } }
  ] },
  { id: 'ls_soccivic', level: 'm4', subject: 'soc', gen: 'soc4_gov', icon: '🏛️', title: 'อำนาจอธิปไตย 3 ฝ่าย', blurb: 'นิติบัญญัติ บริหาร ตุลาการ', pages: [
    { say: 'ประเทศไทยปกครองแบบ <b>ประชาธิปไตยอันมีพระมหากษัตริย์ทรงเป็นประมุข</b> อำนาจอธิปไตยแบ่งเป็น <b>3 ฝ่าย</b> เพื่อถ่วงดุลกัน ไม่ให้ใครมีอำนาจมากเกินไป', fig: { t: 'formula', lines: ['นิติบัญญัติ · บริหาร · ตุลาการ', '(ถ่วงดุลอำนาจกัน)'] } },
    { say: '<b>อำนาจนิติบัญญัติ</b> = <b>ออกกฎหมาย</b> โดย <b>รัฐสภา</b> (สภาผู้แทนราษฎร + วุฒิสภา)', fig: { t: 'formula', lines: ['นิติบัญญัติ', 'ผู้ใช้: รัฐสภา', 'หน้าที่: ออกกฎหมาย'] } },
    { say: '<b>อำนาจบริหาร</b> = <b>นำกฎหมายไปบังคับใช้</b> และบริหารประเทศ โดย <b>คณะรัฐมนตรี</b> มีนายกรัฐมนตรีเป็นหัวหน้า', fig: { t: 'formula', lines: ['บริหาร', 'ผู้ใช้: คณะรัฐมนตรี', 'หน้าที่: บังคับใช้กฎหมาย'] } },
    { say: '<b>อำนาจตุลาการ</b> = <b>ตัดสินคดี</b> ตามกฎหมาย โดย <b>ศาล</b> (ศาลยุติธรรม ศาลปกครอง ศาลรัฐธรรมนูญ ฯลฯ)', fig: { t: 'formula', lines: ['ตุลาการ', 'ผู้ใช้: ศาล', 'หน้าที่: ตัดสินคดี'] } },
    { say: 'จำง่าย ๆ: <b>ออกกฎ → ใช้กฎ → ตัดสินตามกฎ</b> (นิติบัญญัติ → บริหาร → ตุลาการ) ข้อสอบมักให้จับคู่ "ผู้ใช้อำนาจ" กับ "หน้าที่" อย่าสลับระหว่างบริหารกับตุลาการ', fig: { t: 'formula', lines: ['ออกกฎหมาย → รัฐสภา', 'บังคับใช้ → คณะรัฐมนตรี', 'ตัดสินคดี → ศาล'] } }
  ] },
  { id: 'ls_socecon', level: 'm4', subject: 'soc', gen: 'soc4_econ', icon: '📊', title: 'ราคาขึ้น ราคาลง เพราะอะไร', blurb: 'อุปสงค์ อุปทาน และราคาดุลยภาพ', pages: [
    { say: 'ราคาตลาดไม่ได้ตั้งตามใจคนขาย แต่เกิดจากแรง 2 ฝั่ง คือ <b>ผู้ซื้อ (อุปสงค์)</b> และ <b>ผู้ขาย (อุปทาน)</b>', fig: { t: 'formula', lines: ['อุปสงค์ = ความต้องการซื้อ', 'อุปทาน = ความต้องการขาย'] } },
    { say: '<b>กฎอุปสงค์:</b> ถ้าราคาสินค้า <b>สูงขึ้น</b> คนจะซื้อ <b>น้อยลง</b> ถ้าราคา <b>ลดลง</b> คนจะซื้อ <b>มากขึ้น</b> (ราคากับปริมาณซื้อผกผันกัน)', fig: { t: 'formula', lines: ['ราคา ↑ → ซื้อ ↓', 'ราคา ↓ → ซื้อ ↑'] } },
    { say: '<b>กฎอุปทาน:</b> ถ้าราคาสินค้า <b>สูงขึ้น</b> ผู้ขายอยากผลิตและขาย <b>มากขึ้น</b> ถ้าราคา <b>ต่ำลง</b> ผลิต <b>น้อยลง</b> (ราคากับปริมาณขายแปรผันตามกัน)', fig: { t: 'formula', lines: ['ราคา ↑ → ขาย ↑', 'ราคา ↓ → ขาย ↓'] } },
    { say: 'ราคาที่ปริมาณซื้อ <b>เท่ากับ</b> ปริมาณขายพอดี เรียก <b>ราคาดุลยภาพ</b> ถ้าราคาต่ำกว่าดุลยภาพ ของจะ <b>ขาดตลาด</b> ราคามักถูกดันขึ้น ถ้าสูงกว่า ของจะ <b>ล้นตลาด</b> ราคามักลดลง', fig: { t: 'formula', lines: ['ซื้อ = ขาย → ราคาดุลยภาพ', 'ราคาต่ำไป → ขาดตลาด', 'ราคาสูงไป → ล้นตลาด'] } },
    { say: 'ตัวอย่าง: ฝนแล้ง ผักผลิตได้น้อย (อุปทานลด) คนยังต้องการเท่าเดิม ราคาผักจึง <b>สูงขึ้น</b> ส่วนช่วงผักออกมาก ราคามัก <b>ต่ำลง</b> ข้อสอบมักให้ดูเหตุการณ์แล้วทายว่าราคาขึ้นหรือลง', fig: { t: 'formula', lines: ['ผลผลิตน้อย ความต้องการเท่าเดิม', '→ ราคาสูงขึ้น', 'ผลผลิตมาก → ราคาลดลง'] } }
  ] },
  { id: 'ls_enpassive', level: 'm4', subject: 'en', gen: 'en4_gram', icon: '🔄', title: 'Passive Voice (ประโยคกรรมวาจก)', blurb: 'be + V3 และการเปลี่ยนประโยค', pages: [
    { say: '<b>Active</b>: ประธานเป็นผู้กระทำ — The farmer <b>feeds</b> the cows. · <b>Passive</b>: ประธานเป็นผู้ถูกกระทำ — The cows <b>are fed</b> by the farmer.', fig: { t: 'formula', lines: ['Active: The farmer feeds the cows.', 'Passive: The cows are fed by the farmer.'] } },
    { say: 'โครงสร้าง Passive: <b>ประธาน(เดิมคือกรรม) + be + V3 (+ by ผู้กระทำ)</b> V3 คือกริยาช่องที่ 3 เช่น fed, eaten, written, made', fig: { t: 'formula', lines: ['S + be + V3 (+ by ...)', 'V3: fed, eaten, written, made'] } },
    { say: 'ต้องปรับ <b>be</b> ให้ตรงกับ tense เดิม: Present → <b>is/am/are + V3</b> · Past → <b>was/were + V3</b> · Future → <b>will be + V3</b>', fig: { t: 'formula', lines: ['Present: is/am/are + V3', 'Past: was/were + V3', 'Future: will be + V3'] } },
    { say: 'ตัวอย่าง: The letter <b>was written</b> yesterday. (Past) · Rice <b>is grown</b> in Thailand. (Present) · The work <b>will be finished</b> tomorrow. (Future) เลือก be ตามประธานเอกพจน์/พหูพจน์', fig: { t: 'formula', lines: ['The letter was written yesterday.', 'Rice is grown in Thailand.', 'The work will be finished tomorrow.'] } },
    { say: 'ข้อสอบมักให้ <b>เปลี่ยนเป็น Passive</b> หรือเลือกกริยาให้ถูก เทคนิค: <b>1)</b> ย้ายกรรมมาเป็นประธาน <b>2)</b> ดู tense เดิมแล้วเลือก be <b>3)</b> เปลี่ยนกริยาเป็น V3 <b>4)</b> ใส่ by + ผู้กระทำ (ถ้าจำเป็น)', fig: { t: 'formula', lines: ['1) กรรม → ประธาน', '2) เลือก be ตาม tense', '3) กริยา → V3', '4) by + ผู้กระทำ'] } }
  ] },
  { id: 'ls_encond', level: 'm4', subject: 'en', gen: 'en4_gram', icon: '❓', title: 'If-clause: ถ้า...แล้ว...', blurb: 'Conditional type 0, 1, 2', pages: [
    { say: '<b>ประโยคเงื่อนไข</b> (Conditional) มี 2 ส่วน: <b>If-clause</b> (เงื่อนไข) และ <b>Main clause</b> (ผลลัพธ์) ต้องจับคู่ tense ให้ถูกตามชนิด', fig: { t: 'formula', lines: ['If + เงื่อนไข, + ผลลัพธ์', '(เลือก tense ตามชนิด)'] } },
    { say: '<b>Type 0</b> ความจริงทั่วไป: <b>If + present simple, present simple</b> เช่น If you heat ice, it melts. (ถ้าเอาน้ำแข็งไปอุ่น มันละลาย)', fig: { t: 'formula', lines: ['If + V1, V1', 'If you heat ice, it melts.'] } },
    { say: '<b>Type 1</b> เป็นไปได้ในอนาคต: <b>If + present simple, will + V1</b> เช่น If it rains, we <b>will stay</b> home. (ถ้าฝนตก เราจะอยู่บ้าน) อย่าใช้ will ใน If-clause', fig: { t: 'formula', lines: ['If + V1, will + V1', 'If it rains, we will stay home.'] } },
    { say: '<b>Type 2</b> สมมติสิ่งที่ไม่จริงในปัจจุบัน: <b>If + past simple, would + V1</b> เช่น If I <b>had</b> wings, I <b>would fly</b>. (ถ้ามีปีกจะบิน ซึ่งความจริงไม่มี) หลัง If ใช้ <b>were</b> กับทุกประธานในแบบทางการ: If I were you...', fig: { t: 'formula', lines: ['If + V2, would + V1', 'If I had wings, I would fly.', 'If I were you, ...'] } },
    { say: 'เทคนิคเลือกข้อ: ดู If-clause ก่อน <b>V1 → Type 0/1</b> (ดูผลลัพธ์ว่าเป็นความจริงทั่วไปหรืออนาคต) · <b>V2 → Type 2</b> (would) ท่อง 3 สูตรนี้ให้แม่น และตรวจว่าไม่ใช้ will ใน If-clause', fig: { t: 'formula', lines: ['Type 0: V1, V1', 'Type 1: V1, will V1', 'Type 2: V2, would V1'] } }
  ] },
  { id: 'ls_decmul', level: 'm1', subject: 'math', gen: 'dec_mul', icon: '🔟', title: 'คูณทศนิยมไม่ให้ผิดจุด', blurb: 'การคูณทศนิยม', pages: [
    { say: 'ผักราคากิโลกรัมละ <b>2.5 บาท</b> (สมมติ) ซื้อ <b>0.4 กิโลกรัม</b> ต้องจ่ายเท่าไร? คูณทศนิยมมีเคล็ดลับให้ไม่พลาดจุดทศนิยม', fig: { t: 'formula', lines: ['2.5 × 0.4 = ?'] } },
    { say: 'ขั้นแรก <b>ลืมจุดทศนิยมก่อน</b> คูณเป็นจำนวนเต็ม: 25 × 4 = <b>100</b>', fig: { t: 'formula', lines: ['2.5 → 25', '0.4 → 4', '25 × 4 = 100'] } },
    { say: 'ขั้นสอง <b>นับตำแหน่งทศนิยมรวม</b> ของตัวตั้งทั้งสอง: 2.5 มี 1 ตำแหน่ง · 0.4 มี 1 ตำแหน่ง รวม <b>2 ตำแหน่ง</b>', fig: { t: 'formula', lines: ['2.5 → 1 ตำแหน่ง', '0.4 → 1 ตำแหน่ง', 'รวม 2 ตำแหน่ง'] } },
    { say: 'ขั้นสาม ใส่จุดให้คำตอบมีทศนิยม <b>2 ตำแหน่ง</b> นับจากขวา: 100 → <b>1.00 = 1</b> ดังนั้นจ่าย 1 บาท', fig: { t: 'formula', lines: ['100 → 1.00', '2.5 × 0.4 = 1'] } },
    { say: 'ตัวอย่าง 0.05 × 0.6: 5 × 6 = 30 · ทศนิยม 2 + 1 = 3 ตำแหน่ง → 0.030 = <b>0.03</b> ตรวจด้วยการประมาณ: 0.05 ประมาณ 0.1 × 0.6 ≈ 0.06 คำตอบควรเล็กกว่านั้นเล็กน้อย ✓', fig: { t: 'formula', lines: ['5 × 6 = 30', 'ทศนิยม 2 + 1 = 3 ตำแหน่ง', '0.05 × 0.6 = 0.030 = 0.03'] } }
  ] },
  { id: 'ls_markup', level: 'm1', subject: 'math', gen: 'markup_disc', icon: '🏷️', title: 'ตั้งราคาแล้วลดราคา ได้กำไรเท่าไร', blurb: 'กำไรหลังลดราคา', pages: [
    { say: 'ร้านซื้อผักมาต้นทุน <b>100 บาท</b> ตั้งราคาขายสูงกว่าต้นทุน <b>40%</b> แล้วลดราคาให้ลูกค้า <b>10%</b> สุดท้ายได้กำไรเท่าไร?', fig: { t: 'formula', lines: ['ต้นทุน 100', 'ตั้งราคา +40%', 'ลดราคา 10%'] } },
    { say: 'ราคาที่ตั้ง (ป้ายราคา) = 100 + 40% ของ 100 = <b>140 บาท</b>', fig: { t: 'formula', lines: ['100 × 1.4 = 140 บาท'] } },
    { say: 'ลด 10% <b>ของราคาป้าย (140)</b> → ราคาขายจริง = 140 × 0.9 = <b>126 บาท</b>', fig: { t: 'formula', lines: ['140 × 0.9 = 126 บาท'] } },
    { say: 'กำไร = ราคาขายจริง − ต้นทุน = 126 − 100 = <b>26 บาท</b> คิดเป็น <b>26%</b> ของต้นทุน (กำไรเป็นร้อยละคิดจากต้นทุนเสมอ)', fig: { t: 'formula', lines: ['กำไร = 126 − 100 = 26', 'กำไร % = 26 ÷ 100 × 100 = 26%'] } },
    { say: 'ระวัง: ลดราคาคิดจาก <b>ราคาป้าย</b> ไม่ใช่ต้นทุน และกำไรสุทธิไม่ใช่ 40 − 10 = 30% ลำดับ: ต้นทุน → ราคาป้าย → ราคาขายจริง → กำไร', fig: { t: 'formula', lines: ['ต้นทุน → ป้าย → ขายจริง → กำไร', 'ไม่ใช่ 40 − 10 = 30%'] } }
  ] },
  { id: 'ls_classavg', level: 'm1', subject: 'math', gen: 'class_avg', icon: '🏫', title: 'เฉลี่ยรวมสองห้อง', blurb: 'ค่าเฉลี่ยรวมสองกลุ่ม', pages: [
    { say: 'ห้อง ก. มี <b>20 คน</b> เฉลี่ย <b>60</b> คะแนน ห้อง ข. มี <b>30 คน</b> เฉลี่ย <b>80</b> คะแนน เฉลี่ยรวมทั้งสองห้องเท่าไร?', fig: { t: 'bars', rows: [{ parts: 5, shade: 2, label: 'ห้อง ก. 20 คน (เฉลี่ย 60)' }, { parts: 5, shade: 3, label: 'ห้อง ข. 30 คน (เฉลี่ย 80)' }] } },
    { say: 'ห้ามเอา (60 + 80) ÷ 2 = 70 เพราะสองห้องมี <b>จำนวนคนไม่เท่ากัน</b> ห้องที่คนมากกว่าต้องมีน้ำหนักมากกว่า', fig: { t: 'formula', lines: ['(60 + 80) ÷ 2 = 70  ✗', 'จำนวนคนไม่เท่ากัน'] } },
    { say: 'หา <b>ผลรวมคะแนน</b> ของแต่ละห้องก่อน: ก. = 60 × 20 = <b>1,200</b> · ข. = 80 × 30 = <b>2,400</b>', fig: { t: 'formula', lines: ['ก. 60 × 20 = 1,200', 'ข. 80 × 30 = 2,400'] } },
    { say: 'รวมคะแนน 1,200 + 2,400 = 3,600 รวมจำนวนคน 20 + 30 = 50 → เฉลี่ยรวม = 3,600 ÷ 50 = <b>72</b>', fig: { t: 'formula', lines: ['3,600 ÷ 50 = 72'] } },
    { say: 'ตรวจ: ค่าเฉลี่ยรวมต้องอยู่ระหว่าง 60 กับ 80 และ <b>เอนไปทางห้องที่คนมากกว่า</b> (ห้อง ข. 80) 72 สมเหตุสมผล', fig: { t: 'formula', lines: ['ผลอยู่ระหว่าง 60 และ 80', 'เอนไปทางห้องที่คนมากกว่า'] } }
  ] },
  { id: 'ls_ineqmin', level: 'm1', subject: 'math', gen: 'ineq_min', icon: '🔼', title: 'อสมการ จำนวนเต็มน้อยสุด', blurb: 'แก้อสมการและเลือกจำนวนเต็ม', pages: [
    { say: '<b>อสมการ</b> คือประโยคที่เปรียบเทียบด้วย > < ≥ ≤ แทนเครื่องหมายเท่ากับ เช่น 3x − 5 > 10 คำตอบเป็น <b>ช่วงของค่า</b> ไม่ใช่ค่าเดียว', fig: { t: 'formula', lines: ['3x − 5 > 10', 'หาค่า x ที่เป็นไปได้'] } },
    { say: 'แก้เหมือนสมการ: บวก 5 ทั้งสองข้าง → 3x > 15 → หารด้วย 3 → <b>x > 5</b> (ถ้าคูณหรือหารด้วยจำนวน <b>ลบ</b> ต้องกลับเครื่องหมาย)', fig: { t: 'formula', lines: ['3x − 5 > 10', '3x > 15', 'x > 5'] } },
    { say: 'x > 5 แปลว่า x <b>มากกว่า 5</b> (ไม่รวม 5) จำนวนเต็มที่น้อยที่สุดที่ทำได้คือ <b>6</b> ตรวจ: x = 6 → 3(6) − 5 = 13 > 10 ✓ · x = 5 → 10 > 10 ✗', fig: { t: 'formula', lines: ['x = 6 → 13 > 10 ✓', 'x = 5 → 10 > 10 ✗', 'จำนวนเต็มน้อยสุด = 6'] } },
    { say: 'ถ้าเป็น <b>x ≥ 5</b> (รวม 5) จำนวนเต็มน้อยสุดคือ 5 เอง ดังนั้นต้องดูเครื่องหมาย > กับ ≥ ให้ดี', fig: { t: 'formula', lines: ['x > 5 → น้อยสุดคือ 6', 'x ≥ 5 → น้อยสุดคือ 5'] } },
    { say: 'ตัวอย่างกลับเครื่องหมาย: −2x < 6 → หารด้วย −2 ต้องกลับ → <b>x > −3</b> จำนวนเต็มน้อยสุดคือ <b>−2</b> ตรวจ x = −2 → −2(−2) = 4 < 6 ✓', fig: { t: 'formula', lines: ['−2x < 6', 'x > −3 (กลับเครื่องหมาย)', 'น้อยสุด = −2'] } }
  ] },
  { id: 'ls_fracremain', level: 'm1', subject: 'math', gen: 'frac_remain', icon: '💰', title: 'ใช้เงินสองรอบ', blurb: 'เศษส่วนของส่วนที่เหลือ', pages: [
    { say: 'แม่ค้ามีเงิน <b>600 บาท</b> ใช้ไป <b>1/3</b> ของเงินทั้งหมด แล้วใช้อีก <b>1/2 ของเงินที่เหลือ</b> สุดท้ายเหลือเท่าไร?', fig: { t: 'formula', lines: ['เงิน 600', 'รอบ 1: ใช้ 1/3 ของทั้งหมด', 'รอบ 2: ใช้ 1/2 ของที่เหลือ'] } },
    { say: 'รอบที่ 1 ใช้ 1/3 ของ 600 = <b>200 บาท</b> เหลือ 600 − 200 = <b>400 บาท</b> (หรือเหลือ 2/3)', fig: { t: 'bars', rows: [{ parts: 3, shade: 1, label: 'ใช้ไป 1/3 = 200 บาท' }, { parts: 3, shade: 2, label: 'เหลือ 2/3 = 400 บาท' }] } },
    { say: 'รอบที่ 2 ใช้ 1/2 <b>ของ 400 (ไม่ใช่ของ 600)</b> = <b>200 บาท</b> เหลือ 400 − 200 = <b>200 บาท</b>', fig: { t: 'formula', lines: ['400 ÷ 2 = 200', 'เหลือ 400 − 200 = 200'] } },
    { say: 'ทางลัด: เหลือ 2/3 แล้วเหลือต่ออีก 1/2 → 2/3 × 1/2 = <b>1/3</b> ของเงินเดิม = 600 ÷ 3 = <b>200</b> ตรงกัน ✓', fig: { t: 'formula', lines: ['2/3 × 1/2 = 1/3', '600 ÷ 3 = 200 ✓'] } },
    { say: 'จุดพลาด: ห้ามบวก 1/3 + 1/2 แล้วลบจาก 1 เพราะ "ครึ่งหนึ่ง" ในรอบสองเป็นเศษส่วนของ <b>ส่วนที่เหลือ</b> ไม่ใช่ของเงินเดิม ให้คิดทีละรอบ', fig: { t: 'formula', lines: ['1/3 + 1/2 ไม่ใช่คำตอบ', 'คิดทีละรอบ: ฐานเปลี่ยนทุกรอบ'] } }
  ] },
