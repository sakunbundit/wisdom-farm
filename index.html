// ---------- ตอบคำถาม ----------
function startQuiz(opts, review) {
  const p = cur();
  const qs = review ? [genQuestion(review, rng, S.data.bad)] : buildRound(p, Object.assign({ bad: S.data.bad }, opts), rng);
  S.quiz = { qs, i: 0, results: [], phase: 'ask', input: '', paused: false, seeds: 0, coins: 0, review: review || null, opts: opts || {} };
  renderQuiz();
}
function renderQuiz() {
  const z = $('quiz'), Q = S.quiz;
  if (!Q) { z.classList.remove('on'); z.innerHTML = ''; return; }
  z.classList.add('on');
  const p = cur();
  if (Q.i >= Q.qs.length) {
    const ok = Q.results.filter(Boolean).length;
    z.innerHTML = '<div class="qwrap"><div class="qresult"><div class="qbox" style="text-align:center"><div style="font-size:56px">' + (ok === Q.qs.length ? '🎉' : ok >= Q.qs.length / 2 ? '😊' : '💪') + '</div>' +
      '<h2>ตอบถูก ' + ok + ' / ' + Q.qs.length + ' ข้อ</h2>' +
      (Q.seeds ? '<div>ได้เมล็ด 🌱 ' + Q.seeds + ' เมล็ด</div>' : '') + (Q.coins ? '<div>ได้เหรียญ 🪙 ' + Q.coins + '</div>' : '') +
      (ok < Q.qs.length && !Q.review ? '<div style="font-size:15px;margin-top:6px">ข้อที่พลาดจะกลายเป็นวัชพืช มาทบทวนทีหลังนะ</div>' : '') + '</div>' +
      '<button class="btn green big" data-a="qagain">▶ เล่นอีกด่าน</button>' +
      '<button class="btn gray big" data-a="qexit">🌱 กลับไปฟาร์ม</button></div></div>';
    return;
  }
  const q = Q.qs[Q.i];
  const draft = q.itemId && !S.data.ok[q.itemId] ? '<span class="draft">ร่างโดย AI · รอผู้ปกครองตรวจ</span>' : '';
  const last = Q.i + 1 >= Q.qs.length;
  const qbox = '<div class="qbox">' + q.prompt + (q.hint ? '<div class="hint">' + q.hint + '</div>' : '') + '</div>';
  const fbHtml = ok => '<div class="fb ' + (ok ? 'ok' : 'no') + '"><div class="big">' + (ok ? '✅ ถูกต้อง!' : '❌ ยังไม่ถูก') + draft + '</div>' +
    '<div>คำตอบที่ถูก: <b>' + esc(q.ansText) + '</b> ' + (q.unit || '') + '</div><div style="margin-top:4px">💡 ' + q.explain + '</div></div>';
  let left = qbox, right = '', bar = '';
  if (q.kind === 'mc' && Q.phase === 'ask') {
    right = '<div class="note" style="flex:none">เลือกคำตอบที่ถูกที่สุด ' + draft + '</div>' +
      q.choices.map((c, i) => '<button class="choice" data-a="choice" data-id="' + i + '"><b>' + CHOICE_LABELS[i] + '.</b> <span>' + esc(c) + '</span></button>').join('');
  } else if (q.kind === 'mc') {
    const ok = Q.results[Q.i], picked = Q.picked;
    left += fbHtml(ok);
    right = q.choices.map((c, i) => '<div class="choice' + (i === q.correct ? ' right' : i === picked ? ' wrong' : '') + '"><b>' + CHOICE_LABELS[i] + '.</b> <span>' + esc(c) + (i === q.correct ? ' ✅' : i === picked ? ' ❌' : '') + '</span></div>').join('');
    bar = '<button class="btn green" data-a="next">' + (last ? 'ดูผล' : 'ข้อต่อไป ▶') + '</button><button class="btn gray mini" data-a="flag">🚩 เฉลยน่าจะผิด/กำกวม (ซ่อนข้อนี้)</button>';
  } else if (Q.phase === 'ask') {
    left += '<div class="ans"><div class="box" id="ansbox">' + (Q.input ? esc(Q.input) : '<span style="color:#bbb">ตอบที่นี่</span>') + '</div>' + (q.unit ? '<span class="unit">' + q.unit + '</span>' : '') + '</div>';
    right = '<div class="pad">' + ['7', '8', '9', '⌫', '4', '5', '6', '−', '1', '2', '3', '/', '0', '.'].map(k => '<button data-a="key" data-id="' + k + '">' + k + '</button>').join('') +
      '<button class="go" data-a="submit">ส่งคำตอบ ✔</button></div>';
  } else {
    right = fbHtml(Q.results[Q.i]);
    bar = '<button class="btn green" data-a="next">' + (last ? 'ดูผล' : 'ข้อต่อไป ▶') + '</button>';
  }
  const h = '<div class="qwrap"><div class="qtop"><b>' + esc(q.topic) + '<span class="tag ' + q.tier + '">' + TIER_LABEL[q.tier] + '</span></b>' +
    '<button class="btn gray mini" data-a="qpause">⏸ พัก</button></div><div class="prog">' +
    Q.qs.map((_, k) => '<i class="' + (k < Q.results.length ? (Q.results[k] ? 'ok' : 'no') : k === Q.i ? 'cur' : '') + '"></i>').join('') + '</div>' +
    '<div class="qmain"><div class="qleft">' + left + '</div><div class="qright">' + right + '</div></div>' + (bar ? '<div class="qbar">' + bar + '</div>' : '') + '</div>';
  z.innerHTML = h;
  if (Q.paused) {
    openModal('<h3>⏸ พักอยู่</h3><button class="btn green" data-a="qresume">▶ เล่นต่อ</button>' +
      '<button class="btn" data-a="qrestart">🔄 เริ่มด่านใหม่</button><button class="btn gray" data-a="qexit">🌱 กลับไปฟาร์ม</button>');
  }
}
function submitAnswer() {
  const Q = S.quiz;
  if (!Q || Q.phase !== 'ask') return;
  if (!parseAnswer(Q.input)) { toast('พิมพ์ตัวเลขก่อนนะ'); return; }
  const q = Q.qs[Q.i], p = cur(), now = Date.now();
  const ok = checkAnswer(Q.input, q);
  if (Q.review) Q.coins += resolveReview(p, Q.review, q, ok, now).coins;
  else Q.seeds += recordAnswer(p, q, ok, now).seeds;
  Q.results.push(ok);
  Q.phase = 'fb';
  save(); beep(ok); renderQuiz();
}
function quizKey(k) {
  const Q = S.quiz;
  if (!Q || Q.phase !== 'ask') return;
  if (k === '⌫') Q.input = Q.input.slice(0, -1);
  else if (k === '−' || k === '-') Q.input = Q.input.startsWith('-') ? Q.input.slice(1) : '-' + Q.input;
  else if (Q.input.length < 12) Q.input += k;
  const box = $('ansbox');
  if (box) box.innerHTML = Q.input ? esc(Q.input) : '<span style="color:#bbb">ตอบที่นี่</span>';
}
function nextQuestion() {
  const Q = S.quiz;
  Q.i += 1; Q.phase = 'ask'; Q.input = '';
  renderQuiz();
}
function exitQuiz() { S.quiz = null; closeModal(); renderQuiz(); S.tab = 'farm'; render(); }

document.addEventListener('click', e => {

  }
  else if (a === 'animal') {

    else if (st === 'hungry') { const r = feedAnimal(p, id, now); save(); render(); if (r.ok) flyText(sel, '-1 ' + ITEMS[r.feed].icon); toast(r.ok ? 'ให้ ' + ITEMS[r.feed].icon + ' ' + A.name + 'กินแล้ว รอผลผลิตนะ' : r.msg); }
    else if (st === 'ready') { const r = collectAnimal(p, id, now); save(); render(); flyText(sel, '+1 ' + ITEMS[r.out].icon); toast('ได้ ' + ITEMS[r.out].icon + ' ' + ITEMS[r.out].name + ' เข้าโกดังแล้ว'); }
    else toast(A.name + 'กำลังผลิต รออีก ' + fmtTime(animalRemainingMs(p, id, now)));
  }
  else if (a === 'plant') {

});

function lessonNext() {

  const r = finishLesson(cur(), l.id); save(); S.lesson = null;
  startQuiz({ gen: l.gen });
  if (r.first) toast('อ่านจบแล้ว ได้ 🌱 ' + r.seeds + ' เมล็ดโบนัส!');
}
document.addEventListener('keydown', e => {
  if (S.view === 'login') { if (e.key === 'Enter') authSubmit(); return; }
  if (S.lesson && !S.quiz && S.view === 'main' && S.tab === 'learn' && !$('modal').classList.contains('on')) {
    if (e.key === 'ArrowRight') { lessonNext(); return; }
    if (e.key === 'ArrowLeft') { document.querySelector('[data-a="lprev"]').click(); return; }
  }
  const Q = S.quiz;
  if (!Q || Q.paused) return;
  const cq = Q.qs[Q.i];
  if (cq && cq.kind === 'mc' && Q.phase === 'ask') {          // ข้อเลือกตอบ: กด 1-4 เลือกข้อ ก-ง
    if (/^[1-4]$/.test(e.key)) { Q.input = String(+e.key - 1); Q.picked = +e.key - 1; submitAnswer(); }
    return;
  }
  if (e.key === 'Enter') { e.preventDefault(); if (Q.phase === 'ask') submitAnswer(); else if (Q.i < Q.qs.length) nextQuestion(); }
  else if (Q.phase === 'ask') {
    if (/^[0-9./-]$/.test(e.key)) quizKey(e.key);
    else if (e.key === 'Backspace') quizKey('⌫');
  }
});

function boot() {
  const ses = loadSession(), mode = lsGet(MODE_KEY);
  if (ses && mode === 'cloud') {
    CLOUD.session = ses; S.mode = 'cloud'; CLOUD.synced = loadSynced();
    initData(); S.view = 'profiles'; setCloud('sending'); render();
    cloudRun({ first: true });
  } else if (mode === 'guest') enterGuest();
  else { S.data = newData(); normalizeData(); S.view = 'login'; render(); }
}
boot();
setInterval(tick, 1000);
</script>
