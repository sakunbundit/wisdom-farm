    { say: 'แม่น้ำปิงกับแม่น้ำน่านไหลมารวมกันเป็น <b>แม่น้ำเจ้าพระยา</b> ที่นครสวรรค์ · ที่ชัยนาทมี <b>เขื่อนเจ้าพระยา</b> ซึ่งเป็นเขื่อนทดน้ำ ช่วยผันน้ำเข้าคลองชลประทานลงสู่ที่ราบภาคกลาง', fig: { t: 'formula', lines: ['ปิง + น่าน (นครสวรรค์)', '→ เจ้าพระยา', 'เขื่อนเจ้าพระยา (ชัยนาท) ทดน้ำ'] } },
    { say: '<b>ผลกระทบ</b>: น้ำท่วมป่าและที่ทำกิน ต้องย้ายชุมชน · ปลาอพยพขึ้นลงตามแม่น้ำไม่ได้ · ตะกอนดินท้ายน้ำลดลง จึงต้องชั่งน้ำหนักประโยชน์กับผลเสียก่อนสร้าง', fig: { t: 'formula', lines: ['ข้อดี: น้ำ ไฟฟ้า ป้องกันท่วม', 'ข้อเสีย: ท่วมป่า ย้ายชุมชน', 'ปลาอพยพไม่ได้'] } }
  ] },

  { id: 'ls_soccult', level: 'm1', subject: 'soc', gen: 'soc1_cult', icon: '🎎', title: 'วัฒนธรรมไทยและภูมิปัญญาท้องถิ่น', blurb: 'วัฒนธรรมคืออะไร ประเพณีสำคัญ และภูมิปัญญาของบรรพบุรุษ', pages: [
    { say: 'สวัสดีจ้ะหนู ๆ ป้าไก่เอง! วันนี้มาคุยเรื่อง <b>วัฒนธรรม</b> คือแบบแผนการดำเนินชีวิตที่คนในสังคมสร้างขึ้น สืบทอดกันมา และปฏิบัติร่วมกันจ้ะ', fig: { t: 'formula', lines: ['วัฒนธรรม = แบบแผนการใช้ชีวิต', 'สร้างขึ้น + สืบทอด + ปฏิบัติร่วมกัน'] } },
    { say: 'วัฒนธรรมแบ่งได้ 2 แบบ คือ <b>วัฒนธรรมทางวัตถุ</b> จับต้องได้ เช่น บ้านเรือน เครื่องแต่งกาย กับ <b>วัฒนธรรมที่ไม่ใช่วัตถุ</b> จับต้องไม่ได้ เช่น ภาษา ความเชื่อ มารยาท', fig: { t: 'emojis', rows: [['🏠', 1, 'ทางวัตถุ: บ้าน เครื่องแต่งกาย'], ['🗣️', 1, 'ไม่ใช่วัตถุ: ภาษา ความเชื่อ']] } },
    { say: '<b>ประเพณี</b> เป็นวัฒนธรรมที่คนทำสืบต่อกันมา เช่น <b>สงกรานต์</b> (ปีใหม่ไทย รดน้ำขอพรผู้ใหญ่) และ <b>ลอยกระทง</b> (ขอขมาแม่น้ำ) ที่ทำกันทั่วประเทศจ้ะ', fig: { t: 'emojis', rows: [['💦', 1, 'สงกรานต์ รดน้ำขอพร'], ['🪷', 1, 'ลอยกระทง ขอขมาแม่น้ำ']] } },
    { say: 'ประเพณีบางอย่างมีเฉพาะท้องถิ่น เช่น <b>บุญบั้งไฟ</b> ของภาคอีสาน ที่จุดบั้งไฟบูชาขอฝน ส่วนภาคเหนือมีประเพณี <b>ยี่เป็ง</b> ที่ปล่อยโคมลอยจ้ะ', fig: { t: 'emojis', rows: [['🚀', 1, 'บุญบั้งไฟ ภาคอีสาน'], ['🏮', 1, 'ยี่เป็ง ภาคเหนือ']] } },
    { say: '<b>ภูมิปัญญาท้องถิ่น</b> คือความรู้ที่คนในชุมชนสั่งสมจากประสบการณ์ แล้วใช้แก้ปัญหาในชีวิต เช่น การทอผ้า จักสาน ยาสมุนไพร การทำนาตามฤดูกาล', fig: { t: 'formula', lines: ['ภูมิปัญญา = ความรู้จากประสบการณ์', 'ใช้แก้ปัญหา + ถ่ายทอดรุ่นสู่รุ่น'] } },
    { say: 'เราต้อง<b>อนุรักษ์</b>วัฒนธรรม เช่น เรียนรู้จากผู้เฒ่าผู้แก่ ร่วมงานประเพณี ใช้ภาษาไทยให้ถูกต้อง แล้วนำไปต่อยอดให้เหมาะกับยุคสมัยจ้ะ', fig: { t: 'formula', lines: ['อนุรักษ์ = รักษาของดีไว้', 'เรียนรู้ + ปฏิบัติ + ต่อยอด'] } }
  ] },
  { id: 'ls_socevid', level: 'm1', subject: 'soc', gen: 'soc1_evid', icon: '📜', title: 'หลักฐานประวัติศาสตร์และศักราช', blurb: 'แยกหลักฐาน และแปลง พ.ศ. ค.ศ. ร.ศ. จ.ศ.', pages: [
    { say: 'นักประวัติศาสตร์ศึกษาอดีตจาก<b>หลักฐาน</b> ซึ่งแบ่งเป็น 2 ประเภทใหญ่ คือ <b>หลักฐานลายลักษณ์อักษร</b> (มีตัวหนังสือ) กับ<b>ไม่เป็นลายลักษณ์อักษร</b> จ้ะ', fig: { t: 'emojis', rows: [['📃', 1, 'ลายลักษณ์อักษร: จารึก พงศาวดาร'], ['🏺', 1, 'ไม่ใช่ตัวหนังสือ: โบราณวัตถุ ภาพวาด']] } },
    { say: '<b>ศิลาจารึก</b> คือหลักฐานที่จารึกตัวอักษรบนแผ่นหิน เป็นหลักฐานลายลักษณ์อักษรที่สำคัญมาก เช่น ศิลาจารึกหลักที่ 1 ของสุโขทัย', fig: { t: 'emojis', rows: [['🪨', 1, 'ศิลาจารึก'], ['📜', 1, 'เอกสารเก่า']] } },
    { say: 'อีกแบบคือแบ่งตามความใกล้ชิดเหตุการณ์ <b>หลักฐานชั้นต้น</b> เกิดในเวลานั้นหรือผู้เห็นเหตุการณ์บันทึกเอง ส่วน<b>หลักฐานชั้นรอง</b> เป็นผู้อื่นเขียนขึ้นทีหลัง เช่น หนังสือเรียน', fig: { t: 'formula', lines: ['ชั้นต้น = เกิดในเวลานั้น / ผู้เห็นเหตุการณ์', 'ชั้นรอง = เขียนขึ้นภายหลัง'] } },
    { say: 'ปีที่ไทยใช้ตามปกติคือ <b>พุทธศักราช (พ.ศ.)</b> ส่วนสากลใช้ <b>คริสต์ศักราช (ค.ศ.)</b> แปลงได้ง่าย ๆ คือ พ.ศ. ลบ 543 จะได้ ค.ศ. จ้ะ', fig: { t: 'formula', lines: ['ค.ศ. = พ.ศ. − 543', 'พ.ศ. = ค.ศ. + 543', 'เช่น พ.ศ. 2500 = ค.ศ. 1957'] } },
    { say: 'ยังมีศักราชอื่น <b>รัตนโกสินทรศก (ร.ศ.)</b> พ.ศ. = ร.ศ. + 2324 ส่วน<b>จุลศักราช (จ.ศ.)</b> พ.ศ. = จ.ศ. + 1181 เช่น ร.ศ. 112 = พ.ศ. 2436', fig: { t: 'formula', lines: ['พ.ศ. = ร.ศ. + 2324', 'พ.ศ. = จ.ศ. + 1181', 'ร.ศ. 112 → 112 + 2324 = พ.ศ. 2436'] } },
    { say: '<b>ศตวรรษ</b> คือช่วง 100 ปี นับปี 1–100 เป็นศตวรรษที่ 1 ดังนั้นปี 1957 อยู่ในคริสต์ศตวรรษที่ 20 ส่วนพุทธศตวรรษก็นับแบบเดียวกัน เช่น พ.ศ. 2501–2600 คือพุทธศตวรรษที่ 26', fig: { t: 'formula', lines: ['1–100 = ศตวรรษที่ 1', 'ปีลงท้าย 01–00 นับเป็นศตวรรษถัดไป', 'ค.ศ. 1957 = ศตวรรษที่ 20'] } }
  ] },
  { id: 'ls_socayu', level: 'm1', subject: 'soc', gen: 'soc1_ayu', icon: '🏯', title: 'อาณาจักรอยุธยา', blurb: 'ตั้งกรุง การปกครองจตุสดมภ์ การค้า และเสียกรุง 2 ครั้ง', pages: [
    { say: 'อาณาจักร<b>อยุธยา</b> ก่อตั้งโดย<b>พระเจ้าอู่ทอง</b> หรือสมเด็จพระรามาธิบดีที่ 1 เมื่อ <b>พ.ศ. 1893</b> และเป็นราชธานีของไทยอยู่นานหลายร้อยปีจ้ะ', fig: { t: 'formula', lines: ['ผู้สร้างกรุง: พระเจ้าอู่ทอง', 'ปีที่ตั้ง: พ.ศ. 1893'] } },
    { say: 'กรุงศรีอยุธยาตั้งอยู่บน<b>เกาะเมือง</b> ที่มีแม่น้ำล้อมรอบ คือแม่น้ำเจ้าพระยา ลพบุรี และป่าสัก ทำให้ป้องกันข้าศึกได้ดีและเดินทางค้าขายสะดวกจ้ะ', fig: { t: 'emojis', rows: [['🌊', 1, 'แม่น้ำล้อมรอบเกาะเมือง'], ['⛵', 1, 'เรือสินค้าเดินทางสะดวก']] } },
    { say: 'การปกครองส่วนกลางแบ่งเป็น <b>จตุสดมภ์</b> คือ 4 กรม ได้แก่ <b>เวียง วัง คลัง นา</b> โดยสมเด็จพระบรมไตรโลกนาถทรงปฏิรูปให้เป็นระบบ', fig: { t: 'formula', lines: ['เวียง = ดูแลเมืองและความสงบ', 'วัง = ดูแลราชสำนัก', 'คลัง = ดูแลการเงินและการค้า', 'นา = ดูแลที่นาและเสบียง'] } },
    { say: 'อยุธยามีทำเลดีเลยค้าขายกับต่างชาติรุ่งเรือง ทั้งจีน อินเดีย เปอร์เซีย รวมถึงชาติตะวันตก เช่น โปรตุเกส ฮอลันดา อังกฤษ และฝรั่งเศส', fig: { t: 'emojis', rows: [['🚢', 1, 'พ่อค้าต่างชาติเข้ามาค้าขาย'], ['💰', 1, 'ความมั่งคั่งของกรุง']] } },
    { say: 'กรุงศรีอยุธยาเสียกรุงให้พม่า 2 ครั้ง ครั้งแรกใน <b>พ.ศ. 2112</b> ในสมัยพระมหาจักรพรรดิ แล้วพระนเรศวรกู้เอกราชได้ในเวลาต่อมาจ้ะ', fig: { t: 'formula', lines: ['เสียกรุงครั้งที่ 1: พ.ศ. 2112', 'กู้เอกราชโดยสมเด็จพระนเรศวร'] } },
    { say: 'การเสียกรุงครั้งที่ 2 เกิดขึ้นใน <b>พ.ศ. 2310</b> ครั้งนี้กรุงถูกทำลายเสียหายมาก ต่อมาพระเจ้าตากสินรวบรวมกำลังกู้เอกราชได้สำเร็จจ้ะ', fig: { t: 'formula', lines: ['เสียกรุงครั้งที่ 2: พ.ศ. 2310', 'ต่อมา: พระเจ้าตากสินกู้เอกราช'] } }
  ] },
  { id: 'ls_socsukthon', level: 'm1', subject: 'soc', gen: 'soc1_sukh', icon: '🪨', title: 'สุโขทัยและธนบุรี', blurb: 'พ่อขุนรามคำแหง ศิลาจารึก และพระเจ้าตากสิน', pages: [
    { say: 'อาณาจักร<b>สุโขทัย</b> เป็นราชธานีของไทยในยุคแรก ๆ ราวพุทธศตวรรษที่ 18–20 กษัตริย์ที่ยิ่งใหญ่ที่สุดพระองค์หนึ่งคือ <b>พ่อขุนรามคำแหงมหาราช</b> จ้ะ', fig: { t: 'formula', lines: ['สุโขทัย = ราชธานียุคแรก', 'กษัตริย์สำคัญ: พ่อขุนรามคำแหง'] } },
    { say: 'พ่อขุนรามคำแหงทรงประดิษฐ์<b>ลายสือไทย</b> ซึ่งเป็นรากฐานของอักษรไทยที่เราใช้ทุกวันนี้ ตามที่เล่าไว้ในศิลาจารึกหลักที่ 1 จ้ะ', fig: { t: 'emojis', rows: [['✍️', 1, 'ลายสือไทย: ต้นแบบอักษรไทย'], ['🪨', 1, 'ศิลาจารึกหลักที่ 1']] } },
    { say: 'ศิลาจารึกหลักที่ 1 บรรยายความอุดมสมบูรณ์ไว้ว่า <b>ในน้ำมีปลา ในนามีข้าว</b> สะท้อนว่าบ้านเมืองมีความเป็นอยู่ดี และการค้าขายเป็นไปอย่างเสรี', fig: { t: 'formula', lines: ['“ในน้ำมีปลา ในนามีข้าว”', '= บ้านเมืองอุดมสมบูรณ์'] } },
    { say: 'การปกครองสมัยสุโขทัยตอนต้นเป็นแบบ <b>พ่อปกครองลูก</b> พระมหากษัตริย์ใกล้ชิดราษฎรเหมือนพ่อกับลูก ใครเดือดร้อนก็ไปสั่นกระดิ่งที่หน้าประตูเพื่อร้องทุกข์ได้', fig: { t: 'emojis', rows: [['👨‍👧‍👦', 1, 'พ่อปกครองลูก'], ['🔔', 1, 'กระดิ่งร้องทุกข์']] } },
    { say: 'หลังกรุงศรีอยุธยาเสียกรุงครั้งที่ 2 เมื่อ พ.ศ. 2310 <b>พระเจ้าตากสินมหาราช</b> ทรงรวบรวมไพร่พลกู้เอกราชได้สำเร็จ แล้วตั้ง<b>ธนบุรี</b>เป็นราชธานี', fig: { t: 'formula', lines: ['พ.ศ. 2310 เสียกรุงครั้งที่ 2', 'พระเจ้าตากสินกู้เอกราช', 'ราชธานีใหม่: ธนบุรี'] } },
    { say: 'ธนบุรีเป็นราชธานีอยู่ช่วงสั้น ๆ ต่อมาในปี พ.ศ. 2325 พระบาทสมเด็จพระพุทธยอดฟ้าจุฬาโลกทรงย้ายราชธานีมากรุงเทพฯ เริ่มสมัยรัตนโกสินทร์จ้ะ', fig: { t: 'formula', lines: ['ธนบุรี → กรุงเทพฯ', 'พ.ศ. 2325 เริ่มรัตนโกสินทร์'] } }
  ] },
  { id: 'ls_socgov1', level: 'm1', subject: 'soc', gen: 'soc1_gov', icon: '🏛️', title: 'การปกครองของไทย', blurb: 'ส่วนกลาง ภูมิภาค ท้องถิ่น และผู้นำแต่ละระดับ', pages: [
    { say: 'การบริหารราชการแผ่นดินของไทยแบ่งเป็น 3 ส่วน คือ <b>ส่วนกลาง</b> <b>ส่วนภูมิภาค</b> และ<b>ส่วนท้องถิ่น</b> จ้ะ', fig: { t: 'formula', lines: ['1. ส่วนกลาง', '2. ส่วนภูมิภาค', '3. ส่วนท้องถิ่น'] } },
    { say: '<b>ส่วนกลาง</b> คือหน่วยงานที่ทำงานอยู่ในกรุงเทพฯ ได้แก่ นายกรัฐมนตรี คณะรัฐมนตรี กระทรวง และกรมต่าง ๆ ทำหน้าที่กำหนดนโยบายและดูแลทั้งประเทศ', fig: { t: 'emojis', rows: [['🏢', 1, 'กระทรวง กรม'], ['🇹🇭', 1, 'ดูแลทั้งประเทศ']] } },
    { say: '<b>ส่วนภูมิภาค</b> คือตัวแทนของส่วนกลางในพื้นที่ แบ่งเป็น จังหวัด อำเภอ ตำบล หมู่บ้าน มี<b>ผู้ว่าราชการจังหวัด</b> ดูแลจังหวัด และ<b>นายอำเภอ</b> ดูแลอำเภอ', fig: { t: 'formula', lines: ['จังหวัด → ผู้ว่าราชการจังหวัด', 'อำเภอ → นายอำเภอ', 'ตำบล → กำนัน', 'หมู่บ้าน → ผู้ใหญ่บ้าน'] } },
    { say: '<b>กำนัน</b> ดูแลตำบล และ<b>ผู้ใหญ่บ้าน</b> ดูแลหมู่บ้าน สองตำแหน่งนี้ราษฎรในพื้นที่เป็นผู้เลือกตั้งเอง ไม่ได้ส่งมาจากส่วนกลางจ้ะ', fig: { t: 'emojis', rows: [['🏘️', 1, 'หมู่บ้าน: ผู้ใหญ่บ้าน'], ['🏡', 1, 'ตำบล: กำนัน']] } },
    { say: '<b>ส่วนท้องถิ่น</b> ประชาชนเลือกตัวแทนมาบริหารเอง ได้แก่ <b>อบจ.</b> (องค์การบริหารส่วนจังหวัด) <b>เทศบาล</b> และ <b>อบต.</b> (องค์การบริหารส่วนตำบล)', fig: { t: 'formula', lines: ['อบจ. = ระดับจังหวัด', 'เทศบาล = ชุมชนเมือง', 'อบต. = ระดับตำบล'] } },
    { say: 'ท้องถิ่นรูปแบบพิเศษมี 2 แห่ง คือ <b>กรุงเทพมหานคร (กทม.)</b> และ<b>เมืองพัทยา</b> ซึ่งมีรูปแบบการบริหารเฉพาะของตัวเองจ้ะ', fig: { t: 'emojis', rows: [['🌆', 1, 'กรุงเทพมหานคร'], ['🏖️', 1, 'เมืองพัทยา']] } }
  ] },
  { id: 'ls_socgeo4', level: 'm4', subject: 'soc', gen: 'soc4_geo', icon: '🗺️', title: 'ภูมิศาสตร์ไทยและภูมิภาค', blurb: 'ภูมิภาค ลมมรสุม ฤดู ทรัพยากร และพิกัดแผนที่', pages: [
    { say: 'ภูมิศาสตร์ไทยแบ่งตามลักษณะทางกายภาพเป็น 6 ภาค คือ <b>เหนือ กลาง ตะวันออก ตะวันออกเฉียงเหนือ ตะวันตก ใต้</b> แต่ละภาคมีภูมิประเทศต่างกันจ้ะ', fig: { t: 'formula', lines: ['เหนือ · กลาง · ตะวันออก', 'ตะวันออกเฉียงเหนือ · ตะวันตก · ใต้', 'รวม 6 ภาค'] } },
    { say: 'ภาคเหนือมีภูเขาสูงและหุบเขา ภาคกลางเป็น<b>ที่ราบลุ่มแม่น้ำเจ้าพระยา</b> อุดมสมบูรณ์ ภาคอีสานเป็นที่ราบสูง ภาคใต้เป็นคาบสมุทรที่มีทะเลสองฝั่ง', fig: { t: 'emojis', rows: [['⛰️', 1, 'เหนือ: ภูเขาสูง'], ['🌾', 1, 'กลาง: ที่ราบลุ่มปลูกข้าว'], ['🏝️', 1, 'ใต้: คาบสมุทร ทะเลสองฝั่ง']] } },
    { say: 'ประเทศไทยได้รับอิทธิพลจาก<b>ลมมรสุม</b> ลมมรสุมตะวันตกเฉียงใต้พัดจากมหาสมุทรอินเดียนำฝนมาช่วงกลางปี ส่วนลมมรสุมตะวันออกเฉียงเหนือพัดจากแผ่นดินจีนนำอากาศหนาวเย็นและแห้ง', fig: { t: 'formula', lines: ['ลมตะวันตกเฉียงใต้ → ฝน (กลางปี)', 'ลมตะวันออกเฉียงเหนือ → หนาวและแห้ง'] } },
    { say: 'ไทยมี 3 ฤดู คือ <b>ฤดูร้อน</b> (ประมาณกุมภาพันธ์–พฤษภาคม) <b>ฤดูฝน</b> (ประมาณพฤษภาคม–ตุลาคม) และ<b>ฤดูหนาว</b> (ประมาณตุลาคม–กุมภาพันธ์)', fig: { t: 'emojis', rows: [['☀️', 1, 'ร้อน: ก.พ.–พ.ค.'], ['🌧️', 1, 'ฝน: พ.ค.–ต.ค.'], ['❄️', 1, 'หนาว: ต.ค.–ก.พ.']] } },
    { say: '<b>ทรัพยากรธรรมชาติ</b> เช่น ดิน น้ำ ป่าไม้ แร่ธาตุ และสัตว์ป่า เมื่อใช้แล้วบางอย่างหมดไป เราจึงต้องใช้อย่างคุ้มค่าและอนุรักษ์ไว้ให้คนรุ่นหลัง', fig: { t: 'emojis', rows: [['🌳', 1, 'ป่าไม้'], ['💧', 1, 'น้ำ'], ['⛏️', 1, 'แร่ธาตุ']] } },
    { say: 'การอ่านแผนที่ใช้ <b>เส้นละติจูด</b> (ขนานกับเส้นศูนย์สูตร บอกเหนือ-ใต้) และ<b>เส้นลองจิจูด</b> (บอกตะวันออก-ตะวันตก) ไทยอยู่ซีกโลกเหนือและตะวันออกจ้ะ', fig: { t: 'formula', lines: ['ละติจูด = เหนือ–ใต้ (วัดจากเส้นศูนย์สูตร)', 'ลองจิจูด = ตะวันออก–ตะวันตก', 'ไทยอยู่ N และ E'] } }
  ] },
  { id: 'ls_socwar4', level: 'm4', subject: 'soc', gen: 'soc4_wnew', icon: '🌍', title: 'ประวัติศาสตร์โลกยุคใหม่', blurb: 'สงครามโลก 2 ครั้ง สงครามเย็น และสหประชาชาติ', pages: [
    { say: '<b>สงครามโลกครั้งที่ 1</b> เกิดขึ้นช่วง พ.ศ. 2457–2461 (ค.ศ. 1914–1918) มีชนวนเหตุคือการลอบปลงพระชนม์มกุฎราชกุมารแห่งออสเตรียที่เมืองซาราเยโว', fig: { t: 'formula', lines: ['สงครามโลกครั้งที่ 1', 'พ.ศ. 2457–2461', 'ค.ศ. 1914–1918'] } },
    { say: 'สาเหตุเบื้องลึกของสงครามโลกครั้งที่ 1 คือ ลัทธิชาตินิยม การแข่งขันสะสมอาวุธ การแข่งขันหาอาณานิคม และการแบ่งฝ่ายเป็นพันธมิตรของชาติมหาอำนาจ', fig: { t: 'emojis', rows: [['🚩', 1, 'ชาตินิยม'], ['💣', 1, 'แข่งขันสะสมอาวุธ'], ['🤝', 1, 'แบ่งฝ่ายเป็นพันธมิตร']] } },
    { say: 'ประเทศไทยประกาศเข้าร่วมสงครามฝ่ายสัมพันธมิตรเมื่อ <b>พ.ศ. 2460</b> ในรัชกาลที่ 6 และส่งทหารอาสาไปรบที่ยุโรป ผลคือไทยมีฐานะดีขึ้นในสังคมโลก', fig: { t: 'formula', lines: ['พ.ศ. 2460 ไทยเข้าร่วมสงคราม', 'ฝ่ายสัมพันธมิตร', 'ส่งทหารอาสาไปยุโรป'] } },
    { say: '<b>สงครามโลกครั้งที่ 2</b> เกิดขึ้นช่วง ค.ศ. 1939–1945 เริ่มจากเยอรมนีบุกโปแลนด์ ฝ่ายอักษะมีเยอรมนี อิตาลี ญี่ปุ่น สู้กับฝ่ายสัมพันธมิตร และในไทยมีขบวนการ<b>เสรีไทย</b>ต่อต้านญี่ปุ่น', fig: { t: 'formula', lines: ['ค.ศ. 1939–1945', 'ฝ่ายอักษะ vs ฝ่ายสัมพันธมิตร', 'ในไทย: ขบวนการเสรีไทย'] } },
    { say: 'หลังสงครามเกิด<b>สงครามเย็น</b> คือการแข่งขันอิทธิพลระหว่างสหรัฐอเมริกา (เสรีประชาธิปไตย ทุนนิยม) กับสหภาพโซเวียต (คอมมิวนิสต์) โดยไม่ได้รบกันตรง ๆ', fig: { t: 'emojis', rows: [['🇺🇸', 1, 'สหรัฐ: ประชาธิปไตย ทุนนิยม'], ['🚩', 1, 'โซเวียต: คอมมิวนิสต์']] } },
    { say: '<b>องค์การสหประชาชาติ</b> (UN) ก่อตั้งเมื่อ <b>ค.ศ. 1945</b> หลังสงครามโลกครั้งที่ 2 เพื่อรักษาสันติภาพและความมั่นคงของโลก ไม่ให้เกิดสงครามใหญ่ซ้ำอีกจ้ะ', fig: { t: 'formula', lines: ['สหประชาชาติ ก่อตั้ง ค.ศ. 1945', 'เป้าหมาย: สันติภาพของโลก'] } }
  ] },
  { id: 'ls_socasia4', level: 'm4', subject: 'soc', gen: 'soc4_asia', icon: '🌏', title: 'เอเชีย อารยธรรมและอาณานิคม', blurb: 'ภูมิภาคเอเชีย อารยธรรมสำคัญ ศาสนา และลัทธิล่าอาณานิคม', pages: [
    { say: 'ทวีปเอเชียแบ่งเป็น 6 ภูมิภาค คือ <b>ตะวันออก ตะวันออกเฉียงใต้ ใต้ ตะวันตกเฉียงใต้ กลาง และเหนือ</b> ไทยอยู่ในเอเชียตะวันออกเฉียงใต้จ้ะ', fig: { t: 'formula', lines: ['ตะวันออก · ตะวันออกเฉียงใต้ · ใต้', 'ตะวันตกเฉียงใต้ · กลาง · เหนือ', 'ไทย = ตะวันออกเฉียงใต้'] } },
    { say: 'เอเชียเป็นแหล่งกำเนิด<b>อารยธรรม</b>สำคัญของโลก เช่น <b>เมโสโปเตเมีย</b> (ลุ่มแม่น้ำไทกริส-ยูเฟรทีส) <b>อินเดีย</b> (ลุ่มแม่น้ำสินธุ คงคา) และ<b>จีน</b> (ลุ่มแม่น้ำฮวงโห)', fig: { t: 'emojis', rows: [['🏺', 1, 'เมโสโปเตเมีย'], ['🐘', 1, 'อินเดีย'], ['🐉', 1, 'จีน']] } },
    { say: 'ศาสนาสำคัญของโลกจำนวนมากกำเนิดในเอเชีย เช่น <b>พุทธ</b> และ<b>ฮินดู</b> ในอินเดีย <b>คริสต์</b> <b>อิสลาม</b> และ<b>ยูดาห์</b> ในเอเชียตะวันตกเฉียงใต้', fig: { t: 'formula', lines: ['อินเดีย: พุทธ · ฮินดู', 'เอเชียตะวันตกเฉียงใต้:', 'ยูดาห์ · คริสต์ · อิสลาม'] } },
    { say: '<b>ลัทธิล่าอาณานิคม</b> คือการที่ชาติมหาอำนาจยึดครองดินแดนอื่นเพื่อทรัพยากรและตลาด ชาติตะวันตกเข้ามายึดครองเอเชียตะวันออกเฉียงใต้หลายประเทศ', fig: { t: 'formula', lines: ['อาณานิคม = ดินแดนที่ถูกชาติอื่นยึดครอง', 'เพื่อทรัพยากร + ตลาด'] } },
    { say: 'ตัวอย่าง อังกฤษปกครองพม่าและมลายา ฝรั่งเศสปกครองเวียดนาม ลาว กัมพูชา ฮอลันดาปกครองอินโดนีเซีย สเปนและสหรัฐปกครองฟิลิปปินส์', fig: { t: 'emojis', rows: [['🇬🇧', 1, 'อังกฤษ: พม่า มลายา'], ['🇫🇷', 1, 'ฝรั่งเศส: เวียดนาม ลาว กัมพูชา'], ['🇳🇱', 1, 'ฮอลันดา: อินโดนีเซีย']] } },
    { say: 'ประเทศไทย<b>ไม่เคยตกเป็นอาณานิคม</b> เพราะผู้นำใช้นโยบายทางการทูตที่ยืดหยุ่นและปรับปรุงประเทศให้ทันสมัย แม้จะต้องเสียดินแดนบางส่วนไปบ้างก็ตามจ้ะ', fig: { t: 'formula', lines: ['ไทยไม่เคยเป็นอาณานิคม', 'ทูตยืดหยุ่น + พัฒนาประเทศ'] } }
  ] },
  { id: 'ls_socdemo4', level: 'm4', subject: 'soc', gen: 'soc4_demo', icon: '🗳️', title: 'ประชาธิปไตย', blurb: 'หลักการ การเลือกตั้ง และประชาธิปไตยในชีวิตประจำวัน', pages: [
    { say: '<b>ประชาธิปไตย</b> คือการปกครองที่อำนาจสูงสุดเป็นของประชาชน ประชาชนมีส่วนร่วมตัดสินใจในเรื่องสำคัญของบ้านเมืองจ้ะ', fig: { t: 'formula', lines: ['ประชาธิปไตย', '= อำนาจเป็นของประชาชน'] } },
    { say: 'หลักการสำคัญมี <b>เสรีภาพ</b> (ทำสิ่งใดได้ตามกฎหมาย) <b>ความเสมอภาค</b> (ทุกคนเท่าเทียมกัน) และ<b>การมีส่วนร่วม</b> ของประชาชนในการปกครอง', fig: { t: 'emojis', rows: [['🕊️', 1, 'เสรีภาพ'], ['⚖️', 1, 'ความเสมอภาค'], ['🙋', 1, 'การมีส่วนร่วม']] } },
    { say: 'ตัดสินใจโดยยึด<b>เสียงข้างมาก</b> แต่ต้อง<b>เคารพเสียงข้างน้อย</b> ด้วย และทุกคนต้องอยู่ภายใต้<b>หลักนิติธรรม</b> คือกฎหมายใช้กับทุกคนเหมือนกัน ไม่มีใครอยู่เหนือกฎหมาย', fig: { t: 'formula', lines: ['เสียงข้างมาก + เคารพเสียงข้างน้อย', 'หลักนิติธรรม = ทุกคนอยู่ใต้กฎหมาย'] } },
    { say: 'ไทยใช้ประชาธิปไตย<b>แบบมีรัฐสภา</b> ประชาชนเลือกผู้แทนเข้าไปทำหน้าที่แทนตนในสภา ผ่านการ<b>เลือกตั้ง</b> ซึ่งต้องเป็นไปอย่างบริสุทธิ์ยุติธรรมจ้ะ', fig: { t: 'emojis', rows: [['🗳️', 1, 'เลือกตั้งผู้แทน'], ['🏛️', 1, 'ผู้แทนทำงานในรัฐสภา']] } },
    { say: 'ประชาธิปไตยไม่ได้มีแค่ในการเมือง ในโรงเรียนก็ใช้ได้ เช่น เลือกประธานนักเรียนโดยการลงคะแนน ในครอบครัวก็รับฟังความเห็นของทุกคนก่อนตัดสินใจเรื่องสำคัญ', fig: { t: 'emojis', rows: [['🏫', 1, 'โรงเรียน: เลือกประธานนักเรียน'], ['👨‍👩‍👧', 1, 'ครอบครัว: รับฟังทุกคน']] } }
  ] },
  { id: 'ls_soc2475', level: 'm4', subject: 'soc', gen: 'soc4_ratreform', icon: '📅', title: 'เปลี่ยนแปลงการปกครอง พ.ศ. 2475', blurb: 'สาเหตุ คณะราษฎร และผลของการเปลี่ยนแปลง', pages: [
    { say: 'ก่อน พ.ศ. 2475 ไทยปกครองแบบ<b>สมบูรณาญาสิทธิราชย์</b> คือพระมหากษัตริย์ทรงมีอำนาจสูงสุดในการปกครองแผ่นดิน ซึ่งเป็นรัชสมัยของรัชกาลที่ 7', fig: { t: 'formula', lines: ['ก่อน 2475: สมบูรณาญาสิทธิราชย์', 'พระมหากษัตริย์ทรงมีอำนาจสูงสุด'] } },
    { say: 'สาเหตุมาจากหลายอย่าง เช่น ปัญหาเศรษฐกิจตกต่ำ ผู้ที่เรียนต่างประเทศรับแนวคิดการปกครองแบบประชาธิปไตยของตะวันตก และความต้องการให้ประชาชนมีส่วนร่วมในการปกครอง', fig: { t: 'emojis', rows: [['📉', 1, 'เศรษฐกิจตกต่ำ'], ['🎓', 1, 'ผู้รับการศึกษาแบบตะวันตก'], ['💡', 1, 'แนวคิดประชาธิปไตย']] } },
    { say: 'กลุ่ม<b>คณะราษฎร</b> ซึ่งประกอบด้วยทหารและพลเรือน เป็นผู้ก่อการเปลี่ยนแปลง โดยมีพระยาพหลพลพยุหเสนาเป็นหัวหน้าฝ่ายทหาร และนายปรีดี พนมยงค์ เป็นผู้นำฝ่ายพลเรือน', fig: { t: 'formula', lines: ['คณะราษฎร = ทหาร + พลเรือน', 'ทหาร: พระยาพหลฯ', 'พลเรือน: ปรีดี พนมยงค์'] } },
    { say: 'เมื่อ <b>24 มิถุนายน พ.ศ. 2475</b> คณะราษฎรเปลี่ยนแปลงการปกครองสำเร็จโดยไม่มีการเสียเลือดเนื้อ เป็นระบอบประชาธิปไตยที่มี<b>พระมหากษัตริย์ทรงเป็นประมุข</b>', fig: { t: 'formula', lines: ['24 มิถุนายน พ.ศ. 2475', 'ประชาธิปไตย', 'มีพระมหากษัตริย์ทรงเป็นประมุข'] } },
    { say: 'หลังเปลี่ยนแปลง มีธรรมนูญการปกครองแผ่นดินสยามชั่วคราวเป็นฉบับแรก จากนั้นประกาศใช้รัฐธรรมนูญฉบับถาวรในวันที่ 10 ธันวาคม พ.ศ. 2475', fig: { t: 'emojis', rows: [['📘', 1, 'ธรรมนูญชั่วคราว (ฉบับแรก)'], ['📗', 1, 'รัฐธรรมนูญถาวร 10 ธ.ค. 2475']] } },
    { say: 'ผลต่อสังคม คือมี<b>รัฐสภา</b> ประชาชนมีสิทธิเลือกตั้ง มีการขยายการศึกษาให้ทั่วถึงขึ้น และต่อมาเปลี่ยนชื่อประเทศจากสยามเป็นไทยในปี พ.ศ. 2482', fig: { t: 'formula', lines: ['มีรัฐสภา + สิทธิเลือกตั้ง', 'ขยายการศึกษา', 'พ.ศ. 2482 สยาม → ไทย'] } }
  ] },
  { id: 'ls_socfin4', level: 'm4', subject: 'soc', gen: 'soc4_econ', icon: '🏦', title: 'การเงินส่วนบุคคลของวัยรุ่น', blurb: 'ดอกเบี้ย หนี้ บัตรเครดิต ภาษี และการออม', pages: [
    { say: '<b>ดอกเบี้ย</b> คือค่าตอบแทนของการใช้เงิน ถ้าเราฝากเงินกับธนาคารจะได้<b>ดอกเบี้ยเงินฝาก</b> แต่ถ้ากู้เงินต้องจ่าย<b>ดอกเบี้ยเงินกู้</b> ซึ่งปกติสูงกว่าจ้ะ', fig: { t: 'emojis', rows: [['🏦', 1, 'ฝากเงิน: ได้ดอกเบี้ย'], ['💳', 1, 'กู้เงิน: จ่ายดอกเบี้ย (สูงกว่า)']] } },
    { say: '<b>ดอกเบี้ยคงที่</b> (ดอกเบี้ยอย่างง่าย) คิดจากเงินต้นก้อนเดิมเท่านั้น ไม่เอาดอกเบี้ยมาคิดซ้ำ สูตรคือ เงินต้น × อัตราดอกเบี้ยต่อปี × จำนวนปี', fig: { t: 'formula', lines: ['ดอกเบี้ย = เงินต้น × อัตรา × เวลา', 'คิดจากเงินต้นเท่านั้น'] } },
    { say: 'ตัวอย่าง ฝากเงิน 10,000 บาท ดอกเบี้ย 2% ต่อปี นาน 3 ปี ได้ดอกเบี้ย 10,000 × 0.02 × 3 = 600 บาท เมื่อครบ 3 ปีจะมีเงิน 10,600 บาท', fig: { t: 'formula', lines: ['10,000 × 0.02 × 3 = 600 บาท', 'เงินรวม = 10,000 + 600', '= 10,600 บาท'] } },
    { say: '<b>ดอกเบี้ยทบต้น</b> คือเอาดอกเบี้ยไปรวมกับเงินต้นแล้วคิดดอกเบี้ยต่อ ฝาก 10,000 บาท ที่ 2% ปีแรกได้ 10,200 ปีที่สองคิดจาก 10,200 จึงได้มากกว่า', fig: { t: 'formula', lines: ['ปีที่ 1: 10,000 → 10,200', 'ปีที่ 2: 10,200 → 10,404', 'ทบต้นยิ่งนาน ยิ่งงอกเงยมาก'] } },
    { say: '<b>หนี้ที่ดี</b> คือหนี้ที่ก่อให้เกิดรายได้หรือมูลค่าในอนาคต เช่น กู้เรียนต่อ ส่วน<b>หนี้ที่ไม่ดี</b> คือหนี้ซื้อของฟุ่มเฟือย บัตรเครดิตมีดอกเบี้ยสูงมาก ถ้าจ่ายไม่ทันหนี้จะพอกพูนเร็วจ้ะ', fig: { t: 'emojis', rows: [['🎓', 1, 'หนี้ที่ดี: สร้างรายได้ในอนาคต'], ['🛍️', 1, 'หนี้ที่ไม่ดี: ซื้อของฟุ่มเฟือย']] } },
    { say: '<b>ภาษีเงินได้</b> คือเงินที่รัฐเก็บจากรายได้ของประชาชน ยิ่งมีรายได้สูงยิ่งเสียในอัตราที่สูงขึ้น ส่วนคนรายได้น้อยอาจไม่ต้องเสีย นำไปพัฒนาประเทศ เช่น ถนน โรงเรียน', fig: { t: 'formula', lines: ['รายได้มาก → อัตราภาษีสูงขึ้น', 'ภาษี → ถนน โรงเรียน โรงพยาบาล'] } }
  ] },
  // ---------- v0.25.0: lessons_the ----------

  { id: 'ls_thsum', level: 'm1', subject: 'th', gen: 'th1_read', icon: '✍️', title: 'ย่อความและเรียงความ', blurb: 'ย่อเรื่องยาวให้สั้น และเขียนเรียงความให้เป็นระเบียบ', pages: [
    { say: 'วันนี้ป้าไก่จะสอนเขียนสองแบบ คือ <b>ย่อความ</b> (ทำเรื่องยาวให้สั้นลง) กับ <b>เรียงความ</b> (เขียนเรื่องของเราเอง) ข้อสอบชอบถามทั้งสองอย่างนะ', fig: { t: 'emojis', rows: [['📖', 1, 'ย่อความ'], ['📝', 1, 'เรียงความ']] } },
    { say: '<b>ย่อความ</b> คือการอ่านเรื่องแล้วจับ <b>ใจความสำคัญ</b> มาเขียนใหม่ให้สั้นลง โดยตัดรายละเอียด ตัวอย่าง และคำฟุ่มเฟือยออก แต่ใจความต้องครบและไม่ผิดไปจากเดิม', fig: { t: 'formula', lines: ['เรื่องยาว', '→ จับใจความสำคัญ', '→ ตัดรายละเอียด', '→ ข้อความสั้น ๆ'] } },
    { say: 'ขั้นตอนย่อความ มี 4 ขั้น คือ อ่านให้ตลอดเรื่อง · ขีดเส้นใต้ใจความสำคัญ · เรียบเรียงด้วยภาษากระชับ · อ่านทวนว่าเนื้อหาครบและไม่ใส่ความเห็นของตัวเองเข้าไป', fig: { t: 'formula', lines: ['1 อ่านตลอดเรื่อง', '2 ขีดใจความสำคัญ', '3 เรียบเรียงให้กระชับ', '4 อ่านทวน ไม่ใส่ความเห็น'] } },
    { say: '<b>เรียงความ</b> มี 3 ส่วน คือ <b>คำนำ</b> (เปิดเรื่อง ดึงให้คนอยากอ่าน) <b>เนื้อเรื่อง</b> (ส่วนที่ยาวที่สุด บอกรายละเอียด) และ <b>สรุป</b> (ปิดเรื่อง ให้ข้อคิดหรือย้ำใจความ)', fig: { t: 'formula', lines: ['คำนำ → เปิดเรื่อง', 'เนื้อเรื่อง → รายละเอียด', 'สรุป → ปิดเรื่อง'] } },
    { say: 'เนื้อเรื่องแบ่งเป็นหลายย่อหน้าได้ ย่อหน้าหนึ่งควรพูดเรื่องเดียว มี <b>ประโยคใจความสำคัญ</b> 1 ประโยค แล้วมีประโยคขยายช่วยอธิบายหรือยกตัวอย่าง', fig: { t: 'formula', lines: ['ย่อหน้า =', 'ประโยคใจความสำคัญ 1', '+ ประโยคขยาย หลายประโยค'] } },
    { say: 'ตัวอย่างย่อหน้า: <b>การออกกำลังกายมีประโยชน์ต่อสุขภาพ</b> (ใจความสำคัญ) เพราะทำให้ร่างกายแข็งแรง นอนหลับดี และอารมณ์แจ่มใส (ประโยคขยาย) จำไว้ว่า ใจความสำคัญมักอยู่ต้นย่อหน้า', fig: { t: 'emojis', rows: [['🏃', 1, 'ใจความสำคัญ'], ['💪', 1, 'ประโยคขยาย']] } }
  ] },
  { id: 'ls_thlit4', level: 'm4', subject: 'th', gen: 'th4_lit', icon: '📜', title: 'วรรณคดีไทยและกวีสำคัญ', blurb: 'สุนทรภู่ ลิลิตพระลอ ขุนช้างขุนแผน รามเกียรติ์ และรสวรรณคดี', pages: [
    { say: 'ข้อสอบวรรณคดีมักถามว่า "เรื่องนี้ใครแต่ง" "แต่งด้วยคำประพันธ์อะไร" และ "บทนี้แสดงรสอะไร" วันนี้ป้าไก่รวบรวมของที่ควรจำมาให้', fig: { t: 'emojis', rows: [['📜', 1, 'ใครแต่ง'], ['🎼', 1, 'คำประพันธ์'], ['💗', 1, 'รสวรรณคดี']] } },
    { say: '<b>สุนทรภู่</b> เป็นกวีเอกที่แต่งด้วย <b>กลอน</b> ผลงานดัง เช่น <b>พระอภัยมณี</b> (นิทานกลอน) และ <b>นิราศภูเขาทอง</b> (นิราศ คือเรื่องที่เล่าการเดินทางและความคิดถึงคนรัก)', fig: { t: 'formula', lines: ['สุนทรภู่ → กลอน', 'พระอภัยมณี → นิทานกลอน', 'นิราศภูเขาทอง → นิราศ'] } },
    { say: '<b>ลิลิตพระลอ</b> เป็นวรรณคดีสมัยอยุธยา แต่งเป็น <b>ลิลิต</b> ซึ่งคือคำประพันธ์ที่ใช้ <b>ร่าย</b> กับ <b>โคลง</b> สลับกัน เล่าความรักของพระลอกับพระเพื่อนพระแพง', fig: { t: 'formula', lines: ['ลิลิต = ร่าย + โคลง สลับกัน', 'ตัวอย่าง: ลิลิตพระลอ'] } },
    { say: '<b>ขุนช้างขุนแผน</b> แต่งเป็น <b>เสภา</b> คือกลอนที่ใช้ขับหรือเล่าเรื่องเป็นตอน ๆ ส่วน <b>รามเกียรติ์</b> เป็นเรื่องที่ไทยรับมาจากมหากาพย์รามายณะของอินเดีย แล้วแต่งเป็นฉบับไทย (ฉบับสมบูรณ์เป็นพระราชนิพนธ์ในรัชกาลที่ 1)', fig: { t: 'formula', lines: ['ขุนช้างขุนแผน → เสภา', 'รามเกียรติ์ → ต้นเรื่องคือรามายณะ'] } },
    { say: '<b>รสวรรณคดี</b> ที่ใช้บ่อย: <b>เสาวรจนี</b> ชมความงาม · <b>นารีปราโมทย์</b> เกี้ยวพาราสี หรือกล่าวถึงความรัก · <b>พิโรธวาทัง</b> โกรธ ตัดพ้อ · <b>สัลลาปังคพิสัย</b> โศกเศร้า คร่ำครวญ', fig: { t: 'emojis', rows: [['🌸', 1, 'เสาวรจนี ชมความงาม'], ['💞', 1, 'นารีปราโมทย์ เกี้ยวพาราสี'], ['😠', 1, 'พิโรธวาทัง โกรธ'], ['😢', 1, 'สัลลาปังคพิสัย โศกเศร้า']] } },
    { say: 'เทคนิคทำข้อสอบ: อ่านบทประพันธ์แล้วถามตัวเองว่า ผู้แต่ง <b>รู้สึกอย่างไร</b> ถ้าชมความงามคือเสาวรจนี ถ้าโกรธคือพิโรธวาทัง ถ้าเศร้าคือสัลลาปังคพิสัย ถ้าพูดเรื่องรักคือนารีปราโมทย์', fig: { t: 'formula', lines: ['ชม → เสาวรจนี', 'รัก → นารีปราโมทย์', 'โกรธ → พิโรธวาทัง', 'เศร้า → สัลลาปังคพิสัย'] } }
  ] },
  { id: 'ls_thloan4', level: 'm4', subject: 'th', gen: 'th4_gram', icon: '🌏', title: 'คำยืมภาษาต่างประเทศ', blurb: 'บาลี สันสกฤต เขมร จีน อังกฤษ และภาษาอื่น ๆ ที่ปนอยู่ในภาษาไทย', pages: [
    { say: 'ภาษาไทยยืมคำจากหลายภาษามาใช้จนเราไม่รู้ตัว ข้อสอบจะให้บอกว่าคำนี้มาจากภาษาอะไร ป้าไก่จะพาไล่ดูทีละภาษา พร้อมตัวอย่างคำที่ตำราไทยยอมรับกัน', fig: { t: 'emojis', rows: [['🇮🇳', 1, 'บาลี สันสกฤต'], ['🇰🇭', 1, 'เขมร'], ['🇨🇳', 1, 'จีน'], ['🇬🇧', 1, 'อังกฤษ']] } },
    { say: '<b>บาลี</b> กับ <b>สันสกฤต</b> เป็นภาษาอินเดียโบราณ ใช้ในศาสนาและวรรณคดี คำคู่ที่ควรจำ: สัตย์ (สันสกฤต) = สัจจะ (บาลี) · กรรม (สันสกฤต) = กัมมะ (บาลี) · อัคนี (สันสกฤต) = อัคคี (บาลี)', fig: { t: 'formula', lines: ['สันสกฤต → สัตย์ กรรม อัคนี', 'บาลี → สัจจะ กัมมะ อัคคี'] } },
    { say: 'วิธีสังเกต: ภาษาบาลีเขียนตามเสียง ไม่ใช้ <b>ศ ษ ฤ</b> ส่วนสันสกฤตใช้ตัวอักษรเหล่านี้ได้ เช่น ศึกษา (สันสกฤต) เทียบกับ สิกขา (บาลี) ถ้าคำมี ศ ษ ฤ ให้สงสัยว่าเป็นสันสกฤตก่อน', fig: { t: 'formula', lines: ['มี ศ ษ ฤ → มักเป็นสันสกฤต', 'ศึกษา (สกฤต) / สิกขา (บาลี)'] } },
    { say: '<b>เขมร</b> ให้คำราชาศัพท์และคำเกี่ยวกับการสื่อสารไว้หลายคำ เช่น <b>เสวย</b> (กิน) <b>เสด็จ</b> (ไป) <b>เผชิญ</b> (เผชิญหน้า) <b>จำรัส</b> (พูด) ส่วน <b>จีน</b> ให้คำเกี่ยวกับอาหารและข้าวของ เช่น <b>เก้าอี้</b> <b>ก๋วยเตี๋ยว</b> <b>เจ๊ง</b>', fig: { t: 'emojis', rows: [['🍚', 1, 'เสวย (เขมร)'], ['🍜', 1, 'ก๋วยเตี๋ยว (จีน)'], ['🪑', 1, 'เก้าอี้ (จีน)']] } },
    { say: '<b>อังกฤษ</b> ให้คำใหม่ ๆ เช่น ฟุตบอล คอมพิวเตอร์ เทนนิส ส่วนภาษาอื่น: <b>ญี่ปุ่น</b> ให้ ซูชิ ซาชิมิ · <b>โปรตุเกส</b> ให้ ปัง สบู่ · <b>เปอร์เซีย</b> ให้ ตลาด', fig: { t: 'emojis', rows: [['⚽', 1, 'ฟุตบอล (อังกฤษ)'], ['🍣', 1, 'ซูชิ (ญี่ปุ่น)'], ['🍞', 1, 'ปัง (โปรตุเกส)']] } },
    { say: 'สรุปให้จำง่าย: ศาสนา วิชาการ ราชาศัพท์ → บาลี สันสกฤต เขมร · อาหารและของใช้ในบ้าน → จีน · เทคโนโลยีและกีฬาสมัยใหม่ → อังกฤษ ทำข้อสอบให้ดูว่าคำนั้นอยู่ในหมวดไหน แล้วเดาภาษาได้ใกล้เคียง', fig: { t: 'formula', lines: ['ศาสนา/ราชาศัพท์ → บาลี สกฤต เขมร', 'อาหาร/ของใช้ → จีน', 'เทคโนโลยี/กีฬา → อังกฤษ'] } }
  ] },
  { id: 'ls_thmedia4', level: 'm4', subject: 'th', gen: 'th4_read', icon: '📰', title: 'รู้เท่าทันสื่อและข่าวปลอม', blurb: 'แยกข้อเท็จจริงกับความเห็น และตรวจข่าวก่อนเชื่อหรือแชร์', pages: [
    { say: 'ทุกวันนี้เราเจอข้อมูลมากมายในโทรศัพท์ บางเรื่องจริง บางเรื่องปลอม การ <b>รู้เท่าทันสื่อ</b> คือทักษะอ่านแล้วคิดวิเคราะห์ก่อนเชื่อ ซึ่งออกข้อสอบอ่านวิเคราะห์บ่อยมาก', fig: { t: 'emojis', rows: [['📱', 1, 'ข้อมูลรอบตัว'], ['🤔', 1, 'คิดก่อนเชื่อ']] } },
    { say: 'ก่อนอื่นต้องแยก <b>ข้อเท็จจริง</b> (พิสูจน์ได้ว่าจริงหรือไม่ เช่น "วันนี้ฝนตก") ออกจาก <b>ความคิดเห็น</b> (ความรู้สึกของคน เช่น "ฝนตกแบบนี้น่ารำคาญ") ความเห็นมักมีคำอย่าง สวย ดีที่สุด น่าจะ', fig: { t: 'formula', lines: ['ข้อเท็จจริง → พิสูจน์ได้', 'ความเห็น → ความรู้สึก ใช้คำว่า', 'ดี สวย น่าจะ ควร'] } },
    { say: 'ตรวจ <b>แหล่งที่มา</b> ให้ดี: ใครเป็นผู้เขียน เป็นหน่วยงานหรือสำนักข่าวที่น่าเชื่อถือไหม ลงเมื่อ <b>วันที่</b> เท่าไร เพราะข่าวเก่าอาจถูกนำมาแชร์ใหม่ให้เข้าใจผิดได้', fig: { t: 'formula', lines: ['ตรวจ 3 อย่าง', '1 ผู้เขียน/แหล่งข่าว', '2 วันที่เผยแพร่', '3 มีหลักฐานอ้างอิงไหม'] } },
    { say: 'ระวัง <b>พาดหัวที่ชวนคลิก</b> เช่น "ช็อก! ไม่อ่านไม่ได้" ซึ่งมักใช้อารมณ์ล่อให้คนกด เนื้อหาข้างในอาจไม่ตรงกับพาดหัว ให้อ่านเนื้อข่าวให้จบก่อนตัดสินใจ', fig: { t: 'emojis', rows: [['😱', 1, 'พาดหัวเร้าอารมณ์'], ['📄', 1, 'อ่านเนื้อข่าวให้จบ']] } },
    { say: '<b>ภาพตัดต่อ</b> ก็หลอกตาเราได้ ลองสังเกตว่าภาพดูผิดธรรมชาติไหม แสงเงาไม่ตรงกันหรือเปล่า และลองหาว่าภาพนี้เคยปรากฏที่อื่นมาก่อนหรือไม่ รวมถึงเทียบข่าวเดียวกันจาก <b>หลายแหล่ง</b> ว่าตรงกันหรือไม่', fig: { t: 'emojis', rows: [['🖼️', 1, 'ภาพอาจถูกตัดต่อ'], ['🔎', 1, 'เทียบหลายแหล่ง']] } },
    { say: 'ก่อนกดแชร์ให้หยุดคิด: ข้อมูลนี้จริงไหม ใครเสียหายถ้าเป็นข่าวปลอม <b>อย่าแชร์ทันที</b> ในข้อสอบ ถ้าโจทย์ถามว่า "ควรทำอย่างไร" คำตอบที่ดีคือ ตรวจสอบจากแหล่งที่เชื่อถือได้ก่อน', fig: { t: 'formula', lines: ['เจอข่าว → หยุดคิด', '→ ตรวจหลายแหล่ง', '→ ค่อยตัดสินใจแชร์'] } }
  ] },
  { id: 'ls_enart1', level: 'm1', subject: 'en', gen: 'en1_gram', icon: '🔤', title: 'Articles และ Prepositions', blurb: 'a / an / the และ at / on / in บอกเวลาและสถานที่', pages: [
    { say: 'วันนี้เรียน 2 เรื่องเล็ก ๆ แต่ออกสอบบ่อย คือ <b>articles</b> (a, an, the) กับ <b>prepositions</b> (at, on, in) ตัวเล็กแต่ใช้ผิดง่ายมากนะ', fig: { t: 'emojis', rows: [['🔤', 1, 'a / an / the'], ['📍', 1, 'at / on / in']] } },
    { say: 'ใช้ <b>a</b> หรือ <b>an</b> กับนามนับได้ที่เป็น <b>เอกพจน์</b> (หนึ่งสิ่ง) ที่ยังไม่เจาะจง เช่น a dog, an egg ให้ดู <b>เสียง</b> ตัวแรกของคำ ไม่ใช่ตัวอักษร', fig: { t: 'formula', lines: ['a + เสียงพยัญชนะ: a dog', 'an + เสียงสระ: an egg'] } },
    { say: 'คำที่หลอกตา: <b>an hour</b> (h ไม่ออกเสียง เสียงแรกเป็นสระ) แต่ <b>a university</b> (เสียงแรกเหมือน ยู เป็นเสียงพยัญชนะ) และ an apple, an orange ก็ใช้ an เพราะเสียงแรกเป็นสระ', fig: { t: 'emojis', rows: [['⏰', 1, 'an hour'], ['🎓', 1, 'a university'], ['🍎', 1, 'an apple']] } },
    { say: 'ใช้ <b>the</b> เมื่อผู้พูดกับผู้ฟังรู้ว่าหมายถึงสิ่งไหน หรือพูดถึงสิ่งที่มีอย่างเดียว เช่น I have a cat. The cat is white. (พูดถึงแมวตัวเดิม) และ The sun is hot.', fig: { t: 'formula', lines: ['I have a cat.', 'The cat is white.', 'The sun is hot.'] } },
    { say: 'บอก <b>เวลา</b>: <b>at</b> ใช้กับเวลาเป๊ะ ๆ (at 5 o\'clock, at night) · <b>on</b> ใช้กับวัน (on Monday, on 5 May) · <b>in</b> ใช้กับช่วงที่ยาวกว่า (in July, in 2020, in the morning)', fig: { t: 'formula', lines: ['at 5 o\'clock', 'on Monday', 'in July'] } },
    { say: 'บอก <b>สถานที่</b>: <b>at</b> ใช้กับจุด (at school, at the bus stop) · <b>on</b> ใช้เมื่ออยู่บนพื้นผิว (on the table) · <b>in</b> ใช้เมื่ออยู่ข้างใน (in the box, in Bangkok)', fig: { t: 'emojis', rows: [['🏫', 1, 'at school'], ['🍽️', 1, 'on the table'], ['📦', 1, 'in the box']] } }
  ] },
  { id: 'ls_encomp1', level: 'm1', subject: 'en', gen: 'en1_gram', icon: '📏', title: 'Comparative และ Superlative', blurb: 'เปรียบเทียบสองสิ่ง (-er) และเปรียบเทียบที่สุด (-est)', pages: [
    { say: 'เวลาเราอยากบอกว่าอะไร <b>มากกว่า</b> หรือ <b>ที่สุด</b> ใช้ <b>comparative</b> (เปรียบเทียบสองสิ่ง) และ <b>superlative</b> (เปรียบเทียบตั้งแต่สามสิ่งขึ้นไปแล้วบอกที่สุด)', fig: { t: 'emojis', rows: [['📏', 1, 'taller (สูงกว่า)'], ['🏆', 1, 'the tallest (สูงที่สุด)']] } },
    { say: 'คำสั้น (พยางค์เดียว) เติม <b>-er</b> ใช้กับ than และเติม <b>-est</b> ใช้กับ the เช่น tall → taller → tallest. Tom is taller than Ben. Tom is the tallest boy in the class.', fig: { t: 'formula', lines: ['tall → taller → tallest', 'taller + than', 'the + tallest'] } },
    { say: 'ถ้าคำลงท้ายด้วย <b>สระ 1 ตัว + พยัญชนะ 1 ตัว</b> ให้ซ้ำพยัญชนะ: big → bigger → biggest. ถ้าลงท้ายด้วย e อยู่แล้ว เติม r/st เช่น nice → nicer → nicest', fig: { t: 'formula', lines: ['big → bigger → biggest', 'hot → hotter → hottest', 'nice → nicer → nicest'] } },
    { say: 'คำที่ลงท้ายด้วย <b>y</b> ให้เปลี่ยน y เป็น i แล้วเติม -er/-est: happy → happier → happiest, easy → easier → easiest. She is happier today.', fig: { t: 'formula', lines: ['happy → happier → happiest', 'easy → easier → easiest'] } },
    { say: 'คำยาว (ตั้งแต่ 2 พยางค์ขึ้นไป ส่วนใหญ่) ไม่เติม -er แต่ใช้ <b>more</b> และ <b>the most</b> นำหน้า: beautiful → more beautiful → the most beautiful. This book is more interesting than that one.', fig: { t: 'formula', lines: ['beautiful', 'more beautiful (than)', 'the most beautiful'] } },
    { say: 'คำพิเศษต้องจำ: <b>good → better → best</b> และ <b>bad → worse → worst</b> เช่น This cake is better than that one. จำไว้ว่า comparative ใช้ than ส่วน superlative ใช้ the นำหน้า', fig: { t: 'formula', lines: ['good → better → best', 'bad → worse → worst'] } }
  ] },
  { id: 'ls_envocab4', level: 'm4', subject: 'en', gen: 'en4_vocab', icon: '📚', title: 'Vocabulary ม.ปลาย', blurb: 'prefix, suffix, collocation และเดาความหมายจากรูปคำ', pages: [
    { say: 'ข้อสอบคำศัพท์ระดับ ม.ปลายไม่ได้ให้ท่องอย่างเดียว แต่ให้เดาความหมายจาก <b>รูปคำ</b> ได้ด้วย วันนี้เรียนส่วนต้นคำ (prefix) ส่วนท้ายคำ (suffix) และคำที่ใช้คู่กัน (collocation)', fig: { t: 'emojis', rows: [['🧩', 1, 'prefix + root + suffix'], ['🔗', 1, 'collocation']] } },
    { say: '<b>Prefix</b> คือส่วนที่เติมหน้าคำเพื่อเปลี่ยนความหมาย: <b>un-</b> ตรงข้าม (unhappy) · <b>re-</b> อีกครั้ง (rewrite) · <b>dis-</b> ตรงข้าม (disagree) · <b>mis-</b> ผิด (misunderstand) · <b>pre-</b> ก่อน (preview)', fig: { t: 'formula', lines: ['un-: unhappy', 're-: rewrite', 'dis-: disagree', 'mis-: misunderstand', 'pre-: preview'] } },
    { say: '<b>Suffix</b> คือส่วนท้ายคำ มักเปลี่ยนชนิดคำ: <b>-tion / -ment / -ness</b> ทำให้เป็นคำนาม (educate → education, move → movement, kind → kindness) ส่วน <b>-able / -ful / -less</b> ทำให้เป็นคำคุณศัพท์', fig: { t: 'formula', lines: ['-tion -ment -ness → นาม', '-able -ful -less → คุณศัพท์', 'kind → kindness'] } },
    { say: 'ตัวอย่างการเปลี่ยนชนิดคำ: care (นาม ความระมัดระวัง) → careful (มีความระมัดระวัง) → careless (ไม่ระมัดระวัง) · help → helpful (เป็นประโยชน์) → helpless (ช่วยตัวเองไม่ได้)', fig: { t: 'emojis', rows: [['👍', 1, 'careful / helpful'], ['👎', 1, 'careless / helpless']] } },
    { say: '<b>Collocation</b> คือคำที่ชอบใช้คู่กัน ต้องจำเป็นชุด: <b>make</b> a decision / make a mistake · <b>take</b> a break · <b>do</b> homework / do the dishes · <b>heavy</b> rain (ไม่ใช้ strong rain)', fig: { t: 'formula', lines: ['make a decision', 'take a break', 'do homework', 'heavy rain'] } },
    { say: 'เทคนิคเดาศัพท์: แยกคำเป็นชิ้น เช่น <b>unbelievable</b> = un (ไม่) + believe (เชื่อ) + able (สามารถ) จึงแปลว่า "เชื่อไม่ได้" ถ้าเจอคำที่ไม่รู้จัก ลองแยกส่วนก่อนเสมอ', fig: { t: 'formula', lines: ['unbelievable', '= un + believe + able', '= เชื่อไม่ได้'] } }
  ] },
  { id: 'ls_enrel4', level: 'm4', subject: 'en', gen: 'en4_gram', icon: '🔗', title: 'Relative Clauses', blurb: 'who, which, that, whose, where และ defining กับ non-defining', pages: [
    { say: '<b>Relative clause</b> คือประโยคย่อยที่ขยายคำนามข้างหน้า ช่วยเชื่อมสองประโยคให้เป็นประโยคเดียว โดยใช้คำเชื่อม (relative pronoun) เช่น who, which, that', fig: { t: 'emojis', rows: [['👩', 1, 'the girl'], ['🔗', 1, 'who lives next door']] } },
    { say: '<b>who</b> ใช้แทน <b>คน</b> · <b>which</b> ใช้แทน <b>สิ่งของ/สัตว์</b> · <b>that</b> ใช้แทนได้ทั้งคนและสิ่งของ เช่น The girl who lives next door is my friend. The book which I bought is good.', fig: { t: 'formula', lines: ['คน → who / that', 'สิ่งของ → which / that'] } },
    { say: '<b>whose</b> แสดงความเป็นเจ้าของ ตามด้วยคำนาม: I know a boy whose father is a doctor. ส่วน <b>where</b> ใช้แทน <b>สถานที่</b>: This is the school where I study.', fig: { t: 'formula', lines: ['whose + นาม (ของใคร)', 'where = สถานที่', 'a boy whose father is a doctor'] } },
    { say: '<b>Defining clause</b> จำเป็นต่อความหมาย ไม่มีเครื่องหมายจุลภาค: The man who called me is my uncle. ถ้าตัดออก เราจะไม่รู้ว่าพูดถึงผู้ชายคนไหน', fig: { t: 'formula', lines: ['The man who called me', 'is my uncle.', '(ไม่มีจุลภาค)'] } },
    { say: '<b>Non-defining clause</b> เป็นข้อมูลเสริม ใส่ <b>เครื่องหมายจุลภาค</b> คั่น และ <b>ห้ามใช้ that</b>: Bangkok, which is the capital of Thailand, is very big. ตัดออกแล้วประโยคก็ยังสมบูรณ์', fig: { t: 'formula', lines: ['Bangkok, which is the', 'capital of Thailand, is big.', '(มีจุลภาค ห้ามใช้ that)'] } },
    { say: 'ใน defining clause ถ้า who/which/that เป็น <b>กรรม</b> (ตามด้วยประธานใหม่) ตัดทิ้งได้: The movie (that) we watched was great. แต่ถ้าเป็น <b>ประธาน</b> ตัดไม่ได้: The man who called me', fig: { t: 'formula', lines: ['The movie (that) we watched', '→ ตัดได้ เพราะเป็นกรรม', 'The man who called → ตัดไม่ได้'] } }
  ] },
  { id: 'ls_enreport4', level: 'm4', subject: 'en', gen: 'en4_gram', icon: '💬', title: 'Reported Speech และ Modals', blurb: 'เล่าคำพูดคนอื่นด้วยการถอยเทนส์ และ modal verbs ที่ควรรู้', pages: [
    { say: '<b>Reported speech</b> คือการเล่าสิ่งที่คนอื่นพูดโดยไม่ยกคำพูดตรง ๆ เช่น He said, "I am tired." → He said that he was tired. สังเกตว่า <b>เทนส์ถอยหลัง</b> และสรรพนามเปลี่ยน', fig: { t: 'formula', lines: ['He said, "I am tired."', '→ He said that he was tired.'] } },
    { say: 'กฎ <b>ถอยเทนส์</b> (เมื่อกริยานำเป็นอดีต เช่น said): am/is → was · are → were · will → would · present simple → past simple (work → worked) เช่น She said, "I will come." → She said she would come.', fig: { t: 'formula', lines: ['am/is → was', 'will → would', 'work → worked'] } },
    { say: 'ต้องเปลี่ยน <b>สรรพนาม</b> ให้ตรงกับคนเล่า (I → he/she) และเปลี่ยน <b>คำบอกเวลา/สถานที่</b>: today → that day · tomorrow → the next day · yesterday → the day before · now → then · here → there', fig: { t: 'formula', lines: ['today → that day', 'tomorrow → the next day', 'yesterday → the day before', 'here → there'] } },
    { say: '<b>Modals</b> คือกริยาช่วยที่ตามด้วยกริยาช่องที่ 1 เสมอ เช่น can swim ห้ามเติม s หรือ to · <b>can</b> = สามารถ/ขออนุญาต · <b>could</b> = สามารถในอดีต หรือขอร้องสุภาพ · <b>should</b> = ควร (คำแนะนำ)', fig: { t: 'formula', lines: ['modal + V1', 'can swim', 'should study'] } },
    { say: '<b>must</b> = ต้อง (ผู้พูดเห็นว่าจำเป็น) · <b>have to</b> = ต้อง (เพราะกฎหรือสถานการณ์บังคับ) · <b>may / might</b> = อาจจะ (might แน่ใจน้อยกว่า) เช่น It may rain. It might rain.', fig: { t: 'emojis', rows: [['❗', 1, 'must / have to = ต้อง'], ['🌦️', 1, 'may / might = อาจจะ']] } },
    { say: 'ระวังความต่าง: <b>You mustn\'t go.</b> = ห้ามไป (ห้ามเด็ดขาด) แต่ <b>You don\'t have to go.</b> = ไม่จำเป็นต้องไป (จะไปก็ได้ ไม่ไปก็ได้) สองประโยคนี้ความหมายต่างกันมาก ข้อสอบชอบถาม', fig: { t: 'formula', lines: ['mustn\'t = ห้าม', 'don\'t have to = ไม่จำเป็น'] } }
  ] },
  // ---------- v0.25.0: lessons_sci ----------

  { id: 'ls_scwater1', level: 'm1', subject: 'sci', gen: 'sci1_earth', icon: '💧', title: 'วัฏจักรน้ำและสภาพอากาศ', blurb: 'น้ำหมุนเวียนอย่างไร ลมฟ้าอากาศต่างจากภูมิอากาศตรงไหน', pages: [
    { say: 'ป้าไก่เล่าให้ฟังนะ น้ำบนโลกไม่ได้หายไปไหน แต่<b>หมุนเวียน</b>เป็นวงกลมเรียกว่า <b>วัฏจักรน้ำ</b> เริ่มจากความร้อนของดวงอาทิตย์นี่แหละ', fig: { t: 'emojis', rows: [['☀️', 1, 'ดวงอาทิตย์ให้ความร้อน'], ['🌊', 1, 'น้ำในทะเลและแม่น้ำ'], ['☁️', 1, 'เมฆ'], ['🌧️', 1, 'ฝน']] } },
    { say: 'น้ำเปลี่ยนสถานะเป็นไอน้ำเรียกว่า <b>การระเหย</b> ไอน้ำลอยขึ้นฟ้าแล้วเย็นลงจนกลายเป็นหยดน้ำเล็ก ๆ เรียกว่า <b>การควบแน่น</b> หยดน้ำมารวมกันเป็นเมฆ', fig: { t: 'formula', lines: ['น้ำ → (ระเหย) → ไอน้ำ', 'ไอน้ำ → (ควบแน่น) → หยดน้ำ → เมฆ'] } },
    { say: 'เมื่อหยดน้ำในเมฆใหญ่และหนักขึ้นจนลอยไม่ไหว ก็ตกลงมาเป็น<b>ฝน</b> น้ำฝนบางส่วนไหลลงแม่น้ำ บางส่วนซึมลงดินกลายเป็น<b>น้ำใต้ดิน</b>', fig: { t: 'emojis', rows: [['☁️', 1, 'เมฆ'], ['🌧️', 1, 'ฝนตกลงมา'], ['🏞️', 1, 'ไหลลงแม่น้ำ'], ['🪨', 1, 'ซึมลงเป็นน้ำใต้ดิน']] } },
    { say: 'พืชก็ช่วยส่งน้ำขึ้นฟ้าด้วยนะ พืชดูดน้ำทางราก แล้วปล่อยไอน้ำออกทางใบ เรียกว่า <b>การคายน้ำ</b> ป่าใหญ่จึงทำให้อากาศชื้นและเย็นสบาย', fig: { t: 'emojis', rows: [['🌳', 1, 'รากดูดน้ำ'], ['🍃', 1, 'ใบคายไอน้ำ'], ['💨', 1, 'ไอน้ำลอยขึ้นฟ้า']] } },
    { say: '<b>ลมฟ้าอากาศ</b> คือสภาพอากาศช่วงสั้น ๆ ในที่หนึ่ง เช่น วันนี้ฝนตก ส่วน<b>ภูมิอากาศ</b> คือลักษณะอากาศโดยเฉลี่ยของที่นั้นในระยะยาว เช่น ภาคใต้ฝนชุก', fig: { t: 'formula', lines: ['ลมฟ้าอากาศ = ช่วงสั้น (วันนี้ ตอนนี้)', 'ภูมิอากาศ = ระยะยาว (เฉลี่ยหลายปี)'] } },
    { say: '<b>ความกดอากาศ</b> คือแรงที่อากาศกดลงบนพื้นที่ อากาศจะไหลจากที่ความกดอากาศ<b>สูง</b>ไปที่<b>ต่ำ</b> นั่นคือ<b>ลม</b> ส่วน<b>ความชื้น</b>คือปริมาณไอน้ำในอากาศ', fig: { t: 'formula', lines: ['ลม = อากาศไหล', 'จาก กดอากาศสูง → กดอากาศต่ำ', 'ความชื้น = ไอน้ำในอากาศ'] } }
  ] },
  { id: 'ls_scrock1', level: 'm1', subject: 'sci', gen: 'sci1_earth', icon: '🪨', title: 'หินและแร่', blurb: 'หินมี 3 ประเภท และหมุนเวียนเป็นวัฏจักร', pages: [
    { say: '<b>แร่</b>คือสารที่เกิดเองตามธรรมชาติ เป็นของแข็ง มีส่วนประกอบทางเคมีแน่นอน ส่วน<b>หิน</b>คือก้อนที่เกิดจากแร่ตั้งแต่ 1 ชนิดขึ้นไปมารวมกัน', fig: { t: 'formula', lines: ['แร่ + แร่ + ... = หิน', 'หินหนึ่งก้อนมีแร่ได้หลายชนิด'] } },
    { say: '<b>หินอัคนี</b>เกิดจากหินหนืดร้อน (แมกมา หรือลาวา) เย็นตัวลงแล้วแข็ง เช่น <b>หินแกรนิต</b> ที่เม็ดแร่ใหญ่ และ <b>หินบะซอลต์</b> ที่เม็ดละเอียด สีเข้ม', fig: { t: 'emojis', rows: [['🌋', 1, 'หินหนืดร้อนจากภูเขาไฟ'], ['🪨', 1, 'หินแกรนิต'], ['⬛', 1, 'หินบะซอลต์']] } },
    { say: '<b>หินตะกอน</b>เกิดจากเศษหิน ทราย โคลน ที่ถูกพัดมาทับถมกันเป็นชั้น ๆ แล้วอัดแน่น เช่น <b>หินทราย</b> และ <b>หินปูน</b> หินชนิดนี้มักพบ<b>ซากดึกดำบรรพ์</b>', fig: { t: 'emojis', rows: [['🏖️', 1, 'ทับถมเป็นชั้น ๆ'], ['🟫', 1, 'หินทราย'], ['🐚', 1, 'หินปูน มักมีซากเปลือกหอย']] } },
    { say: '<b>หินแปร</b>คือหินเดิมที่ถูก<b>ความร้อนและแรงกดดัน</b>สูงจนเปลี่ยนสภาพ เช่น หินปูนแปรเป็น<b>หินอ่อน</b> และหินแกรนิตแปรเป็น<b>หินไนส์</b>', fig: { t: 'formula', lines: ['หินปูน → (ร้อน+กดดัน) → หินอ่อน', 'หินแกรนิต → (ร้อน+กดดัน) → หินไนส์'] } },
    { say: 'หินเปลี่ยนชนิดได้เรื่อย ๆ เรียกว่า <b>วัฏจักรหิน</b> หินถูก<b>ผุพัง</b>เป็นเศษเล็ก ๆ ถูกน้ำหรือลม<b>พัดพา (กร่อน)</b> ไปทับถมเป็นหินตะกอน หรือหลอมเป็นหินหนืดแล้วเย็นกลายเป็นหินอัคนีอีก', fig: { t: 'formula', lines: ['หินอัคนี → ผุพัง/กร่อน → ตะกอน', 'ตะกอน → อัดแน่น → หินตะกอน', 'ร้อน+กดดัน → หินแปร → หลอม → แมกมา'] } },
    { say: 'หินมีประโยชน์มาก หินปูนใช้ทำปูนซีเมนต์ หินแกรนิตและหินอ่อนใช้ตกแต่งอาคาร หินทรายใช้ก่อสร้าง ส่วนหินย่อยใช้ผสมคอนกรีตและโรยทางรถไฟ', fig: { t: 'emojis', rows: [['🏗️', 1, 'ปูนซีเมนต์จากหินปูน'], ['🏛️', 1, 'หินอ่อน หินแกรนิต ตกแต่งอาคาร'], ['🛤️', 1, 'หินย่อยโรยทางรถไฟ']] } }
  ] },
  { id: 'ls_scbody1', level: 'm1', subject: 'sci', gen: 'sci1_life', icon: '🫁', title: 'ระบบร่างกายของเรา', blurb: 'ย่อยอาหาร หายใจ หมุนเวียนเลือด และอาหาร 5 หมู่', pages: [
    { say: 'ร่างกายเราทำงานเป็นระบบ ๆ ช่วยกัน ป้าไก่จะพาไปรู้จัก 3 ระบบใหญ่ คือ <b>ระบบย่อยอาหาร</b> <b>ระบบหายใจ</b> และ<b>ระบบหมุนเวียนเลือด</b>', fig: { t: 'emojis', rows: [['🍚', 1, 'ระบบย่อยอาหาร'], ['🫁', 1, 'ระบบหายใจ'], ['❤️', 1, 'ระบบหมุนเวียนเลือด']] } },
    { say: 'อาหารเดินทางตามลำดับนี้ <b>ปาก → หลอดอาหาร → กระเพาะอาหาร → ลำไส้เล็ก → ลำไส้ใหญ่</b> สารอาหารส่วนใหญ่ดูดซึมที่<b>ลำไส้เล็ก</b> ส่วนลำไส้ใหญ่ดูดน้ำกลับ', fig: { t: 'formula', lines: ['ปาก → หลอดอาหาร → กระเพาะอาหาร', '→ ลำไส้เล็ก (ดูดซึมสารอาหาร)', '→ ลำไส้ใหญ่ (ดูดน้ำ) → ขับถ่าย'] } },
    { say: 'ระบบหายใจ อากาศเข้าทาง<b>จมูก → หลอดลม → ปอด</b> ในปอดมี<b>ถุงลม</b>เล็ก ๆ จำนวนมาก เป็นที่แลกเปลี่ยนแก๊ส', fig: { t: 'formula', lines: ['จมูก → หลอดลม → ปอด → ถุงลม', 'ถุงลม: ออกซิเจนเข้าเลือด', 'คาร์บอนไดออกไซด์ออกจากเลือด'] } },
    { say: 'เลือดที่รับออกซิเจนแล้วถูก<b>หัวใจ</b>สูบฉีดไปตาม<b>หลอดเลือด</b>ทั่วร่างกาย เพื่อส่งออกซิเจนและสารอาหารให้ทุกเซลล์ แล้วรับของเสียกลับมา', fig: { t: 'emojis', rows: [['❤️', 1, 'หัวใจ ปั๊มเลือด'], ['🩸', 1, 'หลอดเลือด เส้นทางเดินเลือด'], ['🫁', 1, 'ปอด รับออกซิเจน']] } },
    { say: '<b>อาหาร 5 หมู่</b> ควรกินให้ครบทุกวัน หมู่ 1 โปรตีน หมู่ 2 คาร์โบไฮเดรต หมู่ 3 ผัก หมู่ 4 ผลไม้ หมู่ 5 ไขมัน', fig: { t: 'emojis', rows: [['🥚', 1, 'หมู่ 1 โปรตีน เนื้อ นม ไข่ ถั่ว'], ['🍚', 1, 'หมู่ 2 คาร์โบไฮเดรต ข้าว แป้ง น้ำตาล'], ['🥬', 1, 'หมู่ 3 ผัก'], ['🍎', 1, 'หมู่ 4 ผลไม้'], ['🥑', 1, 'หมู่ 5 ไขมัน']] } }
  ] },
  { id: 'ls_scfirst1', level: 'm1', subject: 'sci', gen: 'sci1_life', icon: '🩹', title: 'ปฐมพยาบาลและความปลอดภัย', blurb: 'ช่วยเหลือเบื้องต้นและเบอร์โทรฉุกเฉินที่ต้องจำ', pages: [
    { say: '<b>แผลถลอกหรือเลือดออก</b> ให้ล้างแผลด้วยน้ำสะอาดและสบู่ หากเลือดไหลให้ใช้ผ้าสะอาด<b>กดแผลไว้</b>เพื่อห้ามเลือด แล้วปิดแผลให้สะอาด', fig: { t: 'formula', lines: ['1) ล้างแผลด้วยน้ำสะอาด', '2) กดห้ามเลือดด้วยผ้าสะอาด', '3) ปิดแผลให้สะอาด'] } },
    { say: '<b>แผลไฟไหม้หรือน้ำร้อนลวก</b> ให้ล้างด้วยน้ำสะอาดที่ไหลผ่านนาน ๆ เพื่อลดความร้อน ห้ามทาสิ่งที่ไม่แน่ใจ เช่น ยาสีฟัน หรือของที่ไม่สะอาด', fig: { t: 'emojis', rows: [['🚿', 1, 'ล้างด้วยน้ำสะอาดไหลผ่านนาน ๆ'], ['🚫', 1, 'ห้ามทาของที่ไม่แน่ใจ']] } },
    { say: '<b>จมน้ำ</b> ให้ตะโกนขอความช่วยเหลือ แล้วโยนวัตถุลอยน้ำให้ เช่น ขวดน้ำเปล่า หรือห่วงยาง ห้ามกระโดดลงไปช่วยเอง เพราะอาจจมน้ำไปด้วยกัน', fig: { t: 'formula', lines: ['ตะโกน → โยนของลอยน้ำ → โทรขอความช่วยเหลือ', 'อย่ากระโดดลงไปช่วยเอง'] } },
    { say: 'ถ้าเพื่อน<b>เป็นลม</b> ให้พาไปนอนในที่อากาศถ่ายเทสะดวก ยกขาสูงเล็กน้อย คลายเสื้อผ้าที่รัดแน่น ถ้าไม่ฟื้นหรือไม่หายใจ รีบโทรเรียกรถพยาบาลทันที', fig: { t: 'emojis', rows: [['🛏️', 1, 'นอนราบ อากาศถ่ายเท'], ['🦵', 1, 'ยกขาสูงเล็กน้อย'], ['👕', 1, 'คลายเสื้อผ้าที่รัดแน่น']] } },
    { say: 'เบอร์ฉุกเฉินที่ต้องจำให้ขึ้นใจ <b>1669</b> เรียกการแพทย์ฉุกเฉิน <b>191</b> ตำรวจ <b>199</b> ดับเพลิง โทรได้ตลอด 24 ชั่วโมง', fig: { t: 'emojis', rows: [['🚑', 1, '1669 การแพทย์ฉุกเฉิน'], ['👮', 1, '191 ตำรวจ'], ['🚒', 1, '199 ดับเพลิง']] } },
    { say: '<b>แผ่นดินไหว</b> ให้ก้มต่ำ หาที่กำบัง เช่น ใต้โต๊ะแข็งแรง และจับให้มั่น <b>ไฟไหม้</b> ให้ก้มต่ำหนีควัน ห้ามใช้ลิฟต์ แล้วรีบออกมาและโทรแจ้ง 199', fig: { t: 'formula', lines: ['แผ่นดินไหว: ก้มต่ำ หาที่กำบัง จับให้มั่น', 'ไฟไหม้: ก้มต่ำหนีควัน ห้ามใช้ลิฟต์', 'แล้วโทรแจ้ง 199'] } }
  ] },
  { id: 'ls_scbond4', level: 'm4', subject: 'sci', gen: 'sci4_chem', icon: '🔗', title: 'พันธะเคมีและตารางธาตุ', blurb: 'ไอออนิกกับโคเวเลนต์ต่างกันอย่างไร', pages: [
    { say: 'ตารางธาตุเรียงธาตุตามเลขอะตอม แถวนอนเรียก<b>คาบ</b> แถวตั้งเรียก<b>หมู่</b> ธาตุในหมู่เดียวกันมักมีสมบัติคล้ายกัน เพราะมี<b>เวเลนซ์อิเล็กตรอน</b>เท่ากัน', fig: { t: 'formula', lines: ['แถวนอน = คาบ', 'แถวตั้ง = หมู่', 'หมู่เดียวกัน เวเลนซ์อิเล็กตรอนเท่ากัน'] } },
    { say: '<b>เวเลนซ์อิเล็กตรอน</b>คืออิเล็กตรอนในระดับพลังงานนอกสุด เป็นตัวที่ใช้สร้างพันธะ เช่น Na อยู่หมู่ 1 มี 1 ตัว ส่วน Cl อยู่หมู่ 17 มี 7 ตัว', fig: { t: 'formula', lines: ['Na (หมู่ 1)  : เวเลนซ์ 1', 'Cl (หมู่ 17) : เวเลนซ์ 7'] } },
    { say: '<b>กฎออกเตต</b> อะตอมมักเสถียรเมื่อมีเวเลนซ์อิเล็กตรอน 8 ตัวเหมือนแก๊สเฉื่อย (ฮีเลียมมี 2 ตัว) อะตอมจึงให้ รับ หรือใช้อิเล็กตรอนร่วมกันเพื่อให้ครบ', fig: { t: 'formula', lines: ['เป้าหมาย: เวเลนซ์อิเล็กตรอนครบ 8', '(H และ He ครบที่ 2)'] } },
    { say: '<b>พันธะไอออนิก</b> เกิดระหว่าง<b>โลหะกับอโลหะ</b> โลหะ<b>ให้</b>อิเล็กตรอนเป็นไอออนบวก อโลหะ<b>รับ</b>เป็นไอออนลบ แล้วดึงดูดกัน เช่น NaCl', fig: { t: 'formula', lines: ['Na → Na⁺ + e⁻   (ให้)', 'Cl + e⁻ → Cl⁻   (รับ)', 'Na⁺ ดึงดูด Cl⁻ = NaCl'] } },
    { say: '<b>พันธะโคเวเลนต์</b> เกิดระหว่าง<b>อโลหะกับอโลหะ</b> ใช้อิเล็กตรอน<b>ร่วมกัน</b> เช่น น้ำ H₂O และ คาร์บอนไดออกไซด์ CO₂', fig: { t: 'emojis', rows: [['💧', 1, 'H₂O ใช้อิเล็กตรอนร่วมกัน'], ['💨', 1, 'CO₂ ใช้อิเล็กตรอนร่วมกัน']] } },
    { say: 'สารไอออนิกมักเป็นของแข็ง จุดหลอมเหลวสูง ละลายน้ำหรือเมื่อหลอมเหลวแล้วนำไฟฟ้าได้ ส่วนสารโคเวเลนต์โมเลกุลเล็กมักจุดหลอมเหลวต่ำกว่า และโดยทั่วไปไม่นำไฟฟ้า', fig: { t: 'formula', lines: ['ไอออนิก: จุดหลอมเหลวสูง นำไฟฟ้าเมื่อละลาย/หลอม', 'โคเวเลนต์: จุดหลอมเหลวต่ำกว่า มักไม่นำไฟฟ้า'] } }
  ] },
  { id: 'ls_screact4', level: 'm4', subject: 'sci', gen: 'sci4_chem', icon: '⚗️', title: 'ปฏิกิริยาเคมีและอัตราการเกิด', blurb: 'สมการเคมี กฎทรงมวล และสิ่งที่ทำให้เร็วขึ้น', pages: [
    { say: 'รู้ได้ไงว่าเกิด<b>ปฏิกิริยาเคมี</b> สังเกตจากสัญญาณเหล่านี้ เกิดตะกอน เกิดแก๊สฟองฟู่ สีเปลี่ยน หรือมีการเปลี่ยนแปลงความร้อน (ร้อนขึ้นหรือเย็นลง)', fig: { t: 'emojis', rows: [['🧪', 1, 'เกิดตะกอน'], ['🫧', 1, 'เกิดแก๊ส'], ['🎨', 1, 'สีเปลี่ยน'], ['🌡️', 1, 'อุณหภูมิเปลี่ยน']] } },
    { say: '<b>สมการเคมี</b>เขียนบอกสารตั้งต้นและผลิตภัณฑ์ ตามกฎทรงมวล จำนวนอะตอมแต่ละชนิดทั้งสองข้างต้องเท่ากัน จึงต้องใส่เลขสัมประสิทธิ์หน้าสูตรเพื่อ<b>ดุลสมการ</b>', fig: { t: 'formula', lines: ['2H₂ + O₂ → 2H₂O', 'ซ้าย: H 4 ตัว, O 2 ตัว', 'ขวา: H 4 ตัว, O 2 ตัว (เท่ากัน)'] } },
    { say: 'ลองอีกข้อ มีเทนเผาไหม้ CH₄ + 2O₂ → CO₂ + 2H₂O ตรวจนับได้ ซ้าย C 1 H 4 O 4 ขวา C 1 H 4 O 4 (2 จาก CO₂ รวม 2 จาก 2H₂O) เท่ากันพอดี', fig: { t: 'formula', lines: ['CH₄ + 2O₂ → CO₂ + 2H₂O', 'C: 1 = 1', 'H: 4 = 4', 'O: 4 = 4'] } },
    { say: '<b>อัตราการเกิดปฏิกิริยา</b>เร็วขึ้นได้ เมื่อ<b>เพิ่มอุณหภูมิ</b> <b>เพิ่มความเข้มข้น</b> <b>เพิ่มพื้นที่ผิว</b> (บดให้ละเอียด) หรือใส่<b>ตัวเร่งปฏิกิริยา</b>', fig: { t: 'emojis', rows: [['🔥', 1, 'อุณหภูมิสูงขึ้น'], ['🧂', 1, 'ความเข้มข้นมากขึ้น'], ['🔨', 1, 'บดให้ละเอียด พื้นที่ผิวมากขึ้น'], ['⚡', 1, 'ตัวเร่งปฏิกิริยา']] } },
    { say: 'ตัวเร่งปฏิกิริยาช่วยให้ปฏิกิริยาเร็วขึ้น โดยตัวมันเองไม่ถูกใช้หมดไปในปฏิกิริยา เช่น เอนไซม์ในร่างกายเราก็เป็นตัวเร่งปฏิกิริยา', fig: { t: 'formula', lines: ['ตัวเร่ง: ทำให้เร็วขึ้น', 'ตัวเร่งเองไม่ถูกใช้หมด'] } },
    { say: '<b>ปฏิกิริยาคายความร้อน</b>ปล่อยความร้อนออกมา อุณหภูมิรอบข้างสูงขึ้น เช่น การเผาไหม้ ส่วน<b>ปฏิกิริยาดูดความร้อน</b>ดูดความร้อนเข้าไป รอบข้างเย็นลง', fig: { t: 'formula', lines: ['คายความร้อน: รอบข้างร้อนขึ้น (เช่น เผาไหม้)', 'ดูดความร้อน: รอบข้างเย็นลง'] } }
  ] },
  { id: 'ls_scemag4', level: 'm4', subject: 'sci', gen: 'sci4_phys', icon: '🧲', title: 'แม่เหล็กและไฟฟ้า', blurb: 'แม่เหล็กไฟฟ้า การเหนี่ยวนำ มอเตอร์ และหม้อแปลง', pages: [
    { say: 'แม่เหล็กมี 2 ขั้ว คือ N และ S <b>ขั้วต่างกันดูดกัน ขั้วเหมือนกันผลักกัน</b> บริเวณรอบแม่เหล็กที่มีแรงแม่เหล็กเรียกว่า <b>สนามแม่เหล็ก</b>', fig: { t: 'formula', lines: ['N กับ S → ดูดกัน', 'N กับ N / S กับ S → ผลักกัน'] } },
    { say: 'เมื่อมี<b>กระแสไฟฟ้า</b>ไหลในเส้นลวด จะเกิด<b>สนามแม่เหล็ก</b>รอบลวด ถ้าพันลวดเป็นขดแล้วมีแกนเหล็กอยู่ตรงกลาง จะได้<b>แม่เหล็กไฟฟ้า</b> ที่เปิดปิดได้', fig: { t: 'emojis', rows: [['⚡', 1, 'กระแสไฟฟ้าไหล'], ['🌀', 1, 'ขดลวดพันแกนเหล็ก'], ['🧲', 1, 'เกิดแม่เหล็กไฟฟ้า']] } },
    { say: '<b>การเหนี่ยวนำแม่เหล็กไฟฟ้า</b> (ฟาราเดย์) เมื่อสนามแม่เหล็กที่ผ่านขดลวดเปลี่ยนแปลง เช่น เคลื่อนแม่เหล็กเข้าออกขดลวด จะเกิด<b>กระแสไฟฟ้า</b>ในขดลวดนั้น', fig: { t: 'formula', lines: ['สนามแม่เหล็กผ่านขดลวดเปลี่ยน', '→ เกิดแรงเคลื่อนไฟฟ้า/กระแสไฟฟ้า', '(ถ้าแม่เหล็กนิ่งอยู่เฉย ๆ ไม่เกิด)'] } },
    { say: '<b>มอเตอร์ไฟฟ้า</b>เปลี่ยนพลังงานไฟฟ้าเป็นพลังงานกล ส่วน<b>เครื่องกำเนิดไฟฟ้า</b>เปลี่ยนพลังงานกลเป็นพลังงานไฟฟ้า ทั้งสองทำงานกลับทางกัน', fig: { t: 'formula', lines: ['มอเตอร์: ไฟฟ้า → พลังงานกล', 'เครื่องกำเนิดไฟฟ้า: พลังงานกล → ไฟฟ้า'] } },
    { say: '<b>หม้อแปลง</b>ใช้ได้กับไฟฟ้ากระแสสลับ เพิ่มหรือลดแรงดัน โดยแรงดันแปรผันตามจำนวนรอบขดลวด ปฐมภูมิ (p) คือด้านเข้า ทุติยภูมิ (s) คือด้านออก', fig: { t: 'formula', lines: ['Vp / Vs = Np / Ns', 'Ns มากกว่า Np → เพิ่มแรงดัน', 'Ns น้อยกว่า Np → ลดแรงดัน'] } },
    { say: 'ตัวอย่าง หม้อแปลงมี Np = 1000 รอบ Ns = 50 รอบ ต่อไฟ 220 V ได้ Vs = 220 × 50 ÷ 1000 = <b>11 V</b> เป็นหม้อแปลงลดแรงดัน', fig: { t: 'formula', lines: ['Vs = Vp × Ns ÷ Np', 'Vs = 220 × 50 ÷ 1000', 'Vs = 11 V'] } }
  ] },
  { id: 'ls_scwave4', level: 'm4', subject: 'sci', gen: 'sci4_phys', icon: '🌊', title: 'คลื่นและแสง', blurb: 'ชนิดของคลื่น v = f × λ สเปกตรัม การสะท้อนและหักเห', pages: [
    { say: 'คลื่นถ่ายโอนพลังงานโดยไม่พาตัวกลางไปด้วย <b>คลื่นตามขวาง</b> อนุภาคสั่นตั้งฉากกับทิศคลื่น เช่น คลื่นน้ำ <b>คลื่นตามยาว</b> สั่นขนานทิศคลื่น เช่น คลื่นเสียง', fig: { t: 'formula', lines: ['ตามขวาง: สั่นตั้งฉากทิศคลื่น (คลื่นน้ำ)', 'ตามยาว: สั่นขนานทิศคลื่น (เสียง)'] } },
    { say: '<b>ความยาวคลื่น (λ)</b> คือระยะห่างระหว่างยอดคลื่นถึงยอดคลื่นถัดไป <b>ความถี่ (f)</b> คือจำนวนลูกคลื่นต่อ 1 วินาที มีหน่วยเฮิรตซ์ (Hz) ส่วน<b>แอมพลิจูด</b>คือระยะกระจัดสูงสุดจากแนวสมดุล', fig: { t: 'formula', lines: ['λ = ระยะยอดถึงยอด (เมตร)', 'f = จำนวนลูกคลื่นต่อวินาที (Hz)', 'แอมพลิจูด = ระยะกระจัดสูงสุด'] } },
    { say: 'ความเร็วคลื่นหาได้จาก <b>v = f × λ</b> ตัวอย่าง คลื่นความถี่ 50 Hz ความยาวคลื่น 2 m ความเร็ว = 50 × 2 = <b>100 m/s</b>', fig: { t: 'formula', lines: ['v = f × λ', 'v = 50 × 2', 'v = 100 m/s'] } },
    { say: '<b>สเปกตรัมแม่เหล็กไฟฟ้า</b> เรียงจากความถี่ต่ำไปสูง คือ วิทยุ ไมโครเวฟ อินฟราเรด แสงที่ตามองเห็น อัลตราไวโอเลต เอกซเรย์ และรังสีแกมมา ทุกชนิดเคลื่อนที่ในสุญญากาศด้วยความเร็วเท่ากัน', fig: { t: 'formula', lines: ['ความถี่ต่ำ → สูง', 'วิทยุ → ไมโครเวฟ → อินฟราเรด', '→ แสงที่ตามองเห็น → อัลตราไวโอเลต', '→ เอกซเรย์ → แกมมา'] } },
    { say: '<b>การสะท้อน</b>ของแสงเป็นไปตามกฎ <b>มุมตกกระทบ = มุมสะท้อน</b> โดยวัดมุมจากเส้นปกติ ส่วน<b>การหักเห</b>คือแสงเปลี่ยนทิศเมื่อผ่านตัวกลางต่างชนิด เพราะความเร็วเปลี่ยน', fig: { t: 'formula', lines: ['การสะท้อน: มุมตกกระทบ = มุมสะท้อน', 'การหักเห: ผ่านตัวกลางใหม่ ความเร็วเปลี่ยน ทิศเปลี่ยน'] } },
    { say: 'ตัวอย่างการหักเห หลอดดูดที่แช่ในแก้วน้ำจะดูเหมือนหักงอ เพราะแสงเดินทางจากน้ำสู่อากาศ จึงเกิดการหักเห ทำให้เราเห็นภาพไม่ตรงกับตำแหน่งจริง', fig: { t: 'emojis', rows: [['🥤', 1, 'หลอดในแก้วน้ำ ดูเหมือนหักงอ'], ['💡', 1, 'แสงหักเหเมื่อผ่านตัวกลางต่างกัน']] } }
  ] },
  { id: 'ls_ecosys4', level: 'm4', subject: 'sci', gen: 'sci4_life', icon: '🌿', title: 'ระบบนิเวศและความหลากหลายทางชีวภาพ', blurb: 'ใครกินใคร พลังงานไปไหน และทำไมต้องอนุรักษ์', pages: [
    { say: 'ในระบบนิเวศ สิ่งมีชีวิตแบ่งตามหน้าที่ได้ 3 กลุ่ม <b>ผู้ผลิต</b> สร้างอาหารเองได้ เช่น พืช <b>ผู้บริโภค</b> กินสิ่งมีชีวิตอื่น <b>ผู้ย่อยสลาย</b> ย่อยซากแล้วคืนธาตุสู่ดิน เช่น เห็ดรา แบคทีเรีย', fig: { t: 'emojis', rows: [['🌱', 1, 'ผู้ผลิต'], ['🐇', 1, 'ผู้บริโภค'], ['🍄', 1, 'ผู้ย่อยสลาย']] } },
    { say: '<b>ปิรามิดพลังงาน</b> พลังงานถ่ายทอดขึ้นไปแต่ละลำดับขั้นเหลือราว <b>10%</b> ที่เหลือสูญเสียเป็นความร้อนและใช้ในการดำรงชีวิต ยิ่งขึ้นสูงยิ่งมีพลังงานน้อย', fig: { t: 'formula', lines: ['ผู้ผลิต           10000 หน่วย', 'ผู้บริโภคลำดับ 1    1000 หน่วย', 'ผู้บริโภคลำดับ 2     100 หน่วย', 'ผู้บริโภคลำดับ 3      10 หน่วย'] } },
    { say: '<b>ความสัมพันธ์ของสิ่งมีชีวิต</b> ภาวะพึ่งพากัน อยู่ด้วยกันได้ประโยชน์ทั้งคู่และแยกกันไม่ได้ เช่น ไลเคน ภาวะได้ประโยชน์ร่วมกัน ได้ประโยชน์ทั้งคู่แต่แยกกันอยู่ได้ เช่น นกเอี้ยงกับควาย', fig: { t: 'formula', lines: ['พึ่งพากัน: ได้ + ได้ (แยกกันไม่ได้)', 'ได้ประโยชน์ร่วมกัน: ได้ + ได้ (แยกกันได้)'] } },
    { say: 'ภาวะเกื้อกูล ฝ่ายหนึ่งได้ประโยชน์ อีกฝ่ายไม่ได้ไม่เสีย เช่น กล้วยไม้เกาะต้นไม้ ส่วน<b>ภาวะปรสิต</b> ฝ่ายหนึ่งได้ อีกฝ่ายเสียหาย เช่น เห็บ หมัด พยาธิ', fig: { t: 'formula', lines: ['เกื้อกูล: ได้ + เฉย ๆ', 'ปรสิต: ได้ + เสียหาย'] } },
    { say: '<b>วัฏจักรไนโตรเจน</b> พืชใช้ไนโตรเจนในรูปสารประกอบ แบคทีเรียที่ปมรากพืชตระกูลถั่วช่วยตรึงไนโตรเจนจากอากาศให้พืชใช้ได้ และผู้ย่อยสลายช่วยคืนไนโตรเจนจากซากสู่ดินและอากาศ', fig: { t: 'formula', lines: ['ไนโตรเจนในอากาศ → (แบคทีเรียตรึง) → พืช', 'พืช → สัตว์ → ซาก', 'ซาก → (ผู้ย่อยสลาย) → ดิน/อากาศ'] } },
    { say: '<b>ความหลากหลายทางชีวภาพ</b> คือความหลากหลายของชนิดพันธุ์ พันธุกรรม และระบบนิเวศ ยิ่งหลากหลายระบบนิเวศยิ่งมั่นคง จึงต้องอนุรักษ์ เช่น ไม่ทำลายป่า และไม่ล่าสัตว์ป่า', fig: { t: 'emojis', rows: [['🦜', 1, 'ชนิดพันธุ์หลากหลาย'], ['🌳', 1, 'รักษาป่า'], ['🚫', 1, 'ไม่ล่าสัตว์ป่า']] } }
  ] },

  { id: 'ls_socsukayu4', level: 'm4', subject: 'soc', gen: 'soc4_sukayu', icon: '🏺', title: 'สุโขทัยกับอยุธยา ต่างกันตรงไหน', blurb: 'เปรียบเทียบการปกครอง เศรษฐกิจ และศิลปะของสองราชธานี', pages: [
    { say: 'ป้าไก่ขอเทียบสองยุคนะ สุโขทัยปกครองแบบ <b>พ่อปกครองลูก</b> กษัตริย์ใกล้ชิดราษฎร ส่วนอยุธยาปกครองแบบ <b>สมมติเทพ</b> กษัตริย์เป็นเสมือนเทพเจ้า', fig: { t: 'formula', lines: ['สุโขทัย = พ่อปกครองลูก', 'อยุธยา = สมมติเทพ (เทวราช)'] } },
    { say: 'สุโขทัย: ราษฎรไปสั่นกระดิ่งหน้าประตูวังเพื่อร้องทุกข์ได้ ตามที่ปรากฏในศิลาจารึก ส่วนอยุธยามีระบบ <b>ศักดินา</b> แบ่งชั้นคนชัดเจน มีเจ้านาย ขุนนาง ไพร่ ทาส', fig: { t: 'emojis', rows: [['🔔', 1, 'สุโขทัย ใกล้ชิดราษฎร'], ['👑', 1, 'อยุธยา กษัตริย์อยู่สูงสุด']] } },
    { say: 'เศรษฐกิจสุโขทัย ศิลาจารึกบอกว่า ใครใคร่ค้าก็ค้าได้ และมีการงดเว้นภาษีผ่านด่านที่เรียกว่า <b>จังกอบ</b> ทำให้การค้าคล่องตัว', fig: { t: 'formula', lines: ['สุโขทัย: ค้าขายเสรี', 'งดเว้นจังกอบ (ภาษีผ่านด่าน)'] } },
    { say: 'อยุธยาตั้งอยู่ใกล้ทะเล เป็นศูนย์กลางการค้านานาชาติ ติดต่อกับจีน ญี่ปุ่น เปอร์เซีย และชาติตะวันตก เช่น โปรตุเกส ฮอลันดา อังกฤษ ฝรั่งเศส', fig: { t: 'emojis', rows: [['🚢', 1, 'พ่อค้าต่างชาติเข้ามาค้าขาย'], ['🏯', 1, 'อยุธยาเป็นเมืองท่า']] } },
    { say: 'ศิลปะสุโขทัยที่ควรจำ คือ <b>เครื่องสังคโลก</b> ที่ส่งไปขายต่างประเทศ และพระพุทธรูป <b>ปางลีลา</b> ที่มีลักษณะอ่อนช้อยงดงามมาก', fig: { t: 'formula', lines: ['สุโขทัย: เครื่องสังคโลก', 'พระพุทธรูปปางลีลา'] } },
    { say: 'ศิลปวัฒนธรรมอยุธยาก็รุ่งเรือง มีทั้งงานสถาปัตยกรรม จิตรกรรม และวรรณกรรม เช่น ลิลิตพระลอ สรุปคือสุโขทัยเน้นความใกล้ชิดและค้าเสรี อยุธยาเน้นระบบชนชั้นและการค้านานาชาติ', fig: { t: 'formula', lines: ['สุโขทัย = ใกล้ชิด เรียบง่าย', 'อยุธยา = ชนชั้น ค้านานาชาติ'] } }
  ] },
  { id: 'ls_socratearly4', level: 'm4', subject: 'soc', gen: 'soc4_ratearly', icon: '🏯', title: 'กรุงรัตนโกสินทร์ตอนต้น', blurb: 'สร้างราชธานี รวบรวมกฎหมาย และเปิดการค้าเสรี', pages: [
    { say: 'พระบาทสมเด็จพระพุทธยอดฟ้าจุฬาโลก <b>รัชกาลที่ 1</b> ทรงสถาปนากรุงรัตนโกสินทร์ เป็นราชธานีใหม่ ใน พ.ศ. 2325 โดยย้ายมาฝั่งตะวันออกของแม่น้ำเจ้าพระยา', fig: { t: 'formula', lines: ['พ.ศ. 2325', 'รัชกาลที่ 1 สถาปนากรุงรัตนโกสินทร์'] } },
    { say: 'การสร้างบ้านเมือง ทรงสร้างพระบรมมหาราชวังและวัดพระแก้ว ขุดคลองรอบกรุง ให้เมืองมีแม่น้ำและคลองเป็นปราการป้องกันศัตรู', fig: { t: 'emojis', rows: [['🏯', 1, 'พระบรมมหาราชวัง'], ['🌊', 1, 'คลองรอบกรุงเป็นปราการ']] } },
    { say: 'ด้านกฎหมาย รัชกาลที่ 1 โปรดให้ชำระกฎหมายเก่า รวบรวมเป็น <b>กฎหมายตราสามดวง</b> เพราะประทับตราสามดวงกำกับ คือ ตราราชสีห์ ตราคชสีห์ และตราบัวแก้ว', fig: { t: 'formula', lines: ['กฎหมายตราสามดวง', 'ราชสีห์ + คชสีห์ + บัวแก้ว'] } },
    { say: 'ด้านวรรณคดี รัชกาลที่ 1 ทรงฟื้นฟูและรวบรวมวรรณคดีที่กระจัดกระจายหลังเสียกรุง และมีพระราชนิพนธ์รามเกียรติ์ฉบับรัชกาลที่ 1 ด้วย', fig: { t: 'emojis', rows: [['📜', 1, 'รวบรวมวรรณคดี'], ['⚖️', 1, 'ชำระกฎหมาย']] } },
    { say: 'สมัย <b>รัชกาลที่ 4</b> ไทยทำ <b>สนธิสัญญาเบาว์ริง</b> กับอังกฤษ ใน พ.ศ. 2398 เปิดให้ค้าขายเสรีมากขึ้น เก็บภาษีขาเข้าตามอัตราที่กำหนด และเลิกการผูกขาดการค้าของพระคลังสินค้า', fig: { t: 'formula', lines: ['พ.ศ. 2398 รัชกาลที่ 4', 'สนธิสัญญาเบาว์ริง (ไทย-อังกฤษ)', 'ผล: การค้าเสรี'] } },
    { say: 'หลังสนธิสัญญานี้ ข้าวกลายเป็นสินค้าส่งออกสำคัญ เศรษฐกิจไทยเชื่อมกับตลาดโลกมากขึ้น และรัชกาลที่ 4 ยังทรงปรับตัวรับตะวันตก เช่น ตัดถนนสายใหม่ ให้จ้างครูต่างชาติสอนพระโอรส', fig: { t: 'emojis', rows: [['🌾', 1, 'ข้าวเป็นสินค้าออกหลัก'], ['🛣️', 1, 'ตัดถนนสายใหม่']] } }
  ] },
  { id: 'ls_socworld4', level: 'm4', subject: 'soc', gen: 'soc4_wold', icon: '🏺', title: 'ประวัติศาสตร์โลกยุคโบราณถึงยุคกลาง', blurb: 'จากอารยธรรมโบราณ ถึงยุคฟื้นฟูศิลปวิทยาและยุคสำรวจ', pages: [
    { say: 'อารยธรรมโบราณ <b>เมโสโปเตเมีย</b> อยู่ระหว่างแม่น้ำไทกริสกับยูเฟรตีส มีอักษรลิ่ม (คูนิฟอร์ม) และประมวลกฎหมายฮัมมูราบี ส่วน <b>อียิปต์</b> อยู่ริมแม่น้ำไนล์ มีอักษรภาพ และสร้างพีระมิด', fig: { t: 'emojis', rows: [['🌊', 1, 'เมโสโปเตเมีย: อักษรลิ่ม'], ['🔺', 1, 'อียิปต์: พีระมิด แม่น้ำไนล์']] } },
    { say: '<b>กรีก</b> เป็นนครรัฐหลายแห่ง กรุงเอเธนส์เป็นต้นแบบประชาธิปไตย มีนักปราชญ์ เช่น โสเครตีส เพลโต อริสโตเติล ส่วน <b>โรมัน</b> เก่งเรื่องกฎหมายและการสร้างถนน', fig: { t: 'formula', lines: ['กรีก = ประชาธิปไตย ปรัชญา', 'โรมัน = กฎหมาย ถนน'] } },
    { say: 'จักรวรรดิโรมันตะวันตกล่มสลายราว ค.ศ. 476 เข้าสู่ <b>ยุคกลางของยุโรป</b> ที่ใช้ระบบ <b>ฟิวดัล</b> คือ กษัตริย์ มอบที่ดินให้ขุนนาง ขุนนางให้อัศวิน และชาวนา (ข้าติดที่ดิน) ทำงานในที่ดิน', fig: { t: 'formula', lines: ['กษัตริย์ → ขุนนาง', 'ขุนนาง → อัศวิน', 'ชาวนาทำงานในที่ดิน'] } },
    { say: '<b>สงครามครูเสด</b> เป็นสงครามศาสนาหลายครั้งระหว่างชาวคริสต์ยุโรปกับชาวมุสลิม เพื่อแย่งนครเยรูซาเลม เริ่มปลายคริสต์ศตวรรษที่ 11 ผลคือยุโรปเปิดการค้ากับตะวันออกมากขึ้น', fig: { t: 'emojis', rows: [['⚔️', 1, 'สงครามครูเสด'], ['🛒', 1, 'ผลคือการค้าขยายตัว']] } },
    { say: '<b>ยุคฟื้นฟูศิลปวิทยา</b> (Renaissance) เริ่มในอิตาลี ราวคริสต์ศตวรรษที่ 14 เน้นมนุษย์และศิลปะ มีเลโอนาร์โด ดา วินชี และไมเคิลแอนเจโล ส่วนการพิมพ์ของกูเทนเบิร์กช่วยกระจายความรู้', fig: { t: 'emojis', rows: [['🎨', 1, 'ดา วินชี ไมเคิลแอนเจโล'], ['📖', 1, 'แท่นพิมพ์กูเทนเบิร์ก']] } },
    { say: '<b>การปฏิวัติวิทยาศาสตร์</b> โคเปอร์นิคัสเสนอว่าดวงอาทิตย์เป็นศูนย์กลาง กาลิเลโอใช้กล้องส่องดาว นิวตันอธิบายแรงโน้มถ่วง ส่วน <b>ยุคสำรวจทางทะเล</b> เช่น โคลัมบัสถึงทวีปอเมริกา ค.ศ. 1492', fig: { t: 'formula', lines: ['ค.ศ. 1492 โคลัมบัสถึงอเมริกา', 'วาสโก ดา กามา ถึงอินเดีย', 'ยุโรปเริ่มค้าขายทั่วโลก'] } }
  ] },
  { id: 'ls_socreligion4', level: 'm4', subject: 'soc', gen: 'soc4_asia', icon: '🕊️', title: 'ศาสนาสำคัญของโลกและหลักธรรม', blurb: 'พุทธ คริสต์ อิสลาม ฮินดู เหมือนและต่างกันอย่างไร', pages: [
    { say: '<b>พุทธศาสนา</b> มีหลักสำคัญคือ <b>อริยสัจ 4</b> ได้แก่ ทุกข์ สมุทัย นิโรธ มรรค และ <b>ไตรลักษณ์</b> คือ อนิจจัง ทุกขัง อนัตตา', fig: { t: 'formula', lines: ['อริยสัจ 4 = ทุกข์ สมุทัย นิโรธ มรรค', 'ไตรลักษณ์ = อนิจจัง ทุกขัง อนัตตา'] } },
    { say: 'หลัก <b>ไตรสิกขา</b> คือ ศีล สมาธิ ปัญญา ซึ่งเป็นการฝึกตนสามด้าน และทางดับทุกข์คือ <b>มรรคมีองค์ 8</b> ที่เป็นทางสายกลาง', fig: { t: 'formula', lines: ['ไตรสิกขา = ศีล + สมาธิ + ปัญญา', 'ทางดับทุกข์ = มรรคมีองค์ 8'] } },
    { say: '<b>ศาสนาคริสต์</b> ศาสดาคือพระเยซู คัมภีร์ไบเบิล มี <b>บัญญัติ 10 ประการ</b> เช่น อย่าฆ่าคน อย่าลักทรัพย์ และสอนให้รักพระเจ้ากับ <b>รักเพื่อนบ้านเหมือนรักตนเอง</b>', fig: { t: 'emojis', rows: [['✝️', 1, 'ศาสนาคริสต์'], ['❤️', 1, 'รักเพื่อนบ้านเหมือนรักตนเอง']] } },
    { say: '<b>ศาสนาอิสลาม</b> ศาสดาคือท่านนบีมุฮัมมัด คัมภีร์อัลกุรอาน มี <b>หลัก 5 ประการ</b> คือ ปฏิญาณตน ละหมาดวันละ 5 เวลา ถือศีลอดเดือนรอมฎอน ซะกาต (บริจาคทาน) และฮัจญ์ที่เมืองมักกะฮ์', fig: { t: 'formula', lines: ['ปฏิญาณตน · ละหมาด 5 เวลา', 'ถือศีลอด · ซะกาต · ฮัจญ์'] } },
    { say: '<b>ศาสนาฮินดู</b> นับถือเทพสูงสุดสามองค์ที่เรียกว่า <b>ตรีมูรติ</b> คือ พระพรหมผู้สร้าง พระวิษณุผู้รักษา และพระศิวะผู้ทำลาย เชื่อเรื่องกรรมและการเวียนว่ายตายเกิด', fig: { t: 'formula', lines: ['พระพรหม = สร้าง', 'พระวิษณุ = รักษา', 'พระศิวะ = ทำลาย'] } },
    { say: 'ทุกศาสนาสอนให้ทำความดี ละเว้นความชั่ว แม้ความเชื่อต่างกัน เราควรเคารพความต่าง ไม่ดูหมิ่นกัน และอยู่ร่วมกันอย่างสันติ', fig: { t: 'emojis', rows: [['🕊️', 1, 'สอนให้ทำดี'], ['🤝', 1, 'เคารพกัน อยู่ร่วมกันสันติ']] } }
  ] },
  { id: 'ls_socintl4', level: 'm4', subject: 'soc', gen: 'soc4_econ', icon: '🌐', title: 'เศรษฐกิจระหว่างประเทศ', blurb: 'ส่งออก นำเข้า อัตราแลกเปลี่ยน และองค์กรการค้า', pages: [
    { say: 'ประเทศไม่ได้ผลิตทุกอย่างเองได้ จึงมีการค้าระหว่างประเทศ <b>ส่งออก</b> คือขายสินค้าไปต่างประเทศ ส่วน <b>นำเข้า</b> คือซื้อสินค้าจากต่างประเทศเข้ามา', fig: { t: 'emojis', rows: [['📤', 1, 'ส่งออก = ขายออกไป'], ['📥', 1, 'นำเข้า = ซื้อเข้ามา']] } },
    { say: '<b>ดุลการค้า</b> คือ มูลค่าส่งออกลบมูลค่านำเข้า ถ้าส่งออกมากกว่า เรียกว่า ดุลการค้าเกินดุล ถ้านำเข้ามากกว่า เรียกว่า ขาดดุล', fig: { t: 'formula', lines: ['ดุลการค้า = ส่งออก - นำเข้า', 'ส่งออก 500 นำเข้า 400 = เกินดุล 100'] } },
    { say: '<b>อัตราแลกเปลี่ยน</b> คือราคาของเงินสกุลหนึ่งเมื่อเทียบกับอีกสกุล เช่น สมมติ 1 ดอลลาร์ = 35 บาท ถ้ามี 100 ดอลลาร์ จะแลกได้ 3,500 บาท', fig: { t: 'formula', lines: ['สมมติ 1 ดอลลาร์ = 35 บาท', '100 x 35 = 3,500 บาท'] } },
    { say: 'ถ้าเงินบาทอ่อนค่าลง สินค้าไทยจะถูกลงในสายตาต่างชาติ ช่วยการส่งออก แต่การนำเข้าจะแพงขึ้น ถ้าบาทแข็งค่าจะเป็นตรงข้าม', fig: { t: 'formula', lines: ['บาทอ่อน → ส่งออกง่าย นำเข้าแพง', 'บาทแข็ง → ส่งออกยาก นำเข้าถูก'] } },
    { say: '<b>ภาษีศุลกากร</b> คือภาษีที่เก็บจากสินค้านำเข้า ถ้าตั้งสูงมากเรียกว่า <b>กำแพงภาษี</b> เพื่อปกป้องสินค้าในประเทศ ส่วน <b>WTO</b> (องค์การการค้าโลก ตั้งปี 1995) ดูแลให้การค้าเป็นธรรม', fig: { t: 'emojis', rows: [['🧱', 1, 'กำแพงภาษี ปกป้องสินค้าในประเทศ'], ['🌍', 1, 'WTO ดูแลกติกาการค้าโลก']] } },
    { say: '<b>อาเซียน</b> ตั้งปี 2510 ที่กรุงเทพฯ ตั้งเป้าเป็นประชาคมเศรษฐกิจ <b>AEC</b> ในปี 2558 ส่วน <b>เอเปค (APEC)</b> คือเวทีร่วมมือเศรษฐกิจเอเชีย-แปซิฟิก ทั้งหมดนี้เป็นส่วนของ <b>โลกาภิวัตน์</b> ที่โลกเชื่อมถึงกัน', fig: { t: 'formula', lines: ['อาเซียน ตั้งปี 2510', 'AEC เริ่มปี 2558', 'APEC = เอเชีย-แปซิฟิก'] } }
  ] },
  { id: 'ls_socconsume1', level: 'm1', subject: 'soc', gen: 'soc1_money', icon: '🛒', title: 'ผู้บริโภคฉลาดเลือกซื้อ', blurb: 'สิทธิผู้บริโภค อ่านฉลาก เทียบราคา และวางแผนใช้เงิน', pages: [
    { say: 'ผู้บริโภคคือคนที่ซื้อและใช้สินค้า มี <b>สิทธิ 5 ประการ</b> เช่น สิทธิได้รับข่าวสารที่ถูกต้อง สิทธิเลือกสินค้าอย่างอิสระ สิทธิได้รับความปลอดภัย และสิทธิได้รับการชดเชยความเสียหาย', fig: { t: 'emojis', rows: [['📰', 1, 'ได้รับข่าวสารถูกต้อง'], ['🛡️', 1, 'ได้รับความปลอดภัย']] } },
    { say: 'ก่อนซื้อให้อ่าน <b>ฉลาก</b> ดูวันหมดอายุ ส่วนประกอบ ปริมาณสุทธิ และเลขทะเบียนจาก อย. สำหรับอาหารด้วยนะ จะได้ไม่ซื้อของหมดอายุหรือไม่ปลอดภัย', fig: { t: 'formula', lines: ['ดูวันหมดอายุ', 'ดูส่วนประกอบ และปริมาณสุทธิ', 'ดูเลข อย.'] } },
    { say: 'เปรียบเทียบ <b>ราคาต่อหน่วย</b> ตัวอย่างน้ำ 500 มล. ราคา 20 บาท เท่ากับ 0.04 บาทต่อมล. ส่วนน้ำ 1,500 มล. ราคา 54 บาท เท่ากับ 0.036 บาทต่อมล. ขวดใหญ่ถูกกว่า', fig: { t: 'formula', lines: ['20 ÷ 500 = 0.04 บาท/มล.', '54 ÷ 1,500 = 0.036 บาท/มล.', 'ขวดใหญ่คุ้มกว่า'] } },
    { say: 'โปรโมชั่น <b>ซื้อ 2 แถม 1</b> ไม่ได้แปลว่าถูกเสมอ ต้องคิดดู เช่น ขนมซองละ 15 บาท จ่าย 30 บาทได้ 3 ซอง เท่ากับซองละ 10 บาท ถูกลงจริง แต่ถ้าไม่ได้อยากกินหลายซองก็ไม่คุ้ม', fig: { t: 'formula', lines: ['จ่าย 15 x 2 = 30 บาท', 'ได้ 3 ซอง', '30 ÷ 3 = 10 บาท/ซอง'] } },
    { say: 'แยกให้ออกว่า <b>ของจำเป็น</b> เช่น อาหาร อุปกรณ์การเรียน กับ <b>ของอยากได้</b> เช่น ของเล่นใหม่ ถ้าไม่แน่ใจ ลองรอ 2-3 วัน ถ้ายังจำเป็นค่อยซื้อ', fig: { t: 'emojis', rows: [['📚', 1, 'ของจำเป็น ซื้อก่อน'], ['🧸', 1, 'ของอยากได้ คิดก่อนซื้อ']] } },
    { say: 'วางแผนค่าขนม เช่น ได้ 100 บาทต่อสัปดาห์ เก็บออม 20 บาท เหลือใช้ 80 บาท จดรายจ่ายไว้ จะรู้ว่าใช้ไปกับอะไร และควบคุมตัวเองได้ดีขึ้น', fig: { t: 'formula', lines: ['ได้ 100 - ออม 20 = ใช้ได้ 80', 'จดรายจ่ายทุกวัน'] } }
  ] },
  // ---------- v0.26.0: lessons2_th ----------

  { id: 'ls_thpoem1', level: 'm1', subject: 'th', gen: 'th1_read', icon: '🎶', title: 'ร้อยแก้วกับร้อยกรอง', blurb: 'ป้าไก่พาอ่านบทกวีง่าย ๆ ดูจำนวนคำ สัมผัส และคำเปรียบ', pages: [
    { say: 'ข้อความที่เราเล่าเรื่องเรียงต่อกันธรรมดา เรียกว่า <b>ร้อยแก้ว</b> ส่วนข้อความที่มีกฎบังคับ เช่น จำนวนคำและสัมผัส เรียกว่า <b>ร้อยกรอง</b> เหมือนเอาคำมาร้อยเป็นพวงให้คล้องจองกัน', fig: { t: 'formula', lines: ['ร้อยแก้ว = เล่าเรียงต่อกัน ไม่บังคับสัมผัส', 'ร้อยกรอง = มีบังคับคำและสัมผัส'] } },
    { say: '<b>กลอนสุภาพ</b> บทหนึ่งมี 4 วรรค เรียกชื่อว่า สดับ รับ รอง ส่ง แต่ละวรรคมักมี 7-9 คำ ถ้าเฉลี่ยวรรคละ <b>8 คำ</b> ก็เรียก <b>กลอนแปด</b> ป้าไก่แนะนำให้จำว่า "สี่วรรค แปดคำ"', fig: { t: 'formula', lines: ['วรรคสดับ  ·  วรรครับ', 'วรรครอง  ·  วรรคส่ง', '1 บท = 4 วรรค วรรคละราว 8 คำ'] } },
    { say: 'สัมผัสนอกที่ต้องรู้ก่อน คือ คำท้ายวรรคสดับ ต้องสัมผัสกับคำที่ 3 หรือคำที่ 5 ของวรรครับ สัมผัส คือคำที่เสียงสระเดียวกันและตัวสะกดแม่เดียวกัน ส่วนกฎอื่นไปเรียนต่อบท กลอนแปดและสัมผัส ของ ม.4 นะ', fig: { t: 'formula', lines: ['ท้ายวรรคสดับ', '↔ คำที่ 3 หรือ 5 ของวรรครับ'] } },
    { say: '<b>กาพย์ยานี 11</b> บาทหนึ่งมี 2 วรรค วรรคแรก <b>5 คำ</b> วรรคหลัง <b>6 คำ</b> รวม 11 คำ ตัวอย่างนับพยางค์: แสงทองส่องฟ้าใส (5) ชาวนาออกไปทำไร่ (6) ลองนับนิ้วดูได้เลย', fig: { t: 'formula', lines: ['วรรคแรก 5 คำ + วรรคหลัง 6 คำ = 11 คำ', 'แสงทองส่องฟ้าใส (5)', 'ชาวนาออกไปทำไร่ (6)'] } },
    { say: 'การ<b>ถอดความ</b> คือเล่าความหมายของบทกวีใหม่เป็นร้อยแก้วด้วยคำง่าย ๆ ทำเป็น 3 ขั้น: อ่านให้ครบ หาคำยากแล้วแปลความหมาย แล้วเรียบเรียงเป็นประโยคธรรมดา ห้ามเอาความเห็นตัวเองใส่เพิ่ม', fig: { t: 'formula', lines: ['1. อ่านทั้งบท จับใจความ', '2. หาคำยากแล้วแปลความหมาย', '3. เรียบเรียงเป็นร้อยแก้ว'] } },
    { say: 'ภาพพจน์พื้นฐาน 2 แบบ <b>อุปมา</b> คือเปรียบว่า "เหมือน" ใช้คำ เหมือน ดุจ ราวกับ เช่น "ใจเย็นดุจน้ำ" ส่วน <b>อุปลักษณ์</b> คือเปรียบว่า "เป็น" ใช้คำ เป็น คือ เช่น "ครูคือแสงสว่าง" ดูคำเชื่อมก็แยกออกแล้ว', fig: { t: 'emojis', rows: [['🌊', 1, 'อุปมา: ใจเย็นดุจน้ำ'], ['💡', 1, 'อุปลักษณ์: ครูคือแสงสว่าง']] } }
  ] },
  { id: 'ls_thlevel1', level: 'm1', subject: 'th', gen: 'th1_word', icon: '🗣️', title: 'พูดให้เหมาะกับคนที่คุยด้วย', blurb: 'ระดับภาษา คำสรรพนาม คำลงท้าย คำสุภาพ และจดหมายเบื้องต้น', pages: [
    { say: 'ภาษาไทยมีหลายระดับ ใช้ให้เหมาะกับผู้ฟังและโอกาส เช่น <b>ทางการ</b> (พิธี งานราชการ) <b>กึ่งทางการ</b> (ประชุม ครูพูดกับนักเรียน) <b>ไม่เป็นทางการ</b> (คุยกับเพื่อนสนิท) และ<b>ภาษาปาก</b> (พูดเล่น กันเอง) บางตำราแบ่งละเอียดกว่านี้', fig: { t: 'formula', lines: ['ทางการ → กึ่งทางการ', '→ ไม่เป็นทางการ → ภาษาปาก'] } },
    { say: 'ตัวอย่างเรื่องเดียวกัน พูดต่างระดับ: ทางการ "ขอเรียนเชิญท่านร่วมงาน" กึ่งทางการ "ขอเชิญมาร่วมงานนะคะ" ไม่เป็นทางการ "มาร่วมงานด้วยกันนะ" ภาษาปาก "ไปงานด้วยกันป่ะ" ยิ่งสนิทมาก คำยิ่งสั้นและกันเอง', fig: { t: 'formula', lines: ['ขอเรียนเชิญท่านร่วมงาน', 'มาร่วมงานด้วยกันนะ', 'ไปงานด้วยกันป่ะ'] } },
    { say: 'คำลงท้ายต้องเลือกให้ถูก ผู้ชายใช้ <b>ครับ</b> ผู้หญิงใช้ <b>ค่ะ</b> เวลาตอบรับหรือบอกเล่า และใช้ <b>คะ</b> เวลาถามหรือเรียกชื่อ เช่น "ไปไหนคะ" ส่วน <b>นะคะ / นะครับ</b> ทำให้ประโยคนุ่มนวล เหมาะกับการขอร้อง', fig: { t: 'formula', lines: ['ตอบ/บอกเล่า: ครับ  ค่ะ', 'ถาม/เรียก: คะ  (ผู้ชาย: ครับ)', 'ขอร้องนุ่ม ๆ: นะครับ  นะคะ'] } },
    { say: 'สรรพนามเลือกตามผู้ฟัง พูดกับผู้ใหญ่หรือในที่ทางการ ผู้ชายใช้ <b>ผม</b> ผู้หญิงใช้ <b>ดิฉัน / หนู</b> (เด็กพูดกับผู้ใหญ่) เรียกผู้ใหญ่ว่า คุณครู ท่าน แทนคำว่า เธอ แก ส่วนกับเพื่อนสนิทใช้ เรา เธอ ได้', fig: { t: 'emojis', rows: [['👩‍🏫', 1, 'พูดกับครู: ผม/หนู ... ครับ/ค่ะ'], ['🧒', 1, 'พูดกับเพื่อน: เรา เธอ']] } },
    { say: '<b>คำสุภาพ</b> ใช้แทนคำที่ฟังไม่ไพเราะ เช่น กิน → รับประทาน ขอโทษ → ขออภัย ช่วย → กรุณา และเรียกคนที่ล่วงลับว่า เสียชีวิต แทนคำว่า ตาย การเลือกคำสุภาพคือการให้เกียรติผู้ฟัง', fig: { t: 'formula', lines: ['กิน → รับประทาน', 'ขอโทษ → ขออภัย', 'ตาย → เสียชีวิต'] } },
    { say: 'จดหมายเชิญหรือหนังสือราชการใช้ภาษาทางการ ขึ้นต้นด้วย <b>เรียน</b> ตามด้วยชื่อหรือตำแหน่งผู้รับ บอกเรื่องที่เชิญหรือขอ วัน เวลา สถานที่ ชัดเจน ลงท้ายว่า <b>ขอแสดงความนับถือ</b> แล้วตามด้วยชื่อผู้เขียน', fig: { t: 'formula', lines: ['เรียน ...', 'ขอเชิญ ... วัน เวลา สถานที่', 'ขอแสดงความนับถือ', '(ชื่อผู้เขียน)'] } }
  ] },
  { id: 'ls_thcontext4', level: 'm4', subject: 'th', gen: 'th4_gram', icon: '✍️', title: 'ใช้ภาษาให้ถูกบริบท', blurb: 'คำเขียนผิดบ่อย ประโยคกำกวม ที่ ซึ่ง อัน และคำฟุ่มเฟือย', pages: [
    { say: 'ข้อสอบภาษาไทยชอบถามเรื่อง "ใช้ให้ถูกที่ ถูกคำ" ป้าไก่แบ่งเป็น 5 เรื่องที่ควรจำ: คำเขียนผิดบ่อย, คำเชื่อมอย่าง เป็นต้น ฯลฯ, ประโยคกำกวมหรือไม่สมบูรณ์, ที่ ซึ่ง อัน, และคำฟุ่มเฟือย', fig: { t: 'formula', lines: ['1 คำเขียนผิดบ่อย', '2 เป็นต้น / ฯลฯ', '3 ประโยคกำกวม / ไม่สมบูรณ์', '4 ที่ ซึ่ง อัน', '5 คำฟุ่มเฟือย'] } },
    { say: 'คำที่มักเขียนผิด จำรูปที่ถูกให้แม่น: <b>สังเกต</b> (ไม่ใช่ สังเกตุ), <b>ปรากฏ</b> (ไม่ใช่ ปรากฎ), <b>อนุญาต</b> (ไม่ใช่ อนุญาติ), <b>ลายเซ็น</b> (ไม่ใช่ ลายเซ็นต์), <b>ประสบการณ์</b> (ไม่ใช่ ประสพการณ์)', fig: { t: 'formula', lines: ['สังเกต  ปรากฏ  อนุญาต', 'ลายเซ็น  ประสบการณ์'] } },
    { say: '<b>เป็นต้น</b> ใช้ท้ายตัวอย่างที่ยกมาบางส่วน เช่น "ผลไม้ เช่น ส้ม องุ่น เป็นต้น" ส่วน <b>ฯลฯ</b> อ่านว่า ละ-ละ-ละ แปลว่า "และอื่น ๆ" ใช้ท้ายรายการที่ยังมีอีก ไม่ควรใช้สองคำนี้ซ้อนกัน ส่วน <b>อนึ่ง</b> ใช้เชื่อมความเพิ่มเติมในภาษาเขียนทางการ', fig: { t: 'formula', lines: ['ตัวอย่างบางส่วน → ... เป็นต้น', 'และอื่น ๆ → ... ฯลฯ', 'อนึ่ง = อีกประการหนึ่ง'] } },
    { say: 'ประโยคกำกวมคือประโยคที่ตีความได้สองทาง เช่น "เขาชอบแมวมากกว่าฉัน" แก้เป็น "เขาชอบแมวมากกว่าที่ฉันชอบ" ส่วนประโยคไม่สมบูรณ์ เช่น "สำหรับนักเรียนที่ตั้งใจเรียนเป็นสิ่งสำคัญ" ขาดประธาน แก้เป็น "การตั้งใจเรียนเป็นสิ่งสำคัญ"', fig: { t: 'emojis', rows: [['❓', 1, 'กำกวม: ตีความได้สองแบบ'], ['✅', 1, 'แก้: เติมคำให้ความชัดเจน']] } },
    { say: '<b>ที่</b> ใช้ทั่วไป เช่น "หนังสือที่ฉันอ่าน" <b>ซึ่ง</b> เติมข้อมูลเพิ่ม มักใช้ในภาษาเขียน เช่น "ครูซึ่งสอนไทยเป็นคนใจดี" ส่วน <b>อัน</b> ใช้นำหน้าข้อความที่ขยายนามธรรม เช่น "ความสุขอันยิ่งใหญ่" "ความดีอันน่ายกย่อง"', fig: { t: 'formula', lines: ['ที่  → ใช้ทั่วไป', 'ซึ่ง → ขยายเพิ่ม ภาษาเขียน', 'อัน → ขยายนามธรรม (ความสุขอัน...)'] } },
    { say: '<b>คำฟุ่มเฟือย</b> คือคำที่ไม่จำเป็น เช่น "ได้ทำการตรวจสอบ" เขียนว่า "ตรวจสอบ" พอ, "ขึ้นไปข้างบน" ก็แค่ "ขึ้น" นอกจากนี้ใช้ "ถูก" กับเรื่องไม่ดี เช่น ถูกลงโทษ ส่วนเรื่องดีควรใช้ "ได้รับ" เช่น ได้รับการยกย่อง', fig: { t: 'formula', lines: ['ได้ทำการตรวจสอบ → ตรวจสอบ', 'ขึ้นไปข้างบน → ขึ้น', 'ถูกยกย่อง → ได้รับการยกย่อง'] } }
  ] },
  { id: 'ls_thwrite4', level: 'm4', subject: 'th', gen: 'th4_read', icon: '📝', title: 'โวหาร 5 แบบและโครงเรียงความ', blurb: 'แยกโวหารให้ออก วางโครงเรื่อง เขียนย่อหน้า และสรุปใจความ', pages: [
    { say: '<b>โวหาร</b> คือวิธีเขียนให้ได้อารมณ์ตามจุดประสงค์ มี 5 แบบ: <b>บรรยาย พรรณนา เทศนา สาธก อุปมาอุปไมย</b> จำง่าย ๆ ว่า "เล่า ชม สอน ยกเรื่อง เปรียบ" ลองดูตัวอย่างทีละแบบ', fig: { t: 'formula', lines: ['บรรยาย = เล่าตามลำดับ', 'พรรณนา = เห็นภาพ มีอารมณ์', 'เทศนา = สอน ชักจูง', 'สาธก = ยกตัวอย่างเรื่อง', 'อุปมาอุปไมย = เปรียบเทียบ'] } },
    { say: '<b>บรรยาย</b> เล่าเหตุการณ์ตามลำดับ เช่น "เช้านี้ฉันตื่นหกโมง อาบน้ำ กินข้าว แล้วเดินไปโรงเรียน" ส่วน <b>พรรณนา</b> เน้นให้เห็นภาพและรู้สึก เช่น "ท้องฟ้าสีส้มทองสาดแสงอ่อน ๆ ลมเย็นพัดโชยกลิ่นดอกไม้หอมชื่นใจ"', fig: { t: 'emojis', rows: [['⏰', 1, 'บรรยาย: เล่าเป็นลำดับ'], ['🌅', 1, 'พรรณนา: ทำให้เห็นภาพ']] } },
    { say: '<b>เทศนา</b> คือสั่งสอนชักจูงให้ทำดี มีเหตุผลรองรับ เช่น "เราควรขยันเรียนตั้งแต่วันนี้ เพราะเวลาที่ผ่านไปแล้วไม่หวนกลับ" ส่วน <b>สาธก</b> ยกเรื่องมาประกอบ เช่น "ความเพียรสำคัญ ดังเรื่องเต่ากับกระต่าย เต่าชนะเพราะไม่หยุดเดิน"', fig: { t: 'emojis', rows: [['📣', 1, 'เทศนา: สอน มีเหตุผล'], ['🐢', 1, 'สาธก: ยกเรื่องมาเป็นตัวอย่าง']] } },
    { say: '<b>อุปมาอุปไมย</b> คือเปรียบเทียบของสองอย่างให้เข้าใจง่าย เช่น "ความรู้เหมือนแสงสว่างที่นำทางในความมืด" สังเกตว่ามีการเปรียบ ต่างจากสาธกที่ยกเรื่องหรือเหตุการณ์จริงมาเล่าเป็นตัวอย่าง', fig: { t: 'formula', lines: ['เปรียบ → อุปมาอุปไมย', 'ยกเรื่องมาเล่า → สาธก'] } },
    { say: 'เรียงความมี 3 ส่วน: <b>คำนำ</b> เกริ่นให้น่าอ่านและบอกประเด็น, <b>เนื้อเรื่อง</b> อธิบายพร้อมเหตุผลและตัวอย่าง แยกเป็นหลายย่อหน้าตามประเด็น, <b>สรุป</b> ย้ำใจความและให้ข้อคิด ห้ามเอาประเด็นใหม่มาใส่ในสรุป', fig: { t: 'formula', lines: ['คำนำ → เกริ่น บอกประเด็น', 'เนื้อเรื่อง → อธิบาย ตัวอย่าง', 'สรุป → ย้ำใจความ ข้อคิด'] } },
    { say: '1 ย่อหน้า มี 1 ใจความสำคัญ มี<b>ประโยคใจความ</b> 1 ประโยค แล้วตามด้วยประโยคขยายที่ให้เหตุผลหรือตัวอย่าง เวลา<b>สรุปความ</b> ให้อ่านทั้งหมด ขีดใจความ ตัดตัวอย่างและรายละเอียดทิ้ง แล้วเขียนใหม่ด้วยคำของตัวเองให้สั้นแต่ครบ', fig: { t: 'formula', lines: ['1 ย่อหน้า = 1 ใจความ', 'ประโยคใจความ + ประโยคขยาย', 'สรุป = ตัดตัวอย่าง เก็บใจความ'] } }
  ] },
