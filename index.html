  { id: 'ls_lin2', level: 'm4', subject: 'math', gen: 'lin2', icon: '⚖️', title: 'สมการมี x ทั้งสองข้าง', blurb: 'ย้ายข้างสมการเชิงเส้น', pages: [
    { say: 'สมการ <b>5x − 7 = 2x + 11</b> มีตัวแปรอยู่ทั้งสองข้าง ต้องรวม x ให้อยู่ข้างเดียวกันก่อน', fig: { t: 'formula', lines: ['5x − 7 = 2x + 11'] } },
    { say: 'ขั้นแรก ลบ 2x ออกทั้งสองข้าง (ย้าย x มาข้างซ้าย): 5x − 2x − 7 = 11 → <b>3x − 7 = 11</b>', fig: { t: 'formula', lines: ['5x − 2x − 7 = 11', '3x − 7 = 11'] } },
    { say: 'ขั้นสอง บวก 7 ทั้งสองข้าง → 3x = 18 แล้วหารด้วย 3 → <b>x = 6</b>', fig: { t: 'formula', lines: ['3x = 18', 'x = 6'] } },
    { say: 'ตรวจ: ซ้าย 5(6) − 7 = 23 · ขวา 2(6) + 11 = 23 เท่ากัน ✓ <b>ย้ายข้างแล้วเครื่องหมายสลับ</b> (บวกเป็นลบ ลบเป็นบวก)', fig: { t: 'formula', lines: ['ซ้าย 30 − 7 = 23', 'ขวา 12 + 11 = 23 ✓'] } },
    { say: 'ลำดับคิด: <b>1)</b> ย้ายตัวแปรมาข้างเดียว <b>2)</b> ย้ายตัวเลขไปอีกข้าง <b>3)</b> หารด้วยสัมประสิทธิ์ <b>4)</b> แทนค่าตรวจ ตอบเป็นลบหรือเศษส่วนได้', fig: { t: 'formula', lines: ['1) x มาข้างเดียวกัน', '2) ตัวเลขไปอีกข้าง', '3) หารสัมประสิทธิ์', '4) ตรวจ'] } }
  ] },
  { id: 'ls_twoitems', level: 'm4', subject: 'math', gen: 'two_items', icon: '🧾', title: 'ขายสองชิ้น กำไรหรือขาดทุน', blurb: 'กำไร-ขาดทุนเมื่อราคาขายเท่ากัน', pages: [
    { say: 'พ่อค้าขายของ 2 ชิ้น ชิ้นละ <b>600 บาท</b> เท่ากัน ชิ้นแรก <b>กำไร 20%</b> ชิ้นที่สอง <b>ขาดทุน 20%</b> โดยรวมได้กำไรหรือขาดทุน? หลายคนตอบว่า "เท่าทุน" ซึ่งผิด', fig: { t: 'formula', lines: ['ขายชิ้นละ 600', 'ชิ้น 1 กำไร 20%', 'ชิ้น 2 ขาดทุน 20%'] } },
    { say: 'ร้อยละคิดจาก <b>ต้นทุน</b> ไม่ใช่ราคาขาย ชิ้นแรก ขาย = ต้นทุน × 1.2 → ต้นทุน = 600 ÷ 1.2 = <b>500 บาท</b>', fig: { t: 'formula', lines: ['ต้นทุน × 1.2 = 600', 'ต้นทุน = 500'] } },
    { say: 'ชิ้นที่สอง ขาย = ต้นทุน × 0.8 → ต้นทุน = 600 ÷ 0.8 = <b>750 บาท</b>', fig: { t: 'formula', lines: ['ต้นทุน × 0.8 = 600', 'ต้นทุน = 750'] } },
    { say: 'ต้นทุนรวม 500 + 750 = <b>1,250</b> · รายรับรวม 600 + 600 = <b>1,200</b> → <b>ขาดทุน 50 บาท</b>', fig: { t: 'formula', lines: ['ต้นทุน 1,250', 'รายรับ 1,200', 'ขาดทุน 50 บาท'] } },
    { say: 'ที่เป็นเช่นนี้เพราะขาดทุน 20% ต้นทุนสูงกว่า (750) จึงเสียมากกว่ากำไรที่ได้ (100) · ถ้าขายราคาเท่ากันและกำไร/ขาดทุนร้อยละเท่ากัน <b>จะขาดทุนเสมอ</b>', fig: { t: 'formula', lines: ['กำไรชิ้น 1 = 100', 'ขาดทุนชิ้น 2 = 150', 'สุทธิ −50'] } }
  ] },
  { id: 'ls_quadword', level: 'm4', subject: 'math', gen: 'quad_word', icon: '📐', title: 'โจทย์สมการกำลังสองจากเรื่องจริง', blurb: 'แปลงโจทย์เป็นสมการกำลังสอง', pages: [
    { say: 'สวนสี่เหลี่ยมผืนผ้ายาวกว่ากว้าง <b>3 เมตร</b> มีพื้นที่ <b>40 ตร.ม.</b> กว้างกี่เมตร? แปลงเรื่องเป็นสมการกำลังสอง', fig: { t: 'formula', lines: ['กว้าง = w', 'ยาว = w + 3', 'พื้นที่ = 40'] } },
    { say: 'พื้นที่ = กว้าง × ยาว → <b>w(w + 3) = 40</b> กระจาย: w² + 3w = 40 ย้ายข้างให้ขวาเป็น 0 → <b>w² + 3w − 40 = 0</b>', fig: { t: 'formula', lines: ['w(w + 3) = 40', 'w² + 3w − 40 = 0'] } },
    { say: 'แยกตัวประกอบ: หาเลขสองตัวคูณ −40 บวก +3 → <b>+8 กับ −5</b> ได้ (w + 8)(w − 5) = 0 → w = −8 หรือ w = 5', fig: { t: 'formula', lines: ['(w + 8)(w − 5) = 0', 'w = −8 หรือ w = 5'] } },
    { say: '<b>ตัดคำตอบที่ไม่สมเหตุสมผล</b> ความกว้างติดลบไม่ได้ จึงเหลือ <b>w = 5 เมตร</b> ยาว 5 + 3 = 8 เมตร ตรวจ 5 × 8 = 40 ✓', fig: { t: 'formula', lines: ['w = −8 ✗ (ความยาวติดลบไม่ได้)', 'w = 5 ✓ ยาว 8 · 5 × 8 = 40'] } },
    { say: 'ขั้นตอน: <b>1)</b> ตั้งตัวแปร <b>2)</b> เขียนสมการจากเงื่อนไข <b>3)</b> จัดรูป = 0 และแยกตัวประกอบ <b>4)</b> ตัดคำตอบที่เป็นไปไม่ได้ <b>5)</b> ตรวจกับโจทย์', fig: { t: 'formula', lines: ['ตั้งตัวแปร → สมการ → แยก', '→ ตัดคำตอบที่ไม่ได้ → ตรวจ'] } }
  ] },
  { id: 'ls_expeq', level: 'm4', subject: 'math', gen: 'exp_eq', icon: '🔢', title: 'สมการเลขชี้กำลัง', blurb: 'ทำฐานให้เท่ากัน', pages: [
    { say: 'สมการ <b>2^(x+1) = 32</b> มี x อยู่ที่เลขชี้กำลัง วิธีแก้คือทำ <b>ฐานทั้งสองข้างให้เท่ากัน</b> แล้วเทียบเลขชี้กำลัง', fig: { t: 'formula', lines: ['2^(x+1) = 32'] } },
    { say: 'เขียน 32 เป็นฐาน 2: 32 = 2×2×2×2×2 = <b>2⁵</b> จึงได้ 2^(x+1) = 2⁵', fig: { t: 'formula', lines: ['32 = 2⁵', '2^(x+1) = 2⁵'] } },
    { say: 'ฐานเท่ากันแล้ว <b>เลขชี้กำลังต้องเท่ากัน</b>: x + 1 = 5 → <b>x = 4</b> ตรวจ 2⁵ = 32 ✓', fig: { t: 'formula', lines: ['x + 1 = 5', 'x = 4'] } },
    { say: 'ตัวอย่าง 3^(2x) = 81: 81 = 3⁴ → 2x = 4 → <b>x = 2</b> ตรวจ 3⁴ = 81 ✓ ต้องรู้เลขยกกำลังที่ใช้บ่อย เช่น 2⁵ = 32, 2⁶ = 64, 3⁴ = 81, 5³ = 125', fig: { t: 'formula', lines: ['3^(2x) = 3⁴', '2x = 4 → x = 2', '2⁶=64 · 5³=125'] } },
    { say: 'ระวัง: เทียบเลขชี้กำลังได้ต่อเมื่อ <b>ฐานเท่ากันและไม่ใช่ 1 หรือ 0</b> ถ้าฐานต่างกัน (เช่น 4 กับ 8) ให้แปลงเป็นฐานร่วม เช่น 4 = 2², 8 = 2³', fig: { t: 'formula', lines: ['4 = 2²   8 = 2³', 'แปลงเป็นฐานร่วมก่อนเทียบ'] } }
  ] },
  { id: 'ls_vieta', level: 'm4', subject: 'math', gen: 'vieta', icon: '➕', title: 'ผลบวกและผลคูณของราก', blurb: 'หาค่าโดยไม่ต้องแก้สมการ', pages: [
    { say: 'สมการ x² − 7x + 10 = 0 มีรากสองค่า α กับ β ถ้าอยากรู้ <b>α² + β²</b> ไม่ต้องหารากก็ได้ ถ้ารู้ <b>ผลบวก</b> และ <b>ผลคูณ</b> ของราก', fig: { t: 'formula', lines: ['x² − 7x + 10 = 0', 'α² + β² = ?'] } },
    { say: 'สำหรับ <b>x² + bx + c = 0</b>: ผลบวกราก <b>α + β = −b</b> · ผลคูณราก <b>αβ = c</b> ในที่นี้ b = −7, c = 10 → α + β = 7, αβ = 10', fig: { t: 'formula', lines: ['α + β = −b = 7', 'αβ = c = 10'] } },
    { say: 'ใช้สูตรลัด <b>α² + β² = (α + β)² − 2αβ</b> = 7² − 2(10) = 49 − 20 = <b>29</b>', fig: { t: 'formula', lines: ['α² + β² = (α+β)² − 2αβ', '= 49 − 20 = 29'] } },
    { say: 'ตรวจโดยหาราก: (x − 2)(x − 5) = 0 → α = 2, β = 5 → 4 + 25 = <b>29</b> ✓ และ 1/α + 1/β = (α + β) ÷ αβ = 7/10 (ตรวจ 1/2 + 1/5 = 7/10 ✓)', fig: { t: 'formula', lines: ['รากคือ 2 และ 5', '4 + 25 = 29 ✓', '1/α + 1/β = 7/10'] } },
    { say: 'ระวังเครื่องหมาย: ผลบวกราก = <b>−b</b> (ตรงข้ามกับตัวกลางในสมการ) ผลคูณ = c ตรง ๆ และต้องจัดสมการให้ x² มีสัมประสิทธิ์ 1 ก่อน', fig: { t: 'formula', lines: ['ผลบวก = −b (สลับเครื่องหมาย)', 'ผลคูณ = c', 'x² ต้องมีสัมประสิทธิ์ 1'] } }
  ] },
  { id: 'ls_abseq', level: 'm4', subject: 'math', gen: 'abs_eq', icon: '↔️', title: 'ค่าสัมบูรณ์คือระยะห่างจากศูนย์', blurb: 'สมการค่าสัมบูรณ์', pages: [
    { say: '<b>ค่าสัมบูรณ์</b> |a| คือ <b>ระยะห่างจาก 0</b> บนเส้นจำนวน จึงไม่เป็นลบเสมอ เช่น |5| = 5 และ |−5| = 5', fig: { t: 'formula', lines: ['|5| = 5', '|−5| = 5', '|0| = 0'] } },
    { say: 'สมการ <b>|x − 3| = 5</b> หมายถึง x ห่างจาก 3 เป็นระยะ 5 ซึ่งทำได้ <b>สองทาง</b> คือ x − 3 = 5 หรือ x − 3 = −5', fig: { t: 'formula', lines: ['|x − 3| = 5', 'x − 3 = 5  หรือ  x − 3 = −5'] } },
    { say: 'แก้ทั้งสองกรณี: x = 5 + 3 = <b>8</b> หรือ x = −5 + 3 = <b>−2</b> ตรวจ |8 − 3| = 5 ✓ และ |−2 − 3| = |−5| = 5 ✓', fig: { t: 'formula', lines: ['x = 8', 'x = −2'] } },
    { say: 'ตัวอย่าง |2x + 1| = 7: 2x + 1 = 7 → x = 3 หรือ 2x + 1 = −7 → x = −4 ตรวจ |7| = 7 ✓ · |−7| = 7 ✓', fig: { t: 'formula', lines: ['2x + 1 = 7 → x = 3', '2x + 1 = −7 → x = −4'] } },
    { say: 'ระวัง: ถ้า |x − 3| = <b>−5</b> จะ <b>ไม่มีคำตอบ</b> เพราะค่าสัมบูรณ์ไม่ติดลบ · และอย่าลืมกรณีที่สอง (ติดลบ) ซึ่งเป็นจุดที่หลายคนลืม', fig: { t: 'formula', lines: ['|…| = ลบ → ไม่มีคำตอบ', 'ต้องแก้ทั้ง + และ − เสมอ'] } }
  ] },
  { id: 'ls_quadmin', level: 'm4', subject: 'math', gen: 'quad_min', icon: '⛰️', title: 'จุดต่ำสุดของพาราโบลา', blurb: 'กำลังสองสมบูรณ์และค่าต่ำสุด', pages: [
    { say: 'ฟังก์ชัน <b>y = x² − 6x + 11</b> วาดเป็นพาราโบลาหงาย มี <b>จุดต่ำสุด</b> หนึ่งจุด เราจะหาค่าต่ำสุดของ y โดยไม่ต้องลองแทนค่าทีละตัว', fig: { t: 'formula', lines: ['y = x² − 6x + 11', 'ค่าต่ำสุด = ?'] } },
    { say: 'ใช้วิธี <b>กำลังสองสมบูรณ์</b>: เอาครึ่งหนึ่งของ −6 คือ −3 มายกกำลังสอง → x² − 6x + 9 = (x − 3)² ดังนั้น x² − 6x + 11 = (x − 3)² + 2', fig: { t: 'formula', lines: ['x² − 6x + 9 = (x − 3)²', 'y = (x − 3)² + 2'] } },
    { say: '(x − 3)² ไม่มีวันติดลบ ต่ำสุดคือ <b>0</b> เมื่อ x = 3 ดังนั้น y ต่ำสุด = 0 + 2 = <b>2</b> ที่ x = 3', fig: { t: 'formula', lines: ['(x − 3)² ≥ 0', 'ต่ำสุดเมื่อ x = 3', 'y ต่ำสุด = 2'] } },
    { say: 'ตรวจ: แทน x = 3 → 9 − 18 + 11 = <b>2</b> ✓ ลองแทน x = 2 → 4 − 12 + 11 = 3 และ x = 4 → 16 − 24 + 11 = 3 ซึ่งมากกว่า 2 ทั้งคู่', fig: { t: 'formula', lines: ['x=2 → 3', 'x=3 → 2  (ต่ำสุด)', 'x=4 → 3'] } },
    { say: 'สรุป: y = x² − 2px + c → y = (x − p)² + (c − p²) ค่าต่ำสุด = <b>c − p²</b> ที่ x = p เช่น −6x → p = 3, c = 11 → 11 − 9 = 2 ✓', fig: { t: 'formula', lines: ['x² − 2px + c', '= (x − p)² + (c − p²)', 'ต่ำสุด = c − p²'] } }
  ] },
  { id: 'ls_permadj', level: 'm4', subject: 'math', gen: 'perm_adj', icon: '🧍', title: 'ยืนเรียงแถวให้เพื่อนสองคนติดกัน', blurb: 'การเรียงสับเปลี่ยนแบบติดกัน', pages: [
    { say: 'เด็ก 5 คนยืนเรียงแถว โดย <b>ก. กับ ข. ต้องยืนติดกัน</b> มีวิธีเรียงกี่แบบ? เริ่มจากรู้ก่อนว่า เรียงคน n คน ได้ <b>n!</b> วิธี', fig: { t: 'formula', lines: ['n คนเรียงแถว = n!', '3! = 3×2×1 = 6', '4! = 24 · 5! = 120'] } },
    { say: 'ทริค <b>มัดคู่ที่ต้องติดกันเป็นก้อนเดียว</b> ก. + ข. = 1 ก้อน เท่ากับมี 4 หน่วย (ก้อน + อีก 3 คน) เรียงได้ <b>4! = 24</b> วิธี', fig: { t: 'formula', lines: ['[กข] ค ง จ', '4 หน่วย → 4! = 24 วิธี'] } },
    { say: 'แต่ในก้อน <b>ก. ข. สลับที่กันได้</b> (กข หรือ ขก) อีก <b>2 วิธี</b> ต้องคูณเข้าไป', fig: { t: 'formula', lines: ['ภายในก้อน: กข, ขก', '= 2 วิธี'] } },
    { say: 'รวม <b>4! × 2 = 24 × 2 = 48 วิธี</b> สูตรทั่วไป: เรียง n คน ให้ 2 คนติดกัน = (n − 1)! × 2 เช่น 4 คน → 3! × 2 = 12', fig: { t: 'formula', lines: ['(n − 1)! × 2', 'n = 5 → 24 × 2 = 48', 'n = 4 → 6 × 2 = 12'] } },
    { say: 'ตรวจกับตัวเล็ก: 3 คน (ก ข ค) ให้ ก ข ติดกัน → กขค, ขกค, ค กข, ค ขก = 4 วิธี = (3−1)!×2 = 4 ✓ ถ้าโจทย์ให้ <b>ไม่ติดกัน</b> ให้ใช้ n! − (วิธีที่ติดกัน)', fig: { t: 'formula', lines: ['3 คน: กขค ขกค คกข คขก = 4 ✓', 'ไม่ติดกัน = n! − ติดกัน', '5! − 48 = 72'] } }
  ] },
  { id: 'ls_seqsq', level: 'm1', subject: 'math', gen: 'seq_square', icon: '🟦', title: 'แบบรูปที่เป็นกำลังสอง', blurb: 'พจน์ที่ n = n² + ค่าคงที่', pages: [
    { say: 'แบบรูป <b>2, 5, 10, 17, …</b> ผลต่างไม่เท่ากัน (3, 5, 7) จึงไม่ใช่แบบรูปที่บวกเท่ากันทุกครั้ง ลองเทียบกับ <b>จำนวนกำลังสอง</b> 1, 4, 9, 16', fig: { t: 'formula', lines: ['แบบรูป: 2, 5, 10, 17', 'กำลังสอง: 1, 4, 9, 16'] } },
    { say: 'เทียบทีละพจน์: 2 − 1 = 1 · 5 − 4 = 1 · 10 − 9 = 1 · 17 − 16 = 1 ทุกพจน์ <b>มากกว่ากำลังสองอยู่ 1</b>', fig: { t: 'formula', lines: ['2 = 1² + 1', '5 = 2² + 1', '10 = 3² + 1', '17 = 4² + 1'] } },
    { say: 'ได้กฎ <b>พจน์ที่ n = n² + 1</b> พจน์ที่ 10 = 10² + 1 = <b>101</b> · พจน์ที่ 20 = 400 + 1 = <b>401</b>', fig: { t: 'formula', lines: ['พจน์ที่ n = n² + 1', 'n = 10 → 101', 'n = 20 → 401'] } },
    { say: 'ถ้าแบบรูปเป็น 0, 3, 8, 15, … เทียบกับ 1, 4, 9, 16 จะ <b>น้อยกว่าอยู่ 1</b> ทุกพจน์ → พจน์ที่ n = <b>n² − 1</b>', fig: { t: 'formula', lines: ['0, 3, 8, 15', '= 1²−1, 2²−1, 3²−1, 4²−1', 'พจน์ที่ n = n² − 1'] } },
    { say: 'เคล็ด: ถ้าผลต่างระหว่างพจน์ <b>เพิ่มขึ้นเรื่อย ๆ</b> (3, 5, 7, ...) ให้ลองเทียบกับ n² · ถ้าผลต่าง <b>เท่ากัน</b> ใช้สูตรบวกทีละเท่า ตรวจกฎกับพจน์แรกเสมอ', fig: { t: 'formula', lines: ['ผลต่างเท่ากัน → พจน์แรก + (n−1)d', 'ผลต่างเพิ่มขึ้น → ลองเทียบ n²'] } }
  ] },
  { id: 'ls_lastdig', level: 'm1', subject: 'math', gen: 'last_digit', icon: '🔚', title: 'เลขหลักหน่วยของเลขยกกำลัง', blurb: 'วัฏจักรของเลขหลักหน่วย', pages: [
    { say: '7⁵⁰ คือ 7 คูณกัน 50 ตัว คำนวณตรง ๆ ไม่ไหว แต่ถ้าถามแค่ <b>เลขหลักหน่วย</b> มีทางลัด เพราะเลขหลักหน่วยจะ <b>วนซ้ำเป็นรอบ</b>', fig: { t: 'formula', lines: ['7⁵⁰ หลักหน่วย = ?'] } },
    { say: 'ไล่หลักหน่วยของ 7: 7¹ = <b>7</b> · 7² = 49 → <b>9</b> · 7³ = 343 → <b>3</b> · 7⁴ = 2401 → <b>1</b> · 7⁵ → <b>7</b> (วนกลับ)', fig: { t: 'formula', lines: ['7¹ → 7', '7² → 9', '7³ → 3', '7⁴ → 1', '7⁵ → 7 (วนซ้ำ)'] } },
    { say: 'วัฏจักรของ 7 คือ <b>7, 9, 3, 1</b> มี <b>4 ตัว</b> ดังนั้นให้หาเศษของเลขชี้กำลัง ÷ 4 · 50 ÷ 4 เหลือเศษ 2', fig: { t: 'formula', lines: ['รอบ 4 ตัว: 7, 9, 3, 1', '50 ÷ 4 = 12 เศษ 2'] } },
    { say: 'เศษ 2 หมายถึงตัว <b>ที่ 2</b> ในรอบ = <b>9</b> → 7⁵⁰ ลงท้ายด้วย <b>9</b> ถ้าเศษ <b>0</b> ให้ใช้ตัว <b>สุดท้าย</b> ของรอบ (ตัวที่ 4)', fig: { t: 'formula', lines: ['เศษ 1 → ตัวที่ 1', 'เศษ 2 → ตัวที่ 2 = 9', 'เศษ 0 → ตัวสุดท้ายของรอบ'] } },
    { say: 'อีกตัวอย่าง 2²³: รอบของ 2 คือ 2, 4, 8, 6 (4 ตัว) · 23 ÷ 4 เศษ 3 → ตัวที่ 3 = <b>8</b> · ฐานที่ลงท้าย 0, 1, 5, 6 หลักหน่วยไม่เปลี่ยน (รอบ 1 ตัว)', fig: { t: 'formula', lines: ['2: 2, 4, 8, 6', '23 ÷ 4 เศษ 3 → 8', 'ฐาน 0,1,5,6 → ไม่เปลี่ยน'] } }
  ] },
  { id: 'ls_ratiochg', level: 'm1', subject: 'math', gen: 'ratio_change', icon: '🔀', title: 'อัตราส่วนเปลี่ยนไปหลังให้เงิน', blurb: 'ผลรวมคงที่ ส่วนเปลี่ยน', pages: [
    { say: 'ก. กับ ข. มีเงินอัตราส่วน <b>5 : 3</b> ก. ให้เงิน ข. <b>20 บาท</b> อัตราส่วนเปลี่ยนเป็น <b>3 : 5</b> เดิมแต่ละคนมีเท่าไร?', fig: { t: 'bars', rows: [{ parts: 8, shade: 5, label: 'ก. 5 ส่วน' }, { parts: 8, shade: 3, label: 'ข. 3 ส่วน' }] } },
    { say: 'หัวใจคือ <b>เงินรวมไม่เปลี่ยน</b> (แค่ย้ายจาก ก. ไป ข.) ก่อนให้รวม 5 + 3 = 8 ส่วน หลังให้ 3 + 5 = 8 ส่วน เท่ากันพอดี', fig: { t: 'formula', lines: ['ก่อน 5 : 3 → รวม 8 ส่วน', 'หลัง 3 : 5 → รวม 8 ส่วน'] } },
    { say: 'ก. เปลี่ยนจาก <b>5 ส่วน เหลือ 3 ส่วน</b> หายไป 2 ส่วน ซึ่งคือเงิน <b>20 บาท</b> ดังนั้น 1 ส่วน = 20 ÷ 2 = <b>10 บาท</b>', fig: { t: 'formula', lines: ['5 − 3 = 2 ส่วน = 20 บาท', '1 ส่วน = 10 บาท'] } },
    { say: 'เดิม ก. มี 5 × 10 = <b>50 บาท</b> ข. มี 3 × 10 = <b>30 บาท</b> ตรวจ: ก. 50 − 20 = 30 · ข. 30 + 20 = 50 → 30 : 50 = 3 : 5 ✓', fig: { t: 'formula', lines: ['ก. 50 · ข. 30', 'หลัง ก. 30 · ข. 50', '30 : 50 = 3 : 5 ✓'] } },
    { say: 'ข้อควรระวัง: ถ้า <b>ทั้งสองคนได้เพิ่มเท่ากัน</b> หรือใช้ไปเท่ากัน ผลรวมจะเปลี่ยน ต้องเทียบส่วนที่ <b>คงที่</b> (บางทีคือผลต่าง หรือส่วนของคนที่ไม่เปลี่ยน) ก่อนปรับส่วนให้เท่ากัน', fig: { t: 'formula', lines: ['หาว่าอะไรคงที่', 'ผลรวม หรือ ผลต่าง หรือของคนใดคนหนึ่ง'] } }
  ] },
  { id: 'ls_linbr', level: 'm1', subject: 'math', gen: 'lin_bracket', icon: '🔣', title: 'สมการที่มีวงเล็บ', blurb: 'กระจายวงเล็บก่อนแก้สมการ', pages: [
    { say: 'สมการ <b>3(x − 2) = 2x + 5</b> มีวงเล็บ ต้อง <b>กระจายวงเล็บ</b> ก่อน แล้วค่อยแก้เหมือนสมการปกติ', fig: { t: 'formula', lines: ['3(x − 2) = 2x + 5'] } },
    { say: 'กระจาย: เอา 3 คูณ <b>ทุกตัว</b> ในวงเล็บ → 3 × x = 3x · 3 × (−2) = <b>−6</b> ได้ <b>3x − 6 = 2x + 5</b>', fig: { t: 'formula', lines: ['3(x − 2) = 3x − 6', '3x − 6 = 2x + 5'] } },
    { say: 'ย้าย x มาข้างเดียว: 3x − 2x = 5 + 6 → <b>x = 11</b>', fig: { t: 'formula', lines: ['3x − 2x = 5 + 6', 'x = 11'] } },
    { say: 'ตรวจ: ซ้าย 3(11 − 2) = 3 × 9 = <b>27</b> · ขวา 2(11) + 5 = <b>27</b> เท่ากัน ✓', fig: { t: 'formula', lines: ['ซ้าย 3 × 9 = 27', 'ขวา 22 + 5 = 27 ✓'] } },
    { say: 'จุดพลาดที่พบบ่อย: <b>คูณไม่ครบทุกตัว</b> (ลืม −2) และ <b>เครื่องหมายหน้าวงเล็บ</b> เช่น −2(x + 3) = −2x − 6 (ลบคูณบวก = ลบ) ไม่ใช่ −2x + 6', fig: { t: 'formula', lines: ['−2(x + 3) = −2x − 6', '−2(x − 3) = −2x + 6'] } }
  ] },
  { id: 'ls_intops', level: 'm1', subject: 'math', gen: 'int_ops', icon: '➖', title: 'บวก ลบ คูณ หาร จำนวนเต็ม', blurb: 'จำนวนเต็มบวก ลบ และลำดับการคำนวณ', pages: [
    { say: 'จำนวนเต็มมี <b>บวก ลบ และศูนย์</b> ก่อนคิดต้องรู้เครื่องหมายผลลัพธ์ของการ <b>คูณและหาร</b>: ต่างเครื่องหมาย ได้ <b>ลบ</b> · เครื่องหมายเดียวกัน ได้ <b>บวก</b>', fig: { t: 'formula', lines: ['(+) × (−) = −', '(−) × (−) = +', '(−) ÷ (−) = +'] } },
    { say: 'ตัวอย่าง (−3) × 4 = <b>−12</b> · (−3) × (−5) = <b>15</b> · (−12) ÷ 3 = <b>−4</b> · (−12) ÷ (−6) = <b>2</b>', fig: { t: 'formula', lines: ['(−3) × 4 = −12', '(−3) × (−5) = 15', '(−12) ÷ (−6) = 2'] } },
    { say: '<b>ลำดับการคำนวณ:</b> วงเล็บ → คูณ/หาร (ซ้ายไปขวา) → บวก/ลบ ข้อ (−3) × 4 + 12 ÷ (−6) ทำ <b>คูณและหารก่อน</b>', fig: { t: 'formula', lines: ['(−3) × 4 + 12 ÷ (−6)', 'คูณหารก่อน, บวกลบทีหลัง'] } },
    { say: 'คิดแต่ละส่วน: (−3) × 4 = −12 และ 12 ÷ (−6) = −2 แล้วบวก: −12 + (−2) = <b>−14</b>', fig: { t: 'formula', lines: ['−12 + (−2) = −14'] } },
    { say: 'การลบจำนวนลบ: <b>a − (−b) = a + b</b> เช่น 5 − (−3) = 8 · บวกจำนวนลบ = ลบ เช่น 5 + (−3) = 2 ตรวจด้วยเส้นจำนวนถ้าไม่แน่ใจ', fig: { t: 'formula', lines: ['5 − (−3) = 8', '5 + (−3) = 2'] } }
  ] },
  { id: 'ls_powsimp', level: 'm4', subject: 'math', gen: 'pow_simplify', icon: '⚡', title: 'ทำเลขยกกำลังให้ง่ายขึ้น', blurb: 'กฎเลขยกกำลังแบบรวม', pages: [
    { say: 'จัดรูป <b>(2²)³ ÷ 2⁴</b> ให้เป็นเลขยกกำลังเดียว ใช้กฎเลขชี้กำลัง 2 ข้อมารวมกัน', fig: { t: 'formula', lines: ['(2²)³ ÷ 2⁴ = ?'] } },
    { say: 'กฎที่ 1 <b>ยกกำลังซ้อน → คูณเลขชี้กำลัง</b>: (2²)³ = 2^(2×3) = <b>2⁶</b>', fig: { t: 'formula', lines: ['(aᵐ)ⁿ = aᵐⁿ', '(2²)³ = 2⁶'] } },
    { say: 'กฎที่ 2 <b>หารฐานเดียวกัน → ลบเลขชี้กำลัง</b>: 2⁶ ÷ 2⁴ = 2^(6−4) = <b>2²</b> = 4', fig: { t: 'formula', lines: ['aᵐ ÷ aⁿ = aᵐ⁻ⁿ', '2⁶ ÷ 2⁴ = 2² = 4'] } },
    { say: 'เลขชี้กำลังติดลบ: <b>a⁻ⁿ = 1 ÷ aⁿ</b> เช่น 5⁻² = 1/25 · 2⁻³ = 1/8 เลขชี้กำลังลบ ไม่ได้ทำให้ค่าติดลบ แต่กลับเป็นเศษส่วน', fig: { t: 'formula', lines: ['a⁻ⁿ = 1 ÷ aⁿ', '5⁻² = 1/25', '2⁻³ = 1/8'] } },
    { say: 'ลำดับ: <b>1)</b> ทำฐานเดียวกัน <b>2)</b> ยกกำลังซ้อนให้คูณก่อน <b>3)</b> คูณ → บวก, หาร → ลบ เลขชี้กำลัง <b>4)</b> ตรวจด้วยการคำนวณค่าจริงถ้าตัวเลขเล็ก', fig: { t: 'formula', lines: ['(aᵐ)ⁿ → คูณ', 'aᵐ × aⁿ → บวก', 'aᵐ ÷ aⁿ → ลบ'] } }
  ] },
  { id: 'ls_xyid', level: 'm4', subject: 'math', gen: 'xy_identity', icon: '🧩', title: 'หาค่า x² + y² โดยไม่หา x, y', blurb: 'เอกลักษณ์พีชคณิต', pages: [
    { say: 'ถ้า <b>x + y = 7</b> และ <b>xy = 12</b> จงหา x² + y² ลองเดา x, y ก็ได้ แต่ข้อสอบมักตั้งให้ใช้ <b>เอกลักษณ์</b> จะเร็วกว่า', fig: { t: 'formula', lines: ['x + y = 7', 'xy = 12', 'x² + y² = ?'] } },
    { say: 'จำ <b>(x + y)² = x² + 2xy + y²</b> ย้ายข้างได้ <b>x² + y² = (x + y)² − 2xy</b>', fig: { t: 'formula', lines: ['(x + y)² = x² + 2xy + y²', 'x² + y² = (x + y)² − 2xy'] } },
    { say: 'แทนค่า: x² + y² = 7² − 2(12) = 49 − 24 = <b>25</b>', fig: { t: 'formula', lines: ['49 − 24 = 25'] } },
    { say: 'ตรวจโดยหา x, y: ผลบวก 7 ผลคูณ 12 → <b>3 กับ 4</b> → 9 + 16 = <b>25</b> ✓ และอีกสูตรที่ใช้บ่อย <b>(x − y)² = x² − 2xy + y²</b> = (x + y)² − 4xy = 49 − 48 = <b>1</b>', fig: { t: 'formula', lines: ['x, y = 3, 4 → 9 + 16 = 25 ✓', '(x − y)² = (x+y)² − 4xy', '= 49 − 48 = 1'] } },
    { say: 'สรุปเอกลักษณ์ 3 ตัว: <b>(a + b)² = a² + 2ab + b²</b> · <b>(a − b)² = a² − 2ab + b²</b> · <b>a² − b² = (a − b)(a + b)</b> ถ้าโจทย์ให้ผลบวก/ผลลบ และผลคูณ ให้นึกถึงเอกลักษณ์', fig: { t: 'formula', lines: ['(a+b)² = a² + 2ab + b²', '(a−b)² = a² − 2ab + b²', 'a² − b² = (a−b)(a+b)'] } }
  ] },
  { id: 'ls_surd', level: 'm4', subject: 'math', gen: 'surd_sum', icon: '√', title: 'รากที่สองและการรวมราก', blurb: 'จัดรูปรากแล้วบวกลบ', pages: [
    { say: 'รวม <b>√18 + √8 − √2</b> ได้ไหม? รากต่างเลขกัน บวกลบตรง ๆ ไม่ได้ ต้อง <b>จัดรูป</b> ให้เหลือรากเดียวกันก่อน', fig: { t: 'formula', lines: ['√18 + √8 − √2 = ?'] } },
    { say: 'ดึงกำลังสองสมบูรณ์ออกจากราก: √18 = √(9×2) = <b>3√2</b> · √8 = √(4×2) = <b>2√2</b> · √2 ไว้เหมือนเดิม', fig: { t: 'formula', lines: ['√18 = √(9×2) = 3√2', '√8 = √(4×2) = 2√2'] } },
    { say: 'ตอนนี้ทุกตัวเป็น <b>√2</b> เหมือนกัน รวมสัมประสิทธิ์ได้เลย: 3√2 + 2√2 − 1√2 = (3 + 2 − 1)√2 = <b>4√2</b>', fig: { t: 'formula', lines: ['3√2 + 2√2 − √2', '= (3 + 2 − 1)√2 = 4√2'] } },
    { say: 'ท่องกำลังสองสมบูรณ์ไว้ช่วยแยก: 4, 9, 16, 25, 36, 49 · ตัวอย่าง √12 = 2√3 · √50 = 5√2 · √75 = 5√3 (หาตัวประกอบที่เป็นกำลังสองมากที่สุด)', fig: { t: 'formula', lines: ['√12 = √(4×3) = 2√3', '√50 = √(25×2) = 5√2', '√75 = √(25×3) = 5√3'] } },
    { say: 'ข้อพึงระวัง: √a + √b <b>ไม่เท่ากับ</b> √(a + b) เช่น √9 + √16 = 7 แต่ √25 = 5 · ตรวจค่าประมาณ √2 ≈ 1.41 → 4√2 ≈ 5.66 และ √18 + √8 − √2 ≈ 4.24 + 2.83 − 1.41 = 5.66 ✓', fig: { t: 'formula', lines: ['√a + √b ≠ √(a+b)', '4√2 ≈ 5.66 ✓'] } }
  ] },
  { id: 'ls_sysword', level: 'm4', subject: 'math', gen: 'system_word', icon: '✏️', title: 'ซื้อดินสอกับยางลบ', blurb: 'ระบบสมการจากโจทย์ปัญหา', pages: [
    { say: 'ซื้อดินสอ 2 แท่ง กับยางลบ 3 ก้อน จ่าย <b>21 บาท</b> ซื้อดินสอ 3 แท่ง กับยางลบ 2 ก้อน จ่าย <b>19 บาท</b> ดินสอแท่งละกี่บาท ยางลบก้อนละกี่บาท?', fig: { t: 'emojis', rows: [['✏️', 2, '+ 🧽×3 = 21 บาท'], ['✏️', 3, '+ 🧽×2 = 19 บาท']] } },
    { say: 'ตั้งตัวแปร <b>p = ราคาดินสอ</b> · <b>e = ราคายางลบ</b> เขียนเป็นสมการ 2 ข้อ', fig: { t: 'formula', lines: ['2p + 3e = 21  …(1)', '3p + 2e = 19  …(2)'] } },
    { say: 'ทำให้สัมประสิทธิ์ p เท่ากัน: (1) × 3 → <b>6p + 9e = 63</b> · (2) × 2 → <b>6p + 4e = 38</b>', fig: { t: 'formula', lines: ['(1)×3: 6p + 9e = 63', '(2)×2: 6p + 4e = 38'] } },
    { say: 'ลบสองสมการ: (6p + 9e) − (6p + 4e) = 63 − 38 → <b>5e = 25</b> → e = <b>5</b> แทนใน (1): 2p + 15 = 21 → p = <b>3</b>', fig: { t: 'formula', lines: ['5e = 25 → e = 5', '2p + 15 = 21 → p = 3'] } },
    { say: 'ตรวจกับ <b>ทั้งสองสมการ</b>: 2(3) + 3(5) = 21 ✓ · 3(3) + 2(5) = 19 ✓ ตอบ ดินสอแท่งละ 3 บาท ยางลบก้อนละ 5 บาท', fig: { t: 'formula', lines: ['6 + 15 = 21 ✓', '9 + 10 = 19 ✓'] } }
  ] },
  { id: 'ls_meanrm', level: 'm4', subject: 'math', gen: 'mean_remove', icon: '📉', title: 'เอาข้อมูลออกแล้วเฉลี่ยเปลี่ยน', blurb: 'ค่าเฉลี่ยเมื่อนำข้อมูลออก', pages: [
    { say: 'นักเรียน 10 คนมีคะแนนเฉลี่ย <b>24</b> เมื่อนำคะแนนของนักเรียนคนหนึ่งออก เฉลี่ยของที่เหลือ 9 คนเป็น <b>22</b> คนที่ถูกเอาออกได้กี่คะแนน?', fig: { t: 'formula', lines: ['10 คน เฉลี่ย 24', 'เหลือ 9 คน เฉลี่ย 22', 'ที่ออก = ?'] } },
    { say: 'ย้อนกลับเป็น <b>ผลรวม</b> ก่อน: 10 คน → 24 × 10 = <b>240</b> · เหลือ 9 คน → 22 × 9 = <b>198</b>', fig: { t: 'formula', lines: ['ผลรวมเดิม 24 × 10 = 240', 'ผลรวมใหม่ 22 × 9 = 198'] } },
    { say: 'ผลรวมที่หายไปคือคะแนนของคนที่ออก: 240 − 198 = <b>42 คะแนน</b>', fig: { t: 'formula', lines: ['240 − 198 = 42'] } },
    { say: 'ตรวจ: เอา 42 ออกจาก 240 เหลือ 198 หารด้วย 9 = 22 ✓ คนที่ออกสูงกว่าเฉลี่ย (42 > 24) เฉลี่ยของที่เหลือจึงต่ำลง สมเหตุสมผล', fig: { t: 'formula', lines: ['198 ÷ 9 = 22 ✓', 'ออก 42 > 24 → เฉลี่ยลดลง'] } },
    { say: 'หลักการเดียวกันใช้กับ <b>เพิ่มข้อมูล</b> หรือ <b>เปลี่ยนค่า</b> ทุกครั้งให้ <b>แปลงเป็นผลรวม</b> ปรับ แล้วหารด้วยจำนวนใหม่ ห้ามเฉลี่ยของเฉลี่ยตรง ๆ', fig: { t: 'formula', lines: ['เฉลี่ย → ผลรวม → ปรับ → หารจำนวนใหม่'] } }
  ] },
  { id: 'ls_ineqcnt', level: 'm4', subject: 'math', gen: 'ineq_count', icon: '🔢', title: 'ระบบอสมการ นับจำนวนเต็ม', blurb: 'หาช่วงที่ตรงทั้งสองอสมการ', pages: [
    { say: 'จงหาจำนวนเต็ม x ที่ทำให้ <b>2x − 1 > 5</b> และ <b>3x + 2 ≤ 20</b> เป็นจริงพร้อมกัน', fig: { t: 'formula', lines: ['2x − 1 > 5', '3x + 2 ≤ 20'] } },
    { say: 'แก้ทีละข้อ: 2x − 1 > 5 → 2x > 6 → <b>x > 3</b> · 3x + 2 ≤ 20 → 3x ≤ 18 → <b>x ≤ 6</b>', fig: { t: 'formula', lines: ['x > 3', 'x ≤ 6'] } },
    { say: 'ต้องเป็นจริง <b>ทั้งสองข้อ</b> → 3 < x ≤ 6 (มากกว่า 3 และไม่เกิน 6) วาดบนเส้นจำนวนช่วยได้', fig: { t: 'formula', lines: ['3 < x ≤ 6', '(x ไม่รวม 3 · รวม 6)'] } },
    { say: 'จำนวนเต็มในช่วงนี้คือ <b>4, 5, 6</b> รวม <b>3 ตัว</b> ตรวจ: x = 6 → 3(6) + 2 = 20 ≤ 20 ✓ · x = 7 → 23 > 20 ✗ · x = 3 → 2(3) − 1 = 5 > 5 ✗', fig: { t: 'formula', lines: ['4, 5, 6 → 3 ตัว', 'x=6 ✓ · x=7 ✗ · x=3 ✗'] } },
    { say: 'เทคนิคนับ: ถ้า a < x ≤ b จำนวนเต็ม = <b>b − a</b> (ที่นี่ 6 − 3 = 3) · ถ้า a ≤ x ≤ b จำนวน = b − a + 1 · ระวังว่าปลายช่วงรวมหรือไม่รวม', fig: { t: 'formula', lines: ['a < x ≤ b → b − a ตัว', 'a ≤ x ≤ b → b − a + 1 ตัว'] } }
  ] },
  { id: 'ls_prob2', level: 'm4', subject: 'math', gen: 'prob2', icon: '🎱', title: 'หยิบลูกบอลพร้อมกัน 2 ลูก', blurb: 'ความน่าจะเป็นด้วยการจัดหมู่', pages: [
    { say: 'กล่องมีลูกบอลแดง <b>3 ลูก</b> น้ำเงิน <b>2 ลูก</b> รวม 5 ลูก หยิบ <b>พร้อมกัน 2 ลูก</b> ความน่าจะเป็นที่ได้ <b>แดงทั้งคู่</b> คือเท่าไร?', fig: { t: 'emojis', rows: [['🔴', 3, 'แดง 3 ลูก'], ['🔵', 2, 'น้ำเงิน 2 ลูก']] } },
    { say: 'ความน่าจะเป็น = <b>จำนวนแบบที่ต้องการ ÷ จำนวนแบบทั้งหมด</b> หยิบพร้อมกันไม่สนลำดับ จึงใช้ <b>จัดหมู่ C(n, r)</b>', fig: { t: 'formula', lines: ['P = แบบที่ต้องการ ÷ แบบทั้งหมด', 'ไม่สนลำดับ → C(n, r)'] } },
    { say: '<b>แบบทั้งหมด</b> = เลือก 2 ลูกจาก 5 = C(5, 2) = (5 × 4) ÷ 2 = <b>10 แบบ</b>', fig: { t: 'formula', lines: ['C(5,2) = 10'] } },
    { say: '<b>แบบที่ต้องการ</b> (แดงทั้งคู่) = เลือก 2 จากแดง 3 ลูก = C(3, 2) = <b>3 แบบ</b> → P = 3/10', fig: { t: 'formula', lines: ['C(3,2) = 3', 'P = 3/10'] } },
    { say: 'ตรวจด้วยวิธีหยิบทีละลูก: 3/5 × 2/4 = 6/20 = <b>3/10</b> ✓ · ถ้าอยากได้ <b>แดง 1 น้ำเงิน 1</b> = C(3,1) × C(2,1) = 6 แบบ → 6/10 = 3/5', fig: { t: 'formula', lines: ['3/5 × 2/4 = 3/10 ✓', 'แดง1 น้ำเงิน1 = 3×2 = 6 แบบ', 'P = 6/10 = 3/5'] } }
  ] },
  { id: 'ls_foodchain', level: 'm1', subject: 'sci', gen: 'sci1_life', icon: '🌾', title: 'ห่วงโซ่อาหารในทุ่งนา', blurb: 'ผู้ผลิต ผู้บริโภค ผู้ย่อยสลาย', pages: [
    { say: 'ในทุ่งนา <b>หญ้า → ตั๊กแตน → กบ → งู</b> ลูกศรชี้จาก <b>ผู้ถูกกิน ไปหาผู้กิน</b> เพื่อแสดงทิศทางที่พลังงานถ่ายทอดไป นี่คือ <b>ห่วงโซ่อาหาร</b>', fig: { t: 'emojis', rows: [['🌾', 1, 'หญ้า → '], ['🦗', 1, 'ตั๊กแตน → 🐸 กบ → 🐍 งู']] } },
    { say: '<b>ผู้ผลิต</b> คือสิ่งมีชีวิตที่สร้างอาหารเองได้ด้วยการสังเคราะห์ด้วยแสง เช่น พืชสีเขียว ต้นข้าว หญ้า เป็นจุดเริ่มต้นของห่วงโซ่อาหาร', fig: { t: 'formula', lines: ['ผู้ผลิต = พืชสีเขียว', 'สร้างอาหารเองด้วยแสงอาทิตย์'] } },
    { say: '<b>ผู้บริโภค</b> สร้างอาหารเองไม่ได้ ต้องกินสิ่งมีชีวิตอื่น แบ่งตามอาหาร: <b>กินพืช</b> (ตั๊กแตน วัว) · <b>กินสัตว์</b> (งู เสือ) · <b>กินทั้งพืชและสัตว์</b> (คน ไก่)', fig: { t: 'formula', lines: ['กินพืช: ตั๊กแตน วัว', 'กินสัตว์: งู เสือ', 'กินทั้งสอง: คน ไก่'] } },
    { say: '<b>ผู้ย่อยสลาย</b> เช่น เห็ด รา แบคทีเรีย ย่อยซากสิ่งมีชีวิตให้กลายเป็นแร่ธาตุคืนสู่ดิน ให้พืชนำไปใช้ต่อ ทำให้วัฏจักรหมุนเวียนต่อเนื่อง', fig: { t: 'formula', lines: ['ผู้ย่อยสลาย: เห็ด รา แบคทีเรีย', 'ซาก → แร่ธาตุ → ดิน → พืช'] } },
    { say: 'พลังงานถ่ายทอดขึ้นแต่ละขั้นเหลือราว <b>10%</b> เช่น หญ้า 1,000 → ตั๊กแตน 100 → กบ 10 → งู 1 ถ้า <b>กบหายไป</b> ตั๊กแตนจะเพิ่ม (ไม่มีผู้กิน) และงูขาดอาหาร', fig: { t: 'formula', lines: ['1,000 → 100 → 10 → 1', '(ถ่ายทอดเหลือราว 10%)'] } }
  ] },
  { id: 'ls_matter', level: 'm1', subject: 'sci', gen: 'sci1_matter', icon: '🧊', title: 'น้ำแข็ง น้ำ ไอน้ำ', blurb: 'สถานะของสารและการเปลี่ยนสถานะ', pages: [
    { say: 'สสารมี <b>3 สถานะ</b> หลัก: <b>ของแข็ง</b> (รูปร่างและปริมาตรคงที่) · <b>ของเหลว</b> (ปริมาตรคงที่ รูปร่างเปลี่ยนตามภาชนะ) · <b>แก๊ส</b> (รูปร่างและปริมาตรเปลี่ยนตามภาชนะ)', fig: { t: 'formula', lines: ['ของแข็ง: รูปร่าง+ปริมาตรคงที่', 'ของเหลว: ปริมาตรคงที่', 'แก๊ส: เปลี่ยนตามภาชนะ'] } },
    { say: 'อนุภาคของแข็ง <b>อัดแน่น</b> สั่นอยู่กับที่ · ของเหลว <b>อยู่ใกล้กัน</b> เคลื่อนที่ผ่านกันได้ · แก๊ส <b>ห่างกันมาก</b> เคลื่อนที่เร็วทั่วทิศทาง', fig: { t: 'formula', lines: ['แข็ง: อัดแน่น สั่นอยู่ที่', 'เหลว: ใกล้กัน ไหลได้', 'แก๊ส: ห่างกัน เคลื่อนที่เร็ว'] } },
    { say: 'การเปลี่ยนสถานะ: <b>หลอมเหลว</b> (แข็ง→เหลว) · <b>ระเหย/เดือด</b> (เหลว→แก๊ส) · <b>ควบแน่น</b> (แก๊ส→เหลว) · <b>แข็งตัว</b> (เหลว→แข็ง) · <b>ระเหิด</b> (แข็ง→แก๊สโดยตรง เช่น น้ำแข็งแห้ง ลูกเหม็น)', fig: { t: 'formula', lines: ['แข็ง → เหลว: หลอมเหลว', 'เหลว → แก๊ส: ระเหย/เดือด', 'แก๊ส → เหลว: ควบแน่น', 'เหลว → แข็ง: แข็งตัว'] } },
    { say: 'น้ำบริสุทธิ์ที่ความดันปกติ <b>จุดหลอมเหลว/จุดเยือกแข็ง 0 °C</b> และ <b>จุดเดือด 100 °C</b> ขณะที่เปลี่ยนสถานะ <b>อุณหภูมิคงที่</b> แม้จะยังให้ความร้อนอยู่', fig: { t: 'formula', lines: ['น้ำแข็ง ⇄ น้ำ  0 °C', 'น้ำ ⇄ ไอน้ำ  100 °C', 'ขณะเปลี่ยนสถานะ อุณหภูมิคงที่'] } },
    { say: 'ตัวอย่างในชีวิต: หยดน้ำเกาะแก้วน้ำเย็น = <b>ควบแน่น</b> ของไอน้ำในอากาศ · ผ้าเปียกแห้ง = <b>ระเหย</b> · ไอศกรีมละลาย = <b>หลอมเหลว</b> ข้อสอบมักให้เรียกชื่อการเปลี่ยนสถานะจากสถานการณ์', fig: { t: 'formula', lines: ['หยดน้ำเกาะแก้วเย็น → ควบแน่น', 'ผ้าเปียกแห้ง → ระเหย', 'ไอศกรีมละลาย → หลอมเหลว'] } }
  ] },
  { id: 'ls_earth', level: 'm1', subject: 'sci', gen: 'sci1_earth', icon: '🌍', title: 'โลก ดวงจันทร์ และดวงอาทิตย์', blurb: 'กลางวันกลางคืน ฤดู ข้างขึ้นข้างแรม', pages: [
    { say: '<b>กลางวันกลางคืน</b> เกิดจากโลก <b>หมุนรอบตัวเอง</b> หนึ่งรอบใช้เวลาราว <b>24 ชั่วโมง</b> ด้านที่หันเข้าหาดวงอาทิตย์เป็นกลางวัน อีกด้านเป็นกลางคืน', fig: { t: 'formula', lines: ['โลกหมุนรอบตัวเอง ≈ 24 ชม.', 'ด้านรับแสง = กลางวัน', 'ด้านมืด = กลางคืน'] } },
    { say: '<b>โลกโคจรรอบดวงอาทิตย์</b> หนึ่งรอบใช้เวลาราว <b>365 วัน</b> (1 ปี) เมื่อรวมกับ <b>แกนโลกเอียง</b> ราว 23.5° ทำให้เกิด <b>ฤดูกาล</b>', fig: { t: 'formula', lines: ['โลกโคจรรอบดวงอาทิตย์ ≈ 365 วัน', 'แกนโลกเอียง ≈ 23.5°', '→ เกิดฤดูกาล'] } },
    { say: 'ฤดูเกิดเพราะ <b>แกนโลกเอียง</b> ไม่ใช่เพราะโลกอยู่ใกล้หรือไกลดวงอาทิตย์ ซีกโลกที่เอียงเข้าหาดวงอาทิตย์ได้รับแสงตรงและนานกว่า จึงเป็นฤดูร้อน อีกซีกเป็นฤดูหนาว', fig: { t: 'formula', lines: ['เอียงเข้าหาอาทิตย์ → ร้อน', 'เอียงออก → หนาว', 'ไม่ใช่เรื่องระยะห่าง'] } },
    { say: '<b>ดวงจันทร์</b> โคจรรอบโลกราว <b>29.5 วัน</b> (หนึ่งเดือนจันทรคติ) เราเห็นดวงจันทร์สว่างเพราะสะท้อนแสงอาทิตย์ รูปร่างที่เห็นเปลี่ยนไปตามตำแหน่ง เรียก <b>ข้างขึ้นข้างแรม</b>', fig: { t: 'formula', lines: ['จันทร์โคจรรอบโลก ≈ 29.5 วัน', 'แสงจากอาทิตย์สะท้อนมา', 'รูปร่างเปลี่ยน = ข้างขึ้นข้างแรม'] } },
    { say: '<b>จันทร์เต็มดวง</b> โลกอยู่ระหว่างดวงอาทิตย์กับดวงจันทร์ · <b>จันทร์ดับ (ขึ้น 1 ค่ำ)</b> ดวงจันทร์อยู่ระหว่างโลกกับดวงอาทิตย์ · <b>สุริยุปราคา</b> จันทร์บังอาทิตย์ · <b>จันทรุปราคา</b> เงาโลกบังจันทร์', fig: { t: 'formula', lines: ['สุริยุปราคา: จันทร์บังอาทิตย์', 'จันทรุปราคา: เงาโลกบังจันทร์'] } }
  ] },
  { id: 'ls_energy1', level: 'm1', subject: 'sci', gen: 'sci1_energy', icon: '💡', title: 'พลังงานเปลี่ยนรูปได้', blurb: 'พลังงาน แสง และเสียงเบื้องต้น', pages: [
    { say: '<b>พลังงาน</b> คือความสามารถในการทำงาน มีหลายรูป เช่น พลังงานความร้อน แสง เสียง ไฟฟ้า เคมี ศักย์ จลน์ <b>เปลี่ยนรูปได้</b> แต่ไม่สูญหาย (กฎการอนุรักษ์พลังงาน)', fig: { t: 'formula', lines: ['พลังงานเปลี่ยนรูปได้', 'แต่ไม่สร้างขึ้นใหม่/ไม่สูญหาย'] } },
    { say: 'ตัวอย่างการเปลี่ยนรูป: <b>หลอดไฟ</b> ไฟฟ้า → แสง + ความร้อน · <b>พัดลม</b> ไฟฟ้า → จลน์ · <b>พืช</b> แสง → เคมี (ในอาหาร) · <b>ลำโพง</b> ไฟฟ้า → เสียง', fig: { t: 'formula', lines: ['หลอดไฟ: ไฟฟ้า → แสง + ความร้อน', 'พัดลม: ไฟฟ้า → จลน์', 'พืช: แสง → เคมี'] } },
    { say: '<b>แสง</b> เดินทางเป็นเส้นตรง เมื่อกระทบวัตถุจะ <b>สะท้อน</b> (กระจกเงา) หรือ <b>หักเห</b> เมื่อผ่านตัวกลางต่างชนิด (ดินสอที่จุ่มในน้ำดูหัก) กฎการสะท้อน: <b>มุมตกกระทบ = มุมสะท้อน</b>', fig: { t: 'formula', lines: ['สะท้อน: มุมตก = มุมสะท้อน', 'หักเห: เปลี่ยนตัวกลาง'] } },
    { say: '<b>เสียง</b> เกิดจากการสั่นสะเทือน และต้อง <b>อาศัยตัวกลาง</b> (อากาศ น้ำ ของแข็ง) เดินทางในสุญญากาศไม่ได้ ในอากาศเร็วราว 340 m/s เดินทางในของแข็งเร็วกว่าในอากาศ', fig: { t: 'formula', lines: ['เสียง ← การสั่น', 'ต้องมีตัวกลาง', 'สุญญากาศ → ไม่ได้ยิน'] } },
    { say: 'เสียง <b>สูง–ต่ำ</b> ขึ้นกับ <b>ความถี่</b> (สั่นเร็ว = เสียงสูง) เสียง <b>ดัง–เบา</b> ขึ้นกับ <b>แอมพลิจูด</b> (สั่นแรง = ดัง) หน่วยความถี่คือ <b>เฮิรตซ์ (Hz)</b>', fig: { t: 'formula', lines: ['สูง-ต่ำ ← ความถี่ (Hz)', 'ดัง-เบา ← แอมพลิจูด'] } }
  ] },
  { id: 'ls_civic1', level: 'm1', subject: 'soc', gen: 'soc1_citizen', icon: '🤝', title: 'สิทธิ หน้าที่ และพลเมืองดี', blurb: 'หน้าที่พลเมืองและการอยู่ร่วมกัน', pages: [
    { say: '<b>สิทธิ</b> คือสิ่งที่เรามีอิสระทำได้และได้รับความคุ้มครอง ส่วน <b>หน้าที่</b> คือสิ่งที่เราต้องทำ สิทธิกับหน้าที่ <b>ไปด้วยกันเสมอ</b>', fig: { t: 'formula', lines: ['สิทธิ = สิ่งที่ได้รับ/ทำได้', 'หน้าที่ = สิ่งที่ต้องทำ'] } },
    { say: 'ตัวอย่าง <b>สิทธิ</b> ของเด็ก: ได้รับการศึกษา ได้รับการดูแลรักษาพยาบาล ได้รับความคุ้มครองจากการถูกทำร้าย · แสดงความคิดเห็นอย่างเหมาะสม', fig: { t: 'formula', lines: ['เรียนหนังสือ', 'รักษาพยาบาล', 'ความคุ้มครอง', 'แสดงความคิดเห็น'] } },
    { say: 'ตัวอย่าง <b>หน้าที่</b> ของพลเมืองไทย: ปฏิบัติตามกฎหมาย · เสียภาษี · ป้องกันประเทศ · ไปใช้สิทธิเลือกตั้ง · รักษาสาธารณสมบัติ · ให้ความร่วมมือกับโรงเรียนและชุมชน', fig: { t: 'formula', lines: ['ทำตามกฎหมาย', 'เสียภาษี', 'ไปเลือกตั้ง', 'รักษาสาธารณสมบัติ'] } },
    { say: '<b>พลเมืองดี</b> คือผู้ที่ทำหน้าที่ของตนเอง เคารพสิทธิผู้อื่น มี <b>ระเบียบวินัย</b> ซื่อสัตย์ รับผิดชอบ และช่วยเหลือสังคม ตัวอย่างในโรงเรียน: เข้าแถวตามลำดับ ไม่ทิ้งขยะเรี่ยราด', fig: { t: 'formula', lines: ['มีวินัย ซื่อสัตย์ รับผิดชอบ', 'เคารพสิทธิผู้อื่น', 'ช่วยเหลือสังคม'] } },
    { say: 'หลักตอบข้อสอบ: <b>1)</b> แยกว่าข้อความเป็น "สิ่งที่ได้" (สิทธิ) หรือ "สิ่งที่ต้องทำ" (หน้าที่) <b>2)</b> พฤติกรรมที่ <b>เบียดเบียนผู้อื่น</b> ไม่ใช่การใช้สิทธิที่ถูกต้อง <b>3)</b> เลือกคำตอบที่ส่งผลดีต่อส่วนรวม', fig: { t: 'formula', lines: ['ได้รับ → สิทธิ', 'ต้องทำ → หน้าที่', 'ไม่เบียดเบียนผู้อื่น'] } }
  ] },
  { id: 'ls_econ1', level: 'm1', subject: 'soc', gen: 'soc1_money', icon: '🪙', title: 'รายรับ รายจ่าย และการออม', blurb: 'เศรษฐศาสตร์เบื้องต้น', pages: [
    { say: '<b>ความต้องการ</b> ของคนมีไม่จำกัด แต่ <b>ทรัพยากร</b> มีจำกัด จึงต้อง <b>เลือก</b> ใช้อย่างคุ้มค่า นี่คือที่มาของวิชาเศรษฐศาสตร์', fig: { t: 'formula', lines: ['ความต้องการ ไม่จำกัด', 'ทรัพยากร จำกัด', '→ ต้องเลือกใช้ให้คุ้มค่า'] } },
    { say: 'แยกให้ออก: <b>ความจำเป็น</b> (อาหาร เสื้อผ้า ที่อยู่อาศัย ยารักษาโรค) กับ <b>ความต้องการเพิ่มเติม</b> (ของเล่นราคาแพง ของแฟชั่น) ควรจัดความจำเป็นก่อน', fig: { t: 'formula', lines: ['จำเป็น: อาหาร เสื้อผ้า ที่อยู่ ยา', 'อยากได้: ของฟุ่มเฟือย', 'จัดความจำเป็นก่อน'] } },
    { say: '<b>รายรับ</b> คือเงินที่ได้เข้ามา · <b>รายจ่าย</b> คือเงินที่จ่ายออกไป · <b>เงินออม = รายรับ − รายจ่าย</b> เช่น ได้ 100 บาท จ่าย 70 บาท เหลือออม <b>30 บาท</b>', fig: { t: 'formula', lines: ['ออม = รายรับ − รายจ่าย', '100 − 70 = 30 บาท'] } },
    { say: '<b>การออม</b> ช่วยให้มีเงินใช้ยามจำเป็นหรือซื้อของที่ต้องการในอนาคต ควรเก็บ <b>ก่อนใช้</b> ไม่ใช่เก็บเงินที่เหลือ เปิดบัญชีธนาคารได้ดอกเบี้ย <b>ปลอดภัยกว่าเก็บไว้กับตัว</b>', fig: { t: 'formula', lines: ['ออมก่อนใช้', 'ฝากธนาคาร → ได้ดอกเบี้ย', 'ปลอดภัย'] } },
    { say: '<b>บัญชีรายรับ-รายจ่าย</b> ช่วยให้รู้ว่าเงินหมดไปกับอะไร ถ้ารายจ่ายมากกว่ารายรับ จะ <b>ขาดดุล</b> ต้องลดรายจ่ายหรือหารายได้เพิ่ม · ใช้จ่ายอย่าง <b>พอเพียง</b> คือพอประมาณ มีเหตุผล มีภูมิคุ้มกัน', fig: { t: 'formula', lines: ['จ่าย > รับ → ขาดดุล', 'พอเพียง: พอประมาณ มีเหตุผล', 'มีภูมิคุ้มกัน'] } }
  ] },
  { id: 'ls_cell4', level: 'm4', subject: 'sci', gen: 'sci4_life', icon: '🌱', title: 'พืชสร้างอาหาร เซลล์สร้างพลังงาน', blurb: 'สังเคราะห์ด้วยแสงและการหายใจระดับเซลล์', pages: [
    { say: '<b>การสังเคราะห์ด้วยแสง</b> เกิดในพืชสีเขียว ที่ <b>คลอโรพลาสต์</b> ซึ่งมี <b>คลอโรฟิลล์</b> ดูดแสง พืชนำน้ำกับคาร์บอนไดออกไซด์มาสร้างน้ำตาลและออกซิเจน', fig: { t: 'formula', lines: ['คลอโรพลาสต์ + คลอโรฟิลล์', 'แสง + น้ำ + CO₂', '→ น้ำตาล + O₂'] } },
    { say: 'สมการ: <b>6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂</b> (มีแสงและคลอโรฟิลล์) ตรวจอะตอมซ้ายขวา: C 6 = 6 · H 12 = 12 · O 18 = 18 ครบสมดุล', fig: { t: 'formula', lines: ['6CO₂ + 6H₂O', '→ C₆H₁₂O₆ + 6O₂', 'C 6=6 · H 12=12 · O 18=18'] } },
    { say: '<b>การหายใจระดับเซลล์</b> เกิดในทั้งพืชและสัตว์ ที่ <b>ไมโทคอนเดรีย</b> ใช้น้ำตาลกับออกซิเจน ให้พลังงาน (ATP) น้ำ และคาร์บอนไดออกไซด์', fig: { t: 'formula', lines: ['ไมโทคอนเดรีย', 'น้ำตาล + O₂', '→ CO₂ + H₂O + พลังงาน'] } },
    { say: 'สองกระบวนการ <b>สลับกัน</b>: สังเคราะห์ด้วยแสงใช้ CO₂ ได้ O₂ · หายใจใช้ O₂ ได้ CO₂ พืชหายใจตลอดเวลา แต่สังเคราะห์ด้วยแสงเฉพาะตอนมีแสง', fig: { t: 'formula', lines: ['สังเคราะห์ด้วยแสง: ใช้ CO₂ ได้ O₂', 'หายใจ: ใช้ O₂ ได้ CO₂', 'พืชหายใจตลอดเวลา'] } },
    { say: 'ออร์แกเนลล์ที่ควรจำ: <b>นิวเคลียส</b> ควบคุมเซลล์ (มี DNA) · <b>เยื่อหุ้มเซลล์</b> ควบคุมการผ่านเข้าออก · <b>ผนังเซลล์</b> ค้ำจุน (มีในพืช) · <b>แวคิวโอล</b> เก็บสาร · <b>ไรโบโซม</b> สร้างโปรตีน', fig: { t: 'formula', lines: ['นิวเคลียส: ควบคุม (DNA)', 'เยื่อหุ้มเซลล์: คัดเลือกสาร', 'ผนังเซลล์: ค้ำจุน (พืช)', 'ไรโบโซม: สร้างโปรตีน'] } }
  ] },
  { id: 'ls_chem4', level: 'm4', subject: 'sci', gen: 'sci4_chem', icon: '⚛️', title: 'อะตอมและกรด-เบส', blurb: 'โครงสร้างอะตอม เลขอะตอม และค่า pH', pages: [
    { say: '<b>อะตอม</b> ประกอบด้วย <b>โปรตอน</b> (ประจุ +) และ <b>นิวตรอน</b> (ไม่มีประจุ) อยู่ที่นิวเคลียส กับ <b>อิเล็กตรอน</b> (ประจุ −) วิ่งรอบนิวเคลียส', fig: { t: 'formula', lines: ['โปรตอน +  (นิวเคลียส)', 'นิวตรอน 0  (นิวเคลียส)', 'อิเล็กตรอน −  (รอบนอก)'] } },
    { say: '<b>เลขอะตอม (Z)</b> = จำนวนโปรตอน (= อิเล็กตรอน ในอะตอมกลาง) · <b>เลขมวล (A)</b> = โปรตอน + นิวตรอน ดังนั้น <b>นิวตรอน = A − Z</b>', fig: { t: 'formula', lines: ['Z = โปรตอน = อิเล็กตรอน', 'A = โปรตอน + นิวตรอน', 'นิวตรอน = A − Z'] } },
    { say: 'ตัวอย่างโซเดียม Na: Z = 11, A = 23 → โปรตอน <b>11</b> · อิเล็กตรอน <b>11</b> · นิวตรอน = 23 − 11 = <b>12</b>', fig: { t: 'formula', lines: ['Na: Z = 11, A = 23', 'p = 11, e = 11', 'n = 23 − 11 = 12'] } },
    { say: '<b>ค่า pH</b> บอกความเป็นกรด-เบส: <b>pH &lt; 7 = กรด</b> (เช่น น้ำมะนาว) · <b>pH = 7 = กลาง</b> (น้ำบริสุทธิ์) · <b>pH &gt; 7 = เบส</b> (เช่น น้ำสบู่) ยิ่งห่าง 7 ยิ่งแรง', fig: { t: 'formula', lines: ['pH < 7  กรด', 'pH = 7  กลาง', 'pH > 7  เบส'] } },
    { say: '<b>การทำให้เป็นกลาง</b>: กรด + เบส → เกลือ + น้ำ เช่น <b>HCl + NaOH → NaCl + H₂O</b> (กรดไฮโดรคลอริก + โซเดียมไฮดรอกไซด์ → เกลือแกง + น้ำ) ตรวจ: Na 1=1 · Cl 1=1 · H 2=2 · O 1=1', fig: { t: 'formula', lines: ['HCl + NaOH → NaCl + H₂O', 'กรด + เบส → เกลือ + น้ำ'] } }
  ] },
  { id: 'ls_newton', level: 'm4', subject: 'sci', gen: 'sci4_phys', icon: '🚀', title: 'กฎการเคลื่อนที่ของนิวตัน', blurb: 'แรง มวล ความเร่ง และน้ำหนัก', pages: [
    { say: '<b>กฎข้อ 1 (ความเฉื่อย)</b> วัตถุจะ <b>คงสภาพเดิม</b> (อยู่นิ่ง หรือเคลื่อนที่เร็วคงที่ตามแนวตรง) ถ้าแรงลัพธ์ที่กระทำเป็นศูนย์ เช่น ตัวเราโยกไปข้างหน้าเมื่อรถเบรกกะทันหัน', fig: { t: 'formula', lines: ['แรงลัพธ์ = 0', '→ คงสภาพเดิม', 'เช่น รถเบรก ตัวพุ่งไปข้างหน้า'] } },
    { say: '<b>กฎข้อ 2</b> แรงลัพธ์ทำให้เกิด <b>ความเร่ง</b>: <b>F = m × a</b> (นิวตัน = กก. × m/s²) แรงมากเร่งมาก มวลมากเร่งน้อย', fig: { t: 'formula', lines: ['F = m × a', 'F (N) = m (kg) × a (m/s²)'] } },
    { say: 'ตัวอย่าง: แรง <b>10 N</b> ผลักวัตถุมวล <b>2 kg</b> → a = F ÷ m = 10 ÷ 2 = <b>5 m/s²</b> ถ้ามวลเป็น 4 kg แรงเท่าเดิม a = 2.5 m/s² (มวลมากขึ้น เร่งน้อยลง)', fig: { t: 'formula', lines: ['a = F ÷ m = 10 ÷ 2 = 5 m/s²', 'มวล 4 kg → a = 2.5 m/s²'] } },
    { say: '<b>กฎข้อ 3</b> ทุกแรงกิริยามีแรงปฏิกิริยา <b>ขนาดเท่ากัน ทิศตรงข้าม</b> และกระทำต่อ <b>วัตถุคนละก้อน</b> เช่น จรวดดันแก๊สลง แก๊สดันจรวดขึ้น', fig: { t: 'formula', lines: ['แรงกิริยา = แรงปฏิกิริยา', 'ขนาดเท่ากัน ทิศตรงข้าม', 'กระทำต่อวัตถุคนละก้อน'] } },
    { say: '<b>น้ำหนัก = มวล × g</b> (g ≈ 10 N/kg ใกล้ผิวโลก) มวล 5 kg น้ำหนัก = 5 × 10 = <b>50 N</b> <b>มวล</b> เป็นปริมาณคงที่ ส่วน <b>น้ำหนัก</b> เปลี่ยนตามความโน้มถ่วง (บนดวงจันทร์เบากว่า)', fig: { t: 'formula', lines: ['W = m × g', '5 × 10 = 50 N', 'มวลคงที่ · น้ำหนักเปลี่ยนตาม g'] } }
  ] },
  // ---------- v0.23.0: บทเรียนสังคม · ไทย · อังกฤษ เพิ่ม + วิทย์ภัยพิบัติ/เอลนีโญ + เขื่อนไทย ----------
  { id: 'ls_socrel', level: 'm1', subject: 'soc', gen: 'soc1_rel', icon: '🛕', title: 'ศาสนาและวันสำคัญ', blurb: 'ศาสนาในไทย คัมภีร์ วันสำคัญทางพุทธ', pages: [
    { say: 'คนไทยนับถือหลายศาสนาอยู่ร่วมกันได้ ส่วนใหญ่นับถือ <b>พุทธ</b> รองลงมาคือ <b>อิสลาม</b> <b>คริสต์</b> <b>ฮินดู</b> และ <b>สิกข์</b> รัฐธรรมนูญให้เสรีภาพในการนับถือศาสนา', fig: { t: 'formula', lines: ['พุทธ · อิสลาม · คริสต์', 'ฮินดู · สิกข์', 'เสรีภาพในการนับถือศาสนา'] } },
    { say: 'แต่ละศาสนามี <b>คัมภีร์</b> และ <b>ศาสนสถาน</b> ต่างกัน ข้อสอบชอบถามจับคู่ ต้องจำให้ได้', fig: { t: 'formula', lines: ['พุทธ: พระไตรปิฎก · วัด', 'อิสลาม: อัลกุรอาน · มัสยิด', 'คริสต์: ไบเบิล · โบสถ์', 'ฮินดู: พระเวท · เทวสถาน', 'สิกข์: ครันถ์ซาฮิบ · คุรุทวารา'] } },
    { say: 'วันสำคัญทางพุทธ 3 วันที่ตรงกับวันพระใหญ่: <b>มาฆบูชา</b> (พระสงฆ์ 1,250 องค์มาประชุมกันโดยไม่ได้นัด) · <b>วิสาขบูชา</b> (ประสูติ ตรัสรู้ ปรินิพพาน) · <b>อาสาฬหบูชา</b> (ปฐมเทศนา)', fig: { t: 'emojis', rows: [['🌕', 1, 'มาฆบูชา · ขึ้น 15 ค่ำ เดือน 3'], ['🪷', 1, 'วิสาขบูชา · ขึ้น 15 ค่ำ เดือน 6'], ['☸️', 1, 'อาสาฬหบูชา · ขึ้น 15 ค่ำ เดือน 8']] } },
    { say: '<b>อาสาฬหบูชา</b> พระพุทธเจ้าแสดงปฐมเทศนาแก่ปัญจวัคคีย์ ท่านโกณฑัญญะได้ดวงตาเห็นธรรมและบวชเป็นพระสงฆ์องค์แรก จึงครบ <b>พระรัตนตรัย</b> (พุทธ ธรรม สงฆ์) · วันถัดไปคือ <b>เข้าพรรษา</b> พระอยู่ประจำวัด 3 เดือน', fig: { t: 'formula', lines: ['พุทธ + ธรรม + สงฆ์ = พระรัตนตรัย', 'วันหลังอาสาฬหบูชา = เข้าพรรษา', 'ออกพรรษา = ขึ้น 15 ค่ำ เดือน 11'] } },
    { say: 'ศาสนาอื่นมีวันสำคัญด้วย: อิสลามมี <b>อีดิลฟิตร</b> (หลังถือศีลอดเดือนรอมฎอน) · คริสต์มี <b>คริสต์มาส</b> 25 ธันวาคม ระลึกถึงการประสูติของพระเยซู', fig: { t: 'emojis', rows: [['🌙', 1, 'อีดิลฟิตร · หลังเดือนรอมฎอน'], ['🎄', 1, 'คริสต์มาส · 25 ธ.ค.']] } },
    { say: 'เทคนิค: ถามวันสำคัญให้ดู <b>เหตุการณ์</b> ก่อนชื่อวัน (ประสูติ+ตรัสรู้+ปรินิพพาน = วิสาขบูชา, ปฐมเทศนา = อาสาฬหบูชา) และจับคู่ศาสนากับคัมภีร์ให้แม่น', fig: { t: 'formula', lines: ['ประสูติ ตรัสรู้ ปรินิพพาน → วิสาขบูชา', 'ปฐมเทศนา → อาสาฬหบูชา', 'ประชุมสงฆ์ 1,250 องค์ → มาฆบูชา'] } }
  ] },
  { id: 'ls_socasean', level: 'm1', subject: 'soc', gen: 'soc1_asean', icon: '🤝', title: 'รู้จักอาเซียน', blurb: 'สมาชิก ปฏิญญากรุงเทพ ประชาคมอาเซียน', pages: [
    { say: '<b>อาเซียน (ASEAN)</b> คือสมาคมประชาชาติแห่งเอเชียตะวันออกเฉียงใต้ ก่อตั้งวันที่ <b>8 สิงหาคม พ.ศ. 2510</b> ที่กรุงเทพมหานคร ด้วย <b>ปฏิญญากรุงเทพ</b> จึงมี "วันอาเซียน" ทุก 8 สิงหาคม', fig: { t: 'formula', lines: ['ก่อตั้ง 8 ส.ค. 2510', 'ที่กรุงเทพมหานคร', 'เอกสาร: ปฏิญญากรุงเทพ'] } },
    { say: '<b>สมาชิกผู้ก่อตั้ง 5 ประเทศ</b>: ไทย อินโดนีเซีย มาเลเซีย ฟิลิปปินส์ สิงคโปร์ (จำว่า "ไทย-อิน-มา-ฟิล-สิง") เวียดนามไม่ใช่ผู้ก่อตั้ง', fig: { t: 'emojis', rows: [['🇹🇭', 1, 'ไทย'], ['🇮🇩', 1, 'อินโดนีเซีย'], ['🇲🇾', 1, 'มาเลเซีย'], ['🇵🇭', 1, 'ฟิลิปปินส์'], ['🇸🇬', 1, 'สิงคโปร์']] } },
    { say: 'ประเทศที่เข้ามาทีหลัง: <b>บรูไน</b> (2527) · <b>เวียดนาม</b> (2538) · <b>ลาว และ เมียนมา</b> (2540) · <b>กัมพูชา</b> (2542) รวมเป็น <b>10 ประเทศ</b>', fig: { t: 'formula', lines: ['5 ผู้ก่อตั้ง + บรูไน = 6', '+ เวียดนาม = 7', '+ ลาว + เมียนมา = 9', '+ กัมพูชา = 10'] } },
    { say: '<b>ประชาคมอาเซียน</b> มี 3 เสา: <b>การเมืองและความมั่นคง</b> · <b>เศรษฐกิจ</b> (AEC ค้าขายเสรี) · <b>สังคมและวัฒนธรรม</b> เริ่มต้นเมื่อสิ้นปี พ.ศ. 2558', fig: { t: 'formula', lines: ['เสาที่ 1 การเมืองและความมั่นคง', 'เสาที่ 2 เศรษฐกิจ (AEC)', 'เสาที่ 3 สังคมและวัฒนธรรม'] } },
    { say: 'ข้อควรรู้: ภาษาที่ใช้ทำงานของอาเซียนคือ <b>ภาษาอังกฤษ</b> · สำนักงานเลขาธิการอยู่ที่ <b>จาการ์ตา</b> · ติมอร์-เลสเตเพิ่งได้เป็นสมาชิกลำดับที่ 11 ปลาย พ.ศ. 2568 แต่ข้อสอบส่วนมากยังถามสมาชิก 10 ประเทศ', fig: { t: 'formula', lines: ['ภาษาทำงาน = อังกฤษ', 'สำนักงานเลขาธิการ = จาการ์ตา', 'สมาชิกในข้อสอบ = 10 ประเทศ'] } }
  ] },
  { id: 'ls_thread', level: 'm1', subject: 'th', gen: 'th1_read', icon: '🔍', title: 'จับใจความสำคัญ', blurb: 'ใจความหลัก ข้อเท็จจริง นิสัยตัวละคร', pages: [
    { say: '<b>ใจความสำคัญ</b> คือเรื่องที่ผู้เขียนอยากบอกที่สุดของย่อหน้านั้น ส่วนที่เหลือเป็นรายละเอียดมาอธิบายเพิ่ม ลองถามตัวเองว่า "ย่อหน้านี้พูดถึงอะไร และเป็นอย่างไร"', fig: { t: 'formula', lines: ['ใจความสำคัญ = เรื่องหลัก', 'รายละเอียด = ตัวอย่าง เหตุผล'] } },
    { say: 'ประโยคใจความสำคัญมักอยู่ <b>ต้นย่อหน้า</b> หรือ <b>ท้ายย่อหน้า</b> คำว่า "ดังนั้น" "สรุปแล้ว" "ที่สำคัญคือ" มักนำหน้าใจความหลัก', fig: { t: 'formula', lines: ['ต้นย่อหน้า → เล่าหลักก่อน แล้วขยาย', 'ท้ายย่อหน้า → ดังนั้น/สรุปแล้ว'] } },
    { say: 'ตัวอย่าง: "ฝนตกหนักตั้งแต่เช้า ถนนน้ำท่วมขัง นักเรียนมาสาย ครูจึงเลื่อนเคารพธงชาติ" ใจความคือ <b>ฝนตกหนักทำให้โรงเรียนเลื่อนเคารพธงชาติ</b> (เหตุ → ผล) ไม่ใช่แค่ "นักเรียนมาสาย"', fig: { t: 'emojis', rows: [['🌧️', 1, 'เหตุ: ฝนตกหนัก'], ['🏫', 1, 'ผล: เลื่อนเคารพธงชาติ']] } },
    { say: '<b>ข้อเท็จจริง</b> พิสูจน์ได้ว่าจริงหรือไม่ (น้ำเดือดที่ 100 องศา) · <b>ความคิดเห็น</b> เป็นความรู้สึกของคน มักมีคำว่า น่าจะ ควร ดีที่สุด สวยที่สุด', fig: { t: 'formula', lines: ['พิสูจน์ได้ → ข้อเท็จจริง', 'ขึ้นกับความรู้สึก → ความคิดเห็น'] } },
    { say: 'ถามนิสัยตัวละคร ให้ดูจาก <b>การกระทำ</b> เช่น น้องบีเก็บเงินทุกวันหนึ่งปีแล้วซื้อหนังสือที่อยากอ่าน แปลว่า <b>อดออมและมีเป้าหมาย</b>', fig: { t: 'emojis', rows: [['🐷', 1, 'เก็บเงินทุกวัน = อดออม'], ['📚', 1, 'ซื้อหนังสือที่อยากอ่าน = มีเป้าหมาย']] } },
    { say: 'เทคนิค: <b>1)</b> อ่านเรื่องแล้วขีดคำสำคัญ <b>2)</b> เลือกตัวเลือกที่ครอบคลุมทั้งเรื่อง ไม่ใช่แค่ตอนเดียว <b>3)</b> ตัดตัวเลือกที่เนื้อเรื่องไม่ได้บอกไว้', fig: { t: 'formula', lines: ['ครอบคลุมทั้งเรื่อง ✓', 'เล่าแค่ตอนเดียว ✗', 'เรื่องไม่ได้บอก ✗'] } }
  ] },
  { id: 'ls_thvocab', level: 'm1', subject: 'th', gen: 'th1_vocab', icon: '📚', title: 'คำพ้อง คำตรงข้าม และการสะกด', blurb: 'ความหมายของคำ คำที่ใช้ผิดบ่อย', pages: [
    { say: '<b>คำพ้องความหมาย</b> คือคำต่างกันแต่ความหมายใกล้กัน เช่น <b>ภูผา = ภูเขา</b> · <b>สมุทร = ทะเล</b> · <b>กาย = ร่างกาย</b> · <b>อรุณ = รุ่งเช้า</b> ข้อสอบมักใช้คำไพเราะแบบบทกวี', fig: { t: 'formula', lines: ['ภูผา = ภูเขา', 'สมุทร = ทะเล', 'กาย = ร่างกาย', 'อรุณ = รุ่งเช้า'] } },
    { say: '<b>คำตรงข้าม</b> คือความหมายกลับกัน เช่น ขยัน ↔ เกียจคร้าน · สว่าง ↔ มืด · เบา ↔ หนัก · ซื่อสัตย์ ↔ คดโกง ต้องเลือกคู่ที่ตรงข้าม <b>ในด้านเดียวกัน</b>', fig: { t: 'formula', lines: ['ขยัน ↔ เกียจคร้าน', 'สว่าง ↔ มืด', 'ซื่อสัตย์ ↔ คดโกง'] } },
    { say: '<b>คำที่เขียนถูก</b> ที่มักพลาด: <b>อนุญาต</b> (ไม่ใช่ อนุญาติ) · <b>สังเกต</b> (ไม่ใช่ สังเกตุ) · <b>ปรากฏ</b> (ไม่ใช่ ปรากฎ)', fig: { t: 'formula', lines: ['อนุญาต ✓  อนุญาติ ✗', 'สังเกต ✓  สังเกตุ ✗', 'ปรากฏ ✓  ปรากฎ ✗'] } },
    { say: 'คำหนึ่งอาจมี <b>หลายความหมาย</b> เช่น "ตา" แปลว่าอวัยวะที่ใช้มอง หรือพ่อของแม่ก็ได้ ต้องดูประโยครอบข้างว่าใช้ความหมายไหน', fig: { t: 'emojis', rows: [['👁️', 1, 'ตา = อวัยวะมองเห็น'], ['👴', 1, 'ตา = พ่อของแม่']] } },
    { say: 'เทคนิค: ถ้าไม่รู้ความหมายคำ ลอง <b>แทนคำนั้นลงในประโยค</b> แล้วดูว่าฟังเข้าท่าไหม และตัดตัวเลือกที่ความหมายสวนทางกันออกก่อน', fig: { t: 'formula', lines: ['แทนคำลงประโยค', 'ตัดตัวเลือกที่สวนทาง', 'เหลือตัวที่สมเหตุผล'] } }
  ] },
  { id: 'ls_enread', level: 'm1', subject: 'en', gen: 'en1_read', icon: '📖', title: 'Reading: อ่านเรื่องสั้นให้ตอบได้', blurb: 'หาคำตอบ who what when ตัดตัวเลือกหลอก', pages: [
    { say: 'ก่อนอ่าน ให้ <b>อ่านคำถามก่อน</b> เพื่อรู้ว่าต้องหาอะไร จากนั้นอ่านเรื่องแล้วหาข้อมูลที่ตรงกับคำถาม ไม่ต้องแปลทุกคำ', fig: { t: 'formula', lines: ['1) อ่านคำถาม', '2) อ่านเรื่อง', '3) หาคำตอบในเรื่อง'] } },
    { say: 'คำถามขึ้นต้นบอกชนิดคำตอบ: <b>Who</b> = ใคร · <b>What</b> = อะไร · <b>Where</b> = ที่ไหน · <b>When</b> = เมื่อไร · <b>Why</b> = ทำไม · <b>How many</b> = จำนวน', fig: { t: 'formula', lines: ['Who → คน', 'Where → สถานที่', 'When → เวลา', 'Why → เหตุผล (because)'] } },
    { say: 'ตัวอย่าง: "Mina waters the plants every morning before school." ถามว่า When does she water them? ตอบ <b>Before school</b> (every morning บอกว่าทำเป็นประจำ)', fig: { t: 'emojis', rows: [['🌱', 1, 'Mina waters the plants'], ['🏫', 1, 'when? before school']] } },
    { say: 'ประกาศหรือป้ายมีตัวเลขเยอะ: "borrow up to three books for one week" = ยืมได้ <b>สูงสุด 3 เล่ม</b> นาน 1 สัปดาห์ · ให้ขีดตัวเลขและเวลาก่อนเลือกตอบ', fig: { t: 'formula', lines: ['up to 3 books = ไม่เกิน 3 เล่ม', 'for one week = 1 สัปดาห์', '8 a.m. – 4 p.m. = เปิดทำการ'] } },
    { say: 'ข้อ <b>เดาความหมาย (inference)</b>: Tom ฝึกว่ายน้ำสัปดาห์ละ 2 ครั้ง สองเดือนผ่านไปว่ายข้ามสระได้ แปลว่า <b>Tom can swim now</b> ตอบ could not ไม่ได้ ระวังคำ not never only', fig: { t: 'formula', lines: ['ฝึก 2 เดือน → ว่ายข้ามสระได้', 'สรุป: Tom can swim now'] } },
    { say: 'เทคนิค: ตัดตัวเลือกที่ <b>ขัดกับเรื่อง</b> หรือ <b>เรื่องไม่ได้พูดถึง</b> ก่อน ตัวเลือกที่ใช้คำในเรื่องเป๊ะ ๆ แต่ความหมายผิด มักเป็นตัวหลอก', fig: { t: 'formula', lines: ['ขัดกับเรื่อง ✗', 'เรื่องไม่ได้พูด ✗', 'ตรงกับเรื่อง ✓'] } }
  ] },
  { id: 'ls_envocab', level: 'm1', subject: 'en', gen: 'en1_vocab', icon: '🔤', title: 'Vocabulary: คำศัพท์ที่ต้องรู้', blurb: 'คำตรงข้าม อาชีพ ประสาทสัมผัส เดาจากประโยค', pages: [
    { say: '<b>คำตรงข้าม (opposites)</b> ที่ออกบ่อย: heavy ↔ light · hot ↔ cold · big ↔ small · fast ↔ slow · happy ↔ sad · open ↔ close · full ↔ empty', fig: { t: 'formula', lines: ['heavy ↔ light', 'hot ↔ cold', 'fast ↔ slow', 'happy ↔ sad', 'full ↔ empty'] } },
    { say: '<b>อาชีพ (jobs)</b>: vet = สัตวแพทย์ · nurse = พยาบาล · chef = พ่อครัว · pilot = นักบิน · farmer = ชาวนา/เกษตรกร · dentist = ทันตแพทย์', fig: { t: 'emojis', rows: [['🐶', 1, 'vet · treats sick animals'], ['👩‍🍳', 1, 'chef · cooks food'], ['✈️', 1, 'pilot · flies a plane'], ['🦷', 1, 'dentist · checks teeth']] } },
    { say: '<b>อวัยวะรับความรู้สึก</b>: eyes → see · ears → hear · nose → smell · tongue → taste · hands/skin → touch ใช้ <b>nose</b> ดมดอกไม้ ไม่ใช่ mouth', fig: { t: 'emojis', rows: [['👀', 1, 'eyes → see'], ['👂', 1, 'ears → hear'], ['👃', 1, 'nose → smell'], ['👅', 1, 'tongue → taste']] } },
    { say: 'คำที่สะกดคล้ายกันแต่ความหมายต่าง: <b>there</b> (ที่นั่น) กับ <b>their</b> (ของพวกเขา) · <b>to</b> (ไปยัง) กับ <b>two</b> (สอง) · <b>see</b> (เห็น) กับ <b>sea</b> (ทะเล)', fig: { t: 'formula', lines: ['there = ที่นั่น · their = ของพวกเขา', 'to = ไปยัง · two = สอง', 'see = เห็น · sea = ทะเล'] } },
    { say: 'เจอคำที่ไม่รู้จัก ให้ <b>เดาจากประโยค</b> เช่น "A person who treats sick animals is a ___." รู้ว่าเป็นอาชีพ รักษาสัตว์ป่วย คำตอบคือ <b>vet</b>', fig: { t: 'formula', lines: ['ดูคำใบ้ในประโยค', 'ดูว่าเป็นคน สิ่งของ หรือกริยา', 'เลือกคำที่ความหมายเข้ากัน'] } }
  ] },
  { id: 'ls_soclaw', level: 'm4', subject: 'soc', gen: 'soc4_law', icon: '⚖️', title: 'กฎหมายในชีวิตประจำวัน', blurb: 'ประเภทกฎหมาย ลำดับศักดิ์ หลักนิติธรรม', pages: [
    { say: '<b>กฎหมาย</b> คือข้อบังคับที่รัฐตราขึ้นให้ทุกคนปฏิบัติตาม ใครฝ่าฝืนต้องรับผลตามที่กำหนด ทำให้สังคมสงบเรียบร้อย', fig: { t: 'formula', lines: ['รัฐตราขึ้น', 'ใช้บังคับทุกคน', 'ฝ่าฝืน → รับผิด'] } },
    { say: 'แบ่งตามความสัมพันธ์: <b>กฎหมายเอกชน</b> (เอกชนกับเอกชน เช่น กฎหมายแพ่ง) · <b>กฎหมายมหาชน</b> (รัฐกับเอกชน เช่น รัฐธรรมนูญ อาญา ปกครอง)', fig: { t: 'formula', lines: ['เอกชน ↔ เอกชน → แพ่งและพาณิชย์', 'รัฐ ↔ เอกชน → รัฐธรรมนูญ · อาญา · ปกครอง'] } },
    { say: '<b>แพ่ง</b> ผิดสัญญา กู้เงินไม่คืน → เรียกร้อง <b>ชดใช้</b> · <b>อาญา</b> ทำร้ายร่างกาย ลักทรัพย์ → <b>ลงโทษ</b> (ประหาร จำคุก กักขัง ปรับ ริบทรัพย์สิน)', fig: { t: 'formula', lines: ['แพ่ง → ชดใช้ค่าเสียหาย', 'อาญา → ลงโทษ', 'โทษ: ประหาร จำคุก กักขัง ปรับ ริบทรัพย์'] } },
    { say: '<b>ลำดับศักดิ์</b> สูงไปต่ำ: <b>รัฐธรรมนูญ</b> → พระราชบัญญัติ (พ.ร.บ.) → พระราชกฤษฎีกา (พ.ร.ฎ.) → กฎกระทรวง → ข้อบัญญัติท้องถิ่น ฉบับล่างห้ามขัดกับฉบับบน', fig: { t: 'formula', lines: ['1 รัฐธรรมนูญ', '2 พ.ร.บ.', '3 พ.ร.ฎ.', '4 กฎกระทรวง', '5 ข้อบัญญัติท้องถิ่น'] } },
    { say: '<b>หลักนิติธรรม</b>: ทุกคนเท่าเทียมกันตามกฎหมาย และรัฐลงโทษใครไม่ได้ถ้า <b>ไม่มีกฎหมายให้อำนาจไว้</b> · บรรลุนิติภาวะเมื่ออายุ <b>20 ปีบริบูรณ์</b> (หรือสมรสตามกฎหมาย)', fig: { t: 'formula', lines: ['ทุกคนเท่าเทียมตามกฎหมาย', 'ไม่มีกฎหมาย → ลงโทษไม่ได้', 'บรรลุนิติภาวะ = 20 ปีบริบูรณ์'] } }
  ] },
  { id: 'ls_socrights', level: 'm4', subject: 'soc', gen: 'soc4_rights', icon: '🕊️', title: 'สิทธิ เสรีภาพ และหน้าที่พลเมือง', blurb: 'สิทธิมนุษยชน เสรีภาพมีขอบเขต หน้าที่', pages: [
    { say: '<b>สิทธิ</b> คือสิ่งที่บุคคลมีอำนาจกระทำได้ตามกฎหมาย · <b>เสรีภาพ</b> คือความอิสระที่จะคิดหรือทำ · <b>หน้าที่</b> คือสิ่งที่ต้องทำตามกฎหมาย สิทธิกับหน้าที่ไปคู่กันเสมอ', fig: { t: 'formula', lines: ['สิทธิ = ได้รับการคุ้มครอง', 'เสรีภาพ = อิสระที่จะทำ', 'หน้าที่ = ต้องทำ'] } },
    { say: '<b>สิทธิมนุษยชน</b> คือสิทธิที่ทุกคนมีมาแต่เกิดเท่าเทียมกัน สหประชาชาติประกาศ <b>ปฏิญญาสากลว่าด้วยสิทธิมนุษยชน</b> เมื่อ <b>10 ธันวาคม พ.ศ. 2491</b> ตรงกับ <b>วันสิทธิมนุษยชน</b>', fig: { t: 'formula', lines: ['ปฏิญญาสากลสิทธิมนุษยชน', '10 ธ.ค. 2491 (ค.ศ. 1948)', 'ประกาศโดยสหประชาชาติ'] } },
    { say: '<b>สิทธิ</b> ของประชาชน เช่น สิทธิเลือกตั้ง สิทธิในชีวิตและร่างกาย สิทธิได้รับการศึกษา · <b>เสรีภาพ</b> เช่น เสรีภาพแสดงความคิดเห็น เสรีภาพนับถือศาสนา', fig: { t: 'emojis', rows: [['🗳️', 1, 'สิทธิเลือกตั้ง'], ['📚', 1, 'สิทธิได้รับการศึกษา'], ['🗣️', 1, 'เสรีภาพแสดงความคิดเห็น']] } },
    { say: '<b>เสรีภาพมีขอบเขต</b> ต้องไม่ละเมิดสิทธิหรือทำให้ผู้อื่นเสียหาย เช่น พูดตามความเห็นได้ แต่ใส่ร้ายคนอื่นด้วยเรื่องเท็จไม่ได้', fig: { t: 'formula', lines: ['เสรีภาพของเรา', 'สิ้นสุดที่สิทธิของคนอื่น'] } },
    { say: '<b>หน้าที่พลเมืองไทย</b> เช่น เสียภาษีอากร · ปฏิบัติตามกฎหมาย · ไปใช้สิทธิเลือกตั้ง · ป้องกันประเทศ · ศึกษาภาคบังคับ ข้อสอบมักถามว่าข้อไหนเป็น <b>หน้าที่</b> ไม่ใช่สิทธิ', fig: { t: 'formula', lines: ['หน้าที่: เสียภาษี', 'หน้าที่: ปฏิบัติตามกฎหมาย', 'หน้าที่: ป้องกันประเทศ', 'ไม่ใช่สิทธิ'] } }
  ] },
  { id: 'ls_thgram', level: 'm4', subject: 'th', gen: 'th4_gram', icon: '🧱', title: 'ประโยคความเดียว ความรวม ความซ้อน', blurb: 'ชนิดของประโยค สันธาน ภาษาทางการ', pages: [
    { say: 'ประโยคแบ่งเป็น 3 ชนิด: <b>ความเดียว</b> (กริยาหลักชุดเดียว) · <b>ความรวม</b> (ประโยคความเดียวหลายประโยคเชื่อมด้วยสันธาน) · <b>ความซ้อน</b> (มีประโยคย่อยแทรกเป็นส่วนขยาย)', fig: { t: 'formula', lines: ['ความเดียว: น้องอ่านหนังสือ', 'ความรวม: ... แต่ ...', 'ความซ้อน: ... ที่/ซึ่ง/ว่า ...'] } },
    { say: '<b>ประโยคความรวม</b> เชื่อมด้วยสันธาน: ตามกัน (และ แล้ว) · ขัดแย้ง (แต่ ทว่า) · เลือก (หรือ) · เหตุผล (จึง ดังนั้น) เช่น "ฝนตกหนัก<b>แต่</b>เขาก็ยังไปทำงาน"', fig: { t: 'formula', lines: ['และ แล้ว → คล้อยตาม', 'แต่ ทว่า → ขัดแย้ง', 'หรือ → เลือก', 'จึง ดังนั้น → เหตุผล'] } },
    { say: '<b>ประโยคความซ้อน</b> มีประโยคย่อยที่ทำหน้าที่ขยาย มักมีคำว่า <b>ที่ ซึ่ง อัน ว่า</b> เช่น "ครู<b>ที่สอนภาษาไทย</b>เป็นคนใจดี" ส่วนที่ขีดเส้นคือประโยคย่อยขยายคำว่า ครู', fig: { t: 'formula', lines: ['ครู + ที่สอนภาษาไทย', '(ประโยคย่อยขยายนาม)', '+ เป็นคนใจดี'] } },
    { say: 'วิธีแยก: ถ้าตัดตรงกลางแล้วได้ <b>2 ประโยคที่สมบูรณ์เท่ากัน</b> = ความรวม · ถ้าส่วนหนึ่ง <b>ไปขยายอีกส่วนหนึ่ง</b> ตัดออกแล้วไม่สมบูรณ์ = ความซ้อน', fig: { t: 'formula', lines: ['สมบูรณ์ 2 ประโยค → ความรวม', 'มีส่วนขยายประโยค → ความซ้อน', 'ชุดเดียว → ความเดียว'] } },
    { say: '<b>ภาษาทางการ</b> ใช้ในงานเขียนราชการ ข่าว รายงาน ไม่ใช้คำสแลง คำย่อ หรือคำพูดวัยรุ่น เช่น "คณะกรรมการได้พิจารณาข้อเสนอเรียบร้อยแล้ว"', fig: { t: 'formula', lines: ['ทางการ: ได้พิจารณาเรียบร้อยแล้ว', 'ไม่ทางการ: ดูแล้วนะ โอเคแล้ว', 'เลี่ยงสแลงและคำย่อ'] } }
  ] },
  { id: 'ls_thread4', level: 'm4', subject: 'th', gen: 'th4_read', icon: '🧠', title: 'อ่านวิเคราะห์ จุดประสงค์ผู้เขียน', blurb: 'ข้อเท็จจริง/ความเห็น ข้อสรุป การเปรียบเทียบ', pages: [
    { say: 'การอ่านวิเคราะห์ต้องถามว่า <b>ผู้เขียนต้องการอะไร</b> ไม่ใช่แค่ว่าเรื่องพูดถึงอะไร จุดประสงค์พบบ่อย: แจ้งให้ทราบ · โน้มน้าว · เสนอแนะ · วิจารณ์ · ให้ความบันเทิง', fig: { t: 'formula', lines: ['แจ้งให้ทราบ → ข้อมูลล้วน', 'โน้มน้าว → ชวนให้เชื่อ/ทำ', 'วิจารณ์ → ชี้ข้อดีข้อเสีย', 'เสนอแนะ → ควร...'] } },
    { say: 'แยก <b>ข้อเท็จจริง</b> (ตรวจสอบได้ มีตัวเลข วันที่) กับ <b>ความคิดเห็น</b> (มี ควร น่าจะ ดีที่สุด) ข้อสอบมักให้ข้อความผสมกัน ต้องตัดสินทีละประโยค', fig: { t: 'formula', lines: ['วันที่ ตัวเลข สถิติ → ข้อเท็จจริง', 'ควร น่าจะ ดีที่สุด → ความคิดเห็น'] } },
    { say: '<b>ข้อสรุปที่สมเหตุสมผล</b> ต้องมีหลักฐานในเรื่องรองรับ เช่น ร้านก๋วยเตี๋ยวน้ำซุปจืดลง ราคาเพิ่มขึ้น ลูกค้าเหลือน้อย สรุปได้ว่า <b>รสชาติลดลงและแพงขึ้นทำให้ลูกค้าน้อยลง</b> ไม่ใช่ "เจ้าของใหม่ไม่ดี" เฉย ๆ', fig: { t: 'formula', lines: ['เหตุ: ซุปจืด + ราคาแพง', 'ผล: ลูกค้าเหลือน้อย', 'สรุปให้ตรงเหตุและผล'] } },
    { say: 'ผู้เขียนมักใช้ <b>การเปรียบเทียบ</b> เพื่อให้เห็นภาพ เช่น "ขยะพันล้านชิ้นคือภูเขาลูกใหญ่" ใช้ชี้ว่า <b>การกระทำเล็กน้อยเมื่อรวมกันส่งผลใหญ่</b>', fig: { t: 'emojis', rows: [['🗑️', 1, 'ขยะ 1 ชิ้น = เล็กน้อย'], ['⛰️', 1, 'พันล้านชิ้น = ภูเขา']] } },
    { say: 'เทคนิค: ระวังตัวเลือกที่ใช้คำสุดโต่ง <b>ทุก เสมอ ไม่เคย ทั้งหมด</b> เพราะผิดง่าย · เลือกตัวที่ผู้เขียน <b>บอกหรือสื่อไว้จริง</b> อย่าเติมความคิดตัวเอง', fig: { t: 'formula', lines: ['ทุก เสมอ ไม่เคย → ระวัง', 'ยึดเนื้อความในเรื่อง', 'ไม่เติมความคิดตัวเอง'] } }
  ] },
  { id: 'ls_enconv4', level: 'm4', subject: 'en', gen: 'en4_conv', icon: '🗣️', title: 'Conversation: ตอบให้เหมาะกับสถานการณ์', blurb: 'ขอร้อง เสนอตัว ขอโทษ ปฏิเสธสุภาพ', pages: [
    { say: 'บทสนทนาให้ดู <b>หน้าที่ของประโยคแรก</b> ก่อน (ขอร้อง เสนอช่วย ขอโทษ เชิญ) แล้วเลือกคำตอบที่เข้ากับหน้าที่นั้น ไม่ใช่เลือกจากคำที่คุ้นตา', fig: { t: 'formula', lines: ['ดูหน้าที่ประโยคแรก', 'เลือกคำตอบที่เข้ากัน', 'ให้สุภาพพอ'] } },
    { say: '<b>ขอร้อง</b> Could you pass me the salt, please? → <b>Here you are.</b> / Sure. / Certainly. · ถ้าปฏิเสธ: <b>I\'m afraid I can\'t</b> ... ตามด้วยเหตุผลสั้น ๆ', fig: { t: 'formula', lines: ['Could/Would you...? → Sure. Here you are.', 'ปฏิเสธ → I\'m afraid I can\'t, because...'] } },
    { say: '<b>เสนอช่วย</b> Would you like me to carry your bag? / Shall I...? → <b>That\'s very kind of you. Thanks.</b> หรือปฏิเสธสุภาพ <b>No, thanks. I can manage.</b>', fig: { t: 'formula', lines: ['Shall I...? → That\'s very kind of you.', 'ไม่รับ → No, thanks. I can manage.'] } },
    { say: '<b>ขอบคุณ</b> Thank you. → You\'re welcome. / Not at all. / My pleasure. · <b>ขอโทษ</b> I\'m sorry. → That\'s all right. / Never mind. / No problem.', fig: { t: 'formula', lines: ['Thank you → You\'re welcome.', 'I\'m sorry → That\'s all right.', 'Never mind = ไม่เป็นไร'] } },
    { say: '<b>เชิญและปฏิเสธ</b> Would you like to come? → <b>I\'d love to.</b> หรือ I\'d love to, but I can\'t · ฟังข่าวร้าย: I can\'t come to your party. → <b>What a pity! Maybe next time.</b>', fig: { t: 'formula', lines: ['Would you like to...? → I\'d love to.', 'ฟังข่าวไม่ดี → What a pity!', 'ให้คำแนะนำ → You should... / Why don\'t you...?'] } }
  ] },
  { id: 'ls_enread4', level: 'm4', subject: 'en', gen: 'en4_read', icon: '📰', title: 'Reading: หาใจความและความหมายแฝง', blurb: 'main idea, inference, reference, title', pages: [
    { say: '<b>Main idea</b> คือเรื่องหลักทั้งย่อหน้า ส่วน <b>details</b> คือรายละเอียดสนับสนุน คำตอบ main idea ต้องครอบคลุมทั้งย่อหน้า ไม่แคบเกินไป ไม่กว้างเกินไป', fig: { t: 'formula', lines: ['Main idea = เรื่องหลัก', 'Details = ตัวอย่าง เหตุผล ตัวเลข'] } },
    { say: 'ถามหา <b>best title</b>: เลือกชื่อที่ครอบคลุมเนื้อหา เช่น เรื่อง LED ประหยัดไฟและอายุยาว แต่ราคาแพง ชื่อที่ดีคือ <b>The benefits and a problem of LED streetlights</b>', fig: { t: 'emojis', rows: [['💡', 1, 'ประหยัดไฟ อายุยาว'], ['💰', 1, 'แต่ราคาแพง']] } },
    { say: '<b>Reference words</b> เช่น it, they, this, which, them แทนสิ่งที่กล่าวมาแล้ว ให้ถอยกลับไปหาคำนามที่ใกล้ที่สุดที่เข้ากันทั้งเอกพจน์/พหูพจน์และความหมาย', fig: { t: 'formula', lines: ['it → เอกพจน์', 'they / them → พหูพจน์', 'which → แทนประโยคหรือสิ่งของ'] } },
    { say: '<b>Inference</b> คือสรุปสิ่งที่เรื่องไม่ได้บอกตรง ๆ แต่รู้ได้จากเบาะแส เช่น ปากกาหาย ค้นกระเป๋าสองรอบ แล้วเด็กข้างกันยื่นปากกาให้ → เด็กคนนั้น <b>kind and helpful</b>', fig: { t: 'emojis', rows: [['🖊️', 1, 'her pen was missing'], ['🤝', 1, 'a boy lent his pen = kind']] } },
    { say: '<b>Vocabulary in context</b>: เดาความหมายจากคำรอบข้าง · ระวังตัวเลือกที่ใช้คำจากเรื่อง แต่ความหมายผิด และใส่ใจคำเชื่อม <b>but, however</b> (ขัดแย้ง) <b>so, therefore</b> (ผลลัพธ์)', fig: { t: 'formula', lines: ['but / however → ขัดแย้ง', 'so / therefore → ผลที่ตามมา', 'because → เหตุผล'] } }
  ] },
  { id: 'ls_scdisaster', level: 'm1', subject: 'sci', gen: 'sci1_earth', icon: '🌋', title: 'ภัยพิบัติธรรมชาติ ดิน น้ำ ลม ไฟ', blurb: 'แผ่นดินไหว ดินถล่ม น้ำท่วม พายุ ไฟป่า', pages: [
    { say: '<b>ภัยพิบัติธรรมชาติ</b> แบ่งตามธาตุได้ง่าย ๆ: <b>ดิน</b> (แผ่นดินไหว ดินถล่ม) · <b>น้ำ</b> (น้ำท่วม สึนามิ) · <b>ลม</b> (พายุ) · <b>ไฟ</b> (ไฟป่า ภูเขาไฟระเบิด)', fig: { t: 'emojis', rows: [['⛰️', 1, 'ดิน: แผ่นดินไหว ดินถล่ม'], ['🌊', 1, 'น้ำ: น้ำท่วม สึนามิ'], ['🌪️', 1, 'ลม: พายุ'], ['🔥', 1, 'ไฟ: ไฟป่า ภูเขาไฟ']] } },
    { say: '<b>แผ่นดินไหว</b> เกิดจากแผ่นเปลือกโลกเคลื่อนที่ชนหรือเสียดสีกันแล้วปล่อยพลังงานออกมา วัดความรุนแรงด้วยมาตราริกเตอร์ ถ้าใต้ทะเลเกิดแรงสั่นสะเทือนใหญ่อาจเกิด <b>สึนามิ</b>', fig: { t: 'formula', lines: ['แผ่นเปลือกโลกขยับ', '→ แผ่นดินไหว', '→ (ใต้ทะเล) สึนามิ'] } },
    { say: '<b>ดินถล่ม</b> มักเกิดบนเขาที่ฝนตกหนักและไม่มีต้นไม้ยึดดิน · <b>น้ำท่วม</b> มีทั้งน้ำท่วมฉับพลัน (ไหลหลากจากภูเขา) และน้ำท่วมขัง ป้องกันได้ด้วยการปลูกป่า ไม่ทิ้งขยะลงทางน้ำ', fig: { t: 'formula', lines: ['ฝนหนัก + ไม่มีป่า → ดินถล่ม', 'ปลูกต้นไม้ยึดดิน ✓', 'ไม่ทิ้งขยะลงทางน้ำ ✓'] } },
    { say: '<b>พายุหมุนเขตร้อน</b> แบ่งตามความเร็วลม: <b>ดีเปรสชัน</b> ไม่เกิน 63 กม./ชม. · <b>พายุโซนร้อน</b> 63–118 กม./ชม. · <b>ไต้ฝุ่น</b> ตั้งแต่ 118 กม./ชม. ขึ้นไป (ที่อื่นเรียก เฮอริเคน ไซโคลน)', fig: { t: 'formula', lines: ['ดีเปรสชัน ≤ 63 กม./ชม.', 'พายุโซนร้อน 63 – 118', 'ไต้ฝุ่น ≥ 118'] } },
    { say: '<b>ไฟป่า</b> มักเกิดช่วงแล้งจากความแห้งและฝีมือมนุษย์ ทำให้เกิดฝุ่นควัน PM2.5 · เมื่อเกิดภัย ให้ตั้งสติ ฟังประกาศ หนีไปที่ปลอดภัย: แผ่นดินไหวหมอบใต้โต๊ะแข็งแรง ห่างกระจก', fig: { t: 'formula', lines: ['แผ่นดินไหว: หมอบ ป้องกันศีรษะ ห่างกระจก', 'น้ำท่วม: ปิดไฟ ขึ้นที่สูง', 'ไฟป่า: ไม่เผา ห่างควัน'] } }
  ] },
  { id: 'ls_scstorm', level: 'm1', subject: 'sci', gen: 'sci1_earth', icon: '🌀', title: 'พายุชนิดต่าง ๆ', blurb: 'พายุหมุนเขตร้อน ฟ้าคะนอง พายุฤดูร้อน ทอร์นาโด', pages: [
    { say: '<b>พายุ</b> คืออากาศที่เคลื่อนที่รุนแรง เกิดจากความต่างของอุณหภูมิและความกดอากาศ ชนิดที่ควรรู้: พายุหมุนเขตร้อน · พายุฝนฟ้าคะนอง · พายุฤดูร้อน · ทอร์นาโด', fig: { t: 'emojis', rows: [['🌀', 1, 'พายุหมุนเขตร้อน'], ['⛈️', 1, 'พายุฝนฟ้าคะนอง'], ['🌩️', 1, 'พายุฤดูร้อน'], ['🌪️', 1, 'ทอร์นาโด']] } },
    { say: '<b>พายุหมุนเขตร้อน</b> เกิดเหนือทะเลที่น้ำอุ่น (ราว 26.5 องศาเซลเซียสขึ้นไป) ไอน้ำระเหยขึ้นสูง ลมพัดหมุนเข้าหาศูนย์กลาง ซีกโลกเหนือหมุน <b>ทวนเข็มนาฬิกา</b> ซีกโลกใต้หมุน <b>ตามเข็มนาฬิกา</b>', fig: { t: 'formula', lines: ['ทะเลน้ำอุ่น → ไอน้ำมาก', 'ซีกโลกเหนือ: ทวนเข็มนาฬิกา', 'ซีกโลกใต้: ตามเข็มนาฬิกา'] } },
    { say: 'ชื่อต่างกันตามที่เกิด: <b>ไต้ฝุ่น</b> (แปซิฟิกเหนือตะวันตก ใกล้ไทย) · <b>เฮอริเคน</b> (แอตแลนติกและแปซิฟิกตะวันออก) · <b>ไซโคลน</b> (มหาสมุทรอินเดีย) เป็นพายุชนิดเดียวกัน', fig: { t: 'formula', lines: ['ไต้ฝุ่น → แปซิฟิกเหนือตะวันตก', 'เฮอริเคน → แอตแลนติก', 'ไซโคลน → มหาสมุทรอินเดีย'] } },
    { say: 'ตรงกลางพายุหมุนมี <b>ตาพายุ</b> ที่ลมสงบฟ้าโปร่ง แต่รอบ ๆ ตาเป็นกำแพงเมฆที่ลมแรงสุด เมื่อขึ้นบกจะอ่อนกำลังเพราะไม่มีไอน้ำจากทะเลมาเติม', fig: { t: 'formula', lines: ['ตาพายุ = สงบ', 'กำแพงเมฆรอบตา = แรงสุด', 'ขึ้นบก → อ่อนกำลัง'] } },
    { say: '<b>พายุฝนฟ้าคะนอง</b> เกิดจากเมฆคิวมูโลนิมบัสก้อนใหญ่ มีฝนหนัก ฟ้าแลบ ฟ้าร้อง บางครั้งมีลูกเห็บ · <b>พายุฤดูร้อน</b> เกิดช่วงเมษายน–พฤษภาคม เมื่ออากาศร้อนอบอ้าวแล้วลมเย็นเข้าปะทะ ลมกระโชกแรง', fig: { t: 'formula', lines: ['ฟ้าคะนอง: เมฆคิวมูโลนิมบัส', 'ลูกเห็บ: ก้อนน้ำแข็งตกจากเมฆ', 'พายุฤดูร้อน: เม.ย. – พ.ค.'] } },
    { say: '<b>ทอร์นาโด</b> เป็นเมฆรูปกรวยหมุนเร็วยื่นจากเมฆฝนถึงพื้น เล็กกว่าไต้ฝุ่นมากแต่ลมรุนแรง ถ้าเกิดเหนือน้ำเรียก <b>นาคเล่นน้ำ</b> · เมื่อมีพายุฟ้าคะนอง อย่าหลบใต้ต้นไม้โดดเดี่ยว ให้เข้าอาคาร', fig: { t: 'emojis', rows: [['🌪️', 1, 'ทอร์นาโด เมฆรูปกรวย'], ['🏠', 1, 'หลบในอาคาร'], ['🌳', 1, 'ไม่หลบใต้ต้นไม้โดดเดี่ยว']] } }
  ] },
  { id: 'ls_scquake4', level: 'm4', subject: 'sci', gen: 'sci4_adv', icon: '🌋', title: 'แผ่นดินไหว ภูเขาไฟ และสึนามิ', blurb: 'แผ่นเปลือกโลก คลื่นไหวสะเทือน มาตราริกเตอร์', pages: [
    { say: 'เปลือกโลกแตกเป็น <b>แผ่นเปลือกโลก</b> ลอยบนชั้นเนื้อโลกที่ร้อนและค่อย ๆ ไหล ขอบแผ่นมี 3 แบบ: <b>เคลื่อนเข้าหากัน</b> · <b>แยกออกจากกัน</b> · <b>เฉือนผ่านกัน</b> แผ่นดินไหวและภูเขาไฟส่วนใหญ่เกิดที่ขอบแผ่น', fig: { t: 'formula', lines: ['เข้าหากัน → มุดตัว ภูเขา ภูเขาไฟ', 'แยกจากกัน → รอยแยก ภูเขาไฟใต้ทะเล', 'เฉือนกัน → รอยเลื่อน แผ่นดินไหว'] } },
    { say: 'รอบมหาสมุทรแปซิฟิกเรียก <b>วงแหวนไฟ</b> เพราะมีแผ่นดินไหวและภูเขาไฟมากที่สุดในโลก · ไทยไม่ได้อยู่ขอบแผ่น แต่มี <b>รอยเลื่อนมีพลัง</b> หลายแนวทางเหนือและตะวันตก และรับแรงสั่นจากแผ่นดินไหวใหญ่ที่อยู่ไกล', fig: { t: 'formula', lines: ['วงแหวนไฟ = รอบแปซิฟิก', 'ไทย: รอยเลื่อนมีพลัง เหนือ-ตะวันตก', 'รับแรงสั่นจากแผ่นดินไหวไกล ๆ ได้'] } },
    { say: 'จุดที่แผ่นดินแตกใต้ดินคือ <b>จุดโฟกัส</b> จุดบนผิวโลกที่อยู่เหนือขึ้นมาคือ <b>ศูนย์กลางแผ่นดินไหว (epicenter)</b> คลื่น <b>P</b> มาถึงก่อน ผ่านได้ทั้งของแข็งและของเหลว · คลื่น <b>S</b> ช้ากว่า ผ่านได้เฉพาะของแข็ง', fig: { t: 'formula', lines: ['P: เร็วกว่า มาก่อน แข็ง+เหลว', 'S: ช้ากว่า มาทีหลัง เฉพาะของแข็ง', 'S ไม่ผ่านแก่นนอก → แก่นนอกเป็นของเหลว'] } },
    { say: '<b>มาตราริกเตอร์</b> เป็นสเกลลอการิทึม ขนาดเพิ่ม 1 หน่วย แอมพลิจูดคลื่นเพิ่ม <b>10 เท่า</b> พลังงานเพิ่มราว <b>32 เท่า</b> ดังนั้น ขนาด 7 ต่างจากขนาด 5 อยู่ 2 หน่วย: แอมพลิจูด 10 × 10 = 100 เท่า พลังงานประมาณ 32 × 32 ≈ <b>1,000 เท่า</b>', fig: { t: 'formula', lines: ['+1 หน่วย → แอมพลิจูด ×10', '+1 หน่วย → พลังงาน ≈ ×32', '7 เทียบ 5 → แอมพลิจูด ×100', '7 เทียบ 5 → พลังงาน ≈ ×1,000'] } },
    { say: '<b>สึนามิ</b> เกิดจากแผ่นดินไหวใต้ทะเลที่พื้นทะเลยกหรือยุบ ทำให้น้ำทั้งก้อนเคลื่อนที่ คลื่นเดินทางเร็วหลายร้อย กม./ชม. ในทะเลลึกแทบมองไม่เห็น แต่เข้าใกล้ฝั่งจะช้าลงและสูงขึ้น สัญญาณเตือนคือน้ำทะเลลดลงผิดปกติ · ไทยเจอสึนามิ 26 ธันวาคม พ.ศ. 2547 จากแผ่นดินไหวใกล้เกาะสุมาตรา', fig: { t: 'emojis', rows: [['🌊', 1, 'ทะเลลึก: เร็ว แต่คลื่นเตี้ย'], ['🏖️', 1, 'ใกล้ฝั่ง: ช้าลง คลื่นสูงขึ้น'], ['⬆️', 1, 'น้ำลดผิดปกติ → รีบขึ้นที่สูง']] } }
  ] },
  { id: 'ls_scstorm4', level: 'm4', subject: 'sci', gen: 'sci4_adv', icon: '🌀', title: 'พายุหมุนเขตร้อนและฟ้าคะนองเชิงลึก', blurb: 'ความกดอากาศ โคริโอลิส คลื่นพายุ ฟ้าผ่า', pages: [
    { say: 'ลมพัดจากบริเวณ <b>ความกดอากาศสูง</b> ไปยัง <b>ความกดอากาศต่ำ</b> เสมอ พายุหมุนเขตร้อนมีศูนย์กลางเป็นความกดอากาศต่ำมาก ยิ่งต่ำลมยิ่งแรง', fig: { t: 'formula', lines: ['ลม: กดสูง → กดต่ำ', 'ศูนย์กลางพายุ = กดอากาศต่ำสุด', 'กดต่ำมาก → ลมแรงมาก'] } },
    { say: 'ลมที่พัดเข้าหาศูนย์กลางไม่ได้พุ่งตรง แต่ถูก <b>แรงโคริโอลิส</b> (จากการหมุนของโลก) เบี่ยง จึงหมุนวน: ซีกโลกเหนือเบี่ยงขวา หมุนทวนเข็ม · ที่เส้นศูนย์สูตรแรงนี้เกือบเป็นศูนย์ พายุหมุนจึงไม่ค่อยเกิดห่างเส้นศูนย์สูตรไม่ถึงราว 5 องศา', fig: { t: 'formula', lines: ['โลกหมุน → แรงโคริโอลิส', 'ซีกโลกเหนือ: เบี่ยงขวา', 'ใกล้เส้นศูนย์สูตร: แรงน้อยมาก'] } },
    { say: 'เงื่อนไขให้เกิดพายุหมุนเขตร้อน: ผิวน้ำทะเลอุ่นราว <b>26.5 °C ขึ้นไป</b> · ห่างเส้นศูนย์สูตรพอให้มีแรงโคริโอลิส · ลมเฉือนในแนวตั้งน้อย พลังงานมาจาก <b>ความร้อนแฝง</b> ที่ปล่อยออกมาเมื่อไอน้ำกลั่นตัวเป็นเมฆและฝน', fig: { t: 'formula', lines: ['น้ำทะเล ≥ 26.5 °C', 'มีแรงโคริโอลิสพอ', 'ลมเฉือนต่ำ', 'พลังงาน = ความร้อนแฝงการกลั่นตัว'] } },
    { say: 'สิ่งที่อันตรายที่สุดมักเป็น <b>คลื่นพายุซัดฝั่ง (storm surge)</b> คือน้ำทะเลถูกลมดันและแรงดันอากาศต่ำยกระดับน้ำสูงขึ้นท่วมชายฝั่ง ไม่ใช่แค่ลมแรง · ระดับความรุนแรงแบบแซฟฟีร์–ซิมป์สันมี 5 ระดับ ระดับ 5 ลมตั้งแต่ราว 252 กม./ชม.', fig: { t: 'emojis', rows: [['🌬️', 1, 'ลมแรง'], ['🌊', 1, 'คลื่นพายุซัดฝั่ง (อันตรายมาก)'], ['🌧️', 1, 'ฝนตกหนัก น้ำท่วม']] } },
    { say: '<b>ฟ้าผ่า</b> เกิดจากประจุไฟฟ้าต่างขั้วสะสมในเมฆ จนอากาศเป็นฉนวนไม่ไหวแล้วเกิดการคายประจุ แสงมาถึงเกือบทันที แต่เสียงเดินทางราว <b>340 ม./วินาที</b> นับวินาทีจากเห็นฟ้าแลบถึงได้ยินเสียง × 340 = ระยะ เช่น 3 วินาที ≈ 1,020 ม. ประมาณ 1 กม.', fig: { t: 'formula', lines: ['ระยะ = 340 × เวลา (วินาที)', '3 วินาที → 340 × 3 = 1,020 ม.', 'ประมาณ 1 กม.'] } }
  ] },
  { id: 'ls_scenso4', level: 'm4', subject: 'sci', gen: 'sci4_adv', icon: '🌡️', title: 'ENSO: เอลนีโญและลานีญาเชิงลึก', blurb: 'การไหลเวียนวอล์กเกอร์ อัปเวลลิง ผลต่อไทย', pages: [
    { say: '<b>ENSO</b> คือวัฏจักรอุณหภูมิน้ำทะเลและลมเหนือมหาสมุทรแปซิฟิกเขตร้อน มี 3 ภาวะ: <b>เอลนีโญ</b> (อุ่นกว่าปกติ) · <b>ลานีญา</b> (เย็นกว่าปกติ) · <b>เป็นกลาง</b>', fig: { t: 'formula', lines: ['เอลนีโญ = น้ำอุ่นกว่าปกติ', 'ลานีญา = น้ำเย็นกว่าปกติ', 'เป็นกลาง = ใกล้ปกติ'] } },
    { say: 'ภาวะปกติมี <b>การไหลเวียนวอล์กเกอร์</b>: ลมค้าพัดจากตะวันออกไปตะวันตก พาน้ำอุ่นไปกองฝั่งเอเชียและออสเตรเลีย อากาศชื้นลอยขึ้นฝนมาก ส่วนฝั่งเปรูมี <b>อัปเวลลิง</b> น้ำเย็นอุดมสารอาหารดันขึ้นมา ปลาชุกชุม', fig: { t: 'formula', lines: ['ลมค้า ตะวันออก → ตะวันตก', 'ตะวันตก: น้ำอุ่น ฝนมาก', 'ตะวันออก: อัปเวลลิง น้ำเย็น ปลาเยอะ'] } },
    { say: '<b>เอลนีโญ</b> ลมค้าอ่อน น้ำอุ่นไหลย้อนไปฝั่งตะวันออก อัปเวลลิงลดลง ปลาที่เปรูลดลง และเขตฝนย้ายตามน้ำอุ่น ไทยฝนน้อย ร้อนและแล้ง · <b>ลานีญา</b> ลมค้าแรงขึ้น อัปเวลลิงเด่นขึ้น ไทยฝนมาก น้ำท่วมง่าย', fig: { t: 'emojis', rows: [['🌡️', 1, 'เอลนีโญ: ลมอ่อน ไทยแล้ง'], ['❄️', 1, 'ลานีญา: ลมแรง ไทยฝนมาก'], ['🐟', 1, 'เอลนีโญ: ปลาเปรูลดลง']] } },
    { say: 'นักวิทยาศาสตร์ดูว่าเป็นภาวะไหนจาก <b>อุณหภูมิผิวน้ำทะเล</b> กลางมหาสมุทรแปซิฟิกเทียบค่าปกติ ถ้าสูงกว่าปกติราว 0.5 °C ขึ้นไปต่อเนื่องหลายเดือนถือเป็นเอลนีโญ ต่ำกว่าปกติราว 0.5 °C ต่อเนื่องคือลานีญา', fig: { t: 'formula', lines: ['สูงกว่าปกติ ≥ 0.5 °C ต่อเนื่อง → เอลนีโญ', 'ต่ำกว่าปกติ ≥ 0.5 °C ต่อเนื่อง → ลานีญา', 'เกิดซ้ำราว 2 – 7 ปี'] } },
    { say: 'ผลต่อชีวิต: เอลนีโญ เกษตรกรขาดน้ำ น้ำในเขื่อนลด ไฟป่าเพิ่ม · ลานีญา เสี่ยงน้ำท่วมและดินถล่ม ต้องวางแผนการปล่อยน้ำเขื่อนและการเพาะปลูกล่วงหน้า', fig: { t: 'formula', lines: ['เอลนีโญ → แล้ง เขื่อนน้ำน้อย', 'ลานีญา → ท่วม ดินถล่ม', 'วางแผนน้ำล่วงหน้า'] } }
  ] },
  { id: 'ls_scwarm', level: 'm1', subject: 'sci', gen: 'sci1_earth', icon: '🌍', title: 'โลกร้อนและภาวะเรือนกระจก', blurb: 'แก๊สเรือนกระจก สาเหตุ ผลกระทบ วิธีช่วยโลก', pages: [
    { say: 'โลกมี <b>แก๊สเรือนกระจก</b> เช่น คาร์บอนไดออกไซด์ มีเทน ไอน้ำ ทำหน้าที่เหมือนผ้าห่มกักความร้อนไว้ ตามธรรมชาติเป็นเรื่องดี ถ้าไม่มีเลย โลกจะเย็นจัดจนอยู่ไม่ได้', fig: { t: 'formula', lines: ['แก๊สเรือนกระจก = ผ้าห่มโลก', 'CO₂ · มีเทน · ไอน้ำ', 'พอดี → โลกอุ่นพอให้มีชีวิต'] } },
    { say: 'แต่เมื่อมนุษย์ปล่อยมากเกินไป โลกก็อุ่นขึ้นเรื่อย ๆ เรียกว่า <b>โลกร้อน</b> สาเหตุหลัก: เผา <b>ถ่านหิน น้ำมัน แก๊ส</b> · ตัดไม้ทำลายป่า · ปศุสัตว์และนาข้าวปล่อยมีเทน', fig: { t: 'emojis', rows: [['🏭', 1, 'เผาเชื้อเพลิงฟอสซิล'], ['🪓', 1, 'ตัดไม้ทำลายป่า'], ['🐄', 1, 'ปศุสัตว์ปล่อยมีเทน']] } },
    { say: 'ต้นไม้ช่วยดูดซับ CO₂ ตอนสังเคราะห์ด้วยแสง การเผาป่าจึงเสียสองต่อ: <b>ปล่อย CO₂ ออกมา</b> และ <b>เสียต้นไม้ที่เคยดูดซับ</b>', fig: { t: 'formula', lines: ['ต้นไม้ + แสง → ดูดซับ CO₂', 'เผาป่า → ปล่อย CO₂', 'ป่าน้อยลง → ดูดซับได้น้อยลง'] } },
    { say: '<b>ผลกระทบ</b>: น้ำแข็งขั้วโลกและธารน้ำแข็งละลาย ระดับน้ำทะเลสูงขึ้น · อากาศแปรปรวน ร้อนจัด ฝนหนัก แล้งนาน · ปะการังฟอกขาว สัตว์ที่ปรับตัวไม่ทันอยู่ลำบาก', fig: { t: 'emojis', rows: [['🧊', 1, 'น้ำแข็งละลาย'], ['🌊', 1, 'ระดับน้ำทะเลสูงขึ้น'], ['🪸', 1, 'ปะการังฟอกขาว']] } },
    { say: '<b>ช่วยโลกได้</b>: ประหยัดไฟ · ใช้พลังงานสะอาด (แสงอาทิตย์ ลม น้ำ) · เดิน ปั่นจักรยาน ใช้ขนส่งสาธารณะ · ปลูกต้นไม้ · ใช้ซ้ำและรีไซเคิล (3R)', fig: { t: 'formula', lines: ['ลดการเผาเชื้อเพลิง', 'ปลูกต้นไม้', 'ใช้ซ้ำ รีไซเคิล', 'ใช้พลังงานสะอาด'] } }
  ] },
  { id: 'ls_scpm', level: 'm1', subject: 'sci', gen: 'sci1_earth', icon: '😷', title: 'ฝุ่น PM2.5 รู้ไว้ป้องกันได้', blurb: 'ขนาด แหล่งที่มา ผลต่อสุขภาพ วิธีป้องกัน', pages: [
    { say: '<b>PM2.5</b> คือฝุ่นละอองที่มีขนาดไม่เกิน <b>2.5 ไมโครเมตร</b> เล็กกว่าเส้นผมหลายสิบเท่า จึงลอยในอากาศได้นาน และหายใจเข้าไปลึกถึงถุงลมปอดได้', fig: { t: 'formula', lines: ['PM2.5 ≤ 2.5 ไมโครเมตร', 'เล็กกว่าเส้นผมหลายสิบเท่า', 'เข้าถึงถุงลมปอดได้'] } },
    { say: '<b>แหล่งกำเนิด</b>: ควันรถ โดยเฉพาะดีเซล · เผาในที่โล่ง (เผาขยะ เผาฟางและตอซัง) · ไฟป่า · โรงงานและการก่อสร้าง', fig: { t: 'emojis', rows: [['🚛', 1, 'ควันรถ'], ['🔥', 1, 'เผาในที่โล่ง ไฟป่า'], ['🏗️', 1, 'โรงงาน ก่อสร้าง']] } },
    { say: 'ทำไมช่วงปลายปีถึงต้นปีฝุ่นเยอะ? เพราะอากาศนิ่ง ลมพัดน้อย ฝุ่นไม่ถูกพัดไป และไม่มีฝนชะล้าง ฝุ่นจึงสะสมในอากาศ', fig: { t: 'formula', lines: ['ลมน้อย + อากาศนิ่ง', '+ ไม่มีฝน', '→ ฝุ่นสะสม'] } },
    { say: '<b>ผลต่อสุขภาพ</b>: ระคายเคืองตา จมูก คอ ไอ หายใจลำบาก เสี่ยงโรคปอดและหัวใจ เด็ก ผู้สูงอายุ และคนเป็นหอบหืดเสี่ยงมากกว่า', fig: { t: 'formula', lines: ['ระคายตา จมูก คอ', 'ไอ หายใจลำบาก', 'เด็กและผู้สูงอายุเสี่ยงกว่า'] } },
    { say: '<b>วิธีป้องกัน</b>: ดูค่าฝุ่นก่อนออกจากบ้าน · ใส่หน้ากากที่กรองฝุ่นเล็กได้ เช่น N95 · วันฝุ่นมากอยู่ในอาคารปิดประตูหน้าต่าง งดออกกำลังกายกลางแจ้ง · ไม่เผาขยะ', fig: { t: 'emojis', rows: [['📱', 1, 'เช็กค่าฝุ่น'], ['😷', 1, 'หน้ากาก N95'], ['🏠', 1, 'อยู่ในอาคาร']] } }
  ] },
  { id: 'ls_scsolar', level: 'm1', subject: 'sci', gen: 'sci1_earth', icon: '🪐', title: 'ระบบสุริยะและดาวเคราะห์ทั้งแปด', blurb: 'ลำดับดาวเคราะห์ ดาวหิน ดาวแก๊ส', pages: [
    { say: '<b>ระบบสุริยะ</b> มีดวงอาทิตย์ (ดาวฤกษ์ ให้แสงเองได้) เป็นศูนย์กลาง และมีดาวเคราะห์ 8 ดวงโคจรรอบ ดาวเคราะห์ไม่ได้ให้แสงเอง แต่สะท้อนแสงอาทิตย์', fig: { t: 'formula', lines: ['ดาวฤกษ์ = ให้แสงเอง', 'ดาวเคราะห์ = สะท้อนแสง', 'ดาวเคราะห์ 8 ดวง'] } },
    { say: 'เรียงจากใกล้อาทิตย์: <b>พุธ ศุกร์ โลก อังคาร พฤหัสบดี เสาร์ ยูเรนัส เนปจูน</b> จำเป็นประโยคเดียวได้เลย และโลกเป็นดวงที่ 3', fig: { t: 'formula', lines: ['1 พุธ · 2 ศุกร์ · 3 โลก · 4 อังคาร', '5 พฤหัสบดี · 6 เสาร์', '7 ยูเรนัส · 8 เนปจูน'] } },
    { say: '4 ดวงในเป็น <b>ดาวเคราะห์หิน</b> (พุธ ศุกร์ โลก อังคาร) พื้นผิวแข็ง ขนาดเล็ก · 4 ดวงนอกเป็น <b>ดาวเคราะห์ยักษ์</b> พฤหัสบดีและเสาร์เป็นยักษ์แก๊ส ยูเรนัสและเนปจูนเป็นยักษ์น้ำแข็ง', fig: { t: 'formula', lines: ['ใน: พุธ ศุกร์ โลก อังคาร → หิน', 'นอก: พฤหัสบดี เสาร์ → ยักษ์แก๊ส', 'ยูเรนัส เนปจูน → ยักษ์น้ำแข็ง'] } },
    { say: 'ข้อควรรู้: <b>พุธ</b> ใกล้อาทิตย์สุด · <b>ศุกร์</b> ร้อนที่สุดเพราะมีภาวะเรือนกระจกรุนแรง · <b>พฤหัสบดี</b> ใหญ่ที่สุด · <b>เสาร์</b> มีวงแหวนเด่น · <b>อังคาร</b> เรียกดาวแดง', fig: { t: 'emojis', rows: [['☿️', 1, 'พุธ ใกล้อาทิตย์สุด'], ['🔥', 1, 'ศุกร์ ร้อนที่สุด'], ['🪐', 1, 'เสาร์ มีวงแหวน'], ['🔴', 1, 'อังคาร ดาวแดง']] } },
    { say: 'ระหว่างอังคารกับพฤหัสบดีมี <b>แถบดาวเคราะห์น้อย</b> · พลูโตถูกจัดเป็น <b>ดาวเคราะห์แคระ</b> เมื่อ พ.ศ. 2549 จึงไม่นับเป็นดาวเคราะห์แล้ว', fig: { t: 'formula', lines: ['อังคาร | แถบดาวเคราะห์น้อย | พฤหัสบดี', 'พลูโต = ดาวเคราะห์แคระ (2549)'] } }
  ] },
  { id: 'ls_scwarm4', level: 'm4', subject: 'sci', gen: 'sci4_adv', icon: '🌡️', title: 'โลกร้อนเชิงลึก: วัฏจักรคาร์บอนและป้อนกลับ', blurb: 'CO₂ น้ำทะเลสูงขึ้น กรดในมหาสมุทร', pages: [
    { say: 'ระดับ CO₂ ในอากาศก่อนยุคอุตสาหกรรมอยู่ราว <b>280 ppm</b> ปัจจุบันราว <b>420 ppm</b> ขึ้นไป อุณหภูมิเฉลี่ยโลกสูงขึ้นมากกว่า 1 °C ข้อตกลงปารีสตั้งเป้าไม่ให้เกิน <b>1.5 °C</b>', fig: { t: 'formula', lines: ['CO₂ ก่อนอุตสาหกรรม ≈ 280 ppm', 'CO₂ ปัจจุบัน ≈ 420 ppm ขึ้นไป', 'เป้าปารีส ไม่เกิน 1.5 °C'] } },
    { say: '<b>วัฏจักรคาร์บอน</b>: พืชดูดซับ CO₂ ด้วยการสังเคราะห์ด้วยแสง ทุกชีวิตหายใจปล่อย CO₂ ซากพืชซากสัตว์ทับถมนานล้านปีกลายเป็น <b>เชื้อเพลิงฟอสซิล</b> การเผามันคือการปล่อยคาร์บอนที่สะสมมานานออกมาในเวลาสั้น ๆ', fig: { t: 'formula', lines: ['พืช: CO₂ → อาหาร + O₂', 'สัตว์/พืช หายใจ → CO₂', 'ฟอสซิล เผา → CO₂ มาก'] } },
    { say: '<b>การป้อนกลับ (feedback)</b>: น้ำแข็งขาวสะท้อนแสงได้ดี พอละลายเหลือน้ำทะเลสีเข้มที่ดูดความร้อนมากขึ้น ยิ่งร้อนยิ่งละลาย ยิ่งละลายยิ่งร้อน เป็นวงจรเร่งตัวเอง', fig: { t: 'formula', lines: ['น้ำแข็งละลาย', '→ พื้นผิวสีเข้มดูดความร้อน', '→ ร้อนขึ้น → ละลายเพิ่ม'] } },
    { say: 'ระดับน้ำทะเลสูงขึ้นเพราะ 2 เหตุผล: <b>น้ำอุ่นขยายตัว</b> และ <b>น้ำแข็งบนแผ่นดิน</b> (ธารน้ำแข็ง แผ่นน้ำแข็ง) ละลายไหลลงทะเล · แต่น้ำแข็งที่ลอยอยู่ในทะเลอยู่แล้วละลาย ไม่ทำให้ระดับน้ำเปลี่ยน', fig: { t: 'formula', lines: ['น้ำอุ่นขยายตัว → ระดับขึ้น', 'น้ำแข็งบนบกละลาย → ระดับขึ้น', 'น้ำแข็งลอยในทะเลละลาย → ไม่ขึ้น'] } },
    { say: 'มหาสมุทรดูดซับ CO₂ ส่วนหนึ่งไว้ CO₂ ละลายน้ำเกิด <b>กรดคาร์บอนิก</b> ทำให้น้ำทะเลเป็นกรดมากขึ้น กระทบสัตว์ที่สร้างเปลือกหรือโครงจากแคลเซียมคาร์บอเนต เช่น ปะการัง หอย', fig: { t: 'formula', lines: ['CO₂ + H₂O → H₂CO₃', 'น้ำทะเลเป็นกรดมากขึ้น', 'เปลือกหอย ปะการังอ่อนแอ'] } }
  ] },
  { id: 'ls_scpm4', level: 'm4', subject: 'sci', gen: 'sci4_adv', icon: '😷', title: 'PM2.5 เชิงลึก: ชั้นอากาศกลับและฝุ่นทุติยภูมิ', blurb: 'ชั้นอากาศกลับ PM10 กับ PM2.5 มาตรฐานและการลดฝุ่น', pages: [
    { say: '<b>PM10</b> ขนาดไม่เกิน 10 ไมโครเมตร ถูกกรองได้ที่จมูกและคอบางส่วน · <b>PM2.5</b> ไม่เกิน 2.5 ไมโครเมตร ลึกถึงถุงลมปอด เส้นผมกว้างราว 70 ไมโครเมตร ใหญ่กว่า PM2.5 ราว 70 ÷ 2.5 = <b>28 เท่า</b>', fig: { t: 'formula', lines: ['PM10 ≤ 10 ไมโครเมตร', 'PM2.5 ≤ 2.5 ไมโครเมตร', 'เส้นผม 70 ÷ 2.5 = 28 เท่า'] } },
    { say: 'ฝุ่นมี 2 แบบ: <b>ปฐมภูมิ</b> ปล่อยออกมาเป็นฝุ่นโดยตรง (ควัน เขม่า) และ <b>ทุติยภูมิ</b> เกิดในอากาศจากแก๊สอย่าง NOₓ SO₂ แอมโมเนีย ทำปฏิกิริยากันกลายเป็นอนุภาคเล็ก ๆ เช่น เกลือแอมโมเนียมไนเตรต', fig: { t: 'formula', lines: ['ปฐมภูมิ = ปล่อยเป็นฝุ่นเลย', 'ทุติยภูมิ = แก๊ส → ปฏิกิริยา → ฝุ่น'] } },
    { say: 'ปกติอากาศยิ่งสูงยิ่งเย็น อากาศร้อนข้างล่างลอยขึ้นพาฝุ่นไป แต่ในคืนที่หนาวเงียบ เกิด <b>ชั้นอากาศกลับ (temperature inversion)</b> อากาศอุ่นทับอากาศเย็นข้างล่าง เหมือนมีฝาปิด ฝุ่นลอยขึ้นไม่ได้', fig: { t: 'formula', lines: ['ปกติ: สูงขึ้น → เย็นลง → ลอยขึ้นได้', 'อากาศกลับ: อุ่นทับเย็น', 'ฝุ่นถูกกดอยู่ข้างล่าง'] } },
    { say: 'เมืองในแอ่งหรือหุบเขา เช่น ภาคเหนือตอนบน เจอปัญหานี้หนักเพราะภูเขากั้นลม ประกอบกับการเผาในช่วงแล้ง ฝุ่นจึงสะสมหนาและหายไปเมื่อมีลมแรงหรือฝนตก', fig: { t: 'emojis', rows: [['⛰️', 1, 'แอ่งภูเขากั้นลม'], ['🔥', 1, 'เผาช่วงแล้ง'], ['🌧️', 1, 'ฝนชะล้างฝุ่น']] } },
    { say: 'มาตรฐานฝุ่น PM2.5 เฉลี่ย 24 ชั่วโมงของไทยกำหนดไว้ที่ <b>37.5 ไมโครกรัมต่อลูกบาศก์เมตร</b> (ใช้ตั้งแต่ปี 2566) ลดฝุ่นต้องจัดการที่ต้นทาง: คุมควันดีเซล ห้ามเผา ควบคุมการก่อสร้าง ปลูกต้นไม้', fig: { t: 'formula', lines: ['มาตรฐานไทย 24 ชม. ≈ 37.5 µg/m³', 'ลดที่ต้นทาง', 'ควบคุมควัน ห้ามเผา'] } }
  ] },
  { id: 'ls_scstar4', level: 'm4', subject: 'sci', gen: 'sci4_adv', icon: '🌌', title: 'ดาวฤกษ์ ปีแสง และดาราจักร', blurb: 'ระยะทางในอวกาศ วัฏจักรชีวิตดาว ทางช้างเผือก', pages: [
    { say: '<b>1 ปีแสง</b> คือระยะที่แสงเดินทางใน 1 ปี ประมาณ <b>9.46 ล้านล้านกิโลเมตร</b> ใช้วัดระยะทางไกลมากในอวกาศ ปีแสงเป็นหน่วยของ <b>ระยะทาง</b> ไม่ใช่เวลา', fig: { t: 'formula', lines: ['ปีแสง = หน่วยระยะทาง', '1 ปีแสง ≈ 9.46 ล้านล้าน กม.', 'แสง ≈ 300,000 กม./วินาที'] } },
    { say: 'ลองคำนวณ: ดวงอาทิตย์ห่างโลกราว 150 ล้านกิโลเมตร แสงเดินทาง 300,000 กม./วินาที ใช้เวลา 150,000,000 ÷ 300,000 = 500 วินาที ≈ <b>8.3 นาที</b> เราเห็นดวงอาทิตย์ในอดีต 8 นาที', fig: { t: 'formula', lines: ['เวลา = ระยะทาง ÷ ความเร็ว', '150,000,000 ÷ 300,000 = 500 วินาที', '≈ 8.3 นาที'] } },
    { say: 'ดาวฤกษ์ที่ใกล้เราที่สุดรองจากดวงอาทิตย์คือ <b>พร็อกซิมาเซนทอรี</b> ห่างราว 4.2 ปีแสง ดาวที่ห่าง 10 ปีแสง เราเห็นแสงที่ออกมาเมื่อ 10 ปีก่อน มองดาวไกลคือมองย้อนอดีต', fig: { t: 'emojis', rows: [['☀️', 1, 'อาทิตย์ แสงมาถึง 8.3 นาที'], ['⭐', 1, 'พร็อกซิมาเซนทอรี 4.2 ปีแสง'], ['🔭', 1, 'ไกลกว่า = เห็นอดีตไกลกว่า']] } },
    { say: '<b>วัฏจักรดาว</b>: เนบิวลา (ก๊าซและฝุ่น) → ดาวฤกษ์ที่เผาไฮโดรเจนเป็นฮีเลียมด้วยนิวเคลียร์ฟิวชัน → ดาวยักษ์แดง → ดาวมวลน้อยเป็น <b>ดาวแคระขาว</b> · ดาวมวลมากระเบิดเป็น <b>ซูเปอร์โนวา</b> เหลือดาวนิวตรอนหรือหลุมดำ', fig: { t: 'formula', lines: ['เนบิวลา → ดาวฤกษ์ (H → He)', '→ ยักษ์แดง', 'มวลน้อย → แคระขาว', 'มวลมาก → ซูเปอร์โนวา → นิวตรอน/หลุมดำ'] } },
    { say: 'ดาวฤกษ์นับพันล้านดวงรวมกันเป็น <b>ดาราจักร (กาแล็กซี)</b> ระบบสุริยะอยู่ในดาราจักร <b>ทางช้างเผือก</b> ซึ่งเป็นแบบก้นหอย ดวงอาทิตย์อยู่ในแขนก้นหอยด้านนอกของมัน', fig: { t: 'formula', lines: ['ดาวฤกษ์หลายพันล้านดวง = ดาราจักร', 'เรา: ทางช้างเผือก (ก้นหอย)', 'อาทิตย์อยู่แขนนอก'] } }
  ] },
  { id: 'ls_scelnino', level: 'm1', subject: 'sci', gen: 'sci1_earth', icon: '🌡️', title: 'เอลนีโญ และ ลานีญา', blurb: 'น้ำทะเลแปซิฟิก ลมค้า ฝนแล้งของไทย', pages: [
    { say: 'ปกติลมค้าพัดจาก <b>ตะวันออกไปตะวันตก</b> เหนือมหาสมุทรแปซิฟิก ดันน้ำอุ่นไปกองฝั่งเอเชียและออสเตรเลีย ทำให้ฝั่งอเมริกาใต้น้ำเย็น เรียกว่าภาวะปกติ', fig: { t: 'formula', lines: ['ลมค้า: ตะวันออก → ตะวันตก', 'น้ำอุ่นกองฝั่งเอเชีย', 'น้ำเย็นฝั่งอเมริกาใต้'] } },
    { say: '<b>เอลนีโญ (El Niño)</b> ลมค้า<b>อ่อนลง</b> น้ำอุ่นไหลย้อนไปฝั่งอเมริกาใต้ น้ำทะเลแปซิฟิกตอนกลางค่อนไปทางตะวันออก <b>อุ่นกว่าปกติ</b>', fig: { t: 'formula', lines: ['ลมค้าอ่อน', '→ น้ำอุ่นไหลไปตะวันออก', '→ เอลนีโญ'] } },
    { say: 'ผลต่อประเทศไทยตอนเอลนีโญ: <b>ฝนน้อย อากาศร้อนจัด แล้ง</b> น้ำในเขื่อนลดลง เกษตรกรเสียหาย ต้องประหยัดน้ำและปลูกพืชใช้น้ำน้อย', fig: { t: 'emojis', rows: [['☀️', 1, 'ร้อนจัด'], ['🏜️', 1, 'ฝนน้อย แล้ง'], ['💧', 1, 'น้ำในเขื่อนลด']] } },
    { say: '<b>ลานีญา (La Niña)</b> ลมค้า<b>แรงขึ้น</b> ดันน้ำอุ่นไปฝั่งเอเชียมากกว่าปกติ น้ำทะเลแปซิฟิกตะวันออกเย็นกว่าปกติ ผลต่อไทยคือ <b>ฝนมาก น้ำท่วม หนาวนาน</b>', fig: { t: 'emojis', rows: [['🌧️', 1, 'ฝนมาก'], ['🌊', 1, 'น้ำท่วม'], ['🥶', 1, 'หนาวนานขึ้น']] } },
    { say: 'สรุปเปรียบเทียบ: เอลนีโญเกิดซ้ำทุก 2–7 ปีโดยประมาณ สลับกับลานีญา จำง่าย ๆ <b>เอลนีโญ = ร้อน-แล้ง · ลานีญา = เย็น-ชื้น-ฝนมาก</b>', fig: { t: 'formula', lines: ['เอลนีโญ: ลมอ่อน · อุ่น · แล้ง', 'ลานีญา: ลมแรง · เย็น · ฝนมาก', 'วนทุก 2 – 7 ปี'] } }
  ] },
  { id: 'ls_socdam', level: 'm1', subject: 'soc', gen: 'soc1_geo', icon: '🏞️', title: 'เขื่อนในประเทศไทย', blurb: 'ประโยชน์ ที่ตั้ง ผลกระทบของเขื่อน', pages: [
    { say: '<b>เขื่อน</b> คือสิ่งก่อสร้างกั้นลำน้ำเพื่อกักเก็บน้ำไว้ในอ่างเก็บน้ำ ประเทศไทยมีฝนตกไม่ทั่วถึงทั้งปี เขื่อนช่วยเก็บน้ำช่วงฝนไว้ใช้ช่วงแล้ง', fig: { t: 'formula', lines: ['กั้นแม่น้ำ', '→ เกิดอ่างเก็บน้ำ', '→ ปล่อยน้ำใช้ตามต้องการ'] } },
    { say: '<b>ประโยชน์</b> ของเขื่อนแบบอเนกประสงค์: ชลประทานเพื่อการเกษตร · ผลิตกระแสไฟฟ้า · ป้องกันน้ำท่วม · น้ำอุปโภคบริโภค · เลี้ยงปลา และท่องเที่ยว', fig: { t: 'emojis', rows: [['🌾', 1, 'ชลประทาน'], ['⚡', 1, 'ผลิตไฟฟ้า'], ['🛟', 1, 'ป้องกันน้ำท่วม'], ['🐟', 1, 'ประมง ท่องเที่ยว']] } },
    { say: 'เขื่อนสำคัญ: <b>ภูมิพล</b> (ตาก · แม่น้ำปิง) · <b>สิริกิติ์</b> (อุตรดิตถ์ · แม่น้ำน่าน) · <b>ศรีนครินทร์</b> (กาญจนบุรี · แม่น้ำแควใหญ่) · <b>อุบลรัตน์</b> (ขอนแก่น · แม่น้ำพอง) · <b>ป่าสักชลสิทธิ์</b> (ลพบุรี · แม่น้ำป่าสัก)', fig: { t: 'formula', lines: ['ภูมิพล: ตาก · แม่น้ำปิง', 'สิริกิติ์: อุตรดิตถ์ · แม่น้ำน่าน', 'ศรีนครินทร์: กาญจนบุรี · แควใหญ่', 'อุบลรัตน์: ขอนแก่น · แม่น้ำพอง', 'ป่าสักฯ: ลพบุรี · แม่น้ำป่าสัก'] } },
