  { id: 'ls_pheat1', level: 'm1', subject: 'sci', gen: 'sci1_energy', icon: '🌡️', title: 'ความร้อนมาจากไหน ไปทางไหน', blurb: 'อุณหภูมิ ความร้อน และการนำ การพา การแผ่รังสี', pages: [
    { say: 'ป้าไก่ขอแยกสองคำนี้ก่อนนะ <b>อุณหภูมิ</b> บอกว่าร้อนหรือเย็นแค่ไหน ส่วน <b>ความร้อน</b> คือพลังงานที่ไหลจากของร้อนไปหาของเย็น วัดอุณหภูมิด้วยเทอร์มอมิเตอร์', fig: { t: 'formula', lines: ['อุณหภูมิ = ระดับร้อน-เย็น', 'ความร้อน = พลังงานที่ถ่ายโอน', 'ความร้อนไหลจากร้อน ไปเย็น'] } },
    { say: 'หน่วยอุณหภูมิที่ใช้บ่อยคือ <b>องศาเซลเซียส (°C)</b> น้ำแข็งละลายที่ 0 °C น้ำเดือดที่ 100 °C ส่วนหน่วยของนักวิทยาศาสตร์คือ <b>เคลวิน (K)</b> แปลงได้โดย K = °C + 273', fig: { t: 'formula', lines: ['K = °C + 273', '0 °C = 273 K', '100 °C = 373 K'] } },
    { say: '<b>การนำความร้อน</b> คือความร้อนส่งต่อผ่านเนื้อวัตถุ เหมือนส่งต่อกันเป็นทอด ๆ จากอนุภาคที่สั่นแรงไปหาอนุภาคข้างเคียง เช่น ช้อนโลหะที่แช่ในซุปร้อนแล้วด้ามร้อนตาม', fig: { t: 'emojis', rows: [['🥄', 1, 'ช้อนโลหะแช่ซุปร้อน'], ['🍲', 1, 'ด้ามร้อนขึ้นเรื่อย ๆ']] } },
    { say: '<b>การพาความร้อน</b> เกิดในของเหลวและแก๊ส ส่วนที่ร้อนจะขยายตัว เบาลงแล้วลอยขึ้น ส่วนที่เย็นหนักกว่าจะจมลงมาแทน หมุนเวียนเป็นวงจร เช่น น้ำในหม้อต้ม ลมบก ลมทะเล', fig: { t: 'emojis', rows: [['♨️', 1, 'น้ำร้อนลอยขึ้น'], ['💧', 1, 'น้ำเย็นจมลง']] } },
    { say: '<b>การแผ่รังสีความร้อน</b> คือความร้อนเดินทางเป็นคลื่นได้โดยไม่ต้องมีตัวกลาง จึงมาถึงโลกจากดวงอาทิตย์ผ่านอวกาศได้ ผิวสีดำดูดรังสีได้ดี ผิวขาวเงาสะท้อนได้ดี', fig: { t: 'emojis', rows: [['☀️', 1, 'แผ่รังสีมาถึงโลก'], ['🔥', 1, 'อุ่นมือตอนผิงไฟ']] } },
    { say: 'วัสดุนำความร้อนดี เช่น โลหะ เรียก <b>ตัวนำความร้อน</b> วัสดุนำไม่ดี เช่น ไม้ พลาสติก อากาศ เรียก <b>ฉนวน</b> สารส่วนใหญ่ขยายตัวเมื่อร้อน และเมื่อของสองอย่างอุณหภูมิเท่ากันแล้วเรียกว่า <b>สมดุลความร้อน</b>', fig: { t: 'formula', lines: ['ตัวนำ: ทองแดง เหล็ก', 'ฉนวน: ไม้ พลาสติก อากาศ', 'อุณหภูมิเท่ากัน = สมดุลความร้อน'] } }
  ] },
  { id: 'ls_plight1', level: 'm1', subject: 'sci', gen: 'sci1_energy', icon: '💡', title: 'แสงกับการมองเห็น', blurb: 'แสงเดินทางตรง สะท้อน หักเห เงา และสีของวัตถุ', pages: [
    { say: 'แสงเดินทางเป็น<b>เส้นตรง</b> และเร็วมาก ประมาณ 300,000,000 เมตรต่อวินาที เรามองเห็นของได้เพราะมีแสงจากวัตถุเข้าตาเรา เช่น แสงสะท้อนจากสมุดเข้ามาที่ตา', fig: { t: 'emojis', rows: [['💡', 1, 'แหล่งกำเนิดแสง'], ['📖', 1, 'แสงสะท้อนเข้าตา'], ['👁️', 1, 'ตามองเห็น']] } },
    { say: '<b>การสะท้อนของแสง</b> มีกฎง่าย ๆ ว่า มุมตกกระทบ เท่ากับ มุมสะท้อน โดยวัดมุมจากเส้นปกติ ซึ่งเป็นเส้นตั้งฉากกับผิวสะท้อน ถ้าแสงตกกระทบ 30° ก็สะท้อนออก 30°', fig: { t: 'formula', lines: ['มุมตกกระทบ = มุมสะท้อน', 'วัดจากเส้นปกติ', 'ตัวอย่าง 30° → 30°'] } },
    { say: '<b>กระจกเงาราบ</b> ให้ภาพเสมือนที่อยู่หลังกระจก ขนาดเท่าวัตถุจริง ระยะภาพเท่ากับระยะวัตถุ และกลับซ้ายขวา เช่น ยกมือขวา ภาพในกระจกดูเหมือนยกมือซ้าย', fig: { t: 'emojis', rows: [['🧍', 1, 'วัตถุจริง'], ['🪞', 1, 'กระจกเงาราบ'], ['👥', 1, 'ภาพเสมือน ขนาดเท่าเดิม']] } },
    { say: '<b>การหักเหของแสง</b> คือแสงเปลี่ยนทิศเมื่อผ่านตัวกลางต่างชนิด เช่น จากอากาศลงน้ำ เพราะความเร็วแสงเปลี่ยน ทำให้ดินสอในแก้วน้ำดูหักงอ และก้นสระดูตื้นกว่าจริง', fig: { t: 'emojis', rows: [['🥤', 1, 'ดินสอในน้ำดูหักงอ'], ['🏊', 1, 'ก้นสระดูตื้นกว่าจริง']] } },
    { say: 'เราเห็นแอปเปิลเป็นสีแดงเพราะผิวมัน<b>สะท้อนแสงสีแดง</b>เข้าตา แล้วดูดแสงสีอื่นไว้ วัตถุสีขาวสะท้อนเกือบทุกสี วัตถุสีดำดูดเกือบทุกสี', fig: { t: 'emojis', rows: [['🍎', 1, 'สะท้อนแดง ดูดสีอื่น'], ['⬜', 1, 'ขาว สะท้อนเกือบทุกสี'], ['⬛', 1, 'ดำ ดูดเกือบทุกสี']] } },
    { say: '<b>เงา</b> เกิดเพราะแสงไม่ผ่านวัตถุทึบแสง บริเวณที่แสงถูกบังหมดเป็น<b>เงามืด</b> บริเวณที่แสงถูกบังบางส่วนเป็น<b>เงามัว</b> เงามัวเกิดเมื่อแหล่งกำเนิดแสงมีขนาดใหญ่ เช่น เกิดสุริยุปราคาบางส่วน', fig: { t: 'formula', lines: ['เงามืด = แสงถูกบังหมด', 'เงามัว = แสงถูกบังบางส่วน', 'แหล่งแสงใหญ่ → เงามัวชัด'] } }
  ] },
  { id: 'ls_pforce1', level: 'm1', subject: 'sci', gen: 'sci1_matter', icon: '🧲', title: 'แรง แรงลัพธ์ และแรงเสียดทาน', blurb: 'หน่วยนิวตัน แรงลัพธ์ น้ำหนัก สมดุลของแรง', pages: [
    { say: '<b>แรง</b> คือสิ่งที่ผลัก ดึง หรือทำให้วัตถุเปลี่ยนการเคลื่อนที่หรือเปลี่ยนรูปร่าง หน่วยของแรงคือ <b>นิวตัน (N)</b> แรงมีทั้งขนาดและทิศทาง ต้องบอกทั้งสองอย่าง', fig: { t: 'formula', lines: ['หน่วยแรง = นิวตัน (N)', 'แรงมี ขนาด + ทิศทาง'] } },
    { say: '<b>แรงลัพธ์</b> คือผลรวมของแรงทั้งหมดที่กระทำต่อวัตถุ ถ้าแรงไปทิศเดียวกันให้บวกกัน เช่น ลาก 30 N กับ 20 N ไปทางขวาทั้งคู่ ได้แรงลัพธ์ 50 N ไปทางขวา', fig: { t: 'formula', lines: ['ทิศเดียวกัน: F = F₁ + F₂', '30 N + 20 N = 50 N'] } },
    { say: 'ถ้าแรงสองแรงทิศตรงข้ามกันให้<b>ลบกัน</b> แล้วไปตามทิศของแรงที่มากกว่า เช่น ดึงเชือกไปขวา 30 N ซ้าย 20 N ได้แรงลัพธ์ 30 − 20 = 10 N ไปทางขวา', fig: { t: 'formula', lines: ['ทิศตรงข้าม: F = F₁ − F₂', '30 N − 20 N = 10 N ทางขวา'] } },
    { say: '<b>แรงเสียดทาน</b> เกิดที่ผิวสัมผัสและต้านการเคลื่อนที่ ยิ่งผิวขรุขระหรือกดแน่นยิ่งมาก มีประโยชน์ทำให้เดินไม่ลื่น เบรกได้ แต่ทำให้เครื่องจักรสึกหรอและเสียพลังงานเป็นความร้อน', fig: { t: 'emojis', rows: [['👟', 1, 'ดอกยางช่วยยึดเกาะ'], ['🛢️', 1, 'น้ำมันหล่อลื่นลดเสียดทาน']] } },
    { say: '<b>มวล</b> คือปริมาณเนื้อสาร หน่วยกิโลกรัม ส่วน<b>น้ำหนัก</b> คือแรงโน้มถ่วงที่กระทำต่อวัตถุ หน่วยนิวตัน คิดจาก W = m × g โดยใช้ g = 10 N/kg เช่น มวล 5 kg หนัก 5 × 10 = 50 N', fig: { t: 'formula', lines: ['W = m × g', 'g = 10 N/kg', 'm = 5 kg → W = 50 N'] } },
    { say: 'วัตถุอยู่ใน<b>สมดุลของแรง</b> เมื่อแรงลัพธ์เป็นศูนย์ วัตถุจะหยุดนิ่งหรือเคลื่อนที่ด้วยความเร็วคงที่ เช่น หนังสือวางบนโต๊ะ น้ำหนัก 5 N ลงล่าง โต๊ะดันขึ้น 5 N จึงไม่เคลื่อนที่', fig: { t: 'formula', lines: ['แรงลัพธ์ = 0', 'หนังสือ: ลง 5 N = ขึ้น 5 N', 'จึงนิ่ง'] } }
  ] },
  { id: 'ls_ppress1', level: 'm1', subject: 'sci', gen: 'sci1_matter', icon: '🔪', title: 'ความดัน ทำไมมีดคมตัดง่าย', blurb: 'ความดัน = แรง ÷ พื้นที่ ความดันของเหลวและอากาศ', pages: [
    { say: '<b>ความดัน</b> คือแรงที่กดตั้งฉากต่อพื้นที่ 1 ตารางเมตร คิดจาก P = F ÷ A หน่วย N/m² เรียกอีกชื่อว่า <b>ปาสกาล (Pa)</b> แรงเท่าเดิมแต่พื้นที่เล็ก ความดันยิ่งมาก', fig: { t: 'formula', lines: ['P = F ÷ A', 'F = แรง (N) A = พื้นที่ (m²)', '1 N/m² = 1 Pa'] } },
    { say: 'ตัวอย่าง กล่องหนัก 600 N วางบนพื้นที่ 0.02 m² ความดัน = 600 ÷ 0.02 = 30,000 Pa ถ้าเปลี่ยนไปวางด้านที่พื้นที่ 0.06 m² ความดันจะเหลือ 600 ÷ 0.06 = 10,000 Pa', fig: { t: 'formula', lines: ['600 ÷ 0.02 = 30,000 Pa', '600 ÷ 0.06 = 10,000 Pa', 'พื้นที่ใหญ่ ความดันน้อย'] } },
    { say: 'มีดคมมีพื้นที่ปลายเล็กมาก ออกแรงนิดเดียวก็ได้ความดันสูงจนตัดผักได้ง่าย รองเท้าส้นสูงก็กดพื้นแรงกว่ารองเท้าผ้าใบเพราะพื้นที่น้อยกว่า ส่วนรถถังใช้สายพานกว้างเพื่อไม่จมดิน', fig: { t: 'emojis', rows: [['🔪', 1, 'พื้นที่เล็ก ความดันสูง'], ['👠', 1, 'ส้นเล็ก กดพื้นหนัก'], ['🚜', 1, 'ล้อ-สายพานกว้าง ไม่จม']] } },
    { say: '<b>ความดันของของเหลว</b> เพิ่มขึ้นตามความลึก และกดไปทุกทิศทาง นี่คือเหตุผลที่ฐานเขื่อนต้องหนาและแข็งแรงกว่าด้านบน และนักดำน้ำลึกจะรู้สึกอึดอัดหูมากขึ้น', fig: { t: 'emojis', rows: [['🏞️', 1, 'เขื่อนฐานหนาที่สุด'], ['🤿', 1, 'ลึกขึ้น ความดันมากขึ้น']] } },
    { say: 'อากาศมีน้ำหนักจึงกดเราด้วย <b>ความดันบรรยากาศ</b> ที่ระดับน้ำทะเลประมาณ 100,000 Pa (ค่าละเอียดคือ 101,325 Pa) ยิ่งขึ้นที่สูงอากาศบางลง ความดันยิ่งลดลง', fig: { t: 'formula', lines: ['ความดันบรรยากาศ', '≈ 100,000 Pa ที่ระดับทะเล', 'ที่สูง → ความดันลดลง'] } },
    { say: 'ตอนดูดน้ำด้วยหลอด เราลดความดันอากาศในหลอด ความดันบรรยากาศภายนอกที่สูงกว่าจึงดันน้ำขึ้นมาให้เอง เราไม่ได้ดึงน้ำขึ้น ปั๊มดูดและเครื่องดูดฝุ่นก็ใช้หลักเดียวกัน', fig: { t: 'emojis', rows: [['🥤', 1, 'ความดันอากาศดันผิวน้ำ'], ['🧃', 1, 'ลดความดันในหลอด น้ำขึ้น']] } }
  ] },
  { id: 'ls_pcirc1', level: 'm1', subject: 'sci', gen: 'sci1_energy', icon: '🔌', title: 'ไฟฟ้า วงจร และความปลอดภัย', blurb: 'ไฟฟ้าสถิต กระแส วงจรอนุกรม-ขนาน ฟิวส์', pages: [
    { say: '<b>ไฟฟ้าสถิต</b> เกิดจากประจุที่สะสมบนวัตถุ ประจุชนิดเดียวกันผลักกัน ต่างชนิด (บวกกับลบ) ดูดกัน เช่น หวีถูผมแล้วดูดเศษกระดาษได้ ฟ้าผ่าก็เป็นไฟฟ้าสถิตขนาดใหญ่', fig: { t: 'formula', lines: ['+ กับ + ผลักกัน', '− กับ − ผลักกัน', '+ กับ − ดูดกัน'] } },
    { say: '<b>กระแสไฟฟ้า</b> คือการไหลของอิเล็กตรอนในตัวนำ มี<b>แรงดันไฟฟ้า</b> (โวลต์) จากแบตเตอรี่คอยผลัก ส่วน<b>ความต้านทาน</b> (โอห์ม) คือสิ่งที่ขวางการไหล ภาพรวมนี้เก็บไว้ก่อน สูตรละเอียดเรียนอีกทีตอน ม.ปลาย', fig: { t: 'formula', lines: ['กระแส = การไหลของประจุ', 'แรงดัน (V) = แรงผลัก', 'ความต้านทาน (Ω) = สิ่งขวาง'] } },
    { say: 'วงจรไฟฟ้าต้องครบวงปิดจึงมีกระแสไหล ประกอบด้วยแหล่งกำเนิด สายไฟ สวิตช์ และหลอดไฟ ตัวนำไฟฟ้า เช่น ทองแดง ให้กระแสผ่านได้ ส่วนฉนวน เช่น พลาสติก ยาง ไม่ให้ผ่าน', fig: { t: 'emojis', rows: [['🔋', 1, 'แหล่งกำเนิด'], ['🔌', 1, 'สายไฟและสวิตช์'], ['💡', 1, 'หลอดไฟ']] } },
    { say: 'วงจร<b>อนุกรม</b>ต่ออุปกรณ์เรียงกันเป็นทางเดียว ถ้าหลอดหนึ่งขาด หลอดอื่นดับหมด วงจร<b>ขนาน</b>แยกเป็นหลายทาง หลอดหนึ่งขาด หลอดอื่นยังติดอยู่ ไฟในบ้านจึงต่อแบบขนาน', fig: { t: 'formula', lines: ['อนุกรม: ทางเดียว หลอดขาด ดับหมด', 'ขนาน: หลายทาง หลอดอื่นยังติด', 'ไฟในบ้านต่อแบบขนาน'] } },
    { say: '<b>ฟิวส์</b> คือเส้นลวดที่หลอมง่าย ถ้ากระแสไหลมากเกินไปจะหลอมขาดก่อน ช่วยตัดวงจรป้องกันสายไฟร้อนจนเกิดไฟไหม้ ปัจจุบันบ้านมักใช้เบรกเกอร์ที่ทำหน้าที่คล้ายกัน', fig: { t: 'emojis', rows: [['⚡', 1, 'กระแสมากเกินไป'], ['🧯', 1, 'ฟิวส์ขาด ตัดวงจร']] } },
    { say: 'ความปลอดภัย ห้ามเสียบปลั๊กด้วยมือเปียก ห้ามเสียบปลั๊กพ่วงหลายอุปกรณ์เกินกำลัง สายไฟชำรุดต้องเปลี่ยน และห้ามอยู่กลางแจ้งหรือใกล้ต้นไม้สูงตอนฟ้าผ่า น้ำธรรมดามีแร่ธาตุจึงนำไฟฟ้าได้', fig: { t: 'emojis', rows: [['🖐️', 1, 'มือเปียกห้ามจับปลั๊ก'], ['🔥', 1, 'ปลั๊กพ่วงห้ามโหลดเกิน'], ['⛈️', 1, 'ฟ้าผ่าอย่าอยู่ที่โล่ง']] } }
  ] },
  { id: 'ls_pmomen4', level: 'm4', subject: 'sci', gen: 'sci4_phys', icon: '🎱', title: 'โมเมนตัมและการชน', blurb: 'p = mv, ดล, การอนุรักษ์โมเมนตัม, ถุงลมนิรภัย', pages: [
    { say: '<b>โมเมนตัม</b> บอกว่าวัตถุที่กำลังเคลื่อนที่ "หยุดยากแค่ไหน" คิดจาก p = m × v หน่วย kg·m/s มีทิศเดียวกับความเร็ว เช่น มวล 2 kg วิ่ง 3 m/s มีโมเมนตัม 6 kg·m/s', fig: { t: 'formula', lines: ['p = m × v', 'm = 2 kg, v = 3 m/s', 'p = 6 kg·m/s'] } },
    { say: '<b>การดล (impulse)</b> คือแรงที่กระทำนาน Δt วินาที เท่ากับ F × Δt และเท่ากับการเปลี่ยนโมเมนตัม Δp เช่น แรง 50 N กระทำ 0.2 s ได้การดล 50 × 0.2 = 10 N·s', fig: { t: 'formula', lines: ['F × Δt = Δp', '50 N × 0.2 s = 10 N·s', 'Δp = 10 kg·m/s'] } },
    { say: '<b>กฎการอนุรักษ์โมเมนตัม</b> ถ้าไม่มีแรงภายนอกมากระทำ ผลรวมโมเมนตัมของระบบก่อนชนเท่ากับหลังชนเสมอ ไม่ว่าการชนจะแรงแค่ไหน ใช้กับรถชน ลูกบิลเลียด และจรวดดีดตัว', fig: { t: 'formula', lines: ['โมเมนตัมก่อนชน', '= โมเมนตัมหลังชน', 'ถ้าไม่มีแรงภายนอก'] } },
    { say: 'ชนแบบ<b>ยืดหยุ่น</b> พลังงานจลน์รวมคงเดิม วัตถุแยกกันหลังชน ส่วนแบบ<b>ไม่ยืดหยุ่น</b> พลังงานจลน์บางส่วนกลายเป็นความร้อนและเสียง ถ้าชนแล้วติดกันไปด้วยกัน เรียกว่าไม่ยืดหยุ่นสมบูรณ์', fig: { t: 'formula', lines: ['ยืดหยุ่น: Ek รวมคงเดิม', 'ไม่ยืดหยุ่น: Ek ลดลง', 'โมเมนตัมคงเดิมทั้งสองแบบ'] } },
    { say: 'ตัวอย่าง รถ 2 kg วิ่ง 3 m/s ชนรถ 1 kg ที่จอดนิ่ง แล้วติดกัน ก่อนชน p = 2 × 3 = 6 หลังชน (2 + 1) × v = 6 ได้ v = 2 m/s ส่วนพลังงานจลน์ลดจาก 9 J เหลือ 6 J', fig: { t: 'formula', lines: ['2 × 3 + 1 × 0 = (2 + 1) × v', '6 = 3v → v = 2 m/s', 'Ek: 9 J → 6 J'] } },
    { say: '<b>ถุงลมนิรภัย</b> ทำให้ร่างกายหยุดช้าลง Δt มากขึ้น เมื่อการดลเท่าเดิม (F × Δt คงที่) แรงที่กระทำต่อเราจึงลดลง นี่คือหลักเดียวกับการงอเข่าตอนลงพื้น และพื้นสนามเด็กเล่นที่เป็นยางนุ่ม', fig: { t: 'emojis', rows: [['🚗', 1, 'ชนแล้วหยุดทันที แรงมาก'], ['🎈', 1, 'ถุงลมยืดเวลาให้หยุด แรงน้อยลง']] } }
  ] },
  { id: 'ls_penergy4', level: 'm4', subject: 'sci', gen: 'sci4_phys', icon: '🎢', title: 'พลังงานกลและการอนุรักษ์พลังงาน', blurb: 'Ek, Ep, งาน, รถรางเลื่อน, ตกอิสระ', pages: [
    { say: '<b>งาน</b> เกิดเมื่อมีแรงทำให้วัตถุเคลื่อนที่ไปตามแนวแรง คิดจาก W = F × s หน่วยจูล (J) เช่น ออกแรงผลักกล่อง 10 N ไปไกล 3 m ทำงาน 10 × 3 = 30 J', fig: { t: 'formula', lines: ['W = F × s', '10 N × 3 m = 30 J', 'หน่วย จูล (J)'] } },
    { say: '<b>พลังงานจลน์</b> คือพลังงานของวัตถุที่กำลังเคลื่อนที่ Ek = ½mv² เช่น มวล 2 kg ความเร็ว 10 m/s ได้ Ek = ½ × 2 × 10² = 100 J ความเร็วมีผลมาก เพราะยกกำลังสอง', fig: { t: 'formula', lines: ['Ek = ½ m v²', '½ × 2 × 10² = 100 J', 'v เป็น 2 เท่า Ek เป็น 4 เท่า'] } },
    { say: '<b>พลังงานศักย์โน้มถ่วง</b> คือพลังงานที่เก็บไว้เพราะอยู่สูง Ep = mgh ใช้ g = 10 m/s² เช่น มวล 2 kg อยู่สูง 5 m จะมี Ep = 2 × 10 × 5 = 100 J', fig: { t: 'formula', lines: ['Ep = m g h', '2 × 10 × 5 = 100 J', 'สูงขึ้น พลังงานศักย์มากขึ้น'] } },
    { say: '<b>กฎการอนุรักษ์พลังงานกล</b> ถ้าไม่มีแรงเสียดทาน พลังงานกลรวม (Ek + Ep) คงที่ ของที่ตกลงมา Ep ลดลงเท่าไร Ek เพิ่มขึ้นเท่านั้น ที่ยอดเป็น Ep เต็ม ที่ก้นเป็น Ek เต็ม', fig: { t: 'formula', lines: ['Ek + Ep = ค่าคงที่', 'ตกลง: Ep ลด Ek เพิ่ม', 'ขึ้นสูง: Ek ลด Ep เพิ่ม'] } },
    { say: 'ตัวอย่าง ปล่อยก้อนหินจากความสูง 20 m ถึงพื้นความเร็วเท่าไร ใช้ mgh = ½mv² ตัด m ได้ v² = 2gh = 2 × 10 × 20 = 400 จึง v = 20 m/s รถรางไร้แรงเสียดทานตกลง 5 m ก็ได้ v = 10 m/s', fig: { t: 'formula', lines: ['mgh = ½ m v²', 'v = √(2gh) = √400', 'v = 20 m/s'] } },
    { say: 'ในชีวิตจริงมี<b>แรงเสียดทาน</b> พลังงานกลส่วนหนึ่งเปลี่ยนเป็นความร้อนและเสียง พลังงานกลจึงลดลง แต่พลังงานรวมทุกรูปแบบยังคงเดิม พลังงานไม่สูญหาย แค่เปลี่ยนรูป', fig: { t: 'emojis', rows: [['🎢', 1, 'ลงจากที่สูง Ep เป็น Ek'], ['🔥', 1, 'เสียดทานเปลี่ยนเป็นความร้อน']] } }
  ] },
  { id: 'ls_pproj4', level: 'm4', subject: 'sci', gen: 'sci4_phys', icon: '🏹', title: 'โพรเจกไทล์ และการเคลื่อนที่เป็นวงกลม', blurb: 'แยกแนวราบ-แนวดิ่ง เวลาตก ระยะตก แรงสู่ศูนย์กลาง', pages: [
    { say: 'การเคลื่อนที่แบบ<b>โพรเจกไทล์</b> คือวัตถุถูกขว้างหรือเตะแล้วเคลื่อนที่ในอากาศโดยมีแต่แรงโน้มถ่วง วิถีเป็นเส้นโค้ง ให้แยกคิดเป็นสองแนว คือแนวราบกับแนวดิ่ง แยกกันเป็นอิสระต่อกัน', fig: { t: 'formula', lines: ['แนวราบ: ความเร็วคงที่', 'แนวดิ่ง: ตกอิสระ a = g', 'สองแนวเป็นอิสระต่อกัน'] } },
    { say: 'ขว้างวัตถุตามแนวราบจากที่สูง h เวลาตกขึ้นกับความสูงอย่างเดียว ใช้ h = ½gt² จึงได้ <b>t = √(2h/g)</b> ความเร็วแนวราบไม่มีผลต่อเวลา ปล่อยก้อนหินกับขว้างก้อนหินจากความสูงเท่ากัน ถึงพื้นพร้อมกัน', fig: { t: 'formula', lines: ['t = √(2h / g)', 'ไม่ขึ้นกับความเร็วแนวราบ', 'ปล่อย กับ ขว้าง ถึงพื้นพร้อมกัน'] } },
    { say: 'ตัวอย่าง ขว้างก้อนหินแนวราบด้วยความเร็ว 15 m/s จากหน้าผาสูง 20 m เวลาตก t = √(2 × 20 ÷ 10) = √4 = 2 s ระยะตกแนวราบ = vₓ × t = 15 × 2 = 30 m', fig: { t: 'formula', lines: ['t = √(2 × 20 / 10) = 2 s', 'x = vₓ × t = 15 × 2', 'x = 30 m'] } },
    { say: 'ถ้ายิงเฉียงขึ้นจากพื้นราบ ระยะไกลสุดเมื่อยิงที่มุม <b>45°</b> (เมื่อความเร็วต้นเท่ากัน และไม่คิดแรงต้านอากาศ) มุมที่รวมกันได้ 90° เช่น 30° กับ 60° จะได้ระยะเท่ากัน', fig: { t: 'formula', lines: ['ระยะไกลสุด ที่มุม 45°', '30° กับ 60° ระยะเท่ากัน', 'ไม่คิดแรงต้านอากาศ'] } },
    { say: '<b>การเคลื่อนที่เป็นวงกลมสม่ำเสมอ</b> ความเร็วคงที่แต่ทิศเปลี่ยนตลอด จึงมีความเร่ง ต้องมีแรงลัพธ์ชี้เข้าหาจุดศูนย์กลางเรียกว่า <b>แรงสู่ศูนย์กลาง</b> ขนาด F = mv²/r', fig: { t: 'formula', lines: ['F = m v² / r', 'ชี้เข้าหาศูนย์กลางเสมอ', 'ตั้งฉากกับความเร็ว'] } },
    { say: 'ตัวอย่างแรงสู่ศูนย์กลาง ดาวเทียมโคจรโลก แรงโน้มถ่วงทำหน้าที่เป็นแรงสู่ศูนย์กลาง ส่วนรถเลี้ยวโค้งใช้แรงเสียดทานระหว่างล้อกับถนน ถ้าถนนลื่นแรงไม่พอ รถจะไถลออกนอกโค้ง', fig: { t: 'emojis', rows: [['🛰️', 1, 'แรงโน้มถ่วงดึงเข้าหาโลก'], ['🚗', 1, 'เสียดทานช่วยเลี้ยวโค้ง']] } }
  ] },
  { id: 'ls_pfluid4', level: 'm4', subject: 'sci', gen: 'sci4_phys', icon: '🚢', title: 'ของไหล แรงลอยตัว และความดัน', blurb: 'P = ρgh, ปาสคาล, อาร์คิมิดีส, ลอยหรือจม', pages: [
    { say: 'ความดันของของเหลวที่ความลึก h คิดจาก <b>P = ρgh</b> เมื่อ ρ คือความหนาแน่น เช่น น้ำ ρ = 1000 kg/m³ ลึก 5 m ได้ P = 1000 × 10 × 5 = 50,000 Pa (เป็นความดันที่เพิ่มจากผิวน้ำ)', fig: { t: 'formula', lines: ['P = ρ g h', '1000 × 10 × 5', 'P = 50,000 Pa'] } },
    { say: '<b>หลักของปาสคาล</b> ความดันที่เพิ่มให้ของเหลวในภาชนะปิดจะส่งไปทุกจุดเท่ากัน แม่แรงไฮดรอลิกใช้หลักนี้ จึงได้ความดันเท่ากันที่สองลูกสูบ F₁/A₁ = F₂/A₂', fig: { t: 'formula', lines: ['F₁ / A₁ = F₂ / A₂', 'ความดันเท่ากันทุกจุด', 'พื้นที่มาก ได้แรงมาก'] } },
    { say: 'ตัวอย่างแม่แรง ลูกสูบเล็กพื้นที่ 0.01 m² ออกแรง 100 N ลูกสูบใหญ่พื้นที่ 0.5 m² จะได้แรง F₂ = 100 × 0.5 ÷ 0.01 = 5,000 N ขยายแรง 50 เท่า แต่ลูกสูบเล็กต้องเคลื่อนที่ไกลกว่า 50 เท่า', fig: { t: 'formula', lines: ['F₂ = F₁ × A₂ / A₁', '100 × 0.5 / 0.01', 'F₂ = 5,000 N'] } },
    { say: '<b>หลักของอาร์คิมิดีส</b> วัตถุในของเหลวถูกแรงลอยตัวขึ้น เท่ากับน้ำหนักของของเหลวที่ถูกวัตถุแทนที่ คิดจาก F = ρg V โดย V คือปริมาตรส่วนที่จมอยู่', fig: { t: 'formula', lines: ['F ลอยตัว = ρ ของเหลว × g × V', 'V = ปริมาตรส่วนที่จม', 'F = น้ำหนักของเหลวที่ถูกแทนที่'] } },
    { say: 'ตัวอย่าง ก้อนโลหะปริมาตร 0.002 m³ จมในน้ำทั้งก้อน แรงลอยตัว = 1000 × 10 × 0.002 = 20 N ถ้าก้อนนี้หนัก 50 N น้ำหนักที่ชั่งในน้ำจะเหลือ 50 − 20 = 30 N', fig: { t: 'formula', lines: ['F = 1000 × 10 × 0.002', 'F = 20 N', 'ชั่งในน้ำ = 50 − 20 = 30 N'] } },
    { say: 'วัตถุ<b>ลอย</b>เมื่อแรงลอยตัวสมดุลกับน้ำหนัก ถ้าวัตถุหนาแน่นน้อยกว่าของเหลวจะลอย มากกว่าจะจม เรือเหล็กลอยได้เพราะรูปทรงกลวง ทำให้ความหนาแน่นเฉลี่ยทั้งลำต่ำกว่าน้ำ และแทนที่น้ำได้มาก', fig: { t: 'emojis', rows: [['🚢', 1, 'ทรงกลวง ความหนาแน่นเฉลี่ยต่ำ ลอย'], ['⚓', 1, 'เหล็กก้อนตัน จม']] } }
  ] },
  { id: 'ls_pnuclear4', level: 'm4', subject: 'sci', gen: 'sci4_phys', icon: '☢️', title: 'ฟิสิกส์นิวเคลียร์และกัมมันตรังสี', blurb: 'โครงสร้างอะตอม รังสี ครึ่งชีวิต ฟิชชัน ฟิวชัน', pages: [
    { say: 'อะตอมมี<b>นิวเคลียส</b>อยู่ตรงกลาง ประกอบด้วยโปรตอน (+) และนิวตรอน (ไม่มีประจุ) โดยมีอิเล็กตรอน (−) วิ่งรอบนอก <b>เลขอะตอม</b> = จำนวนโปรตอน <b>เลขมวล</b> = โปรตอน + นิวตรอน', fig: { t: 'formula', lines: ['เลขอะตอม Z = โปรตอน', 'เลขมวล A = โปรตอน + นิวตรอน', 'C-14: p = 6, n = 8'] } },
    { say: '<b>ไอโซโทป</b> คืออะตอมของธาตุเดียวกัน คือเลขอะตอมเท่ากัน แต่เลขมวลต่างกันเพราะจำนวนนิวตรอนต่างกัน เช่น คาร์บอน-12 กับคาร์บอน-14 ไอโซโทปบางตัวไม่เสถียรจึงปล่อยรังสีออกมา เรียกว่ากัมมันตรังสี', fig: { t: 'formula', lines: ['ไอโซโทป: Z เท่ากัน A ต่างกัน', 'C-12 (n = 6), C-14 (n = 8)', 'ไม่เสถียร → ปล่อยรังสี'] } },
    { say: 'รังสีมีสามแบบ <b>แอลฟา</b> ทะลุทะลวงน้อยสุด กระดาษก็กั้นได้ <b>บีตา</b> ทะลุได้กว่า ต้องใช้แผ่นอะลูมิเนียมบาง ๆ <b>แกมมา</b> ทะลุทะลวงสูงสุด ต้องใช้ตะกั่วหนาหรือคอนกรีต', fig: { t: 'emojis', rows: [['📄', 1, 'แอลฟา: กระดาษกั้นได้'], ['🥫', 1, 'บีตา: อะลูมิเนียมบาง'], ['🧱', 1, 'แกมมา: ตะกั่วหนา คอนกรีต']] } },
    { say: '<b>ครึ่งชีวิต</b> คือเวลาที่สารกัมมันตรังสีสลายตัวจนเหลือครึ่งหนึ่ง ตัวอย่าง ครึ่งชีวิต 5 ปี เริ่มต้น 80 g ผ่านไป 20 ปี คือ 4 ครึ่งชีวิต 80 → 40 → 20 → 10 → 5 จึงเหลือ 5 g', fig: { t: 'formula', lines: ['20 ปี ÷ 5 ปี = 4 ครึ่งชีวิต', '80 → 40 → 20 → 10 → 5', 'เหลือ 5 g'] } },
    { say: '<b>ฟิชชัน</b> คือนิวเคลียสหนัก เช่น ยูเรเนียม-235 แตกเป็นนิวเคลียสเล็กลงพร้อมปล่อยพลังงานมาก ใช้ในโรงไฟฟ้านิวเคลียร์ ส่วน<b>ฟิวชัน</b> คือนิวเคลียสเบารวมกัน เช่น ไฮโดรเจนรวมเป็นฮีเลียม เป็นพลังงานของดวงอาทิตย์', fig: { t: 'emojis', rows: [['⚛️', 1, 'ฟิชชัน: แตกตัว โรงไฟฟ้า'], ['☀️', 1, 'ฟิวชัน: รวมตัว ดวงอาทิตย์']] } },
    { say: 'สมการ <b>E = mc²</b> ของไอน์สไตน์ บอกว่ามวลเล็กน้อยที่หายไปในปฏิกิริยานิวเคลียร์กลายเป็นพลังงานมหาศาล เพราะ c ประมาณ 3 × 10⁸ m/s ประโยชน์ เช่น รักษามะเร็ง ตรวจหาอายุซากโบราณ แต่รังสีก็ทำลายเซลล์ ต้องป้องกันอย่างเข้มงวด', fig: { t: 'formula', lines: ['E = m c²', 'c ≈ 3 × 10⁸ m/s', 'มวลน้อย ได้พลังงานมหาศาล'] } }
  ] },
  // ---------- v0.28.0: lessons4_en ----------

  { id: 'ls_enques1', level: 'm1', subject: 'en', gen: 'en1_gram', icon: '❓', title: 'ประโยคคำถามในภาษาอังกฤษ', blurb: 'Yes/No question, Wh-question และการตอบสั้น ๆ', pages: [
    { say: 'ป้าไก่เอง: คำถามแบบตอบ <b>Yes/No</b> ให้ย้ายกริยาช่วยมาไว้หน้าประธาน เช่น She is happy. → <b>Is</b> she happy? กริยา be และ can ย้ายได้เลย', fig: { t: 'formula', lines: ['She is happy. → Is she happy?', 'He can swim. → Can he swim?', 'They are late. → Are they late?'] } },
    { say: 'ถ้าประโยคมีกริยาธรรมดา (like, go, play) ให้เติม <b>Do / Does / Did</b> ไว้หน้าประธาน แล้วกริยาหลักต้องกลับเป็นช่องที่ 1 เสมอ ห้ามเติม s หรือ ed ซ้ำ', fig: { t: 'formula', lines: ['Do you like tea? ✓', 'Does she like tea? ✓', 'Does she likes tea? ✗', 'Did he go home? ✓', 'Did he went home? ✗'] } },
    { say: '<b>Wh-question</b> ขึ้นต้นด้วยคำถาม แล้วต่อด้วยโครงสร้างเหมือนคำถาม Yes/No คือ กริยาช่วย + ประธาน + กริยาหลัก ท่องสูตรนี้ไว้ได้เลย', fig: { t: 'formula', lines: ['Wh-word + auxiliary + subject + verb', 'What do you eat for lunch?', 'Where did he go?', 'Why is she late?'] } },
    { say: 'คำถามที่ควรรู้: what (อะไร) who (ใคร) where (ที่ไหน) when (เมื่อไร) why (ทำไม) how (อย่างไร) และ <b>how many</b> ถามจำนวนนับได้ <b>how much</b> ถามปริมาณหรือราคา', fig: { t: 'formula', lines: ['How many eggs do you need?', 'How much water do you drink?', 'Whose bag is this? (ของใคร)', 'Which color do you like? (สีไหน)'] } },
    { say: 'ข้อควรระวัง: ถ้า <b>Who / What</b> เป็นประธานของประโยคเอง ไม่ต้องใช้ do/does/did ลำดับคำเหมือนประโยคบอกเล่า ส่วนถ้าเป็นกรรมต้องใช้ตามปกติ', fig: { t: 'formula', lines: ['Who broke the vase? (ใครเป็นคนทำ)', 'Who did you meet? (เธอพบใคร)', 'What happened? (เกิดอะไรขึ้น)'] } },
    { say: 'การตอบสั้น ให้ใช้กริยาช่วยตัวเดียวกับในคำถามมาตอบ เช่น Do you like pizza? ตอบ Yes, I <b>do</b>. หรือ No, I <b>don\'t</b>. ไม่ต้องพูดซ้ำทั้งประโยค', fig: { t: 'formula', lines: ['Do you like pizza? → Yes, I do. / No, I don\'t.', 'Is she tall? → Yes, she is. / No, she isn\'t.', 'Can he swim? → Yes, he can.', 'Did they win? → No, they didn\'t.'] } }
  ] },
  { id: 'ls_encount1', level: 'm1', subject: 'en', gen: 'en1_gram', icon: '🥛', title: 'นามนับได้ นับไม่ได้ และ many/much', blurb: 'เลือกคำบอกปริมาณให้ถูก', pages: [
    { say: 'นามนับได้ (countable) นับ 1 2 3 ได้ มี a/an และเติม s เป็นพหูพจน์ได้ ส่วนนามนับไม่ได้ (uncountable) เป็นก้อนหรือเนื้อรวม ไม่เติม s และไม่มี a/an', fig: { t: 'emojis', rows: [['🍎', 1, 'an apple → two apples (นับได้)'], ['💧', 1, 'water (นับไม่ได้ ไม่มี s)']] } },
    { say: 'นามนับไม่ได้ที่เจอบ่อยในข้อสอบ: water, rice, milk, money, information, advice, homework, furniture ห้ามพูดว่า an advice หรือ two homeworks', fig: { t: 'formula', lines: ['some advice ✓', 'an advice ✗', 'a lot of homework ✓', 'two homeworks ✗', 'a piece of information ✓'] } },
    { say: 'คำบอกปริมาณ: <b>many</b> ใช้กับนามนับได้พหูพจน์ <b>much</b> ใช้กับนามนับไม่ได้ ส่วน <b>a lot of</b> ใช้ได้ทั้งสองแบบ และมักใช้ในประโยคบอกเล่า', fig: { t: 'formula', lines: ['many books (นับได้)', 'much water (นับไม่ได้)', 'a lot of books / a lot of water', 'I don\'t have much time.'] } },
    { say: '<b>some</b> ใช้ในประโยคบอกเล่า ส่วน <b>any</b> ใช้ในประโยคปฏิเสธและคำถาม ใช้ได้ทั้งนามนับได้และนับไม่ได้ ข้อยกเว้นคือคำเสนอหรือขอ ใช้ some ได้ เช่น Would you like some tea?', fig: { t: 'formula', lines: ['There is some milk.', 'I don\'t have any eggs.', 'Do you have any money?', 'Would you like some tea?'] } },
    { say: '<b>a few</b> (นับได้) กับ <b>a little</b> (นับไม่ได้) แปลว่า มีบ้าง พอใช้ ส่วน <b>few</b> กับ <b>little</b> ที่ไม่มี a แปลว่า แทบไม่มี ความหมายออกไปทางลบ', fig: { t: 'formula', lines: ['a few friends = มีเพื่อนอยู่บ้าง', 'few friends = แทบไม่มีเพื่อน', 'a little sugar = มีน้ำตาลนิดหน่อย', 'little sugar = แทบไม่มีน้ำตาล'] } },
    { say: 'อยากนับนามนับไม่ได้ ให้ใช้ภาชนะหรือหน่วยวัดมาช่วย แล้วนับที่ภาชนะนั้นแทน เช่น two <b>bottles of</b> water, a <b>glass of</b> milk, a <b>piece of</b> advice', fig: { t: 'emojis', rows: [['🍶', 1, 'a bottle of water'], ['🥛', 1, 'a glass of milk'], ['🍚', 1, 'a bowl of rice'], ['🍞', 1, 'a loaf of bread']] } }
  ] },
  { id: 'ls_enpast1', level: 'm1', subject: 'en', gen: 'en1_gram', icon: '⏪', title: 'Past Simple เล่าเรื่องที่จบไปแล้ว', blurb: 'กริยาปกติ กริยาไม่ปกติ ปฏิเสธ และคำถาม', pages: [
    { say: '<b>Past Simple</b> ใช้เล่าเรื่องที่เกิดและจบไปแล้วในอดีต กริยาปกติ (regular) เติม <b>-ed</b> ท้ายคำ เช่น walk → walked, play → played ใช้เหมือนกันทุกประธาน', fig: { t: 'formula', lines: ['I walked to school.', 'She played the piano.', 'They watched a film.'] } },
    { say: 'กฎการเติม -ed: ลงท้าย e เติม <b>-d</b> (like → liked) · พยัญชนะ+y เปลี่ยน y เป็น <b>ied</b> (study → studied) · สระ+y เติม ed ได้เลย (play → played) · คำสั้นลงท้าย สระ+พยัญชนะ ซ้ำพยัญชนะ (stop → stopped)', fig: { t: 'formula', lines: ['like → liked', 'study → studied', 'play → played', 'stop → stopped'] } },
    { say: 'กริยาไม่ปกติ (irregular) ไม่เติม -ed ต้องจำรูปเปลี่ยน ชุดแรก: go → <b>went</b>, have → <b>had</b>, see → <b>saw</b>, eat → <b>ate</b>, buy → <b>bought</b>', fig: { t: 'formula', lines: ['go → went', 'have → had', 'see → saw', 'eat → ate', 'buy → bought'] } },
    { say: 'ชุดที่สอง: take → <b>took</b>, make → <b>made</b>, come → <b>came</b>, write → <b>wrote</b> และ be เปลี่ยนเป็น was/were ตัวอย่างเช่น Yesterday I went to the market and bought some fruit.', fig: { t: 'formula', lines: ['take → took', 'make → made', 'come → came', 'write → wrote'] } },
    { say: 'ปฏิเสธใช้ <b>did not (didn\'t) + V1</b> ถามใช้ <b>Did + ประธาน + V1</b> พอมี did แล้วกริยาต้องกลับเป็นช่องที่ 1 ห้ามใส่ ed หรือรูปอดีตซ้ำอีก', fig: { t: 'formula', lines: ['She didn\'t go to school. ✓', 'She didn\'t went to school. ✗', 'Did you eat lunch? ✓', 'Did you ate lunch? ✗'] } },
    { say: 'คำบอกเวลาที่ใช้กับ Past Simple บอกช่วงเวลาที่จบแล้ว เช่น <b>yesterday, last week, last year, two days ago, in 2020</b> เจอคำพวกนี้ในข้อสอบให้นึกถึงอดีตทันที', fig: { t: 'emojis', rows: [['📅', 1, 'yesterday = เมื่อวาน'], ['🗓️', 1, 'last week = สัปดาห์ที่แล้ว'], ['⏳', 1, 'two days ago = สองวันก่อน']] } }
  ] },
  { id: 'ls_enmodal1', level: 'm1', subject: 'en', gen: 'en1_gram', icon: '🔑', title: 'Modal verbs: can must should may', blurb: 'กริยาช่วยบอกความสามารถ ความจำเป็น คำแนะนำ และโอกาส', pages: [
    { say: 'Modal verbs เช่น can, must, should, may, might มีกฎร่วมกัน 3 ข้อ: ตามด้วย <b>V1</b> เสมอ · ไม่เติม s กับ he/she/it · ไม่มี to คั่น', fig: { t: 'formula', lines: ['She can swim. ✓', 'She cans swim. ✗', 'She can to swim. ✗', 'Can she swim? ✓'] } },
    { say: '<b>can</b> บอกความสามารถหรืออนุญาต ปฏิเสธเป็น can\'t หรือ cannot ถามขออนุญาตได้ว่า Can I...? ถ้าสุภาพกว่านั้นใช้ <b>May I...?</b>', fig: { t: 'formula', lines: ['I can speak English.', 'You can\'t park here.', 'Can I open the door?', 'May I come in, please?'] } },
    { say: '<b>must</b> แปลว่า ต้อง (จำเป็นมาก) ส่วน <b>have to</b> คือ ต้องทำตามกฎหรือสถานการณ์ เจอ he/she/it ใช้ has to · ปฏิเสธเป็น don\'t have to / doesn\'t have to', fig: { t: 'formula', lines: ['I must finish my homework.', 'He has to wear a uniform.', 'Do you have to go now?'] } },
    { say: 'กับดักข้อสอบ: <b>mustn\'t</b> = ห้ามทำ ส่วน <b>don\'t have to</b> = ไม่จำเป็นต้องทำ (จะทำก็ได้) สองคำนี้ความหมายต่างกันมาก อย่าสลับ', fig: { t: 'formula', lines: ['You mustn\'t run here. = ห้ามวิ่ง', 'You don\'t have to run. = ไม่ต้องวิ่งก็ได้', 'He doesn\'t have to come. = เขาไม่ต้องมา'] } },
    { say: '<b>should</b> ใช้ให้คำแนะนำ แปลว่า ควร ส่วน shouldn\'t = ไม่ควร เป็นน้ำเสียงที่นุ่มกว่า must เพราะไม่ได้บังคับ', fig: { t: 'formula', lines: ['You should drink more water.', 'He shouldn\'t stay up late.', 'What should I do?'] } },
    { say: '<b>may / might</b> บอกโอกาสที่อาจเกิดขึ้น might ไม่มั่นใจกว่าเล็กน้อย ปฏิเสธเป็น may not / might not เช่น It may rain this evening.', fig: { t: 'formula', lines: ['It may rain this evening.', 'He might be late.', 'She may not come today.'] } }
  ] },
  { id: 'ls_endirect1', level: 'm1', subject: 'en', gen: 'en1_conv', icon: '🧭', title: 'บอกทางและบรรยายสถานที่', blurb: 'ถามทาง ตอบทาง และคำบอกตำแหน่ง', pages: [
    { say: 'เริ่มถามทางให้สุภาพ ด้วย <b>Excuse me</b> ก่อนเสมอ แล้วถามต่อ เช่น how do I get to...? หรือ where is...? หรือ is there a... near here?', fig: { t: 'formula', lines: ['Excuse me, how do I get to the library?', 'Where is the post office?', 'Is there a bank near here?'] } },
    { say: 'คำสั่งบอกทางที่ใช้บ่อย: <b>Go straight</b> (ตรงไป) · <b>Turn left / right</b> (เลี้ยวซ้าย/ขวา) · <b>Cross the road</b> (ข้ามถนน) · <b>Go past</b> (ผ่าน) · Take the second left (เลี้ยวซ้ายที่แยกที่สอง)', fig: { t: 'formula', lines: ['Go straight for two blocks.', 'Turn left at the traffic lights.', 'Take the second right.', 'Go past the school.'] } },
    { say: 'คำบอกตำแหน่ง: <b>next to</b> (ติดกับ) · <b>opposite</b> (ตรงข้าม) · <b>between ... and ...</b> (อยู่ระหว่าง) · <b>behind</b> (ข้างหลัง) · <b>in front of</b> (ข้างหน้า)', fig: { t: 'emojis', rows: [['🏦', 1, 'The bank is next to the school.'], ['🏥', 1, 'The hospital is opposite the park.'], ['🛒', 1, 'The shop is between the bank and the cafe.']] } },
    { say: 'อีกสองสำนวนที่ใช้ได้บ่อย: <b>on the corner</b> (ตรงหัวมุม) และ <b>at the end of the road</b> (สุดถนน) ใช้บอกจุดสังเกตให้คนฟังหาเจอง่ายขึ้น', fig: { t: 'formula', lines: ['The cafe is on the corner.', 'The temple is at the end of the road.', 'It is just around the corner.'] } },
    { say: 'ลองดูบทสนทนาสั้น ๆ ที่คนถามกับคนตอบคุยกัน สังเกตว่าคนตอบใช้คำสั่งสั้นและบอกจุดสังเกตทันที', fig: { t: 'formula', lines: ['A: Excuse me, how do I get to the park?', 'B: Go straight, then turn left.', 'A: Is it far?', 'B: No, it\'s next to the school.'] } },
    { say: 'ตอบรับและขอบคุณให้เป็นธรรมชาติ: Thank you very much. · Thanks a lot. ฝั่งตอบใช้ You\'re welcome. หรือ No problem. ถ้าไม่รู้ทางให้บอกว่า Sorry, I don\'t know.', fig: { t: 'formula', lines: ['Thank you very much.', 'You\'re welcome. / No problem.', 'Sorry, I don\'t know.'] } }
  ] },
  { id: 'ls_enword1', level: 'm1', subject: 'en', gen: 'en1_vocab', icon: '🧩', title: 'วิธีจำศัพท์ให้อยู่หมัด', blurb: 'Word family ความหมายเหมือน-ตรงข้าม และการเดาจากบริบท', pages: [
    { say: 'ศัพท์เป็นตระกูลกัน เรียกว่า <b>word family</b> เรียนคำเดียวได้หลายคำ เช่น happy (มีความสุข) → happiness (ความสุข) → unhappy (ไม่มีความสุข)', fig: { t: 'formula', lines: ['happy → happiness → unhappy', 'teach → teacher', 'care → careful → careless'] } },
    { say: 'จำตัวต่อท้ายและตัวนำหน้า: <b>-er/-or</b> = คนทำ (teach → teacher) · <b>-ful</b> = มี (care → careful) · <b>-less</b> = ไม่มี (care → careless) · <b>un-</b> = ไม่/ตรงข้าม (happy → unhappy)', fig: { t: 'formula', lines: ['-er : teach → teacher', '-ful : care → careful', '-less : care → careless', 'un- : happy → unhappy'] } },
    { say: 'คำความหมายเหมือน (synonyms) ที่ออกสอบบ่อย: big = large · begin = start · quick = fast · small เล็ก ส่วน tiny เล็กมาก ๆ คำเหล่านี้แทนกันได้ในหลายประโยค', fig: { t: 'formula', lines: ['big = large', 'begin = start', 'quick = fast', 'small → tiny (เล็กมาก)'] } },
    { say: 'คำตรงข้าม (antonyms) ที่ออกสอบบ่อย: <b>buy ↔ sell</b> · <b>always ↔ never</b> · hot ↔ cold · early ↔ late · เรียนเป็นคู่ จะนึกออกง่ายขึ้นเวลาเจอในข้อสอบ', fig: { t: 'formula', lines: ['buy ↔ sell', 'always ↔ never', 'hot ↔ cold', 'early ↔ late'] } },
    { say: 'ระวังคำสะกดคล้ายแต่ความหมายต่าง: <b>quiet</b> (เงียบ) กับ <b>quite</b> (ค่อนข้าง) · <b>weather</b> (อากาศ) กับ <b>whether</b> (หรือไม่) · <b>hear</b> (ได้ยิน) กับ <b>here</b> (ที่นี่)', fig: { t: 'formula', lines: ['The room is quiet.', 'It is quite cold today.', 'The weather is nice.', 'I can hear music.'] } },
    { say: 'เจอศัพท์ที่ไม่รู้ ให้เดาจากบริบท เช่น We were famished after the long hike, so we ate two big plates of rice. ประโยคหลังบอกว่ากินเยอะ จึงเดาได้ว่า famished = หิวมาก', fig: { t: 'formula', lines: ['famished ... ate two big plates', '→ famished = very hungry', 'ดูประโยคข้างเคียงเป็นเบาะแส'] } }
  ] },
  { id: 'ls_ennotice1', level: 'm1', subject: 'en', gen: 'en1_read', icon: '🪧', title: 'อ่านป้าย ประกาศ และอีเมลสั้น', blurb: 'จับ who what when where จากข้อความสั้น', pages: [
    { say: 'ป้ายห้ามและป้ายเตือนที่ต้องรู้: <b>No parking</b> ห้ามจอดรถ · <b>No smoking</b> ห้ามสูบบุหรี่ · <b>Keep off the grass</b> ห้ามเหยียบหญ้า · <b>Wet floor</b> พื้นเปียก ระวังลื่น', fig: { t: 'formula', lines: ['No parking = ห้ามจอดรถ', 'Keep off the grass = ห้ามเหยียบหญ้า', 'Wet floor = พื้นเปียก ระวังลื่น', 'Out of order = ชำรุด ใช้ไม่ได้'] } },
    { say: 'ประกาศโรงเรียนมักบอก 4 อย่าง คือ เรื่องอะไร (what) วันที่ (date) เวลา (time) และสถานที่ (place) อ่านให้เจอ 4 อย่างนี้ก่อน แล้วค่อยดูคำขอร้องท้ายประกาศ', fig: { t: 'formula', lines: ['Sports Day', 'Day: Friday, 10 March', 'Time: 8.00 a.m.', 'Place: School field'] } },
    { say: 'อีเมลมีหัวข้อตายตัว: <b>From</b> (ผู้ส่ง) · <b>To</b> (ผู้รับ) · <b>Subject</b> (หัวเรื่อง) แล้วเนื้อความ เริ่มด้วย Dear... และจบด้วย Best wishes หรือ Regards ตามด้วยชื่อผู้ส่ง', fig: { t: 'formula', lines: ['From: Mai', 'To: Tom', 'Subject: Party on Saturday', 'Dear Tom, ... Best wishes, Mai'] } },
    { say: 'ข้อความโซเชียลมักสั้นและตัดคำ เช่น I\'m running late. See you at 5! แปลว่า ฉันจะไปสาย เจอกันตอนห้าโมงเย็นนะ ให้จับใจความจากคำหลักก่อน', fig: { t: 'formula', lines: ['I\'m running late. = ฉันจะไปสาย', 'See you at 5! = เจอกันห้าโมงเย็น', 'Thanks a lot! = ขอบคุณมาก'] } },
    { say: 'ตัวย่อที่เจอบ่อย: <b>ASAP</b> = as soon as possible (เร็วที่สุดเท่าที่ทำได้) · <b>FYI</b> = for your information (เพื่อให้ทราบ) · <b>BTW</b> = by the way (ว่าแต่) · <b>TBA</b> = to be announced (จะแจ้งภายหลัง)', fig: { t: 'formula', lines: ['ASAP = as soon as possible', 'FYI = for your information', 'BTW = by the way', 'TBA = to be announced'] } },
    { say: 'เทคนิคหาคำตอบ: อ่านคำถามก่อน แล้วถามตัวเองว่าต้องหา Who, What, When หรือ Where จากนั้นไล่หาในข้อความ ขีดเส้นใต้ชื่อคน วัน เวลา สถานที่ได้เลย', fig: { t: 'emojis', rows: [['👤', 1, 'Who = ใคร'], ['📌', 1, 'What = เรื่องอะไร'], ['⏰', 1, 'When = เมื่อไร'], ['📍', 1, 'Where = ที่ไหน']] } }
  ] },
  { id: 'ls_enperfect4', level: 'm4', subject: 'en', gen: 'en4_gram', icon: '⏳', title: 'Perfect tenses: เชื่อมอดีตกับปัจจุบัน', blurb: 'Present perfect, Past perfect และเลือกเทนส์ให้ถูก', pages: [
    { say: '<b>Present perfect</b> = have/has + V3 ใช้เมื่อเรื่องในอดีตมีผลมาถึงตอนนี้ และไม่ระบุเวลาที่แน่นอน เช่น I have lost my keys. (ตอนนี้ยังหาไม่เจอ)', fig: { t: 'formula', lines: ['I/you/we/they + have + V3', 'he/she/it + has + V3', 'She has finished her work.'] } },
    { say: '<b>for</b> + ช่วงเวลา (for three years) ส่วน <b>since</b> + จุดเริ่มต้น (since 2020, since Monday) ทั้งคู่ใช้กับสถานการณ์ที่เริ่มในอดีตและยังต่อเนื่องถึงปัจจุบัน', fig: { t: 'formula', lines: ['She has lived here for five years.', 'She has lived here since 2019.', 'I haven\'t seen him since Monday.'] } },
    { say: 'คำที่มาคู่กัน: <b>already</b> (แล้ว ใช้ในบอกเล่า) · <b>yet</b> (ยัง/แล้วหรือยัง ท้ายปฏิเสธ-คำถาม) · <b>ever</b> (เคยไหม) · <b>never</b> (ไม่เคย) · <b>just</b> (เพิ่งจะ)', fig: { t: 'formula', lines: ['I have already eaten.', 'He hasn\'t called yet.', 'Have you ever been to Japan?', 'I have never seen snow.'] } },
    { say: 'ถ้ามีเวลาที่ระบุชัดและจบแล้ว (yesterday, last week, in 2019, two days ago) ต้องใช้ <b>Past simple</b> ไม่ใช้ Present perfect', fig: { t: 'formula', lines: ['I saw him yesterday. ✓', 'I have seen him yesterday. ✗', 'We have seen that film. ✓ (ไม่ระบุเวลา)'] } },
    { say: '<b>Past perfect</b> = had + V3 ใช้เล่าเหตุการณ์ที่เกิด <b>ก่อน</b> อีกเหตุการณ์หนึ่งในอดีต เหตุการณ์ที่เกิดก่อนใช้ had + V3 เหตุการณ์ที่เกิดทีหลังใช้ Past simple', fig: { t: 'formula', lines: ['When I arrived, the film had started.', 'She had left before he called.', 'ก่อน = had + V3 / หลัง = V2'] } },
    { say: '<b>Present perfect continuous</b> = have/has been + V-ing เน้นกิจกรรมที่ทำต่อเนื่องมาจนถึงตอนนี้ และอาจยังไม่จบ เช่น I have been studying for two hours.', fig: { t: 'formula', lines: ['I have been studying for two hours.', 'It has been raining since morning.', 'เน้นว่า "ทำมานานแค่ไหน"'] } }
  ] },
  { id: 'ls_engerund4', level: 'm4', subject: 'en', gen: 'en4_gram', icon: '🔀', title: 'Gerund และ Infinitive', blurb: 'กริยาตัวไหนตามด้วย V-ing หรือ to + V1', pages: [
    { say: '<b>Gerund</b> คือ V-ing ที่ทำหน้าที่เป็นนาม ส่วน <b>Infinitive</b> คือ to + V1 กริยาหลักข้างหน้าเป็นตัวกำหนดว่าจะตามด้วยแบบไหน ต้องจำเป็นกลุ่ม', fig: { t: 'formula', lines: ['Gerund = V-ing (swimming)', 'Infinitive = to + V1 (to swim)', 'กริยาหน้าเป็นตัวเลือก'] } },
    { say: 'กริยากลุ่มตามด้วย <b>V-ing</b>: enjoy, avoid, finish, mind, suggest, keep, give up · เช่น She enjoys reading. / Would you mind opening the door?', fig: { t: 'formula', lines: ['She enjoys reading.', 'He avoided answering.', 'They finished cleaning the room.', 'Don\'t give up trying.'] } },
    { say: 'กริยากลุ่มตามด้วย <b>to + V1</b>: want, decide, hope, plan, agree, refuse, promise · เช่น They decided to leave early. / He refused to help.', fig: { t: 'formula', lines: ['I want to learn English.', 'They decided to leave early.', 'She promised to call me.'] } },
    { say: 'กริยาบางตัวต้องมีกรรมคั่น แล้วตามด้วย <b>to + V1</b> เช่น ask, tell, want, would like + someone + to + V1 ห้ามพูดว่า I want that you help', fig: { t: 'formula', lines: ['My teacher told us to be quiet.', 'I want you to help me.', 'She asked him to wait.'] } },
    { say: 'like, love, hate, start, begin ได้ทั้งสองแบบ ความหมายเหมือนเดิม · แต่ <b>stop, remember, try</b> ความหมายเปลี่ยน: stop eating = เลิกกิน · stop to eat = หยุดเพื่อไปกิน · remember to lock = จำว่าต้องล็อก · remember locking = จำได้ว่าล็อกแล้ว', fig: { t: 'formula', lines: ['I like swimming = I like to swim', 'stop eating = เลิกกิน', 'stop to eat = หยุดเพื่อกิน', 'try adding salt = ลองเติมเกลือ'] } },
    { say: 'หลัง <b>บุพบท</b> (in, at, for, before, after, of) ต้องใช้ <b>V-ing</b> เสมอ ระวัง to บางตัวเป็นบุพบท เช่น look forward <b>to</b> meeting you ตามด้วย V-ing', fig: { t: 'formula', lines: ['good at drawing', 'Thank you for helping me.', 'before leaving home', 'I look forward to meeting you.'] } }
  ] },
  { id: 'ls_enlink4', level: 'm4', subject: 'en', gen: 'en4_gram', icon: '🔗', title: 'คำเชื่อมและ Conjunctions', blurb: 'เชื่อมความขัดแย้ง เหตุผล ผลลัพธ์ และเสริมข้อมูล', pages: [
    { say: 'ความขัดแย้ง: <b>but</b> เชื่อมสองประโยคกลางประโยค ส่วน <b>However</b> ขึ้นต้นประโยคใหม่ แล้วมีจุลภาคตามหลัง ความหมายเหมือนกันแต่ตำแหน่งเครื่องหมายต่างกัน', fig: { t: 'formula', lines: ['It was cheap, but it broke easily.', 'It was cheap. However, it broke easily.'] } },
    { say: '<b>Although / though / even though</b> ตามด้วยประโยคเต็ม (ประธาน + กริยา) แปลว่า แม้ว่า ห้ามใช้ although คู่กับ but ในประโยคเดียวกัน', fig: { t: 'formula', lines: ['Although it was raining, we played.', 'Although it was raining, but we played. ✗', 'Even though he was tired, he worked.'] } },
    { say: '<b>Despite / in spite of</b> ตามด้วยคำนามหรือ V-ing เท่านั้น ถ้าอยากตามด้วยประโยคต้องเติม the fact that เข้าไป', fig: { t: 'formula', lines: ['Despite the rain, we played.', 'In spite of being tired, she worked.', 'Despite the fact that it rained, we played.'] } },
    { say: 'เปรียบเทียบสองฝั่งใช้ <b>while</b> หรือ <b>whereas</b> เช่น My brother likes tea, whereas I prefer coffee. ใช้เมื่อสองอย่างต่างกันตรงข้าม', fig: { t: 'formula', lines: ['My brother likes tea, whereas I prefer coffee.', 'While Tom is tall, his sister is short.'] } },
    { say: 'เหตุ: <b>because / since / as</b> (เพราะ) · ผล: <b>so</b> (ดังนั้น) และ <b>therefore / as a result</b> ซึ่งมักขึ้นต้นประโยคใหม่ มีจุลภาคตาม', fig: { t: 'formula', lines: ['She stayed home because she was ill.', 'She was ill, so she stayed home.', 'It rained. Therefore, the match was cancelled.'] } },
    { say: 'เสริมข้อมูลใช้ <b>and, also, moreover, in addition</b> สองคำหลังนิยมขึ้นต้นประโยคใหม่ แล้วตามด้วยจุลภาค ย้ำว่าตัวเชื่อมขึ้นต้นประโยคใหม่ ต้องมีจุลภาคเสมอ', fig: { t: 'formula', lines: ['The hotel is cheap. Moreover, it is near the beach.', 'In addition, breakfast is free.'] } }
  ] },
  { id: 'ls_enphrasal4', level: 'm4', subject: 'en', gen: 'en4_vocab', icon: '🧶', title: 'Phrasal verbs และ Idioms', blurb: 'กริยาวลีกับสำนวนที่ใช้ได้จริง', pages: [
    { say: '<b>Phrasal verb</b> คือกริยา + คำเสริม (up, off, after...) ที่ความหมายเปลี่ยนไปจากเดิม ตัวที่ต้องรู้ก่อน: give up (ยอมแพ้/เลิก) · look after (ดูแล) · look for (มองหา) · turn on/off (เปิด/ปิด)', fig: { t: 'formula', lines: ['give up = ยอมแพ้ เลิกทำ', 'look after = ดูแล', 'look for = มองหา', 'turn on / turn off = เปิด / ปิด'] } },
    { say: 'ชุดต่อไป: put off (เลื่อน) · run out of (หมด) · get along with (เข้ากันได้ดี) · take off (เครื่องบินขึ้น/ถอดออก) · find out (ค้นพบ) · carry on (ทำต่อไป) · break down (เสีย)', fig: { t: 'formula', lines: ['put off = เลื่อนออกไป', 'run out of = หมด', 'get along with = เข้ากันได้', 'break down = เสีย พัง'] } },
    { say: 'แบบ <b>แยกได้</b> (separable) กรรมอยู่ระหว่างกริยากับคำเสริมก็ได้ แต่ถ้ากรรมเป็นสรรพนาม (it, them) ต้องแทรกกลางเสมอ', fig: { t: 'formula', lines: ['turn off the light ✓', 'turn the light off ✓', 'turn it off ✓', 'turn off it ✗'] } },
    { say: 'แบบ <b>แยกไม่ได้</b> (inseparable) กรรมต้องตามหลังคำเสริมเสมอ เช่น look after, get along with, run out of ห้ามแทรกกรรมตรงกลาง', fig: { t: 'formula', lines: ['look after her ✓', 'look her after ✗', 'We ran out of milk. ✓', 'get along with my classmates ✓'] } },
    { say: '<b>Idiom</b> คือสำนวนที่แปลทีละคำไม่ได้ ต้องจำความหมายรวม: a piece of cake (ง่ายมาก) · break the ice (ทำลายความเก้อเขิน) · once in a blue moon (นาน ๆ ครั้ง) · hit the books (ตั้งใจอ่านหนังสือ) · under the weather (ไม่ค่อยสบาย)', fig: { t: 'formula', lines: ['a piece of cake = ง่ายมาก', 'break the ice = ละลายความเก้อเขิน', 'once in a blue moon = นาน ๆ ครั้ง', 'under the weather = ไม่ค่อยสบาย'] } },
    { say: 'เจอวลีที่ไม่รู้ ให้เดาจากประโยครอบข้าง เช่น The test was a piece of cake, so I finished early. จบเร็ว แสดงว่าข้อสอบง่าย อย่าแปลตรงตัวคำต่อคำ', fig: { t: 'formula', lines: ['a piece of cake + finished early', '→ ข้อสอบง่ายมาก', 'ดูบริบทแทนการแปลตรงตัว'] } }
  ] },
  { id: 'ls_enformal4', level: 'm4', subject: 'en', gen: 'en4_conv', icon: '✉️', title: 'ภาษาทางการ อีเมล และโทรศัพท์', blurb: 'พูด-เขียนให้เหมาะกับสถานการณ์ แสดงความเห็น', pages: [
    { say: 'ภาษาทางการ (formal) ต่างจากภาษาเพื่อน (informal): I would like to... แทน I wanna... · Could you...? แทน Can you...? และงานเขียนทางการไม่ควรย่อ เช่น I am แทน I\'m', fig: { t: 'formula', lines: ['I would like to ask... (formal)', 'I wanna ask... (informal)', 'Could you help me? (formal)', 'Can you help me? (informal)'] } },
    { say: 'เปิดและปิดอีเมลทางการ (แบบอังกฤษ): ถ้าไม่รู้ชื่อผู้รับ ใช้ <b>Dear Sir/Madam</b> ปิดด้วย <b>Yours faithfully</b> · ถ้ารู้ชื่อ ใช้ Dear Ms Lee ปิดด้วย <b>Yours sincerely</b>', fig: { t: 'formula', lines: ['Dear Sir/Madam → Yours faithfully', 'Dear Ms Lee → Yours sincerely', 'เปิดอย่างไร ปิดให้คู่กัน'] } },
    { say: 'ประโยคในเนื้ออีเมลทางการ: <b>I am writing to</b> ask about... · I would be grateful if you could... · Please find attached... · I look forward to hearing from you.', fig: { t: 'formula', lines: ['I am writing to ask about the course.', 'I would be grateful if you could reply.', 'Please find attached my CV.', 'I look forward to hearing from you.'] } },
    { say: 'สนทนาทางโทรศัพท์: ขอสายด้วย <b>Could I speak to Ms Lee, please?</b> · ผู้รับตอบ Hold on, please. หรือ I\'ll put you through. · ถ้าไม่สะดวกบอกว่า I\'ll call back later.', fig: { t: 'formula', lines: ['Could I speak to Ms Lee, please?', 'Hold on, please.', 'I\'ll put you through.', 'I\'ll call back later.'] } },
    { say: 'แสดงความเห็นให้สุภาพ: เห็นด้วย <b>I agree.</b> / That\'s true. · ไม่เห็นด้วยแบบนุ่ม ๆ <b>I see your point, but...</b> หรือ <b>I\'m afraid I disagree.</b> · เริ่มความเห็นด้วย In my opinion...', fig: { t: 'formula', lines: ['I agree with you.', 'I see your point, but...', 'I\'m afraid I disagree.', 'In my opinion, it is a good idea.'] } },
    { say: 'ถ้าฟังไม่ทัน ขอให้พูดซ้ำอย่างสุภาพ: <b>Could you repeat that, please?</b> · Sorry, I didn\'t catch that. · Could you speak more slowly, please? ไม่ควรพูดแค่ What?', fig: { t: 'formula', lines: ['Could you repeat that, please?', 'Sorry, I didn\'t catch that.', 'Could you speak more slowly?'] } }
  ] },
  { id: 'ls_enskim4', level: 'm4', subject: 'en', gen: 'en4_read', icon: '🔎', title: 'เทคนิคอ่านเร็ว: skimming และ scanning', blurb: 'กลยุทธ์ทำข้อสอบอ่าน จุดประสงค์ น้ำเสียง และกับดัก', pages: [
    { say: '<b>Skimming</b> คืออ่านผ่านรวดเร็วเพื่อจับภาพรวมว่าเรื่องนี้เกี่ยวกับอะไร ส่วน <b>scanning</b> คือกวาดตาหาข้อมูลเฉพาะ เช่น ตัวเลข ชื่อ วันที่ โดยไม่ต้องอ่านทุกคำ', fig: { t: 'formula', lines: ['skimming = หาภาพรวม ใจความหลัก', 'scanning = หาข้อมูลเฉพาะ', 'ตัวเลข ชื่อ วันที่ ตัวพิมพ์ใหญ่'] } },
    { say: 'ขั้นตอน skim: ดูชื่อเรื่อง → อ่านย่อหน้าแรก → อ่านประโยคแรกและประโยคสุดท้ายของแต่ละย่อหน้า → อ่านย่อหน้าสรุป แล้วลองเดาว่าผู้เขียนอยากบอกอะไร', fig: { t: 'formula', lines: ['1 ชื่อเรื่อง', '2 ย่อหน้าแรก', '3 ประโยคแรก-สุดท้ายของแต่ละย่อหน้า', '4 ย่อหน้าสรุป'] } },
    { say: 'อ่านคำถามก่อนอ่านบทความ จะรู้ว่าต้องหาอะไร แล้วขีดคำสำคัญ ข้อสอบมักถามหลายแบบ: main idea · detail · inference · vocabulary in context · reference · purpose · tone', fig: { t: 'formula', lines: ['main idea = ใจความหลัก', 'detail = รายละเอียด', 'inference = อนุมาน', 'purpose / tone = จุดประสงค์ / น้ำเสียง'] } },
    { say: 'จุดประสงค์ผู้เขียน (purpose) มี 4 แบบ: <b>inform</b> (ให้ข้อมูล) · <b>persuade</b> (ชักชวนโน้มน้าว) · <b>entertain</b> (ให้ความบันเทิง) · <b>criticize</b> (วิจารณ์) ดูว่าบทความ "ต้องการให้ผู้อ่านทำอะไรหรือรู้สึกอย่างไร"', fig: { t: 'formula', lines: ['inform = ให้ข้อมูล', 'persuade = ชักชวน', 'entertain = ให้ความบันเทิง', 'criticize = วิจารณ์'] } },
    { say: 'น้ำเสียง (tone) คือท่าทีต่อเรื่องที่เขียน: <b>neutral</b> (เป็นกลาง) · <b>critical</b> (ตำหนิ) · <b>optimistic</b> (มองโลกในแง่ดี) · <b>humorous</b> (ตลก) ให้ดูคำเลือกใช้ เช่น wonderful ฟังดูชื่นชม terrible ฟังดูตำหนิ', fig: { t: 'formula', lines: ['neutral = เป็นกลาง', 'critical = ตำหนิ', 'optimistic = มองแง่ดี', 'humorous = ตลก ขบขัน'] } },
    { say: 'กับดักตัวเลือกที่ต้องระวัง: คำสุดโต่ง เช่น <b>always, never, all, only, none</b> มักผิด · ตัวเลือกที่จริงในโลกจริงแต่ <b>ไม่มีในบทความ</b> ก็ผิดเช่นกัน ให้ตอบตามที่บทความเขียนเท่านั้น', fig: { t: 'formula', lines: ['always / never / all / only → ระวัง', 'ข้อมูลไม่มีในบท → ตัดทิ้ง', 'ตอบตามบทความ ไม่ใช่ความรู้เดิม'] } }
  ] },
  // ---------- v0.28.0: lessons4_th ----------

  { id: 'ls_thmake1', level: 'm1', subject: 'th', gen: 'th1_word', icon: '🧩', title: 'คำมูล คำประสม คำซ้ำ คำซ้อน', blurb: 'ป้าไก่สอนแยกคำ 4 แบบที่ออกสอบบ่อย ดูแค่ความหมายก็แยกได้', pages: [
    { say: 'วันนี้ป้าไก่จะพาไปดูว่า <b>คำ</b> ในภาษาไทยสร้างได้หลายแบบ เหมือนต่อตัวต่อเลย เริ่มจากตัวต่อชิ้นเล็กที่สุดก่อน คือ <b>คำมูล</b>', fig: { t: 'formula', lines: ['คำมูล = คำพื้นฐาน แยกไม่ได้', 'เช่น ตา ดิน น้ำ นก', 'เอาไปสร้างคำใหม่ต่อได้'] } },
    { say: '<b>คำประสม</b> คือเอาคำมูลตั้งแต่ 2 คำมาต่อกัน ได้คำใหม่ ความหมายมักเปลี่ยนไปเป็นก้อนเดียว เช่น แม่น้ำ ไม่ได้แปลว่าแม่ของน้ำ แต่คือทางน้ำสายใหญ่', fig: { t: 'formula', lines: ['แม่ + น้ำ = แม่น้ำ', 'ลูก + น้ำ = ลูกน้ำ (ตัวอ่อนของยุง)', 'น้ำ + ตก = น้ำตก', 'ตู้ + เย็น = ตู้เย็น'] } },
    { say: '<b>คำซ้ำ</b> คือพูดคำเดิมซ้ำสองครั้ง เขียนไม้ยมก ๆ แทน คำซ้ำทำให้ความหมายเปลี่ยนไปได้ เช่น บอกว่ามีหลายคน หรือย้ำให้ชัดขึ้น', fig: { t: 'formula', lines: ['เด็ก ๆ = เด็กหลายคน (พหูพจน์)', 'ดี ๆ = ดีจริง ๆ (เน้นย้ำ)', 'ช้า ๆ = ค่อยทำ (ขยายกริยา)'] } },
    { say: '<b>คำซ้อน</b> คือเอา 2 คำที่ความหมายใกล้กัน หรือตรงข้ามกัน มาวางคู่กัน แล้วได้ความหมายรวมเป็นก้อนเดียว เสียงมักคล้องจองกัน', fig: { t: 'formula', lines: ['ใกล้กัน: ปิดบัง ใหญ่โต เสื้อผ้า', 'ตรงข้าม: ชั่วดี ยากง่าย', 'ซ้อนเพื่อเสียง: งอแง โวยวาย'] } },
    { say: 'ข้อสอบชอบถามแยกคำประสมกับคำซ้อน เคล็ดลับคือดูว่า 2 คำนั้น <b>ความหมายใกล้กันหรือไม่</b> ถ้าใกล้กันหรือตรงข้ามกันคือคำซ้อน ถ้าคนละเรื่องมารวมกันคือคำประสม', fig: { t: 'formula', lines: ['ใหญ่ + โต = คำซ้อน (ใกล้กัน)', 'ลูก + น้ำ = คำประสม (คนละเรื่อง)', 'ชั่ว + ดี = คำซ้อน (ตรงข้าม)'] } },
    { say: 'คำประสมต่างจาก <b>วลีธรรมดา</b> ตรงที่ความหมายรวมกันเป็นก้อนเดียว ครูใหญ่ คือผู้บริหารโรงเรียน แต่ ครูตัวใหญ่ คือครูที่ตัวสูงใหญ่ ลองแปลแยกคำดู ถ้าความหมายเพี้ยนไปจากเดิม ก็น่าจะเป็นคำประสม', fig: { t: 'emojis', rows: [['🏫', 1, 'ครูใหญ่ = ตำแหน่งในโรงเรียน (คำประสม)'], ['🧍', 1, 'ครูตัวใหญ่ = วลีธรรมดา']] } }
  ] },
  { id: 'ls_thtone1', level: 'm1', subject: 'th', gen: 'th1_word', icon: '🎵', title: 'อักษรสามหมู่และวรรณยุกต์', blurb: 'จำอักษรสูง กลาง ต่ำ แล้วผันเสียงวรรณยุกต์ให้แม่น', pages: [
    { say: 'พยัญชนะไทยมี 44 ตัว แบ่งเป็น <b>3 หมู่</b> ตามวิธีผันเสียงวรรณยุกต์ คือ อักษรสูง 11 ตัว อักษรกลาง 9 ตัว และอักษรต่ำ 24 ตัว รวมกันได้ 44 พอดี', fig: { t: 'formula', lines: ['อักษรสูง 11 ตัว', 'อักษรกลาง 9 ตัว', 'อักษรต่ำ 24 ตัว', 'รวม 11 + 9 + 24 = 44'] } },
    { say: 'ท่องหมู่เล็กก่อน แล้วที่เหลือคืออักษรต่ำ อักษรสูงคือ <b>ข ฃ ฉ ฐ ถ ผ ฝ ศ ษ ส ห</b> จำง่าย ๆ ว่า ผีฝากถุงข้าวสารให้ฉัน ส่วนอักษรกลางคือ <b>ก จ ฎ ฏ ด ต บ ป อ</b> จำว่า ไก่จิกเด็กตายบนปากโอ่ง', fig: { t: 'formula', lines: ['สูง: ข ฃ ฉ ฐ ถ ผ ฝ ศ ษ ส ห', 'กลาง: ก จ ฎ ฏ ด ต บ ป อ', 'ผีฝากถุงข้าวสารให้ฉัน', 'ไก่จิกเด็กตายบนปากโอ่ง'] } },
    { say: 'ตัวที่ไม่ใช่สูงหรือกลางทั้งหมดคือ <b>อักษรต่ำ</b> มี 24 ตัว ก่อนตอบข้อสอบ ให้ตรวจก่อนว่าพยัญชนะต้นเป็นหมู่ไหน เพราะหมู่ของมันกำหนดเสียงที่ได้', fig: { t: 'formula', lines: ['ค ฅ ฆ ง ช ซ ฌ ญ', 'ฑ ฒ ณ ท ธ น พ ฟ', 'ภ ม ย ร ล ว ฬ ฮ', 'รวมอักษรต่ำ 24 ตัว'] } },
    { say: '<b>พยางค์</b> คือเสียงที่เปล่งออกมาครั้งเดียว แบ่งเป็น <b>คำเป็น</b> กับ <b>คำตาย</b> คำเป็นคือพยางค์ที่ลงท้ายด้วยสระเสียงยาว หรือตัวสะกดแม่ กง กน กม เกย เกอว รวมถึงสระ อำ ไอ ใอ เอา ส่วนคำตายคือสระเสียงสั้น หรือสะกดด้วยแม่ กก กด กบ', fig: { t: 'formula', lines: ['คำเป็น: มา ดี น้อง ตาม เรียน', 'คำตาย: จะ นก ลูก รัก ขาด', 'ต้องรู้ก่อนผันเสียง'] } },
    { say: 'เสียงวรรณยุกต์ในภาษาไทยมี <b>5 เสียง</b> คือ สามัญ เอก โท ตรี จัตวา แต่รูปวรรณยุกต์มีแค่ <b>4 รูป</b> คือ ไม้เอก ไม้โท ไม้ตรี ไม้จัตวา เสียงกับรูปไม่ตรงกันเสมอ เช่น ค่า มีไม้เอก แต่ออกเสียงโท', fig: { t: 'formula', lines: ['เสียง 5: สามัญ เอก โท ตรี จัตวา', 'รูป 4: ่ ้ ๊ ๋', 'ค่า = ไม้เอก แต่เสียงโท'] } },
    { say: 'ตารางผัน เริ่มจาก <b>อักษรกลาง</b> ผันครบ 5 เสียงในคำเป็น กา ก่า ก้า ก๊า ก๋า ได้ สามัญ เอก โท ตรี จัตวา ตรงรูปเลย ส่วน <b>อักษรสูง</b> คำเป็นไม่มีรูปได้เสียงจัตวา (ขา) ไม้เอกได้เสียงเอก (ข่า) ไม้โทได้เสียงโท (ข้า) คำตายสูงได้เสียงเอก (ขาด ขับ)', fig: { t: 'formula', lines: ['กลาง เป็น: กา ก่า ก้า ก๊า ก๋า', 'กลาง ตาย ไม่มีรูป = เอก (จด)', 'สูง เป็น: ขา=จัตวา ข่า=เอก ข้า=โท', 'สูง ตาย ไม่มีรูป = เอก (ขาด)'] } },
    { say: 'ท้ายสุดคือ <b>อักษรต่ำ</b> คำเป็นไม่มีรูปได้เสียงสามัญ (คา) ไม้เอกได้เสียงโท (ค่า) ไม้โทได้เสียงตรี (ค้า) ส่วนคำตายต่ำ ถ้าสระสั้นได้เสียงตรี (นก) ถ้าสระยาวได้เสียงโท (มาก) ข้อนี้พลาดกันบ่อย ท่องให้แม่น', fig: { t: 'formula', lines: ['ต่ำ เป็น: คา=สามัญ ค่า=โท ค้า=ตรี', 'ต่ำ ตายสั้น ไม่มีรูป = ตรี (นก)', 'ต่ำ ตายยาว ไม่มีรูป = โท (มาก)'] } }
  ] },
  { id: 'ls_thsent1', level: 'm1', subject: 'th', gen: 'th1_word', icon: '🧱', title: 'ส่วนประกอบของประโยค', blurb: 'ประธาน กริยา กรรม ส่วนขยาย และประโยค 4 แบบ', pages: [
    { say: 'ประโยคที่สมบูรณ์ประกอบด้วย 2 ภาค คือ <b>ภาคประธาน</b> (ผู้ทำ พร้อมส่วนขยาย) กับ <b>ภาคแสดง</b> (กริยา กรรม และส่วนขยาย) เช่น นกบิน นก คือประธาน บิน คือกริยา', fig: { t: 'formula', lines: ['ประโยค = ภาคประธาน + ภาคแสดง', 'นก (ประธาน) + บิน (กริยา)', 'แม่ (ประธาน) + ทำ (กริยา) + อาหาร (กรรม)'] } },
    { say: '<b>กรรม</b> คือผู้ถูกกระทำ ตามหลังกริยา ใช้ถามว่า ทำอะไร หรือ ทำกับใคร ได้ ส่วน <b>ส่วนขยาย</b> คือคำที่บอกเพิ่มเติม ขยายประธาน (แมว<b>อ้วน</b>) หรือขยายกริยา (นกบิน<b>เร็ว</b>) ไม่ใช่กรรม', fig: { t: 'formula', lines: ['แม่ทำอาหาร -> ทำอะไร = อาหาร (กรรม)', 'นกบินเร็ว -> เร็ว ขยายกริยา', 'นกสวยบินเร็ว -> สวย ขยายประธาน'] } },
    { say: 'ลำดับคำในประโยคไทยปกติเรียงเป็น <b>ประธาน + กริยา + กรรม</b> และส่วนขยายมักวางไว้ <b>หลังคำที่ขยาย</b> เช่น น้องกินข้าวเยอะ กลับคำเป็น ข้าวกินน้อง ความหมายเปลี่ยนไปทันที', fig: { t: 'formula', lines: ['ประธาน + กริยา + กรรม', 'น้อง + กิน + ข้าว', 'ส่วนขยายอยู่หลัง: แมวอ้วน บินเร็ว'] } },
    { say: 'ประโยคแบ่งตามจุดประสงค์ได้ 4 แบบ <b>บอกเล่า</b> เล่าเรื่องเฉย ๆ <b>ปฏิเสธ</b> มีคำว่า ไม่ ไม่ได้ <b>คำถาม</b> ถามเพื่อเอาคำตอบ <b>ขอร้อง/คำสั่ง</b> ให้อีกฝ่ายทำ ซึ่งมักละประธานไว้ในฐานที่เข้าใจ', fig: { t: 'formula', lines: ['บอกเล่า: ฉันกินข้าวแล้ว', 'ปฏิเสธ: ฉันไม่กินข้าว', 'คำถาม: เธอกินข้าวหรือยัง', 'ขอร้อง/สั่ง: ช่วยปิดประตูหน่อย'] } },
    { say: '<b>คำลงท้าย</b> ช่วยบอกระดับความสุภาพและอารมณ์ เช่น ครับ ค่ะ คะ นะ นะคะ ในประโยคคำถามและประโยคขอร้อง คำลงท้ายช่วยให้ฟังอ่อนโยนขึ้น ในข้อสอบเรียงความ ควรเลือกให้เหมาะกับผู้ฟัง', fig: { t: 'formula', lines: ['ปิดประตูหน่อย (สั่ง ห้วนกว่า)', 'ช่วยปิดประตูหน่อยนะคะ (สุภาพ)', 'ครับ ค่ะ คะ นะ = คำลงท้าย'] } },
    { say: 'ข้อสอบมักถามหา <b>ประโยคที่ขาดส่วนสำคัญ</b> ให้ตรวจว่าประโยคมีทั้งประธานและกริยาไหม เช่น น้องสาวของฉันที่เรียนอยู่ชั้นประถม อ่านแล้วยังค้างอยู่ ไม่มีกริยาหลัก เติมว่า ชอบอ่านหนังสือ ก็สมบูรณ์', fig: { t: 'formula', lines: ['ขาด: น้องสาวที่เรียนชั้นประถม', 'เติมกริยา: ... ชอบอ่านหนังสือ', 'ตรวจ: ใคร + ทำอะไร ครบหรือยัง'] } }
  ] },
  { id: 'ls_thchart1', level: 'm1', subject: 'th', gen: 'th1_read', icon: '📊', title: 'อ่านตาราง แผนภูมิ และประกาศ', blurb: 'อ่านข้อมูลจากตาราง กราฟแท่ง ป้ายประกาศ แล้วตอบให้ถูก', pages: [
    { say: 'ข้อสอบอ่านจับใจความมักให้ดูข้อมูลที่ไม่ใช่เรื่องเล่า เช่น <b>ตาราง</b> <b>แผนภูมิแท่ง</b> <b>แผนผัง</b> <b>ป้ายประกาศ</b> และ <b>ตารางสอน</b> ขั้นแรกให้อ่านหัวเรื่องและหัวตารางก่อนเสมอ', fig: { t: 'formula', lines: ['1. อ่านหัวเรื่อง', '2. ดูหัวตาราง และหน่วย', '3. ค่อยหาตัวเลขที่ถูกถาม'] } },
    { say: 'ตัวอย่างตารางไข่ไก่ที่ป้าไก่เก็บได้ในฟาร์ม จันทร์ 12 ฟอง อังคาร 15 ฟอง พุธ 9 ฟอง พฤหัส 14 ฟอง ศุกร์ 10 ฟอง ถ้าถามว่าวันไหนได้มากที่สุด ตอบ <b>วันอังคาร</b> วันไหนน้อยที่สุด ตอบ <b>วันพุธ</b>', fig: { t: 'formula', lines: ['จ. 12  อ. 15  พ. 9', 'พฤ. 14  ศ. 10 (หน่วย: ฟอง)', 'มากสุด = อังคาร 15', 'น้อยสุด = พุธ 9'] } },
    { say: 'ลองคำนวณจากตารางเดิม ไข่รวมทั้งสัปดาห์ 12 + 15 + 9 + 14 + 10 = <b>60 ฟอง</b> เฉลี่ยต่อวัน 60 หารด้วย 5 เท่ากับ <b>12 ฟอง</b> ส่วนต่างระหว่างวันมากสุดกับน้อยสุดคือ 15 - 9 = 6 ฟอง', fig: { t: 'formula', lines: ['รวม = 12+15+9+14+10 = 60 ฟอง', 'เฉลี่ย = 60 / 5 = 12 ฟอง/วัน', 'ส่วนต่าง = 15 - 9 = 6 ฟอง', 'อังคาร = 15/60 = 25 %'] } },
    { say: 'แผนภูมิแท่งแสดงความสูงของแท่งแทนปริมาณ ยิ่งสูงยิ่งมาก ลองดูภาพไอคอน (1 รูป แทน 1 กิโลกรัม) แอปเปิลขายได้ 5 ส้มขายได้ 3 กล้วยขายได้ 4 ผลไม้ที่ขายดีที่สุดคือแอปเปิล รวมทั้งหมด 12 กิโลกรัม', fig: { t: 'emojis', rows: [['🍎', 5, 'แอปเปิล 5 กก.'], ['🍊', 3, 'ส้ม 3 กก.'], ['🍌', 4, 'กล้วย 4 กก.']] } },
    { say: 'ป้ายประกาศต้องหา 5 อย่าง คือ ใคร ทำอะไร เมื่อไร ที่ไหน ต้องเตรียมอะไร ตัวอย่าง ประชุมผู้ปกครอง วันเสาร์ที่ 15 เวลา 9.00 - 11.30 น. ห้องประชุมใหญ่ ประชุมนาน <b>2 ชั่วโมง 30 นาที</b>', fig: { t: 'formula', lines: ['ประชุมผู้ปกครอง (ทำอะไร)', 'เสาร์ที่ 15 (เมื่อไร)', '9.00 - 11.30 น. = 2 ชม. 30 นาที', 'ห้องประชุมใหญ่ (ที่ไหน)'] } },
    { say: 'ระวังกับดักในข้อสอบ ดู <b>หน่วย</b> ให้ดี (กรัมหรือกิโลกรัม บาทหรือพันบาท) ดู <b>ช่วงเวลา</b> (รายวันหรือรายเดือน) แล้วตอบด้วยตัวเลขจริงจากตาราง อย่าเดา สรุปได้ว่า ไข่ไก่ได้มากสุดวันอังคาร เฉลี่ยวันละ 12 ฟอง', fig: { t: 'formula', lines: ['เช็ก: หน่วย', 'เช็ก: ช่วงเวลา', 'เช็ก: ตัวเลขที่ถามคือตัวไหน', 'สรุปด้วยตัวเลขจริงเสมอ'] } }
  ] },
  { id: 'ls_thmeter4', level: 'm4', subject: 'th', gen: 'th4_lit', icon: '📜', title: 'ฉันทลักษณ์: โคลง กาพย์ ร่าย ฉันท์', blurb: 'จำนวนคำ สัมผัส และข้อบังคับของคำประพันธ์ที่ออกสอบ', pages: [
    { say: 'คำประพันธ์ไทยมี 5 กลุ่มใหญ่ คือ <b>กลอน โคลง ฉันท์ กาพย์ ร่าย</b> แต่ละแบบมีลักษณะบังคับต่างกัน ได้แก่ จำนวนคำ (คณะ) สัมผัส และบางแบบมีเอก-โท หรือครุ-ลหุ เพิ่ม', fig: { t: 'formula', lines: ['ลักษณะบังคับ = คณะ + สัมผัส', 'โคลง: + เอก โท', 'ฉันท์: + ครุ ลหุ', 'กาพย์ ร่าย: คณะ และสัมผัสเป็นหลัก'] } },
    { say: '<b>โคลงสี่สุภาพ</b> 1 บทมี 4 บาท บาทที่ 1 ถึง 3 วรรคหน้า 5 คำ วรรคหลัง 2 คำ ส่วนบาทที่ 4 วรรคหน้า 5 คำ วรรคหลัง 4 คำ รวม <b>30 คำ</b> ท่องแบบนี้ให้ขึ้นใจ', fig: { t: 'formula', lines: ['บาท 1: 5 + 2', 'บาท 2: 5 + 2', 'บาท 3: 5 + 2', 'บาท 4: 5 + 4  (รวม 30 คำ)'] } },
    { say: 'สัมผัสของโคลงสี่สุภาพ คำท้ายบาทที่ 1 สัมผัสกับคำที่ 5 ของบาทที่ 2 และบาทที่ 3 ส่วนคำท้ายบาทที่ 2 สัมผัสกับคำที่ 5 ของบาทที่ 4 ท้ายบาทที่ 1 และ 3 เติม <b>คำสร้อย</b> ได้ เมื่อความยังไม่ครบ', fig: { t: 'formula', lines: ['ท้ายบาท 1 -> คำที่ 5 บาท 2, บาท 3', 'ท้ายบาท 2 -> คำที่ 5 บาท 4', 'คำสร้อย: เติมท้ายบาท 1 และ 3', 'เช่น เอย นา พ่อ แม่'] } },
    { say: 'โคลงสี่สุภาพบังคับ <b>คำเอก 7 แห่ง คำโท 4 แห่ง</b> คำเอกคือคำมีไม้เอก คำโทคือคำมีไม้โท ที่ใดบังคับเอก ใช้ <b>คำตาย</b> (เช่น บาด พบ) แทนได้ ถ้าหาคำไม่ได้ ต้องใช้รูปที่ผิดไปจากเดิม เรียก <b>เอกโทษ</b> และ <b>โทโทษ</b> ควรเลี่ยง', fig: { t: 'formula', lines: ['คำเอก 7 แห่ง = ไม้เอก หรือคำตาย', 'คำโท 4 แห่ง = ไม้โท', 'เอกโทษ โทโทษ = ฝืนใส่ไม้ที่ไม่ควรมี', 'ชมพู่ -> ชมผู้ (ตัวอย่างโทโทษ)'] } },
    { say: '<b>กาพย์ยานี 11</b> 1 บทมี 2 บาท บาทละ 2 วรรค วรรคหน้า 5 คำ วรรคหลัง 6 คำ มีสัมผัสบังคับระหว่างวรรค และท้ายบทส่งสัมผัสให้บทถัดไป ส่วน <b>กาพย์ฉบัง 16</b> 1 บทมี 3 วรรค วรรคละ 6, 4, 6 คำ ไม่บังคับเอก-โท', fig: { t: 'formula', lines: ['ยานี 11: 5 + 6 / 5 + 6', 'ฉบัง 16: 6 + 4 + 6', 'ยานี 1 บท = 22 คำ', 'ฉบัง 1 บท = 16 คำ'] } },
    { say: '<b>ร่ายสุภาพ</b> วรรคละ 5 คำ เขียนต่อกันไปไม่จำกัดจำนวนวรรค ส่งสัมผัสท้ายวรรคไปยังวรรคถัดไป และจบด้วยโคลงสองสุภาพ ส่วน <b>ฉันท์</b> ต่างจากกาพย์ตรงที่บังคับ <b>ครุ ลหุ</b> ครุ คือพยางค์เสียงยาวหรือมีตัวสะกด ลหุ คือเสียงสั้นไม่มีตัวสะกด', fig: { t: 'formula', lines: ['ร่ายสุภาพ: วรรคละ 5 คำ', 'จบด้วยโคลงสองสุภาพ', 'ครุ = เสียงยาว / มีตัวสะกด (กา, กด)', 'ลหุ = เสียงสั้น ไม่มีสะกด (กะ)'] } }
  ] },
  { id: 'ls_thsamas4', level: 'm4', subject: 'th', gen: 'th4_gram', icon: '🔗', title: 'คำสมาสและสนธิ', blurb: 'ต่อคำบาลีสันสกฤต อ่านถูก แยกออกจากคำประสม', pages: [
    { say: '<b>คำสมาส</b> คือการนำคำบาลีหรือสันสกฤต 2 คำขึ้นไปมาต่อกันโดยไม่เปลี่ยนรูป คำหลังเป็นคำตั้ง คำหน้าเป็นคำขยาย เช่น ประวัติ + ศาสตร์ = ประวัติศาสตร์', fig: { t: 'formula', lines: ['บาลี/สันสกฤต + บาลี/สันสกฤต', 'ประวัติ + ศาสตร์ = ประวัติศาสตร์', 'ไม่เปลี่ยนรูปคำเดิม'] } },
    { say: 'การแปลคำสมาสให้แปลจาก <b>หลังมาหน้า</b> เช่น มหาราช แปลว่า ราชาผู้ยิ่งใหญ่ อุบัติเหตุ แปลว่า เหตุการณ์ที่เกิดโดยไม่คาดคิด และคำที่ขึ้นต้นด้วย พระ ถ้าคำหลังเป็นบาลีสันสกฤตก็เป็นสมาส เช่น พระอาทิตย์', fig: { t: 'formula', lines: ['มหา + ราช = มหาราช', 'แปลหลังมาหน้า: ราชาผู้ยิ่งใหญ่', 'พระ + อาทิตย์ = พระอาทิตย์'] } },
    { say: 'ถ้าคำหน้ามี <b>ประวิสรรชนีย์</b> หรือ <b>การันต์</b> ต้องตัดทิ้งเมื่อสมาส เช่น แพทย์ + ศาสตร์ = แพทยศาสตร์ (ตัดการันต์ ์ ที่ ย ออก) และ <b>พระเจ้า</b> ไม่ใช่สมาส เพราะ เจ้า เป็นคำไทยแท้', fig: { t: 'formula', lines: ['แพทย์ + ศาสตร์ = แพทยศาสตร์', 'ตัดการันต์ที่คำหน้า', 'พระเจ้า ไม่ใช่สมาส (เจ้า เป็นคำไทย)'] } },
    { say: 'วิธีอ่านคำสมาส ส่วนใหญ่ให้อ่านออกเสียงสระท้ายของคำหน้าแล้วต่อเสียงคำหลัง เช่น วิทยาศาสตร์ อ่านว่า วิด-ทะ-ยา-สาด ภูมิศาสตร์ อ่านว่า พู-มิ-สาด แต่มีบางคำที่อ่านไม่เหมือนกัน เช่น พลศึกษา อ่านว่า พะ-ละ-สึก-สา', fig: { t: 'formula', lines: ['วิทยาศาสตร์ = วิด-ทะ-ยา-สาด', 'ภูมิศาสตร์ = พู-มิ-สาด', 'พลศึกษา = พะ-ละ-สึก-สา', 'พิพิธภัณฑ์ = พิ-พิด-ทะ-พัน'] } },
    { say: '<b>สนธิ</b> คือการเชื่อมเสียงของคำบาลีสันสกฤต 2 คำ ให้ติดกัน โดยสระที่ชนกันเปลี่ยนเสียงไป ต่างจากสมาสที่ไม่เปลี่ยนรูป เช่น สุข + อุทัย = สุโขทัย มหา + อิสี = มเหสี วิทยา + อาลัย = วิทยาลัย', fig: { t: 'formula', lines: ['สุข + อุทัย = สุโขทัย', 'มหา + อิสี = มเหสี', 'วิทยา + อาลัย = วิทยาลัย', 'นร + อินทร์ = นเรนทร์'] } },
    { say: 'ทบทวนวิธีแยก <b>สมาส</b> ออกจาก <b>คำประสม</b> ข้อแรก ดูที่มา ถ้าทั้งสองคำเป็นบาลีสันสกฤตก็เป็นสมาส ถ้ามีคำไทยแท้ปนด้วยก็เป็นคำประสม ข้อสอง ดูความหมายแปลหลังมาหน้า สมาส แปลได้ ส่วนคำประสมไทยแปลหน้ามาหลังตามปกติ', fig: { t: 'formula', lines: ['2 คำเป็นบาลี/สันสกฤต = สมาส', 'มีคำไทยแท้ปน = คำประสม', 'สมาสแปลหลัง -> หน้า', 'สนธิ = เสียงชนกัน เปลี่ยนรูป'] } }
  ] },
  { id: 'ls_thchange4', level: 'm4', subject: 'th', gen: 'th4_gram', icon: '🗺️', title: 'ภาษาถิ่น ภาษาสแลง และภาษาที่เปลี่ยนไป', blurb: 'ภาษาถิ่น 4 ภาค สแลง คำใหม่ และเหตุผลที่ภาษาต้องเปลี่ยน', pages: [
    { say: 'ภาษาไทยที่ใช้ทั่วประเทศมี <b>ภาษาถิ่น</b> 4 ภาค คือ เหนือ อีสาน ใต้ และกลาง ภาษากลางเป็นพื้นฐานของ <b>ภาษามาตรฐาน</b> ที่ใช้ในการเรียน ราชการ และสื่อสารกับคนทั้งประเทศ', fig: { t: 'formula', lines: ['ภาษาถิ่น 4 ภาค', 'เหนือ  อีสาน  ใต้  กลาง', 'ภาษากลาง -> ภาษามาตรฐาน'] } },
    { say: 'ตัวอย่างคำถิ่น คำว่า <b>ม่วน</b> ภาคเหนือแปลว่า สนุก คำว่า <b>เฮือน</b> ภาคอีสานแปลว่า บ้าน คำว่า <b>อ้าย</b> ภาคอีสานแปลว่า พี่ชาย คำว่า <b>หวัน</b> ภาคใต้แปลว่า วัน ใช้ในคำทักทาย หวัดดีหวัน', fig: { t: 'formula', lines: ['เหนือ: ม่วน = สนุก', 'อีสาน: เฮือน = บ้าน', 'อีสาน: อ้าย = พี่ชาย', 'ใต้: หวัน = วัน'] } },
    { say: 'คำว่า <b>พูด</b> ในแต่ละถิ่นต่างกัน ภาคเหนือเรียกว่า อู้ ภาคอีสานเรียกว่า เว้า ภาคใต้เรียกว่า แหลง ส่วนคำว่า อร่อย ภาคอีสานมีคำว่า แซ่บ ภาคใต้มีคำว่า หรอย ใช้ผิดภาคจะไม่ตรงกับความหมาย', fig: { t: 'formula', lines: ['พูด: อู้ (เหนือ)', 'พูด: เว้า (อีสาน)', 'พูด: แหลง (ใต้)', 'อร่อย: แซ่บ (อีสาน) / หรอย (ใต้)'] } },
    { say: '<b>ภาษาสแลง</b> คือถ้อยคำที่กลุ่มคนใดกลุ่มหนึ่งเข้าใจกัน หรือนิยมในช่วงเวลาหนึ่ง ยังไม่ใช่ภาษาที่ยอมรับว่าถูกต้อง เช่น เด็กแว้น เด็กซิ่ว ใช้กับเพื่อนสนิทหรือแชตได้ แต่ไม่ควรใช้ในการเขียนรายงาน เรียงความ จดหมายราชการ หรือข้อสอบ', fig: { t: 'formula', lines: ['ใช้ได้: คุยเล่นกับเพื่อน', 'ไม่ควร: รายงาน เรียงความ', 'ไม่ควร: จดหมายทางการ ข้อสอบ'] } },
    { say: 'เมื่อมีสิ่งใหม่ ๆ ก็ต้องมีคำใหม่ <b>ราชบัณฑิตยสภา</b> มีหน้าที่จัดทำพจนานุกรมและ <b>บัญญัติศัพท์</b> วิชาการ เช่น Artificial Intelligence บัญญัติว่า ปัญญาประดิษฐ์ วิธีสร้างคำมีทั้งทับศัพท์ เช่น อินเทอร์เน็ต และสร้างคำไทยขึ้นมาใหม่', fig: { t: 'formula', lines: ['ศัพท์เดิม: Artificial Intelligence', 'บัญญัติ: ปัญญาประดิษฐ์', 'ทับศัพท์: อินเทอร์เน็ต', 'ผู้บัญญัติ: ราชบัณฑิตยสภา'] } },
    { say: 'ภาษาเปลี่ยนแปลงอยู่เสมอ ทั้งคำใหม่ (เซลฟี) ความหมายเปลี่ยนไป และ <b>คำยืม</b> จากภาษาอื่น เช่น เขมร (เสด็จ ถนน) จีน (ก๋วยเตี๋ยว) อังกฤษ (คอมพิวเตอร์) ญี่ปุ่น (ซูชิ) เพราะสังคม เทคโนโลยี วัฒนธรรม เปลี่ยน ภาษามาตรฐานจึงสำคัญเพื่อให้คนทั้งประเทศเข้าใจตรงกัน', fig: { t: 'formula', lines: ['เขมร: เสด็จ ถนน', 'จีน: ก๋วยเตี๋ยว', 'อังกฤษ: คอมพิวเตอร์', 'ญี่ปุ่น: ซูชิ'] } }
  ] },
  { id: 'ls_thargue4', level: 'm4', subject: 'th', gen: 'th4_read', icon: '⚖️', title: 'วิเคราะห์ข้อโต้แย้งและเหตุผลวิบัติ', blurb: 'หาข้อสรุป เหตุผล ข้อสมมติ และจับเหตุผลวิบัติให้ได้', pages: [
    { say: '<b>ข้อโต้แย้ง</b> (การแสดงเหตุผล) มี 2 ส่วนเสมอ คือ <b>ข้อสนับสนุน</b> (เหตุผล) และ <b>ข้อสรุป</b> (สิ่งที่ผู้เขียนอยากให้เชื่อ) ขั้นแรกของการวิเคราะห์ คือหาข้อสรุปให้เจอ แล้วถามว่า เพราะอะไร', fig: { t: 'formula', lines: ['ข้อโต้แย้ง = ข้อสนับสนุน + ข้อสรุป', 'ข้อสรุป = สิ่งที่อยากให้เชื่อ', 'ถามว่า: เพราะอะไร'] } },
    { say: 'หาข้อสนับสนุนกับข้อสรุปได้จาก <b>ตัวชี้นำ</b> คำนำเหตุผล เช่น เพราะ เพราะว่า เนื่องจาก ด้วยเหตุที่ ส่วนคำนำข้อสรุป เช่น ดังนั้น เพราะฉะนั้น จึง สรุปได้ว่า ข้อสรุปอาจอยู่ต้นหรือกลางข้อความก็ได้', fig: { t: 'formula', lines: ['นำเหตุ: เพราะ เนื่องจาก', 'นำสรุป: ดังนั้น เพราะฉะนั้น จึง', 'ข้อสรุปอยู่ได้ทุกตำแหน่ง'] } },
    { say: '<b>ข้อสมมติ</b> คือสิ่งที่ผู้เขียนเชื่อโดยไม่ได้บอก ตัวอย่าง ฝนตก ดังนั้นต้องเลื่อนซ้อมกีฬา ข้อสมมติซ่อนอยู่คือ การซ้อมนั้นทำกลางแจ้ง ถ้าซ้อมในร่ม ข้อโต้แย้งนี้ก็ไม่ถูกต้อง', fig: { t: 'formula', lines: ['เหตุ: ฝนตก', 'ข้อสมมติ (ซ่อนอยู่): ซ้อมกลางแจ้ง', 'สรุป: เลื่อนซ้อม'] } },
    { say: '<b>เหตุผลวิบัติ</b> คือการให้เหตุผลที่ฟังดูดีแต่ไม่สมเหตุสมผล แม้ข้อสรุปจะจริงก็ยังวิบัติได้ แบบแรก <b>โจมตีตัวบุคคล</b> ไม่ฟังความเห็นของใครเพราะนิสัยเขา แบบสอง <b>อ้างคนส่วนมาก</b> เพื่อนทั้งห้องลอกกัน ทำไมฉันจะลอกไม่ได้', fig: { t: 'formula', lines: ['โจมตีตัวบุคคล: เขาสอบตกบ่อย', 'จึงไม่ต้องฟังข้อเสนอเรื่องขยะ', 'อ้างคนส่วนมาก: ใคร ๆ ก็ทำ'] } },
    { say: 'แบบที่สาม <b>สรุปเกินหลักฐาน</b> เจอเด็ก 2 คนไม่มีมารยาท แล้วสรุปว่าเด็กรุ่นนี้ไม่มีมารยาท แบบที่สี่ <b>ทางเลือกลวง</b> ทำเหมือนมีแค่ 2 ทาง ทั้งที่มีมากกว่า เช่น ถ้าไม่เรียนสายวิทย์ ก็ไม่มีอนาคตแน่', fig: { t: 'formula', lines: ['เจอ 2 คน -> สรุปทั้งรุ่น', 'ถ้าไม่ A ก็ต้อง B (มีแค่ 2 ทาง)', 'จริง ๆ มีทางเลือกมากกว่านั้น'] } },
    { say: 'แบบที่ห้า <b>ลื่นไถล</b> บอกว่าเรื่องเล็กจะนำไปสู่หายนะ โดยไม่มีหลักฐาน เช่น ถ้าให้เล่นเกม 10 นาที ต่อไปจะเล่นทั้งวันแล้วสอบตก ขั้นตอนทำข้อสอบ หาข้อสรุป หาเหตุผล ดูข้อสมมติ แล้วเช็กว่าตรงกับเหตุผลวิบัติแบบไหนหรือเปล่า', fig: { t: 'formula', lines: ['1. หาข้อสรุป', '2. หาเหตุผล', '3. ดูข้อสมมติ', '4. เช็กเหตุผลวิบัติ'] } }
  ] },
  { id: 'ls_thinfo4', level: 'm4', subject: 'th', gen: 'th4_read', icon: '📈', title: 'อ่านกราฟ ตาราง และอินโฟกราฟิก', blurb: 'เลือกกราฟให้ถูก อ่านแนวโน้ม คำนวณร้อยละ และไม่ตีความผิด', pages: [
    { say: 'กราฟแต่ละแบบมีงานของมัน <b>แผนภูมิวงกลม</b> แสดงสัดส่วนที่รวมกันได้ 100 เปอร์เซ็นต์ <b>แผนภูมิแท่ง</b> เทียบข้อมูลต่างกลุ่ม <b>กราฟเส้น</b> แสดงการเปลี่ยนแปลงตามเวลา เลือกให้ตรงกับงานก่อนอ่าน', fig: { t: 'formula', lines: ['วงกลม = สัดส่วน (รวม 100%)', 'แท่ง = เปรียบเทียบ', 'เส้น = เปลี่ยนแปลงตามเวลา'] } },
    { say: 'ลองอ่านข้อมูลยอดขายน้ำผลไม้ หน่วยพันขวด มกราคม 20 กุมภาพันธ์ 25 มีนาคม 30 เมษายน 25 <b>ค่าสูงสุด</b> คือมีนาคม (30) <b>ค่าต่ำสุด</b> คือมกราคม (20) แนวโน้ม ช่วงแรกเพิ่มขึ้นต่อเนื่อง แล้วลดลงในเมษายน', fig: { t: 'emojis', rows: [['🧃', 4, 'ม.ค. 20 พันขวด'], ['🧃', 5, 'ก.พ. 25 พันขวด'], ['🧃', 6, 'มี.ค. 30 พันขวด'], ['🧃', 5, 'เม.ย. 25 พันขวด']] } },
    { say: 'คำนวณ ยอดรวม 20 + 25 + 30 + 25 = 100 พันขวด <b>ค่าเฉลี่ย</b> = 100 หาร 4 = 25 พันขวดต่อเดือน มีนาคมคิดเป็น 30 จาก 100 คือ <b>ร้อยละ 30</b> ของยอดรวม', fig: { t: 'formula', lines: ['รวม = 20+25+30+25 = 100', 'เฉลี่ย = 100 / 4 = 25', 'มี.ค. = 30/100 x 100 = 30 %'] } },
    { say: 'ร้อยละของการเปลี่ยนแปลง คิดเทียบกับค่าเดิม จากมกราคมถึงมีนาคมเพิ่มจาก 20 เป็น 30 เพิ่ม 10 คิดเป็น 10 / 20 x 100 = <b>ร้อยละ 50</b> อย่าเอาไปหารด้วยค่าใหม่ และถ้าแผนภูมิวงกลมส้ม 40 แอปเปิล 35 มะม่วง 25 รวม 100 พอดี แปลว่าถ้ามี 200 ขวด ส้มมี 80 ขวด', fig: { t: 'formula', lines: ['เพิ่ม = (30 - 20) / 20 x 100', 'เท่ากับ 50 %', 'วงกลม 40+35+25 = 100', 'ส้ม 40 % ของ 200 = 80 ขวด'] } },
    { say: 'ระวัง <b>การตีความผิด</b> ข้อแรก แกนตั้งไม่เริ่มที่ 0 ทำให้ดูต่างกันมาก เช่น แท่ง 98 กับ 100 ดูเหมือนห่างกันเท่าตัว แต่จริงต่างกันแค่ประมาณ 2 เปอร์เซ็นต์ ข้อสอง สองสิ่งขึ้นลงพร้อมกัน ไม่ได้แปลว่าสิ่งหนึ่งเป็นสาเหตุของอีกสิ่ง (สหสัมพันธ์ไม่เท่ากับสาเหตุ)', fig: { t: 'formula', lines: ['แกนไม่เริ่มที่ 0 -> ดูต่างเกินจริง', '98 กับ 100 ต่างกันแค่ ~2 %', 'ไอศกรีมขายดี กับ จมน้ำมาก', 'ร้อนด้วยกัน ไม่ใช่เพราะกัน'] } },
    { say: 'เขียน <b>สรุปข้อมูล</b> เป็นประโยคที่ดี ต้องมีสิ่งที่วัด ช่วงเวลา ตัวเลขสำคัญ และแนวโน้ม เช่น ยอดขายน้ำผลไม้เพิ่มจาก 20 เป็น 30 พันขวดระหว่างมกราคมถึงมีนาคม คิดเป็นร้อยละ 50 แล้วลดเหลือ 25 พันขวดในเมษายน', fig: { t: 'formula', lines: ['สรุป = วัดอะไร + ช่วงไหน', '+ ตัวเลขสำคัญ + แนวโน้ม', 'ห้ามใส่ความเห็นที่ข้อมูลไม่รองรับ'] } }
  ] },
