  { id: 'ls_scgene4', level: 'm4', subject: 'sci', gen: 'sci4_life', icon: '🧬', title: 'DNA ยีน และโครโมโซม', blurb: 'จากเกลียวคู่ของ DNA ถึงโปรตีน และเมื่อรหัสพันธุกรรมเปลี่ยนไป', pages: [
    { say: 'ป้าไก่เล่าให้ฟังนะ <b>DNA</b> คือสารพันธุกรรมที่เก็บ "สูตร" สร้างสิ่งมีชีวิตไว้ มีรูปร่างเป็น <b>เกลียวคู่</b> เหมือนบันไดเวียนที่ถูกบิด', fig: { t: 'emojis', rows: [['🧬', 1, 'DNA เกลียวคู่'], ['📜', 1, 'เก็บสูตรของร่างกาย']] } },
    { say: 'ขั้นบันไดของ DNA คือ <b>เบส</b> 4 ชนิด จับคู่กันตายตัว A กับ T และ G กับ C ถ้ารู้เบสสายหนึ่งก็เดาอีกสายได้ทันที', fig: { t: 'formula', lines: ['A คู่กับ T', 'G คู่กับ C', 'สาย ATGC → สายคู่ TACG'] } },
    { say: '<b>ยีน</b> คือช่วงของ DNA ที่คุมลักษณะหนึ่งอย่าง ส่วน <b>โครโมโซม</b> คือ DNA ที่ม้วนอัดแน่น คนมี <b>46 โครโมโซม = 23 คู่</b> ได้จากพ่อครึ่งแม่ครึ่ง', fig: { t: 'formula', lines: ['DNA → ยีน → โครโมโซม', 'คน 46 แท่ง = 23 คู่', 'พ่อ 23 + แม่ 23'] } },
    { say: 'ยีนสร้างโปรตีนได้ด้วยลำดับ <b>DNA → RNA → โปรตีน</b> ขั้นแรกคัดลอกรหัสจาก DNA เป็น RNA แล้วอ่านรหัสนั้นเพื่อต่อกรดอะมิโนเป็นโปรตีน', fig: { t: 'formula', lines: ['DNA', '↓ คัดลอกรหัส', 'RNA', '↓ อ่านรหัสต่อกรดอะมิโน', 'โปรตีน'] } },
    { say: '<b>การกลายพันธุ์</b> คือรหัส DNA เปลี่ยนไป อาจเกิดเองหรือจากรังสี สารเคมี บางครั้งไม่มีผล บางครั้งเกิดโรค และบางครั้งให้ลักษณะใหม่ที่เป็นประโยชน์', fig: { t: 'emojis', rows: [['☢️', 1, 'รังสี/สารเคมีทำให้เกิดได้'], ['🧬', 1, 'รหัสเบสเปลี่ยน'], ['🌱', 1, 'ลักษณะใหม่ได้']] } },
    { say: 'ไม่ใช่ทุกลักษณะแบบเมนเดลง่าย ๆ เช่น <b>ข่มไม่สมบูรณ์</b> แดงผสมขาวได้ลูกชมพู ส่วนเทคโนโลยีชีวภาพคือการใช้ความรู้ DNA ปรับปรุงพืช สัตว์ หรือผลิตยา', fig: { t: 'formula', lines: ['ดอกแดง × ดอกขาว', 'ข่มไม่สมบูรณ์ → ดอกชมพู'] } }
  ] },
  { id: 'ls_scbiomol4', level: 'm4', subject: 'sci', gen: 'sci4_life', icon: '🧪', title: 'ชีวโมเลกุลและเอนไซม์', blurb: 'สารอาหารหลักในร่างกาย ตัวเร่งปฏิกิริยา และการทดสอบสาร', pages: [
    { say: 'ร่างกายสร้างจาก <b>ชีวโมเลกุล</b> 4 กลุ่มใหญ่ ได้แก่ คาร์โบไฮเดรต โปรตีน ลิพิด และกรดนิวคลีอิก แต่ละกลุ่มมีหน้าที่ต่างกัน', fig: { t: 'emojis', rows: [['🍚', 1, 'คาร์โบไฮเดรต'], ['🥚', 1, 'โปรตีน'], ['🥑', 1, 'ลิพิด'], ['🧬', 1, 'กรดนิวคลีอิก']] } },
    { say: '<b>คาร์โบไฮเดรต</b> เป็นแหล่งพลังงานหลัก <b>โปรตีน</b> สร้างและซ่อมแซมเซลล์ <b>ลิพิด</b> สะสมพลังงานและเป็นองค์ประกอบของเยื่อหุ้มเซลล์ <b>กรดนิวคลีอิก</b> (DNA, RNA) เก็บและถ่ายทอดข้อมูลพันธุกรรม', fig: { t: 'formula', lines: ['คาร์โบไฮเดรต = พลังงาน', 'โปรตีน = สร้าง/ซ่อม', 'ลิพิด = สะสมพลังงาน', 'กรดนิวคลีอิก = ข้อมูลพันธุกรรม'] } },
    { say: '<b>เอนไซม์</b> คือโปรตีนที่ทำหน้าที่เป็นตัวเร่งปฏิกิริยาชีวภาพ ทำให้ปฏิกิริยาเกิดเร็วขึ้น โดยตัวเอนไซม์เองไม่ถูกใช้หมดไป ใช้ซ้ำได้', fig: { t: 'formula', lines: ['สารตั้งต้น + เอนไซม์', '→ ผลิตภัณฑ์ + เอนไซม์เดิม'] } },
    { say: 'เอนไซม์ทำงานดีที่ <b>อุณหภูมิและ pH ที่เหมาะสม</b> ในร่างกายคนอุณหภูมิเหมาะราว 37 °C ร้อนเกินไปหรือ pH ผิดมาก โปรตีนเสียรูป เอนไซม์เลยทำงานไม่ได้', fig: { t: 'emojis', rows: [['🌡️', 1, 'ร้อนจัด เอนไซม์เสียรูป'], ['🧊', 1, 'เย็นจัด ทำงานช้าลง'], ['✅', 1, 'อุณหภูมิ/pH พอดี ทำงานดีสุด']] } },
    { say: 'การทดสอบสารอาหาร ใช้ <b>ไอโอดีน</b> กับแป้ง ได้สีน้ำเงินเข้ม และใช้ <b>เบเนดิกต์</b> ต้มกับน้ำตาลรีดิวซ์ ได้ตะกอนสีส้มแดงอิฐ', fig: { t: 'formula', lines: ['ไอโอดีน + แป้ง → น้ำเงินเข้ม', 'เบเนดิกต์ + น้ำตาลรีดิวซ์ (ต้ม) → ส้มแดงอิฐ'] } },
    { say: '<b>ไบยูเร็ต</b> ใช้ทดสอบโปรตีน ถ้ามีโปรตีนจะได้สีม่วง จำคู่ให้แม่น แป้ง = ไอโอดีน น้ำตาล = เบเนดิกต์ โปรตีน = ไบยูเร็ต ข้อสอบชอบถาม', fig: { t: 'formula', lines: ['แป้ง → ไอโอดีน → น้ำเงินเข้ม', 'น้ำตาลรีดิวซ์ → เบเนดิกต์ → ส้มแดง', 'โปรตีน → ไบยูเร็ต → ม่วง'] } }
  ] },
  { id: 'ls_scevo4', level: 'm4', subject: 'sci', gen: 'sci4_life', icon: '🦎', title: 'วิวัฒนาการและการคัดเลือกโดยธรรมชาติ', blurb: 'ทำไมสิ่งมีชีวิตเปลี่ยนไปตามกาลเวลา ตามแนวคิดของดาร์วิน', pages: [
    { say: '<b>วิวัฒนาการ</b> คือการเปลี่ยนแปลงลักษณะของประชากรสิ่งมีชีวิตข้ามหลายรุ่น เริ่มจากสังเกตว่าในหมู่เดียวกัน แต่ละตัวมี <b>ความแปรผัน</b> ไม่เหมือนกันเป๊ะ', fig: { t: 'emojis', rows: [['🐢', 1, 'ตัวที่คอสั้น'], ['🦒', 1, 'ตัวที่คอยาว']] } },
    { say: 'ดาร์วิน เสนอ <b>การคัดเลือกโดยธรรมชาติ</b> ตัวที่มีลักษณะเหมาะกับสิ่งแวดล้อมมีโอกาสรอดและมีลูกมากกว่า ลักษณะนั้นจึงถูกถ่ายทอดและพบมากขึ้นในรุ่นถัดไป', fig: { t: 'formula', lines: ['ความแปรผัน', '→ ตัวที่เหมาะสมรอดและสืบพันธุ์มากกว่า', '→ ลักษณะนั้นพบมากขึ้นในรุ่นต่อไป'] } },
    { say: 'ตัวอย่างเข้าใจง่ายคือ <b>แมลงดื้อยา</b> ในแมลงฝูงใหญ่ มีบางตัวทนยาฆ่าแมลงได้โดยบังเอิญ พอพ่นยา ตัวที่ไม่ทนตาย ตัวทนยารอดไปมีลูก รุ่นหลังก็ดื้อยามากขึ้น', fig: { t: 'emojis', rows: [['🐛', 1, 'ตัวไม่ทนยา ตาย'], ['🦟', 1, 'ตัวทนยา รอด'], ['🧪', 1, 'ลูกหลานทนยามากขึ้น']] } },
    { say: 'หลักฐานวิวัฒนาการมีหลายแบบ เช่น <b>ฟอสซิล</b> ที่บอกสิ่งมีชีวิตในอดีต และ <b>โครงสร้างคล้ายคลึง</b> เช่น กระดูกแขนของคน ค้างคาว และวาฬ ที่ใช้งานต่างกันแต่โครงสร้างพื้นฐานคล้ายกัน', fig: { t: 'emojis', rows: [['🦴', 1, 'ฟอสซิล'], ['🦇', 1, 'ปีกค้างคาว'], ['🐋', 1, 'ครีบวาฬ'], ['🙋', 1, 'แขนคน กระดูกพื้นฐานคล้ายกัน']] } },
    { say: '<b>สปีชีส์ใหม่</b> เกิดได้เมื่อประชากรถูกแยกกันทางภูมิศาสตร์ เช่น ภูเขาหรือทะเลกั้น แต่ละฝั่งสะสมความแตกต่างนานเข้า จนผสมพันธุ์กันไม่ได้อีก', fig: { t: 'formula', lines: ['ประชากรเดียว', '→ ถูกแยกทางภูมิศาสตร์', '→ สะสมความต่างหลายรุ่น', '→ กลายเป็นสปีชีส์ใหม่'] } },
    { say: 'แก้ความเข้าใจผิดนะ วิวัฒนาการ <b>ไม่ได้มีเป้าหมาย</b> สิ่งมีชีวิตไม่ได้พยายามเปลี่ยนตัวเอง และตัวเดียวไม่วิวัฒนาการระหว่างชีวิต ที่เปลี่ยนคือสัดส่วนลักษณะในประชากรข้ามรุ่น', fig: { t: 'formula', lines: ['วิวัฒนาการ ≠ ตั้งใจเปลี่ยน', 'เปลี่ยนที่ประชากรข้ามรุ่น', 'ไม่ใช่ตัวเดียวในชั่วชีวิต'] } }
  ] },
  { id: 'ls_scquake1', level: 'm1', subject: 'sci', gen: 'sci1_earth', icon: '🌋', title: 'ข้างในโลกเป็นยังไง', blurb: 'ชั้นของโลก แผ่นเปลือกโลก ภูเขาไฟ และการเตรียมตัวรับแผ่นดินไหว', pages: [
    { say: 'ถ้าผ่าโลกดู จะเห็น 3 ชั้นหลัก คือ <b>เปลือกโลก</b> ชั้นบางที่เรายืนอยู่ <b>เนื้อโลก</b> ชั้นหนาที่ร้อนและค่อย ๆ เคลื่อน และ <b>แก่นโลก</b> ใจกลางที่ร้อนมาก', fig: { t: 'emojis', rows: [['🪨', 1, 'เปลือกโลก'], ['🔥', 1, 'เนื้อโลก'], ['🔴', 1, 'แก่นโลก']] } },
    { say: 'เปลือกโลกไม่ได้เป็นชิ้นเดียว แต่แตกเป็นแผ่นใหญ่ ๆ เรียกว่า <b>แผ่นเปลือกโลก</b> ลอยอยู่บนเนื้อโลก และขยับช้ามาก เพียงไม่กี่เซนติเมตรต่อปี', fig: { t: 'formula', lines: ['เปลือกโลก = หลายแผ่นต่อกัน', 'ขยับช้า ๆ ปีละไม่กี่ cm'] } },
    { say: 'เมื่อแผ่นเปลือกโลกชนหรือเสียดสีกัน แรงสะสมจนหินแตกเลื่อน เกิด <b>แผ่นดินไหว</b> บริเวณรอยต่อของแผ่นจึงเกิดแผ่นดินไหวและมีภูเขาไฟบ่อย', fig: { t: 'emojis', rows: [['↔️', 1, 'แผ่นชนหรือเสียดสีกัน'], ['📳', 1, 'แผ่นดินไหว']] } },
    { say: '<b>ภูเขาไฟ</b> เกิดเมื่อ <b>หินหนืด</b> ใต้ดินดันตัวขึ้นมา เมื่อพ้นผิวโลกเรียกว่า <b>ลาวา</b> นอกจากนี้ยังพ่นเถ้าถ่านและแก๊สออกมาด้วย', fig: { t: 'formula', lines: ['ใต้ดิน: หินหนืด', 'พ้นปากปล่อง: ลาวา', 'ลอยในอากาศ: เถ้าถ่านและแก๊ส'] } },
    { say: 'เตรียมรับแผ่นดินไหว ในอาคารให้ <b>หมอบ ป้องกันศีรษะ และยึดของมั่นคง</b> หลบใต้โต๊ะแข็งแรง ห่างกระจกและตู้สูง อย่าใช้ลิฟต์ เมื่อหยุดไหวค่อยออกไปที่โล่ง', fig: { t: 'emojis', rows: [['🧎', 1, 'หมอบ'], ['🛡️', 1, 'ป้องกันศีรษะ'], ['🪑', 1, 'หลบใต้โต๊ะแข็งแรง'], ['🚫', 1, 'ไม่ใช้ลิฟต์']] } }
  ] },
  { id: 'ls_scstar1', level: 'm1', subject: 'sci', gen: 'sci1_earth', icon: '⭐', title: 'ดวงดาวและกลุ่มดาว', blurb: 'แยกดาวฤกษ์ ดาวเคราะห์ ดาวหาง อุกกาบาต และหาทิศด้วยดาวเหนือ', pages: [
    { say: '<b>ดาวฤกษ์</b> เปล่งแสงได้เองเหมือนดวงอาทิตย์ ส่วน <b>ดาวเคราะห์</b> ไม่เปล่งแสงเอง แค่สะท้อนแสงจากดาวฤกษ์ เช่น โลกของเรา', fig: { t: 'emojis', rows: [['☀️', 1, 'ดาวฤกษ์ เปล่งแสงเอง'], ['🪐', 1, 'ดาวเคราะห์ สะท้อนแสง']] } },
    { say: '<b>ดาวหาง</b> เป็นก้อนน้ำแข็งกับฝุ่นที่โคจรรอบดวงอาทิตย์ เมื่อเข้าใกล้ดวงอาทิตย์จะมีหางยาว ส่วน <b>อุกกาบาต</b> คือหินจากอวกาศที่ตกลงมาถึงพื้นโลก', fig: { t: 'emojis', rows: [['☄️', 1, 'ดาวหาง มีหาง'], ['🪨', 1, 'อุกกาบาต ตกถึงพื้น']] } },
    { say: '<b>กลุ่มดาว</b> คือการเอาดาวฤกษ์หลายดวงมาลากเส้นต่อกันเป็นรูปในจินตนาการ เช่น กลุ่มดาวหมีใหญ่ กลุ่มดาวนายพราน ราศีต่าง ๆ ก็เป็นกลุ่มดาวเช่นกัน', fig: { t: 'emojis', rows: [['🐻', 1, 'กลุ่มดาวหมีใหญ่'], ['🏹', 1, 'กลุ่มดาวนายพราน'], ['♈', 1, 'ราศี']] } },
    { say: 'หาทิศเหนือง่าย ๆ ด้วย <b>ดาวเหนือ</b> ซึ่งอยู่เกือบนิ่งบนฟ้าทางเหนือ วิธีหาคือต่อเส้นจากดาว 2 ดวงปลายกระบวยของกลุ่มดาวหมีใหญ่ ออกไปราว 5 เท่า', fig: { t: 'formula', lines: ['ดาวปลายกระบวยหมีใหญ่ 2 ดวง', '→ ต่อเส้นไปราว 5 เท่า', '→ พบดาวเหนือ = ทิศเหนือ'] } },
    { say: 'กลุ่มดาวที่เห็นไม่เหมือนกันทุกฤดู เพราะโลกโคจรรอบดวงอาทิตย์ ตำแหน่งที่เรามองออกไปตอนกลางคืนจึงเปลี่ยนตามเวลาในรอบปี เช่น นายพรานเห็นชัดช่วงอากาศเย็น', fig: { t: 'formula', lines: ['โลกโคจรรอบดวงอาทิตย์', '→ กลางคืนมองเห็นฟ้าคนละส่วน', '→ กลุ่มดาวต่างฤดูไม่เหมือนกัน'] } },
    { say: 'เคล็ดลับสังเกตท้องฟ้า ไปที่มืดห่างแสงไฟ รอให้ตาชินความมืดสัก 15 นาที ใช้แผนที่ดาวหรือแอปช่วย ดาวฤกษ์กะพริบ ส่วนดาวเคราะห์มักสว่างนิ่งกว่า', fig: { t: 'emojis', rows: [['🌌', 1, 'ที่มืด ห่างแสงไฟ'], ['👀', 1, 'ให้ตาชินความมืด'], ['✨', 1, 'ดาวฤกษ์กะพริบ']] } }
  ] },
  { id: 'ls_scdisaster4', level: 'm4', subject: 'sci', gen: 'sci4_adv', icon: '🌊', title: 'บริหารความเสี่ยงภัยพิบัติ', blurb: 'น้ำท่วม ดินถล่ม ไฟป่า ภัยแล้ง สาเหตุ และการรับมืออย่างเป็นระบบ', pages: [
    { say: '<b>น้ำท่วม</b> เกิดเมื่อฝนสะสมมากจนระบบระบายน้ำและดินรับไม่ไหว ส่วน <b>ดินถล่ม</b> เกิดเมื่อดินบนที่ลาดชันอิ่มตัวด้วยน้ำ หนักขึ้น และยึดเกาะกันน้อยลง', fig: { t: 'formula', lines: ['ฝนสะสมมาก', '→ ดินอิ่มตัวด้วยน้ำ', '→ น้ำไหลบ่า/ดินถล่มบนที่ลาดชัน'] } },
    { say: 'ไฟป่าเกิดจากเชื้อเพลิงแห้ง อากาศร้อน ลมแรง และมีแหล่งจุดไฟ ส่วน <b>ภัยแล้ง</b> คือฝนน้อยกว่าปกติเป็นเวลานาน น้ำไม่พอใช้ทั้งเกษตรและอุปโภค', fig: { t: 'emojis', rows: [['🔥', 1, 'ไฟป่า: แห้ง ร้อน ลมแรง'], ['🏜️', 1, 'ภัยแล้ง: ฝนน้อยนาน']] } },
    { say: 'มนุษย์ช่วยเร่งภัยพิบัติได้ <b>การตัดป่า</b> ทำให้ไม่มีรากไม้ยึดดิน และ <b>ถมที่ลุ่ม</b> ทำให้น้ำไม่มีที่ไป น้ำจึงท่วมเร็วและรุนแรงขึ้น', fig: { t: 'emojis', rows: [['🪓', 1, 'ตัดป่า ดินขาดรากยึด'], ['🏗️', 1, 'ถมที่ลุ่ม น้ำไม่มีที่ไป']] } },
    { say: 'เขื่อนช่วยกักเก็บน้ำช่วงฝนมากและปล่อยใช้ช่วงแล้ง ส่วน <b>พื้นที่รับน้ำ</b> (แก้มลิง) เป็นที่ลุ่มสำหรับพักน้ำชั่วคราว ช่วยลดน้ำท่วมพื้นที่ชุมชน', fig: { t: 'emojis', rows: [['🏞️', 1, 'เขื่อนกักเก็บน้ำ'], ['🌾', 1, 'พื้นที่รับน้ำ พักน้ำชั่วคราว']] } },
    { say: 'การเตือนภัยใช้ข้อมูลเช่น ปริมาณฝนสะสมและระดับน้ำ ก่อนแบ่งระดับเตือน เมื่อถึงเกณฑ์ก็ประกาศ <b>แผนอพยพ</b> ซึ่งต้องรู้ล่วงหน้าทั้งเส้นทาง จุดรวมพล และที่พักพิง', fig: { t: 'formula', lines: ['ข้อมูล: ฝนสะสม ระดับน้ำ', '→ ระดับเตือนภัย', '→ แผนอพยพ'] } },
    { say: 'แนวคิด <b>การบริหารความเสี่ยง</b> ความเสี่ยง = โอกาสเกิด × ความรุนแรง ลดได้ทั้งสองทาง เช่น ไม่สร้างบ้านในเขตน้ำหลากและมีทางหนีทีไล่ เพื่อลดความเสียหาย', fig: { t: 'formula', lines: ['ความเสี่ยง = โอกาสเกิด × ความรุนแรง', 'ลดโอกาสเกิด หรือ ลดความรุนแรง', '→ ความเสี่ยงลดลง'] } }
  ] },
  { id: 'ls_scsolar4', level: 'm4', subject: 'sci', gen: 'sci4_adv', icon: '🪐', title: 'ระบบสุริยะเชิงฟิสิกส์', blurb: 'แรงโน้มถ่วง วงโคจร กฎของเคปเลอร์ และหน่วยดาราศาสตร์', pages: [
    { say: 'ดาวเคราะห์โคจรรอบดวงอาทิตย์ได้เพราะ <b>แรงโน้มถ่วง</b> ของดวงอาทิตย์ดึงไว้ ถ้าไม่มีแรงนี้ ดาวเคราะห์จะพุ่งตรงหลุดออกไปในอวกาศ', fig: { t: 'emojis', rows: [['☀️', 1, 'ดวงอาทิตย์ ดึงด้วยแรงโน้มถ่วง'], ['🌍', 1, 'ดาวเคราะห์ โคจรโค้งรอบ']] } },
    { say: '<b>กฎข้อที่ 1 ของเคปเลอร์</b> วงโคจรของดาวเคราะห์เป็น <b>วงรี</b> โดยมีดวงอาทิตย์อยู่ที่จุดโฟกัสจุดหนึ่ง ไม่ใช่วงกลมสมบูรณ์', fig: { t: 'formula', lines: ['วงโคจรดาวเคราะห์ = วงรี', 'ดวงอาทิตย์อยู่ที่จุดโฟกัส'] } },
    { say: 'ดาวเคราะห์เคลื่อนที่ <b>เร็วขึ้นเมื่ออยู่ใกล้ดวงอาทิตย์</b> และช้าลงเมื่ออยู่ไกล เพราะแรงโน้มถ่วงที่ใกล้ดึงแรงกว่า นี่คือเนื้อหาจากกฎข้อที่ 2 ของเคปเลอร์', fig: { t: 'formula', lines: ['ใกล้ดวงอาทิตย์ → เร็วขึ้น', 'ไกลดวงอาทิตย์ → ช้าลง'] } },
    { say: '<b>กฎข้อที่ 3</b> ดาวเคราะห์ที่อยู่ไกลออกไป ใช้เวลาโคจรครบรอบนานขึ้น ปีของดาวเนปจูนจึงยาวกว่าปีของโลกมาก โดยเทียบด้วย T² = a³ เมื่อ T เป็นปี a เป็น AU', fig: { t: 'formula', lines: ['ไกลขึ้น → 1 ปียาวขึ้น', 'T² = a³ (T ปี, a เป็น AU)', 'a = 4 AU → T² = 64 → T = 8 ปี'] } },
    { say: '<b>หน่วยดาราศาสตร์ (AU)</b> คือระยะเฉลี่ยจากโลกถึงดวงอาทิตย์ ประมาณ <b>150 ล้านกิโลเมตร</b> ใช้วัดระยะในระบบสุริยะให้ตัวเลขไม่ใหญ่เกินไป', fig: { t: 'formula', lines: ['โลก–อาทิตย์ = 1 AU', '1 AU ≈ 150 ล้าน km', 'ดาวที่ไกลกว่าโลก มี AU มากกว่า 1'] } },
    { say: 'ดาวเคราะห์ใน (พุธ ศุกร์ โลก อังคาร) เป็นหิน ส่วนดาวเคราะห์นอก (พฤหัส เสาร์ ยูเรนัส เนปจูน) เป็นก๊าซหรือน้ำแข็งขนาดใหญ่ ดวงจันทร์ก็โคจรรอบโลกด้วยแรงโน้มถ่วง และแรงดึงดูดของดวงจันทร์ทำให้เกิดน้ำขึ้นน้ำลง', fig: { t: 'emojis', rows: [['🪨', 1, 'ดาวเคราะห์ใน เป็นหิน'], ['🌀', 1, 'ดาวเคราะห์นอก ก๊าซ/น้ำแข็ง'], ['🌙', 1, 'ดวงจันทร์ ทำให้น้ำขึ้นน้ำลง']] } }
  ] },
  // ---------- v0.27.0: lessons3_bio ----------

  { id: 'ls_bcell1', level: 'm1', subject: 'sci', gen: 'sci1_life', icon: '🔬', title: 'เซลล์และกล้องจุลทรรศน์', blurb: 'เซลล์พืช เซลล์สัตว์ ออร์แกเนลล์ และวิธีใช้กล้องส่องดูสิ่งเล็ก ๆ', pages: [
    { say: 'ป้าไก่เล่าให้ฟังนะ สิ่งมีชีวิตทุกชนิดประกอบด้วย <b>เซลล์</b> เป็นหน่วยเล็กที่สุดที่ยังมีชีวิต เล็กจนตาเปล่ามองไม่เห็น ต้องใช้ <b>กล้องจุลทรรศน์</b> ช่วยขยายภาพ', fig: { t: 'emojis', rows: [['🔬', 1, 'กล้องจุลทรรศน์'], ['🧫', 1, 'เซลล์'], ['🌿', 1, 'สิ่งมีชีวิต']] } },
    { say: 'ในเซลล์มีชิ้นส่วนเล็ก ๆ เรียกว่า <b>ออร์แกเนลล์</b> เช่น <b>เยื่อหุ้มเซลล์</b> คุมการเข้าออกของสาร <b>นิวเคลียส</b> เป็นศูนย์ควบคุม และ <b>ไมโทคอนเดรีย</b> สร้างพลังงานให้เซลล์', fig: { t: 'formula', lines: ['เยื่อหุ้มเซลล์ = ด่านคุมสารเข้าออก', 'นิวเคลียส = ศูนย์ควบคุม', 'ไมโทคอนเดรีย = โรงไฟฟ้า'] } },
    { say: '<b>เซลล์พืช</b> มีสิ่งที่เซลล์สัตว์ไม่มี คือ <b>ผนังเซลล์</b> ที่แข็งแรงช่วยค้ำรูปร่าง <b>คลอโรพลาสต์</b> สีเขียวที่สังเคราะห์แสง และ <b>แวคิวโอล</b> ใหญ่ที่เก็บน้ำ เซลล์สัตว์ไม่มีสามอย่างนี้', fig: { t: 'emojis', rows: [['🌱', 1, 'เซลล์พืช: ผนังเซลล์ คลอโรพลาสต์ แวคิวโอลใหญ่'], ['🐶', 1, 'เซลล์สัตว์: ไม่มีผนังเซลล์ ไม่มีคลอโรพลาสต์']] } },
    { say: 'กล้องจุลทรรศน์มี <b>เลนส์ใกล้ตา</b> (ที่เรามองเข้าไป) และ <b>เลนส์ใกล้วัตถุ</b> (ใกล้สไลด์) ต้องเริ่มดูด้วยเลนส์กำลังขยายต่ำก่อน แล้วค่อยเปลี่ยนเป็นกำลังขยายสูง ใช้ปุ่มปรับภาพหยาบหาภาพ แล้วปรับภาพละเอียดให้คม', fig: { t: 'emojis', rows: [['👁️', 1, 'เลนส์ใกล้ตา'], ['🔍', 1, 'เลนส์ใกล้วัตถุ'], ['🧪', 1, 'สไลด์บนแท่นวางวัตถุ']] } },
    { say: '<b>กำลังขยายรวม</b> = กำลังขยายเลนส์ใกล้ตา × กำลังขยายเลนส์ใกล้วัตถุ เช่น เลนส์ใกล้ตา 10 เท่า ใช้กับเลนส์ใกล้วัตถุ 40 เท่า จะขยายรวม 10 × 40 = 400 เท่า', fig: { t: 'formula', lines: ['กำลังขยายรวม = ใกล้ตา × ใกล้วัตถุ', '10 × 40 = 400 เท่า'] } },
    { say: 'สิ่งมีชีวิตที่มีเซลล์เดียว เช่น อะมีบา แบคทีเรีย เรียก <b>สิ่งมีชีวิตเซลล์เดียว</b> ส่วนคน สัตว์ และพืชส่วนใหญ่ประกอบด้วยหลายเซลล์ เรียก <b>สิ่งมีชีวิตหลายเซลล์</b> ที่เซลล์แต่ละกลุ่มทำหน้าที่ต่างกัน', fig: { t: 'emojis', rows: [['🦠', 1, 'เซลล์เดียว เช่น อะมีบา แบคทีเรีย'], ['🧍', 1, 'หลายเซลล์ เช่น คน สัตว์ พืช']] } }
  ] },
  { id: 'ls_bclass1', level: 'm1', subject: 'sci', gen: 'sci1_life', icon: '🗂️', title: 'การจำแนกสิ่งมีชีวิต', blurb: 'จัดสิ่งมีชีวิตเป็นหมวดหมู่ ชื่อวิทยาศาสตร์ และอาณาจักรหลัก', pages: [
    { say: 'โลกมีสิ่งมีชีวิตมหาศาล นักวิทยาศาสตร์จึงต้อง <b>จำแนก</b> เป็นกลุ่ม โดยดูลักษณะร่วม เช่น มีกระดูกสันหลังไหม มีเซลล์แบบไหน สร้างอาหารเองได้ไหม แล้วจัดตามความคล้ายกัน', fig: { t: 'emojis', rows: [['🐟', 1, 'ลักษณะคล้ายกัน = กลุ่มเดียวกัน'], ['🐦', 1, 'ลักษณะต่างกัน = คนละกลุ่ม']] } },
    { say: 'ลำดับขั้นการจัดหมวดหมู่จากกลุ่มใหญ่ไปเล็ก คือ <b>อาณาจักร → ไฟลัม → ชั้น → อันดับ → วงศ์ → สกุล → ชนิด</b> ยิ่งลงมาข้างล่าง สมาชิกยิ่งคล้ายกันมาก', fig: { t: 'formula', lines: ['อาณาจักร → ไฟลัม → ชั้น', '→ อันดับ → วงศ์ → สกุล → ชนิด', 'ใหญ่สุด ----> เล็กสุด'] } },
    { say: '<b>ชื่อวิทยาศาสตร์</b> ใช้ระบบ <b>ทวินาม</b> ของ <b>ลินเนียส</b> คือชื่อสกุลขึ้นก่อนด้วยตัวใหญ่ ตามด้วยชื่อชนิดตัวเล็ก และเขียนเป็นตัวเอน เช่น Homo sapiens ของมนุษย์ ใช้ได้เหมือนกันทั่วโลก', fig: { t: 'formula', lines: ['ชื่อวิทยาศาสตร์ = สกุล + ชนิด', 'ตัวอย่าง: Homo sapiens (คน)'] } },
    { say: 'อาณาจักรหลักที่ควรรู้ มี <b>แบคทีเรีย</b> (ไม่มีนิวเคลียส) <b>โปรติสต์</b> (เช่น อะมีบา สาหร่ายบางชนิด) <b>ฟังไจ</b> (เห็ด รา ยีสต์) <b>พืช</b> และ <b>สัตว์</b>', fig: { t: 'emojis', rows: [['🦠', 1, 'แบคทีเรีย'], ['🍄', 1, 'ฟังไจ'], ['🌳', 1, 'พืช'], ['🦁', 1, 'สัตว์']] } },
    { say: 'สัตว์มีกระดูกสันหลังแบ่งเป็น 5 กลุ่ม คือ <b>ปลา สัตว์สะเทินน้ำสะเทินบก สัตว์เลื้อยคลาน นก</b> และ <b>สัตว์เลี้ยงลูกด้วยนม</b> สัตว์เลี้ยงลูกด้วยนมมีขนและให้นมลูก', fig: { t: 'emojis', rows: [['🐟', 1, 'ปลา'], ['🐸', 1, 'สะเทินน้ำสะเทินบก'], ['🐍', 1, 'เลื้อยคลาน'], ['🐦', 1, 'นก'], ['🐘', 1, 'เลี้ยงลูกด้วยนม']] } },
    { say: '<b>ไดโคโทมัสคีย์</b> คือวิธีจำแนกโดยตั้งคำถามที่ตอบได้สองทาง เช่น มีปีกไหม ถ้ามีไปข้อหนึ่ง ถ้าไม่มีไปอีกข้อหนึ่ง ถามไปเรื่อย ๆ จนเหลือสิ่งมีชีวิตทีละชนิด', fig: { t: 'formula', lines: ['มีปีกไหม?', 'มี → ข้อ 2 / ไม่มี → ข้อ 3', 'ตอบ 2 ทาง จนเหลือชนิดเดียว'] } }
  ] },
  { id: 'ls_bplant1', level: 'm1', subject: 'sci', gen: 'sci1_life', icon: '🌿', title: 'พืชและการสังเคราะห์ด้วยแสง', blurb: 'ส่วนต่าง ๆ ของพืช และพืชสร้างอาหารจากแสงได้อย่างไร', pages: [
    { say: 'พืชมีส่วนสำคัญหลายส่วน <b>ราก</b> ดูดน้ำและยึดดิน <b>ลำต้น</b> ค้ำพืชและลำเลียง <b>ใบ</b> สร้างอาหาร <b>ดอก</b> ใช้สืบพันธุ์ และ <b>ผล</b> ห่อหุ้มเมล็ด', fig: { t: 'emojis', rows: [['🌱', 1, 'ราก: ดูดน้ำ ยึดดิน'], ['🌿', 1, 'ลำต้น: ค้ำและลำเลียง'], ['🍃', 1, 'ใบ: สร้างอาหาร'], ['🌸', 1, 'ดอก: สืบพันธุ์']] } },
    { say: 'พืชสร้างอาหารเองได้ด้วย <b>การสังเคราะห์ด้วยแสง</b> โดยใช้ <b>คาร์บอนไดออกไซด์</b> จากอากาศกับ <b>น้ำ</b> จากราก ใช้พลังงานแสง แล้วได้ <b>น้ำตาล</b> (กลูโคส) และ <b>ออกซิเจน</b>', fig: { t: 'formula', lines: ['CO₂ + น้ำ --(แสง, คลอโรฟิลล์)--> น้ำตาล + O₂', 'พืชสร้างอาหาร และปล่อยออกซิเจน'] } },
    { say: 'ปัจจัยที่ต้องมี คือ <b>แสง</b> <b>แก๊สคาร์บอนไดออกไซด์</b> <b>น้ำ</b> และ <b>คลอโรฟิลล์</b> สารสีเขียวในคลอโรพลาสต์ที่จับพลังงานแสง ถ้าขาดอย่างใดอย่างหนึ่ง การสังเคราะห์แสงจะเกิดไม่ได้หรือช้าลง', fig: { t: 'emojis', rows: [['☀️', 1, 'แสง'], ['💨', 1, 'คาร์บอนไดออกไซด์'], ['💧', 1, 'น้ำ'], ['🟩', 1, 'คลอโรฟิลล์']] } },
    { say: 'ที่ผิวใบมีรูเล็ก ๆ เรียก <b>ปากใบ</b> เป็นทางให้แก๊สเข้าออก และให้ไอน้ำระเหยออก เรียกว่า <b>การคายน้ำ</b> ช่วยดึงน้ำจากรากขึ้นมาและทำให้ใบไม่ร้อนเกินไป', fig: { t: 'formula', lines: ['ปากใบ: CO₂ เข้า / O₂ ออก', 'ไอน้ำออก = การคายน้ำ'] } },
    { say: 'ทดสอบว่าใบสร้างแป้งไหม ต้มใบในน้ำเดือด แล้วแช่แอลกอฮอล์เพื่อดึงสีเขียวออก จากนั้นหยด <b>สารละลายไอโอดีน</b> ถ้ามีแป้ง จะเปลี่ยนเป็นสี <b>น้ำเงินเข้ม</b> หรือม่วงดำ', fig: { t: 'formula', lines: ['ใบมีแป้ง + ไอโอดีน', '= สีน้ำเงินเข้ม', 'ไม่มีแป้ง = ไอโอดีนสีน้ำตาลเหลือง'] } },
    { say: 'สรุปให้เด็ก ๆ จำง่าย ๆ ว่า ถ้าเอาใบไปปิดมืดหรือตัดแสง ใบจะสร้างแป้งน้อยลง แสดงว่าแสงสำคัญ พืชจึงเป็นผู้ผลิตของห่วงโซ่อาหาร ให้ทั้งอาหารและออกซิเจนแก่สิ่งมีชีวิตอื่น', fig: { t: 'emojis', rows: [['🌿', 1, 'ผู้ผลิตอาหารและออกซิเจน'], ['🐛', 1, 'ผู้บริโภคกินพืช'], ['🧑', 1, 'คนได้อาหารและอากาศ']] } }
  ] },
  { id: 'ls_blife1', level: 'm1', subject: 'sci', gen: 'sci1_life', icon: '🦋', title: 'การสืบพันธุ์และวงจรชีวิต', blurb: 'สิ่งมีชีวิตสืบพันธุ์อย่างไร ตั้งแต่ดอกไม้ถึงผีเสื้อ', pages: [
    { say: 'การสืบพันธุ์มี 2 แบบ <b>แบบไม่อาศัยเพศ</b> ใช้ตัวเดียวก็สร้างลูกได้ ลูกเหมือนพ่อแม่ เช่น แบคทีเรียแบ่งตัว ยีสต์แตกหน่อ ส่วน <b>แบบอาศัยเพศ</b> ต้องมีเซลล์สืบพันธุ์ตัวผู้และตัวเมียมารวมกัน', fig: { t: 'emojis', rows: [['🦠', 1, 'ไม่อาศัยเพศ: แบ่งตัว แตกหน่อ'], ['🐔', 1, 'อาศัยเพศ: ตัวผู้ + ตัวเมีย']] } },
    { say: 'ดอกไม้สมบูรณ์เพศมี <b>เกสรตัวผู้</b> สร้างละอองเรณู และ <b>เกสรตัวเมีย</b> ที่มีรังไข่ซึ่งในรังไข่มีออวุล เมื่อละอองเรณูตกบนยอดเกสรตัวเมีย เรียกว่า <b>การถ่ายละอองเรณู</b>', fig: { t: 'emojis', rows: [['🌼', 1, 'เกสรตัวผู้ ให้ละอองเรณู'], ['🐝', 1, 'ผึ้งช่วยถ่ายละอองเรณู'], ['🌸', 1, 'เกสรตัวเมีย มีรังไข่']] } },
    { say: 'หลังถ่ายละอองเรณู เซลล์สืบพันธุ์ตัวผู้เข้าไปรวมกับเซลล์ไข่ในออวุล เรียกว่า <b>การปฏิสนธิ</b> จากนั้นออวุลเจริญเป็น <b>เมล็ด</b> และรังไข่เจริญเป็น <b>ผล</b>', fig: { t: 'formula', lines: ['ละอองเรณู → ปฏิสนธิ', 'ออวุล → เมล็ด', 'รังไข่ → ผล'] } },
    { say: '<b>กบ</b> วางไข่ในน้ำ ไข่ฟักเป็นลูกอ๊อดหายใจด้วยเหงือก แล้วงอกขา หางหด ปอดเจริญ กลายเป็นกบโตเต็มวัยที่อยู่บนบกได้ เรียกว่าการเปลี่ยนแปลงรูปร่าง', fig: { t: 'formula', lines: ['ไข่ → ลูกอ๊อด → ลูกกบ → กบโตเต็มวัย', 'ในน้ำ ................. บนบก'] } },
    { say: 'แมลงเปลี่ยนรูปร่างได้ 2 แบบ <b>สมบูรณ์</b> มี 4 ระยะ ไข่ ตัวอ่อน ดักแด้ ตัวเต็มวัย เช่น ผีเสื้อ ส่วน <b>ไม่สมบูรณ์</b> ไม่มีดักแด้ ตัวอ่อนคล้ายพ่อแม่ เช่น ตั๊กแตน แมลงสาบ', fig: { t: 'emojis', rows: [['🥚', 1, 'ไข่'], ['🐛', 1, 'ตัวอ่อน'], ['🪺', 1, 'ดักแด้'], ['🦋', 1, 'ตัวเต็มวัย']] } },
    { say: 'มนุษย์สืบพันธุ์แบบอาศัยเพศ เมื่อ <b>เซลล์อสุจิ</b> จากเพศชายรวมกับ <b>เซลล์ไข่</b> จากเพศหญิง เกิดการปฏิสนธิ แล้วเจริญในมดลูกจนคลอด ร่างกายของวัยรุ่นจะเปลี่ยนแปลงตามฮอร์โมนซึ่งเป็นเรื่องธรรมชาติ', fig: { t: 'formula', lines: ['อสุจิ + ไข่ = ปฏิสนธิ', 'เจริญในมดลูก → ทารก'] } }
  ] },
  { id: 'ls_bimmune1', level: 'm1', subject: 'sci', gen: 'sci1_life', icon: '🛡️', title: 'เชื้อโรค ภูมิคุ้มกัน และวัคซีน', blurb: 'ร่างกายสู้เชื้อโรคอย่างไร และวัคซีนช่วยอะไร', pages: [
    { say: '<b>เชื้อโรค</b> คือจุลชีพที่ทำให้เกิดโรค มีหลายกลุ่ม เช่น <b>ไวรัส</b> (ไข้หวัดใหญ่) <b>แบคทีเรีย</b> (วัณโรค) <b>ฟังไจ</b> (กลาก เกลื้อน) และ <b>โปรโตซัว</b> (มาลาเรีย)', fig: { t: 'emojis', rows: [['🧬', 1, 'ไวรัส'], ['🦠', 1, 'แบคทีเรีย'], ['🍄', 1, 'ฟังไจ'], ['🔬', 1, 'โปรโตซัว']] } },
    { say: 'เชื้อโรคติดต่อได้หลายทาง เช่น ทางอากาศจากการไอจาม ทางอาหารและน้ำที่ไม่สะอาด การสัมผัสสิ่งของที่เปื้อนเชื้อ หรือมีสัตว์พาหะ เช่น ยุงที่เป็นพาหะของไข้เลือดออก', fig: { t: 'emojis', rows: [['🤧', 1, 'ไอ จาม'], ['🍲', 1, 'อาหารน้ำไม่สะอาด'], ['🦟', 1, 'สัตว์พาหะ เช่น ยุง']] } },
    { say: 'ร่างกายมีด่านป้องกัน <b>ด่านแรก</b> คือ ผิวหนัง น้ำตา น้ำลาย เมือกในจมูก ช่วยกันเชื้อไม่ให้เข้า ถ้าเชื้อเข้าได้ <b>ด่านสอง</b> คือ <b>เม็ดเลือดขาว</b> ที่จับกินหรือกำจัดเชื้อโรค', fig: { t: 'formula', lines: ['ด่านแรก: ผิวหนัง น้ำตา เมือก', 'ด่านสอง: เม็ดเลือดขาว'] } },
    { say: '<b>วัคซีน</b> คือเชื้อที่อ่อนแรงหรือตายแล้ว หรือชิ้นส่วนของเชื้อ ฉีดเข้าไปเพื่อให้ร่างกายสร้างภูมิคุ้มกันไว้ก่อน เมื่อเจอเชื้อจริงภายหลัง ร่างกายจะจำได้และสู้ได้เร็ว โดยไม่ต้องป่วยหนักก่อน', fig: { t: 'emojis', rows: [['💉', 1, 'วัคซีนฝึกร่างกาย'], ['🧠', 1, 'ร่างกายจำเชื้อได้'], ['🛡️', 1, 'สู้ได้เร็วเมื่อเจอจริง']] } },
    { say: 'สุขอนามัยง่าย ๆ ช่วยลดการติดเชื้อมาก เช่น <b>ล้างมือ</b> ด้วยน้ำและสบู่ก่อนกินข้าวและหลังเข้าห้องน้ำ กินอาหารที่สุก ใส่หน้ากากเมื่อป่วย และนอนหลับให้พอ', fig: { t: 'emojis', rows: [['🧼', 1, 'ล้างมือบ่อย ๆ'], ['😷', 1, 'ใส่หน้ากากเมื่อป่วย'], ['😴', 1, 'นอนให้พอ']] } },
    { say: '<b>ยาปฏิชีวนะ</b> ใช้ฆ่าหรือยับยั้ง <b>แบคทีเรีย</b> เท่านั้น ใช้กับ <b>ไวรัส</b> เช่น ไข้หวัด ไม่ได้ผล การกินยาปฏิชีวนะพร่ำเพรื่อทำให้เชื้อดื้อยา ต้องใช้ตามที่หมอสั่ง', fig: { t: 'formula', lines: ['ยาปฏิชีวนะ → ใช้กับแบคทีเรีย', 'ไวรัส → ไม่ได้ผล', 'ใช้ตามหมอสั่งเท่านั้น'] } }
  ] },
  { id: 'ls_bdiv4', level: 'm4', subject: 'sci', gen: 'sci4_life', icon: '🧬', title: 'การแบ่งเซลล์', blurb: 'ไมโทซิสและไมโอซิส จำนวนโครโมโซม และความหลากหลาย', pages: [
    { say: 'เซลล์ใหม่เกิดจากเซลล์เดิมแบ่งตัวเท่านั้น วัฏจักรเซลล์แบ่งเป็น <b>อินเทอร์เฟส</b> ที่เซลล์เติบโตและจำลอง DNA กับ <b>ระยะแบ่งเซลล์</b> ที่นิวเคลียสและไซโทพลาซึมแบ่งออกเป็นเซลล์ลูก', fig: { t: 'formula', lines: ['วัฏจักรเซลล์ = อินเทอร์เฟส + แบ่งเซลล์', 'อินเทอร์เฟส: เติบโต จำลอง DNA'] } },
    { say: '<b>ไมโทซิส</b> แบ่งหนึ่งครั้ง ได้ <b>2 เซลล์ลูก</b> ที่มีจำนวนโครโมโซมเท่าเซลล์แม่ และเหมือนกันทางพันธุกรรม ใช้ในการเจริญเติบโต ซ่อมแซมแผล และทดแทนเซลล์เก่า', fig: { t: 'formula', lines: ['ไมโทซิส: 1 เซลล์ → 2 เซลล์', '2n → 2n (เท่าเดิม)', 'เซลล์ลูกเหมือนเซลล์แม่'] } },
    { say: '<b>ไมโอซิส</b> แบ่งสองครั้งติดกัน ได้ <b>4 เซลล์ลูก</b> ที่มีโครโมโซมลดลงครึ่งหนึ่ง ใช้สร้างเซลล์สืบพันธุ์ (อสุจิและไข่) เมื่อปฏิสนธิ จำนวนโครโมโซมจึงกลับเป็นปกติ', fig: { t: 'formula', lines: ['ไมโอซิส: 1 เซลล์ → 4 เซลล์', '2n → n (ลดลงครึ่ง)', 'n + n = 2n เมื่อปฏิสนธิ'] } },
    { say: 'ตัวอย่างคำนวณ คนมีโครโมโซมในเซลล์ร่างกาย <b>2n = 46</b> แท่ง ถ้าเซลล์ร่างกายแบ่งแบบไมโทซิส เซลล์ลูกมี 46 แท่ง แต่ถ้าแบ่งแบบไมโอซิส เซลล์สืบพันธุ์มี n = 46 ÷ 2 = <b>23</b> แท่ง', fig: { t: 'formula', lines: ['เซลล์ร่างกาย 2n = 46', 'เซลล์สืบพันธุ์ n = 46 ÷ 2 = 23', 'ปฏิสนธิ 23 + 23 = 46'] } },
    { say: 'ในไมโอซิส มี <b>ครอสซิงโอเวอร์</b> คือโครโมโซมคู่เหมือนแลกเปลี่ยนชิ้นส่วนกัน และโครโมโซมแยกกันแบบสุ่ม ทำให้เซลล์สืบพันธุ์มีชุดพันธุกรรมต่างกัน ลูกจึงมีความหลากหลาย', fig: { t: 'emojis', rows: [['🧬', 1, 'ครอสซิงโอเวอร์แลกชิ้นส่วน'], ['🎲', 1, 'แยกโครโมโซมแบบสุ่ม'], ['🌈', 1, 'ลูกมีความหลากหลาย']] } },
    { say: 'ถ้าการแบ่งเซลล์ผิดปกติ จะเกิดปัญหาได้ เช่น <b>มะเร็ง</b> คือเซลล์แบ่งตัวไม่หยุดจนควบคุมไม่ได้ และถ้าโครโมโซมแยกไม่ปกติตอนไมโอซิส เช่น มีโครโมโซมคู่ที่ 21 เกินมา 1 แท่ง จะเกิด <b>ดาวน์ซินโดรม</b>', fig: { t: 'emojis', rows: [['⚠️', 1, 'มะเร็ง: แบ่งไม่หยุด'], ['🧬', 1, 'ดาวน์ซินโดรม: โครโมโซม 21 เกิน 1 แท่ง']] } }
  ] },
  { id: 'ls_bnerve4', level: 'm4', subject: 'sci', gen: 'sci4_life', icon: '🧠', title: 'ระบบประสาทและฮอร์โมน', blurb: 'เซลล์ประสาท รีเฟล็กซ์ ฮอร์โมน และภาวะธำรงดุล', pages: [
    { say: 'หน่วยของระบบประสาทคือ <b>เซลล์ประสาท</b> มี <b>ตัวเซลล์</b> ที่มีนิวเคลียส <b>เดนไดรต์</b> รับสัญญาณเข้า และ <b>แอกซอน</b> ส่งสัญญาณออก ระหว่างเซลล์ประสาทมีรอยต่อเรียกว่า <b>ไซแนปส์</b> ที่ส่งสัญญาณด้วยสารเคมี', fig: { t: 'formula', lines: ['เดนไดรต์ → ตัวเซลล์ → แอกซอน', '→ ไซแนปส์ → เซลล์ถัดไป'] } },
    { say: 'ระบบประสาทแบ่งเป็น <b>ระบบประสาทส่วนกลาง</b> คือสมองกับไขสันหลัง ทำหน้าที่ประมวลผล และ <b>ระบบประสาทรอบนอก</b> คือเส้นประสาทที่ส่งข้อมูลระหว่างอวัยวะกับระบบประสาทส่วนกลาง', fig: { t: 'emojis', rows: [['🧠', 1, 'สมอง'], ['🦴', 1, 'ไขสันหลัง'], ['⚡', 1, 'เส้นประสาทรอบนอก']] } },
    { say: '<b>รีเฟล็กซ์</b> คือการตอบสนองเร็วโดยไม่ต้องรอสมองคิด เช่น มือโดนของร้อนแล้วชักมือหนี เส้นทางคือ ตัวรับ → เซลล์ประสาทรับความรู้สึก → <b>ไขสันหลัง</b> → เซลล์ประสาทสั่งการ → กล้ามเนื้อ', fig: { t: 'formula', lines: ['ตัวรับ → ประสาทรับความรู้สึก', '→ ไขสันหลัง → ประสาทสั่งการ', '→ กล้ามเนื้อตอบสนอง'] } },
    { say: '<b>ฮอร์โมน</b> สร้างจาก <b>ต่อมไร้ท่อ</b> ส่งไปตามเลือด เช่น <b>อินซูลิน</b> (ลดน้ำตาลในเลือด) <b>กลูคากอน</b> (เพิ่มน้ำตาลในเลือด) <b>อะดรีนาลีน</b> (เตรียมสู้หรือหนี) <b>ไทรอกซิน</b> (คุมเมแทบอลิซึม) และ <b>GH</b> (กระตุ้นการเจริญเติบโต)', fig: { t: 'emojis', rows: [['🍬', 1, 'อินซูลิน: ลดน้ำตาล'], ['🍭', 1, 'กลูคากอน: เพิ่มน้ำตาล'], ['😱', 1, 'อะดรีนาลีน: สู้หรือหนี'], ['📏', 1, 'GH: เติบโต']] } },
    { say: 'ร่างกายควบคุมฮอร์โมนด้วย <b>กลไกป้อนกลับแบบยับยั้ง</b> เมื่อฮอร์โมนในเลือดมากพอแล้ว จะส่งสัญญาณไปลดการสร้างฮอร์โมนนั้นลง เหมือนเทอร์โมสตัตที่ตัดไฟเมื่อห้องเย็นพอ', fig: { t: 'formula', lines: ['ฮอร์โมนมากพอ', '→ ส่งสัญญาณยับยั้งต่อม', '→ สร้างฮอร์โมนน้อยลง'] } },
    { say: '<b>ภาวะธำรงดุล</b> คือการรักษาภาวะภายในร่างกายให้คงที่ เช่น น้ำตาลในเลือดและอุณหภูมิ ถ้าน้ำตาลสูง อินซูลินลดลง ถ้าร้อนก็เหงื่อออกและหลอดเลือดขยาย ร่างกายจึงปรับตัวได้เสมอ', fig: { t: 'emojis', rows: [['🌡️', 1, 'อุณหภูมิร่างกายคงที่'], ['🩸', 1, 'น้ำตาลในเลือดคงที่'], ['⚖️', 1, 'ธำรงดุล']] } }
  ] },
  { id: 'ls_bimmune4', level: 'm4', subject: 'sci', gen: 'sci4_life', icon: '💉', title: 'ภูมิคุ้มกันเชิงลึก', blurb: 'แอนติบอดี ลิมโฟไซต์ วัคซีน ภูมิแพ้ และหมู่เลือด ABO', pages: [
    { say: 'ภูมิคุ้มกันมี 2 แบบ <b>ภูมิคุ้มกันที่มีมาแต่กำเนิด</b> ตอบสนองได้ทันทีกับเชื้อทุกชนิด เช่น ผิวหนัง และเม็ดเลือดขาวที่จับกิน ส่วน <b>ภูมิคุ้มกันที่ได้รับมา</b> จำเพาะต่อเชื้อแต่ละชนิดและต้องเรียนรู้ก่อน', fig: { t: 'formula', lines: ['มีมาแต่กำเนิด: เร็ว ไม่จำเพาะ', 'ได้รับมา: จำเพาะ มีความจำ'] } },
    { say: '<b>แอนติเจน</b> คือสิ่งแปลกปลอมที่กระตุ้นให้ร่างกายตอบสนอง เช่น โปรตีนบนเชื้อโรค ส่วน <b>แอนติบอดี</b> คือโปรตีนที่ร่างกายสร้างขึ้น จับกับแอนติเจนชนิดนั้นโดยเฉพาะ เหมือนกุญแจกับแม่กุญแจ', fig: { t: 'emojis', rows: [['🦠', 1, 'แอนติเจน'], ['Y', 1, 'แอนติบอดีจับเฉพาะตัว']] } },
    { say: '<b>ลิมโฟไซต์ B</b> เปลี่ยนเป็นเซลล์พลาสมาที่สร้างแอนติบอดีออกมาในเลือด ส่วน <b>ลิมโฟไซต์ T</b> บางชนิดทำลายเซลล์ที่ติดเชื้อโดยตรง บางชนิดช่วยกระตุ้นเซลล์อื่น และบางส่วนของทั้งสองชนิดกลายเป็น <b>เซลล์ความจำ</b> ไว้สู้เชื้อเดิมรอบหน้า', fig: { t: 'formula', lines: ['B cell → สร้างแอนติบอดี', 'T cell → ทำลายเซลล์ติดเชื้อ / ช่วยกระตุ้น', 'เซลล์ความจำ → สู้เร็วรอบสอง'] } },
    { say: '<b>วัคซีน</b> มีหลายแบบ เช่น เชื้อตาย เชื้อที่อ่อนฤทธิ์ และ <b>mRNA</b> ที่ส่งคำสั่งให้เซลล์ผลิตโปรตีนของเชื้อสักชิ้น เพื่อให้ภูมิคุ้มกันเรียนรู้ ทุกแบบมีหลักเดียวกัน คือกระตุ้นให้เกิดเซลล์ความจำโดยไม่ต้องป่วยหนัก', fig: { t: 'emojis', rows: [['💀', 1, 'เชื้อตาย'], ['🤏', 1, 'เชื้ออ่อนฤทธิ์'], ['📜', 1, 'mRNA: คำสั่งสร้างโปรตีน']] } },
    { say: 'ภูมิคุ้มกันทำงานผิดปกติได้ <b>ภูมิแพ้</b> คือตอบสนองแรงเกินต่อสิ่งที่ไม่อันตราย เช่น ละอองเกสร ฝุ่น ส่วน <b>โรคภูมิต้านตนเอง</b> คือภูมิคุ้มกันทำลายเซลล์ของร่างกายตัวเองโดยผิดพลาด', fig: { t: 'formula', lines: ['ภูมิแพ้ = ตอบสนองแรงเกินต่อสิ่งไม่อันตราย', 'ภูมิต้านตนเอง = ทำร้ายเซลล์ตัวเอง'] } },
    { say: 'หมู่เลือด <b>ABO</b> ขึ้นกับแอนติเจนบนเม็ดเลือดแดง หมู่ A มีแอนติบอดี anti-B หมู่ B มี anti-A หมู่ AB ไม่มีทั้งสอง หมู่ O มีทั้งสอง การให้เลือดจึงต้องเข้ากันได้ ไม่เช่นนั้นเลือดจะจับตัวเป็นก้อน', fig: { t: 'formula', lines: ['A: แอนติบอดี anti-B', 'B: แอนติบอดี anti-A', 'AB: ไม่มี / O: มีทั้งสอง'] } }
  ] },
  { id: 'ls_bplant4', level: 'm4', subject: 'sci', gen: 'sci4_life', icon: '🌱', title: 'การลำเลียงในพืชและฮอร์โมนพืช', blurb: 'ไซเลม โฟลเอม ปากใบ และฮอร์โมนพืชที่ควบคุมการเติบโต', pages: [
    { say: 'พืชมีท่อลำเลียงสองชนิด <b>ไซเลม</b> ลำเลียงน้ำและแร่ธาตุจากรากขึ้นสู่ลำต้นและใบ ส่วน <b>โฟลเอม</b> ลำเลียงน้ำตาลที่ใบสร้างได้ไปเลี้ยงส่วนอื่น เช่น ราก ผล และหัว', fig: { t: 'formula', lines: ['ไซเลม: น้ำ + แร่ธาตุ (ขึ้น)', 'โฟลเอม: น้ำตาล (ไปส่วนที่ต้องการ)'] } },
    { say: 'รากดูดน้ำด้วย <b>ออสโมซิส</b> คือน้ำแพร่ผ่านเยื่อเลือกผ่านจากที่ที่มีน้ำมากไปที่มีน้ำน้อย ในดินน้ำมาก ในเซลล์รากน้ำน้อยกว่า น้ำจึงเข้ารากได้ ส่วน <b>แรงดันราก</b> ช่วยดันน้ำขึ้นด้านบน', fig: { t: 'formula', lines: ['ดิน (น้ำมาก) → เซลล์ราก (น้ำน้อยกว่า)', 'น้ำเคลื่อนที่ผ่านออสโมซิส'] } },
    { say: 'แรงที่ดันน้ำขึ้นต้นไม้สูง ๆ ส่วนใหญ่มาจาก <b>แรงดึงจากการคายน้ำ</b> เมื่อไอน้ำระเหยออกที่ใบ น้ำในไซเลมถูกดึงขึ้นไปเป็นสายต่อเนื่อง เหมือนดูดน้ำด้วยหลอด', fig: { t: 'emojis', rows: [['☀️', 1, 'น้ำระเหยที่ใบ'], ['🌿', 1, 'ดึงน้ำในไซเลมขึ้น'], ['💧', 1, 'น้ำจากรากเข้ามาแทน']] } },
    { say: '<b>ปากใบ</b> ถูกล้อมด้วย <b>เซลล์คุม</b> เมื่อเซลล์คุมรับน้ำจนเต็มตึง ปากใบจะเปิด เมื่อเสียน้ำ ปากใบปิด พืชเปิดปากใบตอนมีแสงเพื่อรับ CO₂ และปิดเมื่อขาดน้ำเพื่อลดการสูญเสียน้ำ', fig: { t: 'formula', lines: ['เซลล์คุมรับน้ำ → ปากใบเปิด', 'เซลล์คุมเสียน้ำ → ปากใบปิด'] } },
    { say: '<b>ฮอร์โมนพืช</b> ที่ควรรู้ <b>ออกซิน</b> กระตุ้นเซลล์ยืดตัวและสร้างราก <b>ไซโทไคนิน</b> กระตุ้นการแบ่งเซลล์ <b>จิบเบอเรลลิน</b> กระตุ้นลำต้นยืดและเมล็ดงอก <b>เอทิลีน</b> เร่งผลไม้สุก <b>กรดแอบไซซิก</b> ทำให้ปากใบปิดและเมล็ดพักตัว', fig: { t: 'emojis', rows: [['📏', 1, 'ออกซิน: ยืดเซลล์ สร้างราก'], ['✂️', 1, 'ไซโทไคนิน: แบ่งเซลล์'], ['🌰', 1, 'จิบเบอเรลลิน: งอก ยืดต้น'], ['🍌', 1, 'เอทิลีน: ผลสุก'], ['🏜️', 1, 'ABA: ปิดปากใบ พักตัว']] } },
    { say: '<b>โฟโตโทรปิซึม</b> คือการเจริญเข้าหาแสง เมื่อแสงมาจากด้านหนึ่ง ออกซินจะไปรวมที่ด้านมืดของยอด ทำให้เซลล์ด้านนั้นยืดยาวกว่า ยอดจึงโค้งเข้าหาแสง', fig: { t: 'formula', lines: ['แสงด้านเดียว → ออกซินรวมด้านมืด', '→ ด้านมืดยืดยาวกว่า', '→ ยอดโค้งเข้าหาแสง'] } }
  ] },
