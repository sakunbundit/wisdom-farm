<title>ฟาร์มแห่งปัญญา</title>
<!-- ฟอนต์ Inter + Anuphan จาก Google Fonts (ผู้ใช้อนุญาตให้ใช้เน็ตได้ 2026-11-01) — ไม่มีเน็ตจะใช้ฟอนต์สำรองของเครื่อง เกมยังเล่นได้ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#bfe6ff; --sky2:#8fd0f7; --grass:#9be37c; --grass2:#6cc44f; --soil:#a9713f; --soil2:#8a5a30;
  --wood:#e8c58f; --wood2:#c99a5b; --ink:#3a2a14; --ink2:#6b5636; --white:#fffdf6;
  --good:#2fae4f; --bad:#e0553d; --gold:#f3b823; --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Inter","Anuphan","Noto Sans Thai","Leelawadee UI","Tahoma",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(var(--sky) 0,var(--sky) 110px,var(--grass) 110px,var(--grass2) 100%);
  background-attachment:fixed;font-size:16px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0}
/* จัดหน้าให้พอดีจอเดียว (ใช้กับ iPad เป็นหลัก): โครงหน้า = แถบบน + แท็บ + เนื้อหา ไม่เลื่อนทั้งหน้า */
.wrap{max-width:1100px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:6px;
  padding:max(6px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.content{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.content>.panel{margin-bottom:0}
h1,h2,h3{margin:.3em 0}
.banner{background:#fff3cd;border:2px solid #e0b43c;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:15px}
/* ปุ่ม */
.btn{background:linear-gradient(#ffd45c,#f3b823);border-bottom:4px solid #c48a0b;border-radius:14px;padding:8px 16px;font-weight:700;min-height:44px}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.green{background:linear-gradient(#7fdc6a,#3fb24a);border-bottom-color:#2a8a35;color:#fff}
.btn.gray{background:linear-gradient(#f2ead8,#d9ccb0);border-bottom-color:#b3a27f}
.btn.red{background:linear-gradient(#f28a73,#d9503a);border-bottom-color:#a93522;color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.big{font-size:18px;padding:10px 18px;width:100%}
/* แถบบน */
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--wood);
  border:3px solid var(--wood2);border-radius:var(--r);padding:4px 10px;flex:none}
.top .title{font-weight:800;font-size:18px}
.top .ver{font-size:12px;color:var(--ink2);font-weight:400}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--white);border-radius:999px;padding:5px 12px;font-weight:700;border:2px solid var(--wood2)}
.mini{padding:6px 10px;min-height:38px;font-size:15px}
/* แท็บ */
.tabs{display:flex;gap:6px;flex:none}
.tab{flex:1;background:var(--wood);border:3px solid var(--wood2);border-radius:14px;padding:6px 4px;min-height:44px;font-weight:700;text-align:center;font-size:15px}
.tab.on{background:var(--white);border-color:var(--gold)}
.panel{background:rgba(255,253,246,.92);border:3px solid var(--wood2);border-radius:var(--r);padding:8px 10px}
/* ฟาร์มสไตล์ Hay Day: ฉากวาดด้วย CSS/SVG/อีโมจิ ไม่ใช้ไฟล์ภาพ (เปิดแบบไม่มีเน็ตได้)
   ฉากมีหน่วย --u (1u = 1% ของความกว้างฉาก) ขยายตามจอ: แนวนอน 100x62.5u แนวตั้ง 100x100u */
.scenebox{flex:1 1 auto;min-height:0;container-type:size;display:grid;place-items:center}
.scene{--u:min(1cqw,1.6cqh);position:relative;width:calc(var(--u)*100);height:calc(var(--u)*62.5);overflow:hidden;
  border-radius:calc(var(--u)*2);box-shadow:0 0 0 4px var(--wood2),0 6px 0 4px #a8793f;
  background:radial-gradient(circle at 18% 25%,rgba(255,255,255,.14),transparent 45%),
    repeating-linear-gradient(0deg,rgba(0,0,0,.045) 0 calc(var(--u)*3),transparent calc(var(--u)*3) calc(var(--u)*6)),
    linear-gradient(#92dc70,#78c855)}
.sp{position:absolute;left:calc(var(--u)*var(--x));top:calc(var(--u)*var(--y));width:calc(var(--u)*var(--w))}
.sp.em{width:auto;font-size:calc(var(--u)*var(--w));line-height:1;user-select:none;pointer-events:none}
.sp .art{display:block;width:100%;height:auto;filter:drop-shadow(0 calc(var(--u)*.5) 0 rgba(0,0,0,.18))}
button.sp{background:none;border:0;padding:0;cursor:pointer}
.s-barn{--x:2;--y:3;--w:19}.s-silo{--x:21.5;--y:2;--w:6.5}.s-shop{--x:78;--y:3;--w:19}
.s-road{--x:79;--y:25;--w:19;height:calc(var(--u)*37.5);border-radius:calc(var(--u)*1.5);
  background:linear-gradient(90deg,#b9996a,#d1b588 14%,#d1b588 86%,#b9996a);box-shadow:inset 0 0 0 calc(var(--u)*.3) rgba(90,60,20,.35)}
.s-road::after{content:"";position:absolute;left:50%;top:3%;bottom:3%;width:calc(var(--u)*.5);margin-left:calc(var(--u)*-.25);
  background:repeating-linear-gradient(0deg,#f7eccd 0 calc(var(--u)*2.2),transparent calc(var(--u)*2.2) calc(var(--u)*4.4))}
.s-truck{--x:84.5;--y:27;--w:6;animation:drive 14s ease-in-out infinite}
.s-pond{--x:11;--y:51;--w:15;height:calc(var(--u)*9.5);border-radius:50%;
  background:radial-gradient(ellipse at 35% 30%,#bfe9ff,#6cc0ee 55%,#4da6dd);box-shadow:0 0 0 calc(var(--u)*.7) #9fd47f,0 0 0 calc(var(--u)*1.1) #7bb85b}
.s-field{--x:29;--y:9;--w:46;height:calc(var(--u)*41);padding:calc(var(--u)*2);box-sizing:border-box;z-index:2;border-radius:calc(var(--u)*1.5);
  background:linear-gradient(#86cf62,#74bd51);border:calc(var(--u)*.8) solid #a3733a;
  box-shadow:inset 0 0 0 calc(var(--u)*.35) #7a5224,0 calc(var(--u)*.6) 0 #7a5224;
  --tile:11.5;display:grid;grid-template-columns:repeat(3,calc(var(--u)*var(--tile)));grid-auto-rows:calc(var(--u)*var(--tile));gap:calc(var(--u)*1.2);justify-content:center;align-content:center}
.s-field::before,.s-field::after{content:"";position:absolute;left:calc(var(--u)*-.8);right:calc(var(--u)*-.8);height:calc(var(--u)*1.5);pointer-events:none;
  background:repeating-linear-gradient(90deg,#8a5a2b 0 calc(var(--u)*.9),transparent calc(var(--u)*.9) calc(var(--u)*3.4))}
.s-field::before{top:calc(var(--u)*-1.9)}.s-field::after{bottom:calc(var(--u)*-1.9)}
.t1{--x:.5;--y:53;--w:8}.t2{--x:25;--y:51;--w:7}.t3{--x:75.5;--y:52;--w:8}.t4{--x:31;--y:.5;--w:6}.t5{--x:68;--y:1;--w:5}
.fl1{--x:27;--y:44;--w:3}.fl2{--x:76;--y:49;--w:2.6}.fl3{--x:2;--y:34;--w:2.6}
.a-duck{--x:17;--y:53;--w:3;animation:wander 8s ease-in-out -3s infinite}
.cl1{--x:42;--y:.5;--w:6;opacity:.85;animation:drift 40s linear infinite}.cl2{--x:58;--y:2;--w:4.4;opacity:.7;animation:drift 55s linear -20s infinite}
.bf1{--x:27;--y:44;--w:2;animation:flutter 7s ease-in-out infinite}.bf2{--x:75;--y:46;--w:1.8;animation:flutter 5s ease-in-out -2s infinite}
.bush1{--x:27.5;--y:57;--w:3.2}.bush2{--x:27;--y:49.5;--w:2.4}.rock1{--x:28;--y:60;--w:2.4}.hay1{--x:8.2;--y:56;--w:3.6}.mail1{--x:76;--y:23;--w:2.4}
/* คอกสัตว์ */
.s-pen{--x:1;--y:23;--w:23;height:calc(var(--u)*18);box-sizing:border-box;padding:calc(var(--u)*1);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:calc(var(--u)*.7);z-index:2;
  border-radius:calc(var(--u)*1.2);border:calc(var(--u)*.7) solid #8a5a2b;box-shadow:0 calc(var(--u)*.5) 0 #6a4220,inset 0 0 0 calc(var(--u)*.25) #5b3a18;
  background:repeating-linear-gradient(100deg,#e6c984 0 calc(var(--u)*1.1),#dcbb72 calc(var(--u)*1.1) calc(var(--u)*2.2))}
.an{position:relative;display:grid;place-items:center;padding:0;cursor:pointer;border:0;border-radius:calc(var(--u)*.9);background:rgba(255,255,255,.28);box-shadow:inset 0 calc(var(--u)*-.35) 0 rgba(90,55,20,.22);color:#fff;font-weight:700;min-height:44px}
.an:active{transform:translateY(2px)}
.an .spr{font-size:calc(var(--u)*3.4);line-height:1;transform:translateY(-12%);filter:drop-shadow(0 2px 0 rgba(0,0,0,.28))}
.an.locked .spr{filter:grayscale(1) brightness(.9);opacity:.55}
.an.locked{background:rgba(120,90,50,.28)}
.an.ready{box-shadow:0 0 0 calc(var(--u)*.4) var(--gold),inset 0 calc(var(--u)*-.35) 0 rgba(90,55,20,.22)}
.an.ready .spr{animation:bob 1.3s ease-in-out infinite}
.an .tm,.an .bub{position:absolute;border-radius:99px;font-weight:800;white-space:nowrap;padding:0 .5em;font-size:max(12px,calc(var(--u)*1.4))}
.an .tm{bottom:3%;left:50%;transform:translateX(-50%);background:rgba(40,25,5,.82)}
.an .bub{top:-14%;right:-6%;background:var(--gold);color:#3a2a14;animation:pop 1s ease-in-out infinite}
.an .bub.hint{background:#fff;opacity:.92;animation:pop 1.8s ease-in-out infinite}
.w0{--x:2;--y:42.5;--w:7}.w1{--x:13;--y:42.5;--w:7}.w2{--x:34;--y:52;--w:7}.w3{--x:46;--y:52;--w:7}.w4{--x:58;--y:52;--w:7}.w5{--x:68;--y:52;--w:7}
/* แปลงดิน */
.tile{position:relative;aspect-ratio:1;border-radius:calc(var(--u)*1.2);border:calc(var(--u)*.4) solid #5e3b1c;padding:0;cursor:pointer;color:#fff;
  background-color:#a06a3a;background-image:linear-gradient(rgba(255,255,255,.14),transparent 45%),repeating-linear-gradient(90deg,rgba(60,30,10,.3) 0 8%,transparent 8% 25%);
  box-shadow:inset 0 calc(var(--u)*-.6) 0 rgba(0,0,0,.2);display:grid;place-items:center;font-weight:700}
.tile:active{transform:translateY(2px)}
.tile.ghost{background:rgba(120,80,40,.13);border:calc(var(--u)*.35) dashed rgba(90,60,30,.4);box-shadow:none;pointer-events:none}
.tile .spr{font-size:calc(var(--u)*4.6);line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.tile.g0 .spr{font-size:calc(var(--u)*3)}.tile.g1 .spr{font-size:calc(var(--u)*3.8)}.tile.g2 .spr{font-size:calc(var(--u)*4.2)}
.tile .spr.m1,.tile .spr.m2{position:absolute;bottom:20%;font-size:calc(var(--u)*2.3)}
.tile .spr.m1{left:9%}.tile .spr.m2{right:9%}.tile.g2 .spr.m1{left:auto;right:9%;font-size:calc(var(--u)*2)}
.tile.plus .spr{font-size:calc(var(--u)*4);opacity:.5}
.tile.ready{box-shadow:0 0 0 calc(var(--u)*.5) var(--gold),inset 0 calc(var(--u)*-.6) 0 rgba(0,0,0,.2)}
.tile.ready .spr{animation:bob 1.3s ease-in-out infinite}
.tile .tm,.tile .bub{position:absolute;border-radius:99px;font-weight:800;font-size:max(11px,calc(var(--u)*1.45));white-space:nowrap;padding:0 .55em}
.tile .tm{bottom:5%;left:50%;transform:translateX(-50%);background:rgba(40,25,5,.8);color:#fff}
.tile .bub{top:-7%;right:-7%;background:var(--gold);color:#3a2a14;animation:pop 1s ease-in-out infinite}
.tile.lock{background:repeating-linear-gradient(45deg,#eadfc4 0 8px,#d9ccab 8px 16px);border-color:#a8996f;color:#5a4a2a;font-size:max(11px,calc(var(--u)*1.5));line-height:1.25}
.tile.lock .spr{font-size:calc(var(--u)*3.4);filter:none}
/* ป้าย/ปุ่มบนฉาก */
.badge{position:absolute;top:-6%;right:-4%;background:#e0553d;color:#fff;border-radius:99px;min-width:1.9em;text-align:center;font-weight:800;font-size:max(12px,calc(var(--u)*1.7));padding:0 .4em;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.badge.go{animation:pop 1s ease-in-out infinite;background:var(--good)}
.cap{position:absolute;left:50%;bottom:-9%;transform:translateX(-50%);background:rgba(58,42,20,.82);color:#fff;border-radius:99px;padding:0 .7em;font-size:max(11px,calc(var(--u)*1.5));font-weight:700;white-space:nowrap}
.weedsp{display:grid;justify-items:center;animation:sway 3s ease-in-out infinite;text-align:center}
.weedsp .spr{font-size:calc(var(--u)*5.2);line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.weedsp .cap{position:static;transform:none;max-width:calc(var(--u)*13);overflow:hidden;text-overflow:ellipsis;margin-top:calc(var(--u)*-.6)}
.fly{position:absolute;z-index:9;pointer-events:none;font-weight:800;font-size:max(15px,calc(var(--u)*2.4));color:#fff;white-space:nowrap;
  text-shadow:0 2px 0 #3a2a14,0 0 6px #3a2a14;animation:flyup 1s ease-out forwards}
.gobar{flex:none;display:flex;gap:8px}.gobar .btn{flex:1}
@keyframes bob{50%{transform:translateY(calc(var(--u)*-.7)) scale(1.06)}}
@keyframes pop{50%{transform:scale(1.18)}}
@keyframes sway{50%{transform:rotate(5deg)}}
@keyframes wander{50%{transform:translateX(calc(var(--u)*4))}}
@keyframes drift{from{transform:translateX(calc(var(--u)*-6))}to{transform:translateX(calc(var(--u)*30))}}
@keyframes flutter{25%{transform:translate(calc(var(--u)*3),calc(var(--u)*-2))}50%{transform:translate(calc(var(--u)*6),calc(var(--u)*1))}75%{transform:translate(calc(var(--u)*2),calc(var(--u)*-1.5))}}
@keyframes drive{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--u)*26))}}
@keyframes flyup{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,calc(var(--u)*-8));opacity:0}}
@media (prefers-reduced-motion:reduce){.s-truck,.a-duck,.cl1,.cl2,.bf1,.bf2,.weedsp,.tile.ready .spr,.an.ready .spr,.an .bub,.badge.go,.tile .bub,.fly{animation:none}}
@media (orientation:portrait){
  .scene{--u:min(1cqw,1cqh);height:calc(var(--u)*100)}
  .s-barn{--x:2;--y:2.5;--w:26}.s-silo{--x:28.5;--y:1.5;--w:8.5}.s-shop{--x:73;--y:2.5;--w:25}
  .s-road{--x:0;--y:92;--w:100;height:calc(var(--u)*8);border-radius:0;background:linear-gradient(#b9996a,#d1b588 15%,#d1b588 85%,#b9996a)}
  .s-road::after{left:3%;right:3%;top:50%;bottom:auto;width:auto;height:calc(var(--u)*.5);margin:calc(var(--u)*-.25) 0 0;
    background:repeating-linear-gradient(90deg,#f7eccd 0 calc(var(--u)*2.2),transparent calc(var(--u)*2.2) calc(var(--u)*4.4))}
  .s-truck{--x:2;--y:92.5;--w:6;animation-name:driveh}
  .s-pond{--x:40;--y:5;--w:20;height:calc(var(--u)*11)}
  .s-field{--x:8;--y:25;--w:84;--tile:20;height:calc(var(--u)*66);padding:calc(var(--u)*1.5);gap:calc(var(--u)*1)}
  .t1{--x:0;--y:20;--w:7}.t2{--x:60;--y:19;--w:6}.t3{--x:92.5;--y:22;--w:7}.t4{--x:40;--y:17;--w:5}.t5{--x:94;--y:80;--w:6}
  .fl1{--x:30;--y:21;--w:3}.fl2{--x:88;--y:92;--w:2.6}.fl3{--x:96;--y:70;--w:2.6}
  .s-pen{--x:38;--y:2.5;--w:33;height:calc(var(--u)*18);grid-template-columns:repeat(4,1fr);grid-template-rows:1fr}
  .s-pond,.a-duck,.bf1{display:none}
  .weedsp .cap{max-width:calc(var(--u)*8)}
  .cl1{--x:4;--y:.5}.cl2{--x:74;--y:1}.bf2{--x:80;--y:23}
  .hay1{--x:.5;--y:70;--w:5}.rock1{--x:1;--y:80;--w:4}.bush1{--x:93.5;--y:68;--w:5}.bush2{--x:94;--y:58;--w:4}.mail1{--x:96;--y:22;--w:2.6}
  .w0{--x:.5;--y:30;--w:7}.w1{--x:.5;--y:42;--w:7}.w2{--x:.5;--y:54;--w:7}.w3{--x:92.8;--y:30;--w:7}.w4{--x:92.8;--y:42;--w:7}.w5{--x:92.8;--y:54;--w:7}

ว"},{"t":"en1_read","q":"Many birds fly to warmer countries in winter. They do this because food becomes hard to find in the cold. Some birds travel thousands of kilometres.\nWhat is the passage mainly about?","c":["How to feed pet birds","Why some birds travel in winter","Birds that cannot fly","Where birds build their nests"],"a":1,"e":"เนื้อหาหลักคือนกบินไปประเทศที่อบอุ่นในฤดูหนาวเพราะหาอาหารยาก"},{"t":"en1_read","q":"Nam goes to school by bike on sunny days. When it rains, her father drives her. Today the sun is shining brightly.\nHow will Nam go to school today?","c":["By car","By bike","On foot","By bus"],"a":1,"e":"วันนี้แดดออก (sunny) Nam จึงไปโรงเรียนด้วยจักรยาน"},{"t":"en1_read","q":"The night market opens at six in the evening and closes at eleven. Most stalls sell food, but a few sell clothes. It is busiest on Saturdays.\nHow long is the market open each night?","c":["Four hours","Five hours","Six hours","Eleven hours"],"a":1,"e":"เปิด 6 โมงเย็นถึง 5 ทุ่ม (11 นาฬิกา) รวม 5 ชั่วโมง"},{"t":"en4_gram","q":"If I ___ you, I would apologise to her.","c":["am","will be","had been","were"],"a":3,"e":"Conditional type 2 (สมมติสิ่งที่ไม่จริงในปัจจุบัน) ใช้ If + Past Simple โดย be ใช้ were กับทุกประธานในแบบทางการ"},{"t":"en4_gram","q":"The window ___ by a stone yesterday.","c":["was broken","broke","has broken","is broken"],"a":0,"e":"หน้าต่างถูกกระทำ จึงใช้ passive voice และ yesterday บอกอดีต ต้องใช้ was + V3 (was broken)"},{"t":"en4_gram","q":"The man ___ lives next door is a pilot.","c":["which","whose","who","whom"],"a":2,"e":"ขยายคน (the man) และทำหน้าที่เป็นประธานของ lives จึงใช้ relative pronoun who"},{"t":"en4_gram","q":"He said, \"I will call you tomorrow.\" → He said that he ___ me the next day.","c":["will call","called","would call","calls"],"a":2,"e":"Reported speech เมื่อกริยานำเป็นอดีต (said) will เปลี่ยนเป็น would และ tomorrow เปลี่ยนเป็น the next day"},{"t":"en4_gram","q":"I ___ in Bangkok since 2015.","c":["have lived","live","lived","am living"],"a":0,"e":"since 2015 บอกจุดเริ่มต้นในอดีตที่ต่อเนื่องมาถึงปัจจุบัน ใช้ Present Perfect (have lived)"},{"t":"en4_gram","q":"Her house is ___ than mine.","c":["more big","biggest","the bigger","bigger"],"a":3,"e":"adjective พยางค์เดียวสร้าง comparative ด้วยการเติม -er (big → bigger โดยซ้ำตัว g) และมี than ตามหลัง"},{"t":"en4_gram","q":"You ___ wear a helmet when riding a motorbike. It's the law.","c":["might","must","can","needn't"],"a":1,"e":"must ใช้บอกข้อบังคับหรือกฎหมาย ส่วน might แสดงความเป็นไปได้ และ needn't แปลว่าไม่จำเป็น"},{"t":"en4_gram","q":"If you heat ice, it ___.","c":["melt","melts","will melted","would melt"],"a":1,"e":"Conditional type 0 ใช้กับความจริงทางวิทยาศาสตร์ ใช้ If + Present Simple, Present Simple และ it ต้องเติม -s"},{"t":"en4_gram","q":"By the time we arrived, the film ___.","c":["already started","has already started","already starts","had already started"],"a":3,"e":"เหตุการณ์ที่เกิดก่อนอีกเหตุการณ์ในอดีต (by the time we arrived) ใช้ Past Perfect (had + V3)"},{"t":"en4_gram","q":"While I ___ TV, the phone rang.","c":["was watching","watched","am watching","have watched"],"a":0,"e":"การกระทำที่กำลังดำเนินอยู่ในอดีตแล้วมีเหตุการณ์สั้น ๆ มาแทรก ใช้ Past Continuous (was watching) กับ while"},{"t":"en4_vocab","q":"Which word is closest in meaning to \"huge\"?","c":["tiny","narrow","enormous","quiet"],"a":2,"e":"huge (ใหญ่มาก) ความหมายใกล้เคียงกับ enormous ส่วน tiny คือเล็กมาก (ตรงข้าม)"},{"t":"en4_vocab","q":"Please ___ your shoes before you enter the temple.","c":["put off","give off","take off","turn off"],"a":2,"e":"take off แปลว่า ถอด (เสื้อผ้า รองเท้า) put off คือเลื่อน give off คือปล่อย (กลิ่น ความร้อน) turn off คือปิด"},{"t":"en4_vocab","q":"She spoke very ___ at the interview.","c":["confidently","confidence","confident","confide"],"a":0,"e":"ต้องการ adverb ขยายกริยา spoke จึงใช้ confidently"},{"t":"en4_vocab","q":"Please ___ attention to the teacher.","c":["make","do","take","pay"],"a":3,"e":"คำว่า attention ใช้กับกริยา pay เป็น collocation คือ pay attention (ใส่ใจ ตั้งใจฟัง)"},{"t":"en4_vocab","q":"What is the opposite of \"scarce\"?","c":["rare","plentiful","weak","cheap"],"a":1,"e":"scarce (หายาก มีน้อย) ตรงข้ามกับ plentiful (มีมากมาย)"},{"t":"en4_vocab","q":"Her explanation was so ___ that everyone understood it at once.","c":["vague","clear","confusing","careless"],"a":1,"e":"ทุกคนเข้าใจทันที แสดงว่าคำอธิบายชัดเจน (clear) ส่วน vague และ confusing หมายถึงคลุมเครือหรือสับสน"},{"t":"en4_vocab","q":"The ___ of the new bridge took two years.","c":["construct","constructive","constructed","construction"],"a":3,"e":"หลัง the ต้องเป็นคำนาม (noun) จึงใช้ construction (การก่อสร้าง)"},{"t":"en4_vocab","q":"We need to ___ with this problem quickly.","c":["deal","make","give","keep"],"a":0,"e":"deal with แปลว่า จัดการกับ (ปัญหา) เป็น phrasal verb ที่ใช้ with ตามหลัง"},{"t":"en4_vocab","q":"Which word is closest in meaning to \"reluctant\"?","c":["eager","generous","unwilling","certain"],"a":2,"e":"reluctant (ไม่เต็มใจ ลังเล) ใกล้เคียง unwilling ส่วน eager คือกระตือรือร้น (ตรงข้าม)"},{"t":"en4_vocab","q":"He ___ a mistake in the last question.","c":["did","took","made","had"],"a":2,"e":"คำว่า mistake ใช้กับกริยา make เป็น collocation คือ make a mistake (ทำผิดพลาด)"},{"t":"en4_conv","q":"A: Could you pass me the salt, please?\nB: ___","c":["Here you are.","I'm sorry for you.","Yes, I could pass.","It's my pleasure to eat."],"a":0,"e":"เมื่อมีคนขอให้ส่งของ ตอบรับและยื่นให้ด้วย Here you are."},{"t":"en4_conv","q":"A: Would you like me to carry your bag?\nB: ___","c":["Yes, I would like you.","No, it's not carried.","You're welcome.","That's very kind of you. Thanks."],"a":3,"e":"เมื่อมีคนเสนอความช่วยเหลือ ตอบรับและขอบคุณว่า That's very kind of you."},{"t":"en4_conv","q":"A: I'm afraid I can't come to your party.\nB: ___","c":["Congratulations!","What a pity! Maybe next time.","You're welcome.","It's a pleasure."],"a":1,"e":"เมื่อเพื่อนปฏิเสธมางานเลี้ยง ตอบเสียดายว่า What a pity! เป็นการตอบที่เหมาะสม"},{"t":"en4_conv","q":"A: Sorry for spilling water on your notes.\nB: ___","c":["Thank you very much.","Never mind. It was an accident.","Congratulations.","Yes, you should be sorry."],"a":1,"e":"เมื่อมีคนขอโทษ ตอบให้อภัยด้วย Never mind. หรือ That's OK. ส่วนข้ออื่นไม่สุภาพหรือไม่เกี่ยวข้อง"},{"t":"en4_conv","q":"A: What should I do about my headache?\nB: ___","c":["You shouldn't to worry.","I think it's Tuesday.","Thanks, I'm fine too.","Why don't you rest and drink some water?"],"a":3,"e":"การให้คำแนะนำใช้ Why don't you + V1 ส่วน shouldn't ต้องตามด้วย V1 ไม่มี to"},{"t":"en4_conv","q":"A: Mr Brown, this is my classmate, Mai.\nB: ___","c":["I'm fine, thanks.","See you later, Mai.","Nice to meet you, Mai.","Thank you very much."],"a":2,"e":"เมื่อถูกแนะนำให้รู้จักใคร ตอบว่า Nice to meet you."},{"t":"en4_conv","q":"A: Can you lend me 500 baht until Friday?\nB: ___","c":["Yes, I can't.","You're welcome.","I'm sorry, but I'm short of money myself.","It's up to the bank."],"a":2,"e":"การปฏิเสธอย่างสุภาพควรขอโทษแล้วให้เหตุผล เช่น ตัวเองก็ขาดเงิน"},{"t":"en4_conv","q":"A: Thank you for the lovely present!\nB: ___","c":["I'm glad you like it.","Thanks, same to you.","I beg your pardon.","Never mind."],"a":0,"e":"เมื่อมีคนขอบคุณของขวัญ ตอบว่า I'm glad you like it. (ดีใจที่ชอบ)"},{"t":"en4_conv","q":"A: Hello, may I speak to Ms Lee?\nB: ___","c":["I'm Ms Lee's calling.","Yes, you may to speak.","Please speak me.","Speaking. How can I help you?"],"a":3,"e":"ทางโทรศัพท์ ถ้าผู้รับสายเป็นคนที่ถูกขอพูดด้วย ตอบว่า Speaking. (นี่แหละค่ะ/ครับ)"},{"t":"en4_read","q":"Many cities are replacing traditional streetlights with LED lamps. LEDs use about half as much electricity and last far longer, so the cities save money on both power and repairs. However, some residents complain that the white light is too harsh at night. As a result, several councils are testing warmer-coloured lamps.\nWhat is the passage mainly about?","c":["How LED lamps are made","The benefits and a problem of LED streetlights","Why people dislike electricity","How councils repair roads"],"a":1,"e":"ย่อหน้ากล่าวถึงข้อดี (ประหยัดไฟและค่าซ่อม) และข้อเสีย (แสงแรง) ของไฟถนน LED"},{"t":"en4_read","q":"Lake Sila is home to a rare fish found nowhere else. In recent years the number of fish has dropped because nearby farms have released chemicals into the water. Local students now test the water every month and send the results to the government. Thanks to their reports, two farms have been ordered to change their methods.\nWhat have the students' reports led to?","c":["Two farms closing down","Two farms being told to change their methods","The fish being moved elsewhere","The lake being closed to visitors"],"a":1,"e":"ประโยคสุดท้ายบอกว่าเพราะรายงานของนักเรียน ฟาร์มสองแห่งถูกสั่งให้เปลี่ยนวิธีการ ไม่ได้ถูกปิด"},{"t":"en4_read","q":"When Pim arrived at the exam room, she found that her pen was missing. She searched her bag twice, then looked at the clock and sighed. A boy at the next desk quietly held out a spare pen. Pim smiled with relief and whispered, \"You've saved me.\"\nWhat can we infer about the boy?","c":["He was Pim's brother.","He wanted to cheat.","He had finished the exam early.","He was kind and helpful."],"a":3,"e":"เขายื่นปากกาสำรองให้เงียบ ๆ โดยไม่มีใครขอ แสดงว่าเป็นคนใจดีและช่วยเหลือผู้อื่น ส่วนข้ออื่นไม่มีข้อมูลสนับสนุน"},{"t":"en4_read","q":"The mayor's speech was brief; it lasted barely two minutes. Even so, the crowd cheered loudly because he promised to build a new playground.\nWhat does \"brief\" mean in this passage?","c":["short","boring","angry","loud"],"a":0,"e":"บอกว่ากินเวลาแค่สองนาที จึงหมายถึงสั้น (short)"},{"t":"en4_read","q":"Remote working has become common since 2020. Employees save travel time and often feel more relaxed at home. On the other hand, some workers feel lonely and find it hard to separate work from private life. Experts suggest setting fixed working hours to deal with this problem.\nAccording to the passage, what do experts suggest?","c":["Spending more time travelling","Quitting remote jobs","Setting fixed working hours","Working late at night"],"a":2,"e":"ประโยคสุดท้ายระบุว่า experts suggest setting fixed working hours"},{"t":"en4_read","q":"Don't throw away your old clothes! Bring them to the collection box at our school gate every Friday. We will wash them and give them to families who need them. Together, we can help others and reduce waste.\nWhat is the writer's main purpose?","c":["To sell used clothes","To announce a fashion show","To ask people to donate clothes","To complain about rubbish"],"a":2,"e":"ผู้เขียนชวนให้นำเสื้อผ้าเก่ามาใส่กล่อง เพื่อมอบให้ครอบครัวที่ต้องการ จึงเป็นการขอรับบริจาค"},{"t":"en4_read","q":"The first bicycles had no pedals; riders pushed along the ground with their feet. Pedals were added later, and the front wheel became larger to make the bicycle faster. Unfortunately, these tall bicycles were dangerous, and riders often fell off. Eventually, designers made two equal-sized wheels joined by a chain, which is the design we use today.\nWhy did designers stop making bicycles with a very large front wheel?","c":["They were dangerous.","They were too slow.","They had no pedals.","They were too expensive."],"a":0,"e":"ข้อความบอกว่าจักรยานล้อหน้าใหญ่อันตราย คนขับล้มบ่อย จึงเปลี่ยนเป็นล้อเท่ากัน"},{"t":"en4_read","q":"Ben loves astronomy. His uncle gave him a telescope for his birthday, and he now spends every clear night looking at the moon. He has even started a notebook in which he records what he sees.\nWhy does Ben keep a notebook?","c":["To write letters to his uncle","To sell his telescope","To do his homework","To record what he sees"],"a":3,"e":"ข้อความบอกว่า a notebook in which he records what he sees คือจดสิ่งที่เห็นจากการดูดาว"},{"t":"en4_read","q":"The restaurant was empty at lunchtime, though it used to be full. The owner had recently raised prices by thirty per cent and reduced the portions. Regular customers began to eat at the cheaper café across the road.\nWhy is the restaurant now empty?","c":["The restaurant was closed for repairs.","Customers went elsewhere because of the higher prices and smaller portions.","The owner was on holiday.","The food had become better."],"a":1,"e":"ข้อความบอกว่าราคาแพงขึ้นและอาหารน้อยลง ลูกค้าประจำจึงไปร้านที่ถูกกว่าฝั่งตรงข้ามถนน"},{"t":"sci1_life","q":"โครงสร้างข้อใดพบในเซลล์พืชแต่ไม่พบในเซลล์สัตว์","c":["ผนังเซลล์ที่ห่อหุ้มอยู่นอกเยื่อหุ้มเซลล์","ไมโทคอนเดรียที่สร้างพลังงานให้เซลล์","นิวเคลียสที่ควบคุมการทำงานของเซลล์","เยื่อหุ้มเซลล์ที่ควบคุมการผ่านของสาร"],"a":0,"e":"เซลล์พืชมีผนังเซลล์ (เซลลูโลส) ห่อหุ้มอยู่ ส่วนเซลล์สัตว์ไม่มี ส่วนไมโทคอนเดรีย นิวเคลียส และเยื่อหุ้มเซลล์พบได้ทั้งในเซลล์พืชและเซลล์สัตว์"},{"t":"sci1_life","q":"ออร์แกเนลล์ใดในเซลล์ทำหน้าที่ปลดปล่อยพลังงานจากอาหารด้วยกระบวนการหายใจระดับเซลล์","c":["คลอโรพลาสต์","ไมโทคอนเดรีย","แวคิวโอล","ผนังเซลล์"],"a":1,"e":"ไมโทคอนเดรียเป็นแหล่งปลดปล่อยพลังงานจากการสลายอาหาร คลอโรพลาสต์ใช้สังเคราะห์แสง แวคิวโอลเก็บสาร และผนังเซลล์ช่วยค้ำจุนรูปร่าง"},{"t":"sci1_life","q":"ส่วนใดของเซลล์ทำหน้าที่ควบคุมกิจกรรมต่าง ๆ ของเซลล์และเก็บสารพันธุกรรม","c":["ไซโทพลาซึม","แวคิวโอล","นิวเคลียส","คลอโรพลาสต์"],"a":2,"e":"นิวเคลียสเป็นศูนย์กลางควบคุมการทำงานและเก็บสารพันธุกรรม ส่วนไซโทพลาซึมเป็นที่อยู่ของออร์แกเนลล์ แวคิวโอลเก็บสาร และคลอโรพลาสต์ใช้สังเคราะห์แสง"},{"t":"sci1_life","q":"เซลล์ใบของต้นไม้มีสีเขียวเพราะภายในมีออร์แกเนลล์ใดที่บรรจุคลอโรฟิลล์","c":["ไมโทคอนเดรีย","นิวเคลียส","เยื่อหุ้มเซลล์","คลอโรพลาสต์"],"a":3,"e":"คลอโรพลาสต์มีคลอโรฟิลล์ซึ่งเป็นรงควัตถุสีเขียวที่ใช้ดูดแสงสังเคราะห์อาหาร ส่วนออร์แกเนลล์อื่นไม่มีรงควัตถุนี้"},{"t":"sci1_life","q":"โครงสร้างใดของเซลล์ทำหน้าที่เลือกให้สารบางชนิดผ่านเข้าออกเซลล์ได้","c":["เยื่อหุ้มเซลล์","ผนังเซลล์","นิวเคลียส","ไมโทคอนเดรีย"],"a":0,"e":"เยื่อหุ้มเซลล์มีคุณสมบัติยอมให้สารบางชนิดผ่านได้ ส่วนผนังเซลล์พรุนมากจึงไม่เลือกสารเท่าเยื่อหุ้มเซลล์"},{"t":"sci1_life","q":"กล้องจุลทรรศน์ตัวหนึ่งใช้เลนส์ใกล้ตากำลังขยาย 10 เท่า และเลนส์ใกล้วัตถุกำลังขยาย 40 เท่า ภาพที่เห็นมีกำลังขยายรวมเท่าใด","c":["50 เ ่เข้าเซลล์จนเซลล์ย่อยสลายตัวเอง","น้ำออสโมซิสออกจากเซลล์ไปยังสารละลายภายนอกที่เข้มข้นกว่า","เซลล์ใช้น้ำสร้างแป้งจนน้ำในเซลล์ลดลง","ผนังเซลล์ดูดน้ำเกลือไว้แล้วปล่อยแป้งออก"],"a":1,"e":"ข้างนอกเข้มข้นกว่า น้ำจึงเคลื่อนที่ผ่านเยื่อเลือกผ่านออกจากเซลล์ ทำให้มวลลดลง ข้ออื่นไม่สอดคล้องกับหลักออสโมซิส"},{"t":"sci1_adv","q":"เซลล์เม็ดเลือดแดงของคนที่ถูกแช่ในน้ำกลั่นแล้วแตก แต่เซลล์พืชแช่น้ำกลั่นไม่แตก เพราะเหตุใด","c":["เซลล์พืชไม่มีเยื่อหุ้มเซลล์จึงไม่ดูดน้ำ","เม็ดเลือดแดงมีแวคิวโอลใหญ่จึงเก็บน้ำเกินพอดี","เซลล์พืชมีผนังเซลล์ที่แข็งแรงช่วยจำกัดการขยายตัว","น้ำกลั่นเป็นพิษต่อเซลล์สัตว์เท่านั้น"],"a":2,"e":"น้ำเข้าเซลล์ทั้งสองชนิด แต่เซลล์สัตว์ไม่มีผนังเซลล์จึงขยายจนแตก ส่วนเซลล์พืชมีผนังเซลล์ค้ำไว้"},{"t":"sci1_adv","q":"เมื่อเซลล์พืชถูกแช่ในสารละลายที่เข้มข้นกว่าสารในเซลล์มาก จะสังเกตเห็นการเปลี่ยนแปลงใดใต้กล้องจุลทรรศน์","c":["ผนังเซลล์หดตัวเข้าไปติดนิวเคลียส","เซลล์บวมจนผนังเซลล์แตกออก","คลอโรพลาสต์ละลายหายไปทั้งหมด","เยื่อหุ้มเซลล์หดตัวแยกออกจากผนังเซลล์"],"a":3,"e":"น้ำออกจากเซลล์ ทำให้ไซโทพลาซึมหดและเยื่อหุ้มเซลล์แยกจากผนังเซลล์ เรียกว่าพลาสโมไลซิส"},{"t":"sci1_adv","q":"นักเรียนหยดสีผสมอาหารลงในน้ำร้อนและน้ำเย็นปริมาณเท่ากัน พบว่าสีกระจายในน้ำร้อนเร็วกว่า เพราะเหตุใด","c":["อนุภาคในน้ำร้อนมีพลังงานจลน์สูงกว่าจึงเคลื่อนที่เร็วกว่า","น้ำร้อนมีมวลน้อยกว่าจึงผลักสีให้กระจาย","น้ำเย็นไม่มีอนุภาคเคลื่อนที่เลย","สีผสมอาหารละลายเฉพาะในน้ำร้อน"],"a":0,"e":"ยิ่งอุณหภูมิสูง อนุภาคยิ่งเคลื่อนที่เร็ว การแพร่จึงเร็วขึ้น อนุภาคในน้ำเย็นยังเคลื่อนที่เพียงแต่ช้ากว่า"},{"t":"sci1_adv","q":"ที่ถุงลมในปอด ออกซิเจนเคลื่อนที่จากถุงลมเข้าสู่หลอดเลือดฝอยด้วยกระบวนการใดและเพราะเหตุใด","c":["การแพร่ เพราะในเลือดมีความเข้มข้นออกซิเจนสูงกว่าในถุงลม","การแพร่ เพราะในถุงลมมีความเข้มข้นออกซิเจนสูงกว่าในเลือด","ออสโมซิส เพราะออกซิเจนเป็นตัวทำละลายในเลือด","ออสโมซิส เพราะถุงลมดูดน้ำออกจากเลือด"],"a":1,"e":"สารแพร่จากบริเวณที่เข้มข้นมากไปน้อย ออกซิเจนในถุงลมสูงกว่าในเลือดที่ไหลมาจากร่างกาย จึงแพร่เข้าเลือด"},{"t":"sci1_adv","q":"เซลล์กล้ามเนื้อหัวใจมีไมโทคอนเดรียจำนวนมากกว่าเซลล์ผิวหนัง เพราะเหตุใด", :"sci1_adv","q":"ที่ 20°C เกลือแกงละลายน้ำ 100 กรัมได้สูงสุด 36 กรัม ถ้าใส่เกลือ 50 กรัมลงในน้ำ 100 กรัม จะมีเกลือเหลือไม่ละลายกี่กรัม","c":["14 กรัม","36 กรัม","50 กรัม","0 กรัม"],"a":0,"e":"ละลายได้ 36 กรัม เหลือ 50 − 36 = 14 กรัม สารละลายที่ได้เป็นสารละลายอิ่มตัว"},{"t":"sci1_adv","q":"ที่ 20°C เกลือแกงละลายน้ำ 100 กรัมได้สูงสุด 36 กรัม น้ำ 50 กรัมที่อุณหภูมิเดียวกันละลายเกลือได้สูงสุดกี่กรัม","c":["36 กรัม","18 กรัม","72 กรัม","9 กรัม"],"a":1,"e":"ปริมาณตัวทำละลายเป็นครึ่งหนึ่ง ละลายได้ครึ่งหนึ่ง = 36 ÷ 2 = 18 กรัม"},{"t":"sci1_adv","q":"ทดลองเปรียบเทียบอัตราการละลายของน้ำตาลก้อนกับน้ำตาลทรายป่นในน้ำอุณหภูมิและปริมาณเท่ากัน ตัวแปรต้นคือข้อใด","c":["เวลาที่ใช้ละลาย","ปริมาณน้ำ","ขนาดเม็ดของน้ำตาล","อุณหภูมิของน้ำ"],"a":2,"e":"ตัวแปรต้นคือสิ่งที่ผู้ทดลองเปลี่ยน คือขนาดเม็ดน้ำตาล เวลาเป็นตัวแปรตาม ส่วนปริมาณน้ำและอุณหภูมิเป็นตัวแปรควบคุม"},{"t":"sci1_adv","q":"แท่งมันฝรั่งหนัก 10.0 กรัม แช่ในสารละลาย A, B, C ได้มวลหลังแช่ 11.5, 10.0 และ 8.5 กรัมตามลำดับ สารละลายใดมีความเข้มข้นเท่ากับของเหลวในเซลล์มันฝรั่ง","c":["A","C","A และ C","B"],"a":3,"e":"มวลไม่เปลี่ยนแปลงแสดงว่าน้ำเข้าและออกเท่ากัน ความเข้มข้นจึงเท่ากัน คือสารละลาย B"},{"t":"sci1_adv","q":"จากการทดลองมันฝรั่งในสารละลาย A (มวลเพิ่ม) B (มวลคงเดิม) C (มวลลด) การเรียงความเข้มข้นของสารละลายจากน้อยไปมากเป็นอย่างไร","c":["A, B, C","C, B, A","B, A, C","A, C, B"],"a":0,"e":"A ทำให้น้ำเข้าเซลล์ จึงเจือจางกว่าเซลล์ B เท่ากับเซลล์ C ทำให้น้ำออก จึงเข้มข้นกว่าเซลล์ ลำดับคือ A < B < C"},{"t":"sci1_adv","q":"ไข่ที่แช่น้ำส้มสายชูจนเปลือกละลายหมดเหลือแต่เยื่อ นำไปแช่ในน้ำเชื่อมเข้มข้นมาก ไข่จะเป็นอย่างไร","c":["พองใหญ่ขึ้น เพราะน้ำจากน้ำเชื่อมเข้าไข่","เหี่ยวเล็กลง เพราะน้ำออกจากไข่สู่น้ำเชื่อม","ขนาดคงเดิม เพราะเยื่อไม่ยอมให้น้ำผ่าน","เปลี่ยนเป็นสีเหลืองเพราะน้ำตาลทำปฏิกิริยา"],"a":1,"e":"น้ำเชื่อมเข้มข้นกว่าภายในไข่ น้ำจึงเคลื่อนผ่านเยื่อออกจากไข่ ไข่จึงเหี่ยว"},{"t":"sci1_adv","q":"การดองผักด้วยเกลือทำให้ผักเหี่ยวและมีน้ำไหลออกมา เกิดจากกระบวนการใดเป็นหลัก","c":["การสังเคราะห์ด้วยแสง เพราะเกลือกระตุ้นคลอโรพลาสต์","การหายใจระดับเซลล์ เพราะเกลือเป็นอาหารของเซลล์","ออสโมซิส เพราะน้ำออกจากเซลล์ผักสู่สารละลายเกลือที่เข้มข้นกว่า","การแบ่งเซลล์ เพราะเกลือทำให้เซลล์เพิ่มจำนวน"],"a":2,"e":"เกลือทำให้ภายนอกเข้มข้นกว่าในเซลล์ น้ำจึงออกสู่ภายนอกด้วยออสโมซิส"},{"t":"sci1_adv","q":"ใส่ปุ๋ยเคมีเข้มข้นมากเกินไป พืชกลับเหี่ยวเฉา สาเหตุที่สมเหตุสมผลที่สุดคือข้อใด","c":["ปุ๋ยปิดปากใบจนพืชคายน้ำไม่ได้","ปุ๋ยทำให้ผนังเซลล์รากละลายหมด","ปุ๋ยทำให้เซลล์รากดูดน้ำเข้ามากจนแตก","สารละลายในดินเข้มข้นกว่าในเซลล์ราก น้ำจึงออกจากเซลล์ราก"],"a":3,"e":"ดินที่เข้มข้นกว่าดึงน้ำออกจากรากด้วยออสโมซิส พืชขาดน้ำจึงเหี่ยว"},{"t":"sci1_adv","q":"พารามีเซียมอาศัยในน้ำจืด จึงมีโครงสร้างใดช่วยกำจัดน้ำส่วนเกินที่ซึมเข้าเซลล์","c":["คอนแทรกไทล์แวคิวโอล","คลอโรพลาสต์","ผนังเซลล์เซลลูโลส","ไลโซโซม"],"a":0,"e":"น้ำจืดเจือจางกว่าเซลล์ น้ำเข้ามาตลอด คอนแทรกไทล์แวคิวโอลจึงบีบน้ำส่วนเกินออก"},{"t":"sci1_adv","q":"ข้อใดอธิบายออสโมซิสได้ถูกต้องที่สุด","c":["การแพร่ของตัวละลายทุกชนิดผ่านเยื่อจากที่เข้มข้นไปเจือจาง","การแพร่ของน้ำผ่านเยื่อเลือกผ่านจากด้านที่ตัวละลายเจือจางไปด้านที่เข้มข้น","การที่เซลล์ใช้พลังงานดันน้ำจากที่เข้มข้นไปเจือจาง","การที่น้ำเคลื่อนที่เฉพาะเมื่อมีอุณหภูมิสูงกว่า 50°C"],"a":1,"e":"ออสโมซิสคือการแพร่ของน้ำผ่านเยื่อเลือกผ่าน จากบริเวณที่มีน้ำมากไปยังบริเวณที่มีน้ำน้อย (ตัวละลายเข้มข้นกว่า)"},{"t":"sci1_adv","q":"กระเพาะอาหารจัดอยู่ในระดับการจัดระบบของสิ่งมีชีวิตระดับใด","c":["เนื้อเยื่อ","ระบบอวัยวะ","อวัยวะ","เซลล์"],"a":2,"e":"กระเพาะอาหารประกอบด้วยเนื้อเยื่อหลายชนิดทำงานร่วมกัน จึงเป็นอวัยวะ และเป็นส่วนหนึ่งของระบบย่อยอาหาร"},{"t":"sci1_adv","q":"ข้อใดเป็นสิ่งมีชีวิตเซลล์เดียว","c":["เห็ดฟาง","เฟิร์น","ฟองน้ำ","ยีสต์"],"a":3,"e":"ยีสต์มีเซลล์เดียว ส่วนเห็ดฟาง เฟิร์น และฟองน้ำเป็นสิ่งมีชีวิตหลายเซลล์"},{"t":"sci1_adv","q":"เซลล์ขนราก (root hair cell) มีส่วนยื่นยาวออกมา ซึ่งเหมาะกับหน้าที่ใด","c":["เพิ่มพื้นที่ผิวเพื่อดูดน้ำและแร่ธาตุ","ช่วยสังเคราะห์ด้วยแสงที่ราก","ช่วยป้องกันรากจากสัตว์กินพืช","ช่วยเก็บแป้งปริมาณมาก"],"a":0,"e":"ส่วนยื่นยาวทำให้พื้นที่ผิวสัมผัสดินมากขึ้น จึงดูดน้ำและแร่ธาตุได้มาก"},{"t":"sci1_adv","q":"เม็ดเลือดแดงของคนเต็มวัยไม่มีนิวเคลียส ข้อใดเป็นผลดีต่อหน้าที่ของเม็ดเลือดแดง","c":["สร้างพลังงานจากแสงได้มากขึ้น","มีพื้นที่ภายในมากขึ้นสำหรับฮีโมโกลบินที่ขนส่งออกซิเจน","แบ่งเซลล์ได้เร็วขึ้น","สังเคราะห์โปรตีนจากยีนได้ไม่จำกัด"],"a":1,"e":"เมื่อไม่มีนิวเคลียส ภายในมีที่เก็บฮีโมโกลบินได้มาก ช่วยขนส่งออกซิเจนได้ดี"},{"t":"sci1_adv","q":"ทำไมนักเรียนจึงย้อมเยื่อหัวหอมด้วยสารละลายไอโอดีนก่อนดูใต้กล้อง","c":["ฆ่าเชื้อให้เซลล์เจริญเร็ว","ทำให้ผนังเซลล์หายไป","ทำให้เห็นนิวเคลียสและโครงสร้างอื่นชัดขึ้น","เปลี่ยนเซลล์พืชเป็นเซลล์สัตว์"],"a":2,"e":"เซลล์ใสมองยาก สีย้อมช่วยเพิ่มความแตกต่างของส่วนประกอบ เช่น นิวเคลียส"},{"t":"sci1_adv","q":"ดูเซลล์เยื่อบุข้างแก้มใต้กล้องจุลทรรศน์ ข้อสังเกตใดบ่งชี้ว่าเป็นเซลล์สัตว์","c":["มีคลอโรพลาสต์สีเขียวหลายเม็ด","มีผนังเซลล์หนาเรียงเป็นแถวชัดเจน","มีแวคิวโอลใหญ่ตรงกลางเซลล์","ไม่มีผนังเซลล์ และรูปร่างค่อนข้างกลมไม่เป็นเหลี่ยมชัด"],"a":3,"e":"เซลล์สัตว์ไม่มีผนังเซลล์และคลอโรพลาสต์ แวคิวโอลมีขนาดเล็ก รูปร่างจึงไม่เหลี่ยมเหมือนเซลล์พืช"},{"t":"sci1_adv","q":"ข้อใดเป็นตัวกำหนดว่าอะตอมนั้นเป็นธาตุชนิดใด","c":["จำนวนโปรตอน","จำนวนนิวตรอน","จำนวนอิเล็กตรอนเท่านั้น","มวลของอะตอม"],"a":0,"e":"เลขอะตอมคือจำนวนโปรตอน เป็นเอกลักษณ์ของธาตุ นิวตรอนเปลี่ยนได้ (ไอโซโทป)"},{"t":"sci1_adv","q":"คาร์บอน-14 มีโปรตอน 6 ตัว มีเลขมวล 14 จะมีนิวตรอนกี่ตัว","c":["6","8","14","20"],"a":1,"e":"นิวตรอน = 14 − 6 = 8 ตัว คาร์บอน-12 มี 6 ตัว ต่างกันที่นิวตรอน จึงเป็นไอโซโทปกัน"},{"t":"sci1_adv","q":"อะตอมแคลเซียมมีโปรตอน 20 ตัว และนิวตรอน 20 ตัว มีเลขมวลเท่าใด","c":["20","60","40","0"],"a":2,"e":"เลขมวล = โปรตอน + นิวตรอน = 20 + 20 = 40"},{"t":"sci1_adv","q":"ข้อใดจับคู่สัญลักษณ์ธาตุกับชื่อธาตุได้ถูกต้อง","c":["Ag – ทองคำ","Fe – ฟลูออรีน","Na – ไนโตรเจน","Pb – ตะกั่ว"],"a":3,"e":"Pb คือตะกั่ว ส่วน Ag คือเงิน Fe คือเหล็ก และ Na คือโซเดียม"},{"t":"sci1_adv","q":"เหตุใดจึงนิยมบรรจุฮีเลียมในบอลลูนลอยฟ้ามากกว่าไฮโดรเจน","c":["ฮีเลียมเบากว่าอากาศและไม่ติดไฟ","ฮีเลียมหนักกว่าอากาศจึงทรงตัวดี","ฮีเลียมติดไฟช้ากว่าไฮโดรเจนเล็กน้อย","ฮีเลียมเป็นโลหะที่เบาที่สุด"],"a":0,"e":"ฮีเลียมเป็นแก๊สเฉื่อย เบากว่าอากาศ จึงลอยได้และปลอดภัย ส่วนไฮโดรเจนติดไฟง่าย"},{"t":"sci1_adv","q":"แยกน้ำด้วยไฟฟ้า ได้แก๊สออกซิเจน 10 mL จะได้แก๊สไฮโดรเจนกี่ mL","c":["5 mL","20 mL","10 mL","40 mL"],"a":1,"e":"น้ำ H₂O มีไฮโดรเจน : ออกซิเจน = 2 : 1 ตามปริมาตรแก๊ส จึงได้ 20 mL"},{"t":"sci1_adv","q":"ข้อใดเป็นสมบัติของสารประกอบที่ต่างจากสารผสม","c":["แยกส่วนประกอบได้ด้วยการกรองธรรมดา","ส่วนประกอบคงสมบัติเดิมของตัวเองทุกอย่าง","องค์ประกอบรวมกันด้วยอัตราส่วนมวลคงที่","อัตราส่วนผสมเปลี่ยนได้ตามต้องการ"],"a":2,"e":"สารประกอบเกิดจากธาตุรวมกันทางเคมีในอัตราส่วนคงที่ สารผสมเปลี่ยนอัตราส่วนได้และคงสมบัติเดิม"},{"t":"sci1_adv","q":"ผสมผงเหล็ก ทราย และเกลือแกง ลำดับวิธีแยกที่เหมาะสมคือข้อใด","c":["ละลายน้ำกรอง แล้วใช้แม่เหล็ก แล้วระเหยน้ำ","ระเหยน้ำ แล้วใช้แม่เหล็ก แล้วละลายน้ำกรอง","ใช้แม่เหล็ก แล้วระเหยน้ำ แล้วละลายน้ำกรอง","ใช้แม่เหล็ก แล้วละลายน้ำกรอง แล้วระเหยน้ำ"],"a":3,"e":"แม่เหล็กดึงเหล็กออกก่อน เติมน้ำละลายเกลือแล้วกรองแยกทราย สุดท้ายระเหยน้ำกรองเพื่อได้เกลือ"},{"t":"sci1_adv","q":"การกลั่นแยกน้ำบริสุทธิ์จากน้ำทะเลใช้หลักการใด","c":["จุดเดือดของน้ำต่ำกว่าเกลือมาก น้ำจึงกลายเป็นไอแยกออกมา","เกลือเบากว่าน้ำจึงลอยแยกออก","น้ำละลายเกลือหมดไปจึงเหลือแต่น้ำ","น้ำเกลือไหลผ่านกระดาษกรองได้ต่างกัน"],"a":0,"e":"น้ำเดือดกลายเป็นไอที่อุณหภูมิต่ำกว่าเกลือ จึงแยกด้วยการกลั่นแล้วควบแน่นไอน้ำ"},{"t":"sci1_adv","q":"ทำโครมาโทกราฟีหมึกสีดำพบว่าแยกเป็นหลายสี ที่ระยะทางต่างกัน เพราะเหตุใด","c":["หมึกทุกสีมีมวลอะตอมเท่ากัน","สารสีแต่ละชนิดละลายในตัวทำละลายและถูกกระดาษดูดซับไม่เท่ากัน","ตัวทำละลายทำปฏิกิริยากับกระดาษให้เป็นสี","สีดำเป็นธาตุที่แตกตัวได้"],"a":1,"e":"สารที่ละลายดีและถูกดูดซับน้อยจะเคลื่อนที่ไปไกล สารต่างชนิดจึงแยกจากกัน"},{"t":"sci1_adv","q":"ใส่หินในกระบอกตวงที่มีน้ำ 50 mL ระดับน้ำขึ้นเป็น 65 mL หินมีมวล 39 กรัม ความหนาแน่นของหินเท่าใด","c":["0.6 g/cm³","0.77 g/cm³","2.6 g/cm³","1.5 g/cm³"],"a":2,"e":"ปริมาตรหิน = 65 − 50 = 15 cm³ ความหนาแน่น = 39 ÷ 15 = 2.6 g/cm³"},{"t":"sci1_adv","q":"น้ำมันพืช (0.92 g/cm³) น้ำ (1.00 g/cm³) และน้ำผึ้ง (1.40 g/cm³) เทใส่แก้วเดียวกันโดย ไม่ได้","ตับอ่อนสร้างอินซูลินไม่ได้หรือน้อยมาก","ต่อมหมวกไตไม่สร้างอะดรีนาลีน"],"a":2,"e":"ขาดอินซูลิน เซลล์จึงนำกลูโคสเข้าไม่ได้ น้ำตาลในเลือดสูง ต้องฉีดอินซูลินทดแทน"},{"t":"sci4_life","q":"คนที่ดื่มน้ำน้อยมากและเสียเหงื่อมาก ปัสสาวะมักเป็นอย่างไร","c":["ปริมาณมากและใสมาก","ไม่มีสารใดอยู่ในปัสสาวะ","ปริมาณน้อยและเข้มข้น เพื่อรักษาน้ำในร่างกาย","ปริมาณมากและเข้มข้นมาก"],"a":2,"e":"เมื่อร่างกายขาดน้ำ ฮอร์โมน ADH เพิ่ม ไตดูดน้ำกลับมากขึ้น ปัสสาวะจึงเข้มข้นและน้อย"},{"t":"sci4_life","q":"ขณะวิ่งเร็ว เรารู้สึกหอบหายใจแรง เพราะเหตุใด","c":["O₂ ในเลือดสูงจนต้องระบายออก","กระเพาะอาหารว่าง","CO₂ ในเลือดเพิ่มสูงขึ้น กระตุ้นศูนย์ควบคุมการหายใจให้หายใจเร็วขึ้น","เซลล์หยุดหายใจ"],"a":2,"e":"กล้ามเนื้อใช้พลังงานมากจึงผลิต CO₂ มาก ระบบประสาทสั่งให้หายใจเร็วขึ้นเพื่อกำจัด CO₂ และรับ O₂ เพิ่ม"},{"t":"sci4_life","q":"เม็ดเลือดขาวที่กำจัดเชื้อโรคโดยการกลืนกิน เรียกกระบวนการนี้ว่าอะไร","c":["ออสโมซิส","ฟาโกไซโทซิส","การสังเคราะห์แสง","ไมโทซิส"],"a":1,"e":"ฟาโกไซโทซิสคือการที่เซลล์ยื่นส่วนห่อเชื้อโรคเข้าไปย่อยภายในเซลล์"},{"t":"sci4_life","q":"การฉีดวัคซีนช่วยป้องกันโรคได้อย่างไร","c":["ใส่แอนติบอดีสำเร็จรูปที่อยู่ในร่างกายตลอดชีวิต","ฆ่าเชื้อทุกชนิดในเลือดทันที","ทำให้ร่างกายไม่ต้องใช้เม็ดเลือดขาว","กระตุ้นร่างกายสร้างแอนติบอดีและเซลล์ความจำไว้ล่วงหน้า"],"a":3,"e":"วัคซีนมีเชื้อที่อ่อนฤทธิ์หรือส่วนของเชื้อ กระตุ้นภูมิคุ้มกัน เมื่อเจอเชื้อจริงจะตอบสนองได้เร็วและแรง"},{"t":"sci4_life","q":"น้ำตาและน้ำลายมีสารไลโซไซม์ซึ่งช่วยทำลายแบคทีเรีย จัดเป็นการป้องกันแบบใด","c":["ภูมิคุ้มกันแบบจำเพาะที่ได้รับจากการฉีดวัคซีน","การตอบสนองของแอนติบอดีเท่านั้น","ภูมิแพ้","ด่านป้องกันแบบไม่จำเพาะ"],"a":3,"e":"ผิวหนัง น้ำตา และเมือกเป็นด่านแรกที่ป้องกันเชื้อทุกชนิดโดยไม่เจาะจง"},{"t":"sci4_life","q":"ภูมิแพ้เกิดจากอะไร","c":["ระบบภูมิคุ้มกันไม่ทำงานเลย","ร่างกายขาดเม็ดเลือดแดง","ระบบภูมิคุ้มกันตอบสนองเกินปกติต่อสารที่ปกติไม่เป็นอันตราย","ติดเชื้อแบคทีเรียทุกครั้ง"],"a":2,"e":"เช่น ละอองเกสรหรืออาหารบางชนิดไม่เป็นอันตราย แต่ภูมิคุ้มกันของคนแพ้ตอบสนองรุนแรงเกินไป"},{"t":"sci4_life","q":"ไวรัสเอชไอวี (HIV) ทำให้ภูมิคุ้มกันอ่อนแอลงเพราะเหตุใด","c":["ทำลายเม็ดเลือดแดงทั้งหมด","ทำลายเกล็ดเลือดจนเลือดแข็งตัวไม่ได้","ทำให้ตับอ่อนไม่สร้างอินซูลิน","ทำลายเม็ดเลือดขาวชนิดทีช่วย จึงควบคุมภูมิคุ้มกันไม่ได้"],"a":3,"e":"เซลล์ทีช่วยเป็นตัวกระตุ้นการทำงานของภูมิคุ้มกัน เมื่อถูกทำลายร่างกายจึงติดเชื้อฉวยโอกาสง่าย"},{"t":"sci4_life","q":"ยาปฏิชีวนะ เช่น เพนิซิลลิน ใช้รักษาโรคที่เกิดจากสิ่งใดได้","c":["ไวรัสไข้หวัดใหญ่","ภูมิแพ้","มะเร็ง","แบคทีเรียบางชนิด"],"a":3,"e":"ยาปฏิชีวนะออกฤทธิ์ต่อแบคทีเรีย ไม่ได้ผลกับไวรัส"},{"t":"sci4_life","q":"การฉีดเซรุ่มแก้พิษงู ต่างจากการฉีดวัคซีนอย่างไร","c":["เซรุ่มกระตุ้นให้ร่างกายสร้างเซลล์ความจำ","เซรุ่มมีเชื้อที่อ่อนฤทธิ์","เซรุ่มอยู่ในร่างกายตลอดชีวิตเสมอ","เซรุ่มมีแอนติบอดีสำเร็จรูป ออกฤทธิ์เร็วแต่อยู่ไม่นาน"],"a":3,"e":"เซรุ่มให้แอนติบอดีโดยตรงเพื่อต้านพิษทันที แต่ร่างกายไม่ได้สร้างความจำ ภูมิจึงอยู่ไม่นาน"},{"t":"sci4_life","q":"ข้อใดเป็นสมการเคมีรวมของการสังเคราะห์แสง","c":["กลูโคส + ออกซิเจน → คาร์บอนไดออกไซด์ + น้ำ + พลังงาน","คาร์บอนไดออกไซด์ + น้ำ + พลังงานแสง → กลูโคส + ออกซิเจน","คาร์บอนไดออกไซด์ + กลูโคส → น้ำ + ออกซิเจน","น้ำ + ออกซิเจน → กลูโคส + คาร์บอนไดออกไซด์"],"a":1,"e":"พืชใช้ CO₂ และน้ำ ด้วยพลังงานแสง สร้างกลูโคสและปล่อย O₂ ข้อแรกในตัวเลือกลวงคือการหายใจ"},{"t":"sci4_life","q":"นำใบไม้ที่ถูกคลุมด้วยกระดาษดำหนึ่งวัน ไปทดสอบด้วยสารละลายไอโอดีน ผลที่คาดว่าจะเป็นอย่างไร","c":["เกิดสีน้ำเงินเข้ม เพราะมีแป้งมาก","ไม่เกิดสีน้ำเงินเข้ม เพราะไม่ได้สังเคราะห์แสงจึงไม่มีแป้งสะสม","เกิดสีเหลืองใส เพราะมีโปรตีน","เกิดตะกอนแดง"],"a":1,"e":"ไอโอดีนเปลี่ยนเป็นสีน้ำเงินเข้มเมื่อพบแป้ง ใบที่ไม่ได้รับแสงสร้างแป้งไม่ได้"},{"t":"sci4_life","q":"ในการทดลองแช่ไฮดริลลาไว้ในน้ำ ย้ายไฟเข้าใกล้มากขึ้นแล้วนับฟองแก๊สที่ออกจากต้นต่อนาที ถ้าฟองเพิ่มขึ้น แสดงว่าอย่างไร (ตัวแปรอื่นคงที่)","c":["ต้นไม้หยุดหายใจ","อัตราการสังเคราะห์แสงเพิ่มขึ้นตามความเข้มแสง","อัตราการสังเคราะห์แสงลดลง","น้ำเปลี่ยนเป็นออกซิเจนทั้งหมด"],"a":1,"e":"ฟองส่วนใหญ่เป็นออกซิเจนจากการสังเคราะห์แสง ฟองมากขึ้นแสดงว่าสังเคราะห์แสงเร็วขึ้นเมื่อแสงแรงขึ้น"},{"t":"sci4_life","q":"การหายใจร <script>

const SQ_VERSION = '0.10.0';

// ---------- ตัวสุ่มแบบกำหนดเมล็ดได้ (เทสต์ซ้ำได้) ----------
function makeRng(seed) {
  let a = seed >>> 0;
  const next = () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    next,
    int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
    pick: arr => arr[Math.floor(next() * arr.length)],
    chance: p => next() < p
  };
}

// ---------- เลขและเศษส่วน ----------
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
function lcm(a, b) { return a / gcd(a, b) * b; }
function rat(n, d) {
  if (d === undefined) d = 1;
  if (d < 0) { n = -n; d = -d; }
  const g = gcd(n, d) || 1;
  return { n: n / g, d: d / g };
}
function ratText(r) { return r.d === 1 ? String(r.n) : r.n + '/' + r.d; }
// เขียนเป็นทศนิยมถ้าหารลงตัวในฐานสิบ ไม่งั้นเป็นเศษส่วน
function decText(r) {
  if (r.d === 1) return String(r.n);
  for (let k = 1; k <= 6; k++) {
    const scaled = r.n * Math.pow(10, k);
    if (scaled % r.d === 0) {
      let s = String(Math.abs(scaled / r.d));
      while (s.length <= k) s = '0' + s;
      return (r.n < 0 ? '-' : '') + s.slice(0, -k) + '.' + s.slice(-k);
    }
  }
  return ratText(r);
}
function fracHtml(n, d) { return '<span class="fr"><span>' + n + '</span><span>' + d + '</span></span>'; }
function neg(n) { return n < 0 ? '−' + (-n) : String(n); }          // −5
function sgn(n) { return n < 0 ? '− ' + (-n) : '+ ' + n; }           // + 5 / − 5
function nCr(n, r) { let v = 1; for (let i = 1; i <= r; i++) v = v * (n - r + i) / i; return Math.round(v); }

// ---------- ตรวจคำตอบ ----------
// รับ "12" "-3" "0.75" "7/4" (รับเครื่องหมายลบแบบ −) คืนเศษส่วน หรือ null ถ้าอ่านไม่ออก
function parseAnswer(s) {
  if (typeof s !== 'string') return null;
  s = s.trim().replace(/−/g, '-').replace(/,/g, '').replace(/\s+/g, '');
  let m = /^(-?)(\d+)\/(\d+)$/.exec(s);
  if (m) {
    const n = parseInt(m[2], 10), d = parseInt(m[3], 10);
    return d === 0 ? null : rat(m[1] ? -n : n, d);
  }
  m = /^(-?)(\d*)(?:\.(\d+))?$/.exec(s);
  if (!m || (m[2] === '' && m[3] === undefined)) return null;
  const frac = m[3] || '';
  const n = parseInt((m[2] || '0') + frac, 10);
  return rat(m[1] ? -n : n, Math.pow(10, frac.length));
}
function checkAnswer(input, q) {
  const r = parseAnswer(input);
  return !!r && r.n === q.answer.n && r.d === q.answer.d;
}

// ---------- ตัวสร้างโจทย์คณิต (คำตอบคำนวณด้วยโค้ด ไม่พิมพ์เฉลยมือ) ----------

}

  const a = arr.slice();

function bankItemId(topicId, k) { return topicId + '#' + k; }
function bankItems(topicId) {
  const out = []; let k = 0;
  BANK_ITEMS.forEach(it => { if (it.t === topicId) { out.push({ id: bankItemId(topicId, k), item: it }); k++; } });
  return out;
}
function bankGen(t) {
  return { id: t.id, subject: t.subject, level: t.level, tier: t.tier, topic: t.name, bank: true,
    make(r, g, bad, used) {
      let pool = bankItems(g.id).filter(x => !(bad && bad[x.id]) && !(used && used[x.id]));
      if (!pool.length) pool = bankItems(g.id).filter(x => !(bad && bad[x.id]));
      if (!pool.length) pool = bankItems(g.id);
      const pick = r.pick(pool), it = pick.item;
      const order = shuffle([0, 1, 2, 3], r);
      const choices = order.map(i => it.c[i]);
      const correct = order.indexOf(it.a);
      return mkQ(g, escHtml(it.q).replace(/\n/g, '<br>'), rat(correct), escHtml(it.e),
        { kind: 'mc', choices, correct, ansText: CHOICE_LABELS[correct] + '. ' + choices[correct], itemId: pick.id });
    } };
}

function listBank(subject) {
  const out = [];
  BANK_TOPICS.filter(t => t.subject === subject).forEach(t => {
    bankItems(t.id).forEach(x => out.push({ id: x.id, topicId: t.id, topic: t.name, level: t.level, tier: t.tier,
      q: x.item.q, c: x.item.c, a: x.item.a, e: x.item.e }));

function newProfile(id, name, level) {
  const p = { id, name, level, coins: 0, seeds: 3, barn: {}, plotCount: 4, plots: [null, null, null, null],
    orders: [], stats: {}, review: [], answered: 0, stretch: 0.2 };

}
// เติมของใหม่ให้เซฟรุ่นเก่า (ไม่มีสัตว์/ผลผลิตสัตว์) โดยไม่แตะข้อมูลเดิม
function ensureFarmExtras(p) {
  if (!p.barn) p.barn = {};
  Object.keys(ITEMS).forEach(c => { if (typeof p.barn[c] !== 'number') p.barn[c] = 0; });
  if (!p.animals) p.animals = { hen: { at: null } };
  if (!p.lessons) p.lessons = {};
}

// ---------- ฟาร์ม ----------
function plotState(p, i, now) {
  const s = p.plots[i];
  if (!s) return 'empty';
  return now - s.at >= CROPS[s.crop].ms ? 'ready' : 'growing';
}
function plotRemainingMs(p, i, now) {
  const s = p.plots[i];
  return s ? Math.max(0, CROPS[s.crop].ms - (now - s.at)) : 0;
}
// ความคืบหน้าการโต 0..1 (ใช้เลือกรูปต้นกล้า/ต้นโตครึ่งทาง/พร้อมเก็บ)
function plotProgress(p, i, now) {
  const s = p.plots[i];
  return s ? Math.min(1, Math.max(0, (now - s.at) / CROPS[s.crop].ms)) : 0;
}
// ระยะการโต 0 ต้นกล้า · 1 ใบอ่อน · 2 เริ่มออกผล · 3 พร้อมเก็บ
function plotStage(p, i, now) {
  if (!p.plots[i]) return 0;
  const g = plotProgress(p, i, now);
  return g >= 1 ? 3 : g >= 2 / 3 ? 2 : g >= 1 / 3 ? 1 : 0;
}
function plantCrop(p, i, crop, now) {
  if (!CROPS[crop]) return { ok: false, msg: 'ไม่รู้จักพืชนี้' };
  if (i < 0 || i >= p.plotCount) return { ok: false, msg: 'ยังไม่มีแปลงนี้' };
  if (p.plots[i]) return { ok: false, msg: 'แปลงนี้มีพืชอยู่แล้ว' };
  if (p.seeds < 1) return { ok: false, msg: 'เมล็ดหมดแล้ว ไปตอบคำถามเพื่อรับเมล็ดเพิ่ม' };
  p.seeds -= 1;
  p.plots[i] = { crop, at: now };
  return { ok: true };
}
function harvestPlot(p, i, now) {
  if (plotState(p, i, now) !== 'ready') return { ok: false, msg: 'ยังไม่โต' };
  const crop = p.plots[i].crop;
  p.barn[crop] += 1;
  p.plots[i] = null;
  return { ok: true, crop };
}
function plotCost(plotCount) { return 40 * (plotCount - 3); }
function buyPlot(p) {
  if (p.plotCount >= MAX_PLOTS) return { ok: false, msg: 'แปลงเต็มแล้ว' };
  const cost = plotCost(p.plotCount);
  if (p.coins < cost) return { ok: false, msg: 'เหรียญไม่พอ (ต้องใช้ ' + cost + ')' };
  p.coins -= cost;
  p.plotCount += 1;
  p.plots.push(null);
  return { ok: true, cost };
}

// ---------- สัตว์ ----------
// สถานะ: locked (ยังไม่ซื้อ) · hungry (รออาหาร) · producing (กำลังผลิต) · ready (เก็บได้)
function animalState(p, id, now) {
  const a = p.animals[id];
  if (!a) return 'locked';
  if (a.at === null) return 'hungry';
  return now - a.at >= ANIMALS[id].ms ? 'ready' : 'producing';
}
function animalRemainingMs(p, id, now) {
  const a = p.animals[id];
  return a && a.at !== null ? Math.max(0, ANIMALS[id].ms - (now - a.at)) : 0;
}
function animalProgress(p, id, now) {
  const a = p.animals[id];
  return a && a.at !== null ? Math.min(1, Math.max(0, (now - a.at) / ANIMALS[id].ms)) : 0;
}
function feedAnimal(p, id, now) {
  const st = animalState(p, id, now), A = ANIMALS[id];
  if (st === 'locked') return { ok: false, msg: 'ยังไม่มี' + A.name + 'ตัวนี้' };
  if (st !== 'hungry') return { ok: false, msg: A.name + 'ยังไม่หิว' };
  if (p.barn[A.feed] < 1) return { ok: false, msg: A.name + 'กิน ' + ITEMS[A.feed].icon + ' ' + ITEMS[A.feed].name + ' (ในโกดังไม่มี ไปปลูกก่อนนะ)' };
  p.barn[A.feed] -= 1;
  p.animals[id].at = now;
  return { ok: true, feed: A.feed };
}
function collectAnimal(p, id, now) {
  if (animalState(p, id, now) !== 'ready') return { ok: false, msg: 'ยังไม่ได้ผลผลิต' };
  const out = ANIMALS[id].out;
  p.barn[out] += 1;
  p.animals[id].at = null;
  return { ok: true, out };
}
function buyAnimal(p, id) {
  const A = ANIMALS[id];
  if (!A) return { ok: false, msg: 'ไม่รู้จักสัตว์ชนิดนี้' };
  if (p.animals[id]) return { ok: false, msg: 'มี' + A.name + 'แล้ว' };
  if (p.coins < A.cost) return { ok: false, msg: 'เหรียญไม่พอ (ต้องใช้ ' + A.cost + ')' };
  p.coins -= A.cost;
  p.animals[id] = { at: null };
  return { ok: true, cost: A.cost };
}

// ---------- ออเดอร์ลูกค้า ----------
// ของที่ออเดอร์ขอได้: พืชทุกชนิด + ผลผลิตของสัตว์ที่มีแล้วเท่านั้น (ไม่ขอของที่ผลิตไม่ได้)
function orderPool(p) {
  const pool = CROP_IDS.slice();
  ANIMAL_IDS.forEach(id => { if (p.animals && p.animals[id]) pool.push(ANIMALS[id].out); });
  return pool;
}
function makeOrder(rng, itemPool) {
  const kinds = rng.chance(0.3) ? 3 : rng.chance(0.6) ? 2 : 1;
  const pool = (itemPool || CROP_IDS).slice();
  const items = {};
  let value = 0;
  for (let i = 0; i < kinds && pool.length; i++) {
    const c = pool.splice(rng.int(0, pool.length - 1), 1)[0];
    const q = rng.int(1, 3);
    items[c] = q;
    value += ITEMS[c].price * q;
  }
  return { items, reward: Math.round(value * 1.4) };
}
function ensureOrders(p, rng) {
  while (p.orders.length < ORDER_SLOTS) p.orders.push(makeOrder(rng, orderPool(p)));
}
function canDeliver(p, order) {
  return Object.keys(order.items).every(c => p.barn[c] >= order.items[c]);
}
function deliverOrder(p, idx, rng) {
  const o = p.orders[idx];
  if (!o) return { ok: false, msg: 'ไม่มีออเดอร์นี้' };
  if (!canDeliver(p, o)) return { ok: false, msg: 'ของในโกดังยังไม่พอ' };
  Object.keys(o.items).forEach(c => { p.barn[c] -= o.items[c]; });
  p.coins += o.reward;
  p.orders[idx] = makeOrder(rng, orderPool(p));
  return { ok: true, reward: o.reward };
}

// ---------- บันทึกคำตอบ + ทบทวนข้อที่ผิด (วัชพืช) ----------
function addReview(p, genId, now) {
  const e = p.review.find(x => x.gen === genId);
  if (e) { e.step = 0; e.due = now + REVIEW_STEPS_MS[0]; }
  else p.review.push({ gen: genId, step: 0, due: now + REVIEW_STEPS_MS[0] });
}
function dueReviews(p, now) { return p.review.filter(x => x.due <= now); }
function recordAnswer(p, q, correct, now) {
  const st = p.stats[q.gen] || (p.stats[q.gen] = { r: 0, w: 0 });
  if (correct) st.r += 1; else st.w += 1;
  p.answered += 1;
  let seeds = 0;
  if (correct) { seeds = TIER_SEEDS[q.tier] || 1; p.seeds += seeds; }
  else addReview(p, q.gen, now);
  return { seeds };
}
function resolveReview(p, genId, q, correct, now) {
  const st = p.stats[genId] || (p.stats[genId] = { r: 0, w: 0 });
  if (correct) st.r += 1; else st.w += 1;
  p.answered += 1;
  const e = p.review.find(x => x.gen === genId);
  let coins = 0;
  if (correct) {
    coins = 5;
    p.coins += coins;
    if (e) {
      if (e.step >= REVIEW_STEPS_MS.length - 1) p.review = p.review.filter(x => x !== e);
      else { e.step += 1; e.due = now + REVIEW_STEPS_MS[e.step]; }
    }
  } else if (e) { e.step = 0; e.due = now + REVIEW_STEPS_MS[0]; }
  return { coins };
}

// ---------- จัดชุดคำถาม ----------
function genWeight(p, g) {
  const st = p.stats[g.id];
  if (!st || st.r + st.w === 0) return 1.5;          // ยังไม่เคยเล่น เจอบ้าง
  return 1 + 3 * (st.w / (st.r + st.w));              // ยิ่งผิดบ่อย ยิ่งเจอบ่อย
}
function weightedPick(list, weightFn, rng) {
  let total = 0;
  const w = list.map(x => { const v = weightFn(x); total += v; return v; });
  let t = rng.next() * total;
  for (let i = 0; i < list.length; i++) { t -= w[i]; if (t <= 0) return list[i]; }
  return list[list.length - 1];
}
// opts: { gen: รหัสหัวข้อ (ไม่ใส่ = ผสม), count }
function buildRound(p, opts, rng) {
  const count = (opts && opts.count) || ROUND_SIZE;
  const bad = (opts && opts.bad) || null;
  const qs = [], used = {};
  const add = (g) => {                       // ไม่ให้ข้อเลือกตอบข้อเดิมซ้ำในด่านเดียวกัน
    const q = g.make(rng, g, bad, used);
    if (q.itemId) used[q.itemId] = true;
    qs.push(q);
  };
  if (opts && opts.gen) {
    for (let i = 0; i < count; i++) add(GEN_BY_ID[opts.gen]);
    return qs;
  }
  const subj = (opts && opts.subject) || 'math';
  const subjects = subj === 'all' ? SUBJECT_IDS.filter(s => gensFor(p.level, s).length) : [subj];
  let prev = null;
  for (let i = 0; i < count; i++) {
    let g, tries = 0;
    do {
      // ด่านรวมทุกวิชา: สุ่มวิชาก่อน (ให้ทุกวิชาออกเท่า ๆ กัน) แล้วค่อยเลือกหัวข้อ
      const all = gensFor(p.level, subjects.length > 1 ? rng.pick(subjects) : subjects[0]);
      const core = all.filter(x => x.tier === 'core'), stretch = all.filter(x => x.tier === 'stretch'), easy = all.filter(x => x.tier === 'easy');
      const roll = rng.next();
      let pool = roll < p.stretch ? stretch : (easy.length && roll < p.stretch + EASY_SHARE) ? easy : core;
      if (!pool.length) pool = core.length ? core : all;
      g = weightedPick(pool, x => genWeight(p, x), rng);
      tries++;
    } while (g.id === prev && tries < 10);
    prev = g.id;
    add(g);
  }
  return qs;
}
function topicAccuracy(p, genId) {
  const st = p.stats[genId];
  if (!st || st.r + st.w === 0) return null;
  return st.r / (st.r + st.w);
}

    { say: 'แรงที่ทำให้คานหมุนเรียกว่า <b>โมเมนต์</b> หาได้จาก <b>น้ำหนัก × ระยะจากจุดหมุน</b> ยิ่งหนักหรือยิ่งอยู่ไกล โมเมนต์ยิ่งมาก', fig: { t: 'formula', lines: ['โมเมนต์ = น้ำหนัก × ระยะ', '(นิวตัน × เมตร)'] } },
    { say: 'คานสมดุลเมื่อ <b>โมเมนต์ด้านซ้าย = โมเมนต์ด้านขวา</b> ตัวอย่าง ซ้าย 20 N ห่าง 3 ม. = 60 · ขวา 30 N ห่าง 2 ม. = 60 เท่ากันพอดี', fig: { t: 'lever', left: { w: 20, d: 3 }, right: { w: 30, d: 2 } } },
    { say: 'หาน้ำหนักที่ไม่รู้: ซ้ายหนัก 10 N ห่าง 6 ม. อีกด้านห่าง 3 ม. ต้องหนักกี่ N? <b>10 × 6 = F × 3</b> ได้ F = 60 ÷ 3 = <b>20 N</b> (อยู่ใกล้กว่าก็ต้องหนักกว่า)', fig: { t: 'lever', left: { w: 10, d: 6 }, right: { w: null, d: 3 } } },
    { say: 'จำไว้ 2 ข้อ: ใช้ระยะ <b>จากจุดหมุน</b> ไม่ใช่ความยาวทั้งกระดาน · หน่วยต้องตรงกัน (เมตรกับเมตร) แล้วลองทำโจทย์ได้เลย', fig: { t: 'formula', lines: ['น้ำหนักซ้าย × ระยะซ้าย', '= น้ำหนักขวา × ระยะขวา'] } }
  ] },
  { id: 'ls_pythag', level: 'm4', subject: 'math', gen: 'pythag', icon: '📐', title: 'บันไดพิงโรงนา', blurb: 'ทฤษฎีบทพีทาโกรัส', pages: [
    { say: 'ลุงข้าวโพดเอาบันไดยาว 5 เมตรพิงโรงนา ปลายล่างห่างกำแพง 3 เมตร ปลายบนจะสูงกี่เมตร? บันไดกับกำแพงกับพื้นเกิดเป็น <b>สามเหลี่ยมมุมฉาก</b>', fig: { t: 'rtri', a: '3 ม. (พื้น)', b: '? (กำแพง)', c: '5 ม. (บันได)' } },
    { say: 'ด้านที่ <b>ยาวที่สุด</b> อยู่ตรงข้ามมุมฉาก เรียก <b>ด้านตรงข้ามมุมฉาก (c)</b> อีกสองด้านเรียก <b>ด้านประกอบมุมฉาก (a, b)</b>', fig: { t: 'rtri', a: 'a', b: 'b', c: 'c' } },
    { say: 'พีทาโกรัสพบว่า พื้นที่สี่เหลี่ยมบนสองด้านเล็ก <b>รวมกัน = พื้นที่สี่เหลี่ยมบนด้านยาว</b> 9 + 16 = 25 หรือ <b>a² + b² = c²</b>', fig: { t: 'pyth' } },
    { say: 'หาด้านตรงข้ามมุมฉาก: a = 6, b = 8 → c² = 36 + 64 = 100 → <b>c = 10</b> (ถอดรากที่สองของ 100)', fig: { t: 'rtri', a: '6', b: '8', c: '? = 10' } },
    { say: 'หาด้านประกอบ ต้อง <b>ลบ</b>: c = 13, a = 5 → b² = c² − a² = 169 − 25 = 144 → <b>b = 12</b> กลับมาที่บันได: 5² − 3² = 16 ความสูง <b>4 ม.</b>', fig: { t: 'rtri', a: '5', b: '? = 12', c: '13' } },
    { say: 'ชุดเลขที่ควรจำ จะได้ไม่ต้องคิดนาน และคูณทวีคูณได้ เช่น 6, 8, 10 (ได้จาก 3, 4, 5 × 2)', fig: { t: 'formula', lines: ['3 · 4 · 5', '5 · 12 · 13', '8 · 15 · 17', '7 · 24 · 25', '20 · 21 · 29'] } }
  ] },
  { id: 'ls_system', level: 'm4', subject: 'math', gen: 'system2', icon: '🧺', title: 'ตะกร้าข้าวสาลีกับแครอท', blurb: 'ระบบสมการ (วิธีลบสมการ)', pages: [
    { say: 'ป้าไก่ซื้อข้าวสาลี (กำละ 3 บาท) กับแครอท (หัวละ 1 บาท) รวม <b>10 ชิ้น</b> จ่าย <b>18 บาท</b> ซื้ออย่างละกี่ชิ้น?', fig: { t: 'emojis', rows: [['🌾', 3, 'ข้าวสาลี กำละ 3 บาท'], ['🥕', 3, 'แครอท หัวละ 1 บาท']] } },
    { say: 'ตั้งตัวแปร <b>x = จำนวนข้าวสาลี</b> · <b>y = จำนวนแครอท</b> แล้วแปลงเรื่องเป็นสมการ 2 ข้อ: รวมกัน 10 ชิ้น และรวมเงิน 18 บาท', fig: { t: 'formula', lines: ['x + y = 10', '3x + y = 18'] } },
    { say: 'ทริค: <b>นำสมการสองลบสมการหนึ่ง</b> ตัว y หายไปเลย (3x + y) − (x + y) = 18 − 10 เหลือ <b>2x = 8</b>', fig: { t: 'formula', lines: ['(3x + y) − (x + y) = 18 − 10', '2x = 8', 'x = 4'] } },
    { say: 'ได้ x = 4 แล้ว <b>แทนกลับ</b> ในสมการง่าย ๆ: 4 + y = 10 → <b>y = 6</b> สรุป ข้าวสาลี 4 กำ แครอท 6 หัว', fig: { t: 'emojis', rows: [['🌾', 4, 'ข้าวสาลี 4 กำ'], ['🥕', 6, 'แครอท 6 หัว']] } },
    { say: '<b>ตรวจคำตอบทุกครั้ง</b> 3(4) + 6 = 18 ✓ · 4 + 6 = 10 ✓ ถ้าสัมประสิทธิ์ของตัวแปรหนึ่งเท่ากันทั้งสองสมการ ลบกันตัดทิ้งได้เลย ถ้าไม่เท่า ให้คูณสมการให้เท่ากันก่อน', fig: { t: 'formula', lines: ['1) ทำให้ตัวแปรหนึ่งเท่ากัน', '2) ลบ (หรือบวก) ให้ตัวนั้นหาย', '3) แทนกลับหาอีกตัว', '4) ตรวจคำตอบ'] } }
  ] },
  { id: 'ls_ratio', level: 'm1', subject: 'math', gen: 'ratio_share', icon: '🍯', title: 'แบ่งน้ำผึ้งให้เพื่อนผึ้ง', blurb: 'อัตราส่วนและการแบ่งเป็นส่วน ๆ', pages: [
    { say: 'ผึ้งน้อยสองตัวช่วยกันเก็บน้ำผึ้งขายได้เงิน <b>40 บาท</b> ตกลงแบ่งกันในอัตราส่วน <b>3 : 5</b> (ตัวแรก : ตัวที่สอง) ใครได้กี่บาทนะ?', fig: { t: 'bars', rows: [{ parts: 8, shade: 3, label: 'ตัวแรก 3 ส่วน' }, { parts: 8, shade: 5, label: 'ตัวที่สอง 5 ส่วน' }] } },
    { say: 'อัตราส่วน 3 : 5 แปลว่าแบ่งเป็นส่วนเท่า ๆ กัน ตัวแรกได้ 3 ส่วน ตัวที่สองได้ 5 ส่วน รวมทั้งหมด <b>3 + 5 = 8 ส่วน</b>', fig: { t: 'bars', rows: [{ parts: 8, shade: 3, label: '3 ส่วนจาก 8 ส่วน' }] } },
    { say: 'ขั้นแรก หาว่า <b>1 ส่วน</b> เท่ากับกี่บาท เอายอดรวมหารจำนวนส่วนทั้งหมด', fig: { t: 'formula', lines: ['40 ÷ 8 = 5', '1 ส่วน = 5 บาท'] } },
    { say: 'ขั้นสอง เอา 1 ส่วนไปคูณจำนวนส่วนของแต่ละตัว แล้วบวกกลับมาตรวจว่าครบ 40 ไหม', fig: { t: 'formula', lines: ['ตัวแรก 3 × 5 = 15 บาท', 'ตัวที่สอง 5 × 5 = 25 บาท', '15 + 25 = 40 ✓'] } },
    { say: 'สรุปวิธีทำทุกครั้ง: <b>รวมส่วน → หารยอดรวมได้ 1 ส่วน → คูณส่วนของแต่ละคน → บวกตรวจ</b> อย่าเอา 40 ไปหารด้วย 3 หรือ 5 ตรง ๆ', fig: { t: 'formula', lines: ['1) รวมส่วนทั้งหมด', '2) ยอดรวม ÷ ส่วนรวม = 1 ส่วน', '3) 1 ส่วน × ส่วนของแต่ละคน', '4) บวกกลับตรวจ'] } }
  ] },
  { id: 'ls_pct', level: 'm1', subject: 'math', gen: 'pct_disc', icon: '🏷️', title: 'ป้ายลดราคาที่ตลาดนัด', blurb: 'ร้อยละและส่วนลด', pages: [
    { say: '<b>ร้อยละ</b> คือ "ส่วนจากร้อย" เช่น 50% คือครึ่งหนึ่ง 25% คือ 1 ใน 4 และ 10% คือ 1 ใน 10', fig: { t: 'bars', rows: [{ parts: 2, shade: 1, label: '50% = 1/2' }, { parts: 4, shade: 1, label: '25% = 1/4' }, { parts: 10, shade: 1, label: '10% = 1/10' }] } },
    { say: 'ที่ตลาดนัดมีเสื้อป้าย <b>800 บาท</b> ติดป้ายว่า <b>ลด 25%</b> 25% ก็คือ 1 ใน 4 ของราคา', fig: { t: 'pie', parts: 4, shade: 1, label: 'ส่วนลด 25% = 1/4' } },
    { say: 'คิด <b>ส่วนลด</b> ก่อน: ราคา × ร้อยละ ÷ 100', fig: { t: 'formula', lines: ['800 × 25 ÷ 100', '= 200 บาท (ส่วนลด)'] } },
    { say: 'แล้ว <b>ราคาที่จ่าย = ราคาเดิม − ส่วนลด</b> หรือทางลัด จ่ายแค่ 75% ของราคาเดิม (800 × 75 ÷ 100) ได้ 600 เท่ากัน', fig: { t: 'formula', lines: ['800 − 200 = 600 บาท', 'หรือ 800 × 75 ÷ 100 = 600'] } },
    { say: 'ระวัง! ลด 20% แล้วลดอีก 10% <b>ไม่ใช่ลด 30%</b> เพราะลดครั้งที่สองคิดจากราคาใหม่ 1,000 → 800 → 720 (ลดรวม 28%)', fig: { t: 'formula', lines: ['1,000 × 80% = 800', '800 × 90% = 720', 'ลดรวม 28% ไม่ใช่ 30%'] } }
  ] },
  { id: 'ls_sound', level: 'm1', subject: 'sci', gen: 'sc_sound', icon: '⚡', title: 'ทำไมเห็นฟ้าแลบก่อนได้ยินฟ้าร้อง', blurb: 'ความเร็วเสียงและการหาระยะทาง', pages: [
    { say: 'คืนฝนตก เห็น <b>ฟ้าแลบ ⚡</b> วาบก่อน แล้วอีกพักใหญ่ถึงได้ยิน <b>ฟ้าร้อง 🔊</b> ทั้งที่เกิดพร้อมกัน ทำไมกัน?', fig: { t: 'emojis', rows: [['⚡', 1, 'เห็นแสงก่อน'], ['🔊', 1, 'ได้ยินเสียงทีหลัง']] } },
    { say: '<b>แสงเร็วมาก</b> ราว 300,000 กิโลเมตรต่อวินาที มาถึงตาเราทันที ส่วน <b>เสียงช้ากว่ามาก</b> เดินทางในอากาศราว <b>340 เมตรต่อวินาที</b> เท่านั้น', fig: { t: 'formula', lines: ['แสง ≈ 300,000 กม./วินาที', 'เสียง ≈ 340 ม./วินาที (ในอากาศ)'] } },
    { say: 'เวลาที่เรารอเสียงหลังเห็นแสง ใช้หาว่าฟ้าแลบอยู่ไกลแค่ไหนได้ ด้วยสูตรที่รู้จักกันดี', fig: { t: 'formula', lines: ['ระยะทาง = ความเร็ว × เวลา'] } },
    { say: 'เห็นฟ้าแลบแล้วอีก <b>5 วินาที</b> จึงได้ยินเสียง: ระยะ = 340 × 5 = <b>1,700 เมตร</b> (ใช้เวลาของเสียงอย่างเดียว เพราะแสงมาถึงทันที)', fig: { t: 'formula', lines: ['340 × 5 = 1,700 เมตร', '(ประมาณ 1.7 กิโลเมตร)'] } },
    { say: 'ทริคนับเร็ว: ทุก ๆ <b>3 วินาที</b> เสียงเดินทางราว <b>1 กิโลเมตร</b> (340 × 3 = 1,020 เมตร) ระวังหน่วย โจทย์มักให้ตอบเป็นเมตร', fig: { t: 'formula', lines: ['3 วินาที ≈ 1 กม.', 'ตรวจหน่วยเสมอ (ม. หรือ กม.)'] } }
  ] },
  { id: 'ls_density', level: 'm1', subject: 'sci', gen: 'sc_density', icon: '🧊', title: 'ก้อนไหนลอย ก้อนไหนจม', blurb: 'ความหนาแน่น', pages: [
    { say: 'หย่อนไม้ลงน้ำ ไม้ลอย หย่อนก้อนเหล็กลงไป เหล็กจม ทั้งที่บางทีเหล็กก้อนเล็กกว่ามาก ความลับคือ <b>ความหนาแน่น</b>', fig: { t: 'emojis', rows: [['🪵', 1, 'ไม้ ลอย'], ['🔩', 1, 'เหล็ก จม']] } },
    { say: '<b>ความหนาแน่น</b> บอกว่าของ 1 ลูกบาศก์เซนติเมตรหนักกี่กรัม หาได้จากมวลหารปริมาตร', fig: { t: 'formula', lines: ['ความหนาแน่น = มวล ÷ ปริมาตร', 'หน่วย กรัม/ลูกบาศก์เซนติเมตร'] } },
    { say: 'โลหะก้อนหนึ่งมวล 78 กรัม ปริมาตร 10 ลูกบาศก์เซนติเมตร: ความหนาแน่น = 78 ÷ 10 = <b>7.8 g/cm³</b>', fig: { t: 'formula', lines: ['78 ÷ 10 = 7.8', 'ความหนาแน่น 7.8 g/cm³'] } },
    { say: 'ย้อนกลับหามวลได้ด้วย: วัตถุหนาแน่น 2.5 g/cm³ ปริมาตร 20 cm³ → มวล = 2.5 × 20 = <b>50 กรัม</b>', fig: { t: 'formula', lines: ['มวล = ความหนาแน่น × ปริมาตร', '2.5 × 20 = 50 กรัม'] } },
    { say: '<b>น้ำมีความหนาแน่น 1 g/cm³</b> ของที่หนาแน่น <b>น้อยกว่า 1 จะลอย</b> ของที่หนาแน่น <b>มากกว่า 1 จะจม</b> เช่น ไม้ 0.5 ลอย เหล็ก 7.8 จม', fig: { t: 'bars', rows: [{ parts: 10, shade: 5, label: 'ไม้ 0.5 (ลอย)' }, { parts: 10, shade: 10, label: 'น้ำ 1 (เทียบ)' }] } }
  ] },
  { id: 'ls_ohm', level: 'm4', subject: 'sci', gen: 'sc_ohm', icon: '💡', title: 'ไฟสว่างในโรงนา', blurb: 'กฎของโอห์ม ต่ออนุกรมและขนาน', pages: [
    { say: 'ลุงข้าวโพดต่อหลอดไฟในโรงนา ต้องรู้ 3 อย่าง: <b>แรงดันไฟ V</b> (โวลต์) <b>กระแส I</b> (แอมแปร์) และ <b>ความต้านทาน R</b> (โอห์ม) ซึ่งสัมพันธ์กันตามกฎของโอห์ม', fig: { t: 'formula', lines: ['V = I × R', 'I = V ÷ R'] } },
    { say: 'ต่อตัวต้านทานแบบ <b>อนุกรม</b> (ต่อเรียงกันทางเดียว) ความต้านทานรวมคือ <b>บวกกัน</b> เช่น 4 + 6 = 10 โอห์ม', fig: { t: 'circ', kind: 'series', a: '4 Ω', b: '6 Ω' } },
    { say: 'ถ้าแหล่งไฟ <b>20 โวลต์</b> กระแสในวงจร I = V ÷ R = 20 ÷ 10 = <b>2 แอมแปร์</b> (กระแสเท่ากันตลอดวงจรอนุกรม)', fig: { t: 'formula', lines: ['R รวม = 4 + 6 = 10 Ω', 'I = 20 ÷ 10 = 2 A'] } },
    { say: 'ต่อแบบ <b>ขนาน</b> (มีหลายทางให้กระแสแยกไหล) ความต้านทานรวมจะ <b>น้อยลง</b> สูตร 1/R = 1/R₁ + 1/R₂ หรือ R = (R₁×R₂) ÷ (R₁+R₂)', fig: { t: 'circ', kind: 'parallel', a: '6 Ω', b: '3 Ω' } },
    { say: 'ตัวอย่าง 6 Ω ขนานกับ 3 Ω: R = (6 × 3) ÷ (6 + 3) = 18 ÷ 9 = <b>2 Ω</b> ซึ่งน้อยกว่าตัวที่น้อยที่สุด (3 Ω) เสมอ ใช้ตรวจคำตอบได้', fig: { t: 'formula', lines: ['อนุกรม: R = R₁ + R₂', 'ขนาน: R = (R₁×R₂)÷(R₁+R₂)', 'ขนานแล้ว R น้อยกว่าตัวเล็กสุด'] } }
  ] },
  { id: 'ls_quad', level: 'm4', subject: 'math', gen: 'quad_roots', icon: '🧩', title: 'ล้อมคอกด้วยการแยกตัวประกอบ', blurb: 'สมการกำลังสอง (แยกตัวประกอบ)', pages: [
    { say: 'สมการแบบ <b>x² − 5x + 6 = 0</b> เรียกว่าสมการกำลังสอง มักมีคำตอบ 2 ค่า วิธีง่ายที่สุดคือ <b>แยกตัวประกอบ</b> ให้เป็นวงเล็บสองอัน', fig: { t: 'formula', lines: ['x² − 5x + 6 = 0', '= (x − ?)(x − ?) = 0'] } },
    { say: 'หาเลข 2 ตัวที่ <b>คูณกันได้ +6</b> (ตัวท้าย) และ <b>บวกกันได้ −5</b> (ตัวกลาง) ลองไล่: 1×6, 2×3 และต้องติดลบทั้งคู่ → <b>−2 กับ −3</b> (−2×−3 = 6, −2+−3 = −5)', fig: { t: 'formula', lines: ['คูณกัน = 6', 'บวกกัน = −5', 'คือ −2 และ −3'] } },
    { say: 'จึงได้ (x − 2)(x − 3) = 0 ถ้าสองอย่างคูณกันได้ 0 อย่างน้อยหนึ่งอย่างต้องเป็น 0 จึงได้ <b>x = 2 หรือ x = 3</b>', fig: { t: 'formula', lines: ['(x − 2)(x − 3) = 0', 'x = 2 หรือ x = 3'] } },
    { say: '<b>ตรวจคำตอบ</b> แทนค่ากลับ: x = 2 → 4 − 10 + 6 = 0 ✓ · x = 3 → 9 − 15 + 6 = 0 ✓', fig: { t: 'formula', lines: ['2² − 5(2) + 6 = 0 ✓', '3² − 5(3) + 6 = 0 ✓'] } },
    { say: 'ตัวอย่างตัวท้ายติดลบ: x² + x − 12 = 0 → คูณได้ −12 บวกได้ +1 คือ <b>+4 กับ −3</b> ได้ (x + 4)(x − 3) = 0 → <b>x = −4 หรือ 3</b> (ระวังเครื่องหมายตอนย้ายวงเล็บ)', fig: { t: 'formula', lines: ['x² + x − 12 = 0', '(x + 4)(x − 3) = 0', 'x = −4 หรือ x = 3'] } },
    { say: 'สรุป: <b>1)</b> จัดให้ขวาเป็น 0 <b>2)</b> หาเลขสองตัว คูณ = ตัวท้าย บวก = ตัวกลาง <b>3)</b> เขียนเป็นวงเล็บ <b>4)</b> ให้แต่ละวงเล็บ = 0 <b>5)</b> ตรวจด้วยการแทนค่า', fig: { t: 'formula', lines: ['x² + bx + c = 0', 'หาสองตัว: คูณ = c · บวก = b', '(x + ตัวแรก)(x + ตัวสอง) = 0'] } }
  ] },
  { id: 'ls_arith', level: 'm4', subject: 'math', gen: 'arith_seq', icon: '🌽', title: 'แถวข้าวโพดที่เพิ่มขึ้นทีละแถว', blurb: 'ลำดับเลขคณิต พจน์ที่ n และผลบวก', pages: [
    { say: 'ลุงปลูกข้าวโพดเป็นแถว แถวแรก 3 ต้น แถวถัดไปเพิ่มทีละ 2 ต้น: <b>3, 5, 7, 9, …</b> เลขที่เพิ่มด้วยจำนวนเท่ากันทุกครั้ง เรียกว่า <b>ลำดับเลขคณิต</b>', fig: { t: 'emojis', rows: [['🌽', 3, 'แถว 1: 3 ต้น'], ['🌽', 5, 'แถว 2: 5 ต้น'], ['🌽', 7, 'แถว 3: 7 ต้น']] } },
    { say: 'ตัวเลขที่เพิ่มทุกครั้ง เรียก <b>ผลต่างร่วม d</b> ในที่นี้ d = 2 พจน์แรก <b>a₁ = 3</b> ถ้าอยากรู้แถวที่ 10 จะมีกี่ต้น ไม่ต้องไล่นับก็ได้', fig: { t: 'formula', lines: ['a₁ = 3', 'd = 2'] } },
    { say: 'สูตรพจน์ที่ n: <b>aₙ = a₁ + (n − 1)d</b> เพราะกว่าจะถึงพจน์ที่ n ต้องบวก d ไป (n − 1) ครั้ง แถวที่ 10: 3 + 9 × 2 = <b>21 ต้น</b>', fig: { t: 'formula', lines: ['aₙ = a₁ + (n − 1)d', 'a₁₀ = 3 + 9 × 2 = 21'] } },
    { say: 'ผลบวก 10 แถวแรก: <b>Sₙ = n(a₁ + aₙ) ÷ 2</b> = 10 × (3 + 21) ÷ 2 = 10 × 24 ÷ 2 = <b>120 ต้น</b>', fig: { t: 'formula', lines: ['Sₙ = n(a₁ + aₙ) ÷ 2', 'S₁₀ = 10 × 24 ÷ 2 = 120'] } },
    { say: 'ที่มาของสูตร: จับคู่ <b>หัวกับท้าย</b> 3 + 21 = 24, 5 + 19 = 24, … ได้ 5 คู่ คู่ละ 24 รวม 5 × 24 = 120 ถ้าไม่รู้พจน์สุดท้าย ใช้ Sₙ = n(2a₁ + (n − 1)d) ÷ 2 แทน', fig: { t: 'formula', lines: ['3 + 21 = 24', '5 + 19 = 24 ...', '5 คู่ × 24 = 120'] } }
  ] },
  { id: 'ls_punnett', level: 'm4', subject: 'sci', gen: 'sc_punnett', icon: '🐥', title: 'ลูกเจี๊ยบสีอะไรดี', blurb: 'พันธุศาสตร์ ตาราง Punnett', pages: [
    { say: 'ลักษณะของลูกถ่ายทอดจากพ่อแม่ผ่าน <b>ยีน</b> ที่เป็นคู่ เขียนด้วยตัวอักษร: ตัวใหญ่ <b>A = ลักษณะเด่น</b> ตัวเล็ก <b>a = ลักษณะด้อย</b> พ่อและแม่ให้ลูกคนละ 1 ตัวจากคู่ของตัวเอง', fig: { t: 'formula', lines: ['A = เด่น · a = ด้อย', 'AA, Aa แสดงลักษณะเด่น', 'aa แสดงลักษณะด้อย'] } },
    { say: 'พ่อ <b>Aa</b> แม่ <b>Aa</b> ใช้ <b>ตาราง Punnett</b> จับคู่ทุกแบบที่เป็นไปได้ ได้ลูก 4 แบบ (แถวคือยีนพ่อ คอลัมน์คือยีนแม่)', fig: { t: 'grid', cols: ['A', 'a'], rows: ['A', 'a'], cells: [['AA', 'Aa'], ['Aa', 'aa']], hi: [] } },
    { say: 'นับจาก 4 ช่อง: ลักษณะเด่น (AA, Aa, Aa) = <b>3/4</b> · ลักษณะด้อย (aa) = <b>1/4</b> · พันธุ์ทาง Aa = <b>2/4 = 1/2</b>', fig: { t: 'grid', cols: ['A', 'a'], rows: ['A', 'a'], cells: [['AA', 'Aa'], ['Aa', 'aa']], hi: [[0, 0], [0, 1], [1, 0]] } },
    { say: 'พ่อ <b>Aa</b> แม่ <b>aa</b>: ลูกได้ Aa 2 ช่อง และ aa 2 ช่อง ลักษณะเด่น = 2/4 = <b>1/2</b> ลักษณะด้อย = <b>1/2</b>', fig: { t: 'grid', cols: ['a', 'a'], rows: ['A', 'a'], cells: [['Aa', 'Aa'], ['aa', 'aa']], hi: [[0, 0], [0, 1]] } },
    { say: 'สรุป: <b>1)</b> เขียนยีนพ่อแม่ <b>2)</b> วาดตาราง 2×2 <b>3)</b> เติมแต่ละช่อง <b>4)</b> นับช่องที่ตรงเงื่อนไข ÷ 4 ถ้าพ่อแม่เป็น AA จะได้ลูกเด่นทุกตัว (4/4)', fig: { t: 'formula', lines: ['จำนวนช่องที่ตรงเงื่อนไข', '÷ 4 ช่อง = ความน่าจะเป็น'] } }
  ] },
  { id: 'ls_rect', level: 'm1', subject: 'math', gen: 'rect_fence', icon: '🥕', title: 'รั้วและหญ้าของสวนผัก', blurb: 'พื้นที่และเส้นรอบรูปสี่เหลี่ยมผืนผ้า', pages: [
    { say: 'ลุงข้าวโพดมีสวนผักรูปสี่เหลี่ยมผืนผ้า <b>ยาว 10 เมตร กว้าง 6 เมตร</b> อยากรู้ว่าต้องซื้อรั้วกี่เมตร และปูหญ้าได้กี่ตารางเมตร', fig: { t: 'rect', l: 'ยาว 10 ม.', w: 'กว้าง 6 ม.' } },
    { say: '<b>เส้นรอบรูป</b> คือความยาวของขอบรอบสวน ใช้คิดรั้ว: <b>2 × (ยาว + กว้าง)</b> = 2 × (10 + 6) = <b>32 เมตร</b>', fig: { t: 'formula', lines: ['เส้นรอบรูป = 2 × (ยาว + กว้าง)', '= 2 × 16 = 32 เมตร'] } },
    { say: '<b>พื้นที่</b> คือเนื้อที่ข้างใน ใช้คิดปูหญ้า: <b>ยาว × กว้าง</b> = 10 × 6 = <b>60 ตารางเมตร</b> สังเกตหน่วย: รอบรูปเป็น "เมตร" พื้นที่เป็น "ตารางเมตร"', fig: { t: 'formula', lines: ['พื้นที่ = ยาว × กว้าง', '= 10 × 6 = 60 ตร.ม.'] } },
    { say: 'โจทย์มักให้ข้อมูลอ้อม ๆ เช่น <b>พื้นที่ 60 ตร.ม. กว้าง 6 ม.</b> ถามรั้ว ต้องหาด้านยาวก่อน: 60 ÷ 6 = 10 แล้วค่อยหารอบรูป 2 × (10 + 6) = 32', fig: { t: 'formula', lines: ['ยาว = พื้นที่ ÷ กว้าง', '= 60 ÷ 6 = 10', 'รั้ว = 2 × (10 + 6) = 32 ม.'] } },
    { say: 'ข้อผิดที่พบบ่อย: เอาพื้นที่ไปใช้เป็นเส้นรอบรูป หรือลืมคูณ 2 จำไว้ว่า <b>รั้ว = รอบรูป · หญ้า/ปูกระเบื้อง = พื้นที่</b>', fig: { t: 'formula', lines: ['รั้ว, ขอบ → เส้นรอบรูป (เมตร)', 'หญ้า, ทาสี, ปูพื้น → พื้นที่ (ตร.ม.)'] } }
  ] },
  { id: 'ls_mean', level: 'm1', subject: 'math', gen: 'mean_missing', icon: '📊', title: 'ไข่ไก่เฉลี่ยต่อวัน', blurb: 'ค่าเฉลี่ยและการหาจากผลรวม', pages: [
    { say: 'ป้าไก่นับไข่ 4 วัน ได้ 3, 5, 4 และ 8 ฟอง ถามว่า <b>เฉลี่ยวันละกี่ฟอง</b>? ค่าเฉลี่ยคือจำนวนที่ถ้าทุกวันได้เท่ากัน จะรวมได้เท่าเดิม', fig: { t: 'emojis', rows: [['🥚', 3, 'วัน 1: 3 ฟอง'], ['🥚', 5, 'วัน 2: 5 ฟอง'], ['🥚', 4, 'วัน 3: 4 ฟอง']] } },
    { say: 'สูตร: <b>ค่าเฉลี่ย = ผลรวม ÷ จำนวนข้อมูล</b> ในที่นี้ 3 + 5 + 4 + 8 = 20 แล้ว 20 ÷ 4 = <b>5 ฟองต่อวัน</b>', fig: { t: 'formula', lines: ['เฉลี่ย = ผลรวม ÷ จำนวนวัน', '(3 + 5 + 4 + 8) ÷ 4 = 5'] } },
    { say: 'โจทย์สอบมักให้ค่าเฉลี่ยมา แล้วให้ย้อนหา <b>ผลรวม</b>: นักเรียน 4 คนเฉลี่ย 70 คะแนน → ผลรวม = 70 × 4 = <b>280</b>', fig: { t: 'formula', lines: ['ผลรวม = เฉลี่ย × จำนวน', '70 × 4 = 280'] } },
    { say: 'มีคนที่ 5 สอบได้ 90: ผลรวมใหม่ = 280 + 90 = 370 เฉลี่ยใหม่ = 370 ÷ 5 = <b>74</b>', fig: { t: 'formula', lines: ['280 + 90 = 370', '370 ÷ 5 = 74'] } },
    { say: 'ระวัง! ห้ามเอา (70 + 90) ÷ 2 = 80 เพราะ 70 เป็นค่าเฉลี่ยของ <b>4 คน</b> ไม่ใช่คนเดียว ต้องแปลงกลับเป็นผลรวมก่อนเสมอ', fig: { t: 'formula', lines: ['เฉลี่ย → ผลรวม (× จำนวนคน)', 'บวกข้อมูลใหม่', 'หารด้วยจำนวนคนใหม่'] } }
  ] },
  { id: 'ls_speed', level: 'm1', subject: 'math', gen: 'speed_time', icon: '🚚', title: 'รถบรรทุกส่งผัก', blurb: 'ระยะทาง ความเร็ว เวลา', pages: [
    { say: 'รถบรรทุกส่งผักวิ่งด้วยความเร็วคงที่ <b>60 กิโลเมตรต่อชั่วโมง</b> นาน 2 ชั่วโมง จะไปได้ไกลแค่ไหน?', fig: { t: 'emojis', rows: [['🚚', 2, '60 กม./ชม. นาน 2 ชม.']] } },
    { say: 'สูตร: <b>ระยะทาง = ความเร็ว × เวลา</b> = 60 × 2 = <b>120 กิโลเมตร</b> ความเร็ว 60 กม./ชม. แปลว่า 1 ชั่วโมงไป 60 กม.', fig: { t: 'formula', lines: ['ระยะทาง = ความเร็ว × เวลา', '60 × 2 = 120 กม.'] } },
    { say: 'ถ้าเวลามี <b>นาที</b> ต้องแปลงเป็นชั่วโมงก่อน (หาร 60) เช่น 2 ชม. 30 นาที = 2 ชม. + 30/60 = 2.5 ชม. → 60 × 2.5 = <b>150 กม.</b>', fig: { t: 'formula', lines: ['30 นาที = 30/60 = 1/2 ชม.', '60 × 2.5 = 150 กม.'] } },
    { say: 'อีกตัวอย่าง: 80 กม./ชม. นาน 1 ชม. 45 นาที: 80 × 1 = 80 กม. และ 45 นาที = 3/4 ชม. 80 × 3/4 = 60 กม. รวม <b>140 กม.</b>', fig: { t: 'formula', lines: ['80 × 1 = 80', '80 × 45/60 = 60', '80 + 60 = 140 กม.'] } },
    { say: 'จำไว้: <b>หน่วยต้องตรงกัน</b> ความเร็วเป็นต่อชั่วโมง เวลาต้องเป็นชั่วโมง ทางลัด 15 นาที = 1/4 ชม. · 30 นาที = 1/2 ชม. · 45 นาที = 3/4 ชม.', fig: { t: 'formula', lines: ['15 นาที = 1/4 ชม.', '30 นาที = 1/2 ชม.', '45 นาที = 3/4 ชม.'] } }
  ] },
  { id: 'ls_lin', level: 'm1', subject: 'math', gen: 'lin1', icon: '⚖️', title: 'ตาชั่งสมดุลของสมการ', blurb: 'สมการเชิงเส้น 1 ตัวแปร', pages: [
    { say: 'สมการเหมือน <b>ตาชั่งสมดุล</b> ซ้ายเท่ากับขวา อะไรที่ทำกับข้างซ้าย <b>ต้องทำกับข้างขวาเหมือนกัน</b> ตาชั่งถึงยังสมดุล', fig: { t: 'formula', lines: ['3x + 5 = 20', 'หา x = ?'] } },
    { say: 'ขั้นแรก <b>กำจัดตัวบวกลบ</b> ลบ 5 ออกทั้งสองข้าง: 3x + 5 − 5 = 20 − 5 ได้ <b>3x = 15</b>', fig: { t: 'formula', lines: ['3x + 5 = 20', '3x = 20 − 5', '3x = 15'] } },
    { say: 'ขั้นสอง <b>กำจัดตัวคูณ</b> หารทั้งสองข้างด้วย 3: x = 15 ÷ 3 = <b>5</b>', fig: { t: 'formula', lines: ['3x = 15', 'x = 15 ÷ 3', 'x = 5'] } },
    { say: '<b>ตรวจคำตอบ</b> เสมอ แทน x = 5 กลับ: 3 × 5 + 5 = 20 ✓ ถ้าไม่เท่า แปลว่าคำนวณพลาด', fig: { t: 'formula', lines: ['3(5) + 5 = 15 + 5 = 20 ✓'] } },
    { say: 'ตัวอย่างมีเครื่องหมายลบ: 4x − 7 = 13 → <b>บวก 7</b> ทั้งสองข้าง ได้ 4x = 20 → x = <b>5</b> (ตรวจ 4×5 − 7 = 13 ✓) ย้ายข้างแล้วเครื่องหมายสลับเสมอ', fig: { t: 'formula', lines: ['4x − 7 = 13', '4x = 13 + 7 = 20', 'x = 5'] } },
    { say: 'ตอบเป็นลบได้ เช่น 2x + 9 = 1 → 2x = 1 − 9 = <b>−8</b> → x = <b>−4</b> (ตรวจ 2(−4) + 9 = 1 ✓) ลำดับ: จัดบวกลบก่อน แล้วค่อยหารตัวคูณ', fig: { t: 'formula', lines: ['2x + 9 = 1', '2x = −8', 'x = −4'] } }
  ] },
  { id: 'ls_circle', level: 'm4', subject: 'math', gen: 'circle', icon: '⭕', title: 'บ่อน้ำกลมของฟาร์ม', blurb: 'เส้นรอบวงและพื้นที่วงกลม (π = 22/7)', pages: [
    { say: 'ฟาร์มมีบ่อน้ำกลม <b>รัศมี 7 เมตร</b> รัศมีคือระยะจากจุดศูนย์กลางถึงขอบ ถ้าอยากรู้ว่าต้องล้อมรั้วยาวเท่าไร และผิวน้ำกว้างแค่ไหน', fig: { t: 'disc', label: 'รัศมี r = 7 ม.' } },
    { say: '<b>เส้นรอบวง</b> (ยาวรอบบ่อ) <b>C = 2πr</b> ใช้ π = 22/7: 2 × 22/7 × 7 = <b>44 เมตร</b> (7 ตัดกับ 7 ได้พอดี)', fig: { t: 'formula', lines: ['C = 2πr', '= 2 × 22/7 × 7 = 44 ม.'] } },
    { say: '<b>พื้นที่</b> A = <b>πr²</b> = 22/7 × 7 × 7 = 22 × 7 = <b>154 ตารางเมตร</b> ระวัง r² คือ r × r ไม่ใช่ r × 2', fig: { t: 'formula', lines: ['A = πr²', '= 22/7 × 7 × 7 = 154 ตร.ม.'] } },
    { say: 'ใช้ 22/7 สะดวกเมื่อรัศมีหารด้วย 7 ลงตัว เช่น r = 14: A = 22/7 × 14 × 14 = 22 × 2 × 14 = <b>616</b> และ C = 2 × 22/7 × 14 = <b>88</b>', fig: { t: 'formula', lines: ['r = 14', 'A = 22/7 × 196 = 616', 'C = 2 × 22/7 × 14 = 88'] } },
    { say: 'ระวังโจทย์ให้ <b>เส้นผ่านศูนย์กลาง d</b> (กว้างสุดของวงกลม) ต้องหาร 2 ให้เป็นรัศมีก่อน: r = d ÷ 2', fig: { t: 'formula', lines: ['d = 2r  →  r = d ÷ 2', 'แล้วค่อยใช้ C = 2πr, A = πr²'] } }
  ] },
  { id: 'ls_dice', level: 'm4', subject: 'math', gen: 'dice_sum', icon: '🎲', title: 'ทอยลูกเต๋าสองลูก', blurb: 'ความน่าจะเป็นจากตารางผลลัพธ์', pages: [

function partHashes(parts) { const o = {}; Object.keys(parts).forEach(k => { o[k] = hashStr(JSON.stringify(parts[k])); }); return o; }

function mergeRows(localParts, synced, cloudRows) {

  });
  return { rows, taken };
}

async function ensureToken() {

function applyCloudRows(list, opt) {
  const cloud = {};
  list.forEach(x => { cloud[x.key] = x.data; });
  if (!Object.keys(cloud).length && opt.offerGuest) {
    const g = guestData();
    if (g && confirm('พบข้อมูลที่เล่นไว้ในเครื่องนี้ (แบบไม่ล็อกอิน)\nต้องการโอนขึ้นบัญชีนี้ไหม?\n\nตกลง = โอนขึ้นบัญชี · ยกเลิก = เริ่มใหม่ในบัญชีนี้')) {
      S.data = g; normalizeData(); writeLocal(); render(); return;
    }
  }
  if (!opt.first) {                                   // ระหว่างเล่น: ไม่แตะคนที่กำลังเล่น และไม่ยุ่งตอนทำโจทย์
    if (S.quiz || S.lesson) return;
    if (S.data.current) delete cloud['p:' + S.data.current];
  }
  const mr = mergeRows(splitSave(S.data), CLOUD.synced, cloud);
  S.data = joinSave(mr.rows, { current: S.data.current, sound: S.data.sound });
  normalizeData();
  const h = partHashes(splitSave(S.data));
  mr.taken.forEach(k => { CLOUD.synced[k] = h[k]; });
  saveSynced(); writeLocal();
  if (S.view === 'main' && !cur()) S.view = 'profiles';
  if (opt.first || S.view === 'profiles') render();
}
async function cloudPush(tok) {
  const parts = splitSave(S.data), keys = dirtyKeys(parts, CLOUD.synced);
  if (!keys.length) return;
  const snap = partHashes(parts), now = new Date().toISOString();
  const body = keys.map(k => ({ user_id: CLOUD.session.uid, key: k, data: parts[k], updated_at: now }));
  const r = await sbFetch('/rest/v1/sq_saves?on_conflict=user_id,key', { method: 'POST', token: tok, headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body });
  if (!r.ok) throw cloudErr(r);
  keys.forEach(k => { CLOUD.synced[k] = snap[k]; });

}

async function cloudRun(opt) {
  opt = opt || {};
  if (S.mode !== 'cloud' || !CLOUD.session) return;
  if (CLOUD.busy) { CLOUD.again = true; return; }
  CLOUD.busy = true; CLOUD.lastRun = Date.now(); setCloud('sending');
  try {
    const tok = await ensureToken();
    if (opt.pull !== false || !CLOUD.pulled) {         // ยังไม่เคยดึงของเน็ตสำเร็จ → ต้องดึงก่อนส่งเสมอ (กันส่งของเก่าไปทับของใหม่)
      const r = await sbFetch('/rest/v1/sq_saves?select=key,data', { token: tok });
      if (!r.ok) throw cloudErr(r);
      applyCloudRows(r.json || [], opt);
      CLOUD.pulled = true;
    }
    await cloudPush(await ensureToken());
    setCloud('ok');
  } catch (e) {
    if (e && e.expired) { lsDel(AUTH_KEY); CLOUD.session = null; toLogin('การเข้าสู่ระบบหมดอายุ กรุณาเข้าสู่ระบบอีกครั้ง (ข้อมูลที่ยังไม่ได้ส่งยังเก็บอยู่ในเครื่อง)'); }
    else setCloud('offline', e && e.text || 'เกิดข้อผิดพลาด');
  } finally {
    CLOUD.busy = false;
    if (CLOUD.again) { CLOUD.again = false; clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(() => cloudRun({ pull: false }), 300); }
  }
}

function farmSig() {
  if (S.view !== 'main' || S.tab !== 'farm') return '';

  for (let i = 0; i < p.plotCount; i++) s += plotState(p, i, now)[0] + plotStage(p, i, now);
  ANIMAL_IDS.forEach(id => { s += animalState(p, id, now)[0]; });

}
function tick() {
